<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chartership Tracker</title>
<style>
/* Chartership Tracker, by "Datum Software" (fictional), 2026-11-16. A GENEXXO app for EngineerXX.
   Evidence logged against the five UK-SPEC competence areas (A Knowledge and understanding; B Design and development;
   C Responsibility, management and leadership; D Communication and interpersonal skills; E Professional commitment).
   Each piece of evidence is rated by the engineer (1 supporting, 2 good, 3 strong); an area reads "ready" at 6 points.
   That threshold is this app's own guide, not an institution's rule, and the app says to follow your institution. */
:root{--bg:#0A1630;--card:rgba(255,255,255,.05);--line:rgba(234,242,255,.1);--ink:#EAF2FF;--mut:rgba(234,242,255,.55);--amber:#FFB000;--cyan:#4FC3F7;--red:#F0646E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F0646E,#A3263A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.top{display:flex;gap:10px;background:linear-gradient(150deg,#14306A,#0F2148);border:1px solid rgba(240,100,110,.25);border-radius:18px;padding:16px}
.top div{flex:1;text-align:center}.top b{display:block;font-size:30px;font-weight:900;line-height:1.1}.top small{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.ar{padding:9px 0}.ar+.ar{border-top:1px solid var(--line)}
.ar .l{display:flex;align-items:center;gap:9px;margin-bottom:6px}.ar .k{width:26px;height:26px;border-radius:8px;background:rgba(240,100,110,.16);color:var(--red);font-weight:900;display:flex;align-items:center;justify-content:center}
.ar .l b{flex:1;font-size:13.5px}.ar .tag{font-size:11px;font-weight:900;border-radius:99px;padding:3px 9px}
.t-ok{background:rgba(46,213,115,.15);color:#5EE09A}.t-mid{background:rgba(255,176,0,.15);color:#FFC94D}.t-lo{background:rgba(240,100,110,.15);color:#FF8F97}
.meter{height:8px;border-radius:8px;background:rgba(234,242,255,.08);overflow:hidden}.meter i{display:block;height:100%;border-radius:8px}
.ev{display:flex;gap:10px;padding:9px 0}.ev+.ev{border-top:1px solid var(--line)}.ev .k{width:26px;height:26px;border-radius:8px;background:rgba(79,195,247,.14);color:var(--cyan);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev .x{flex:1}.ev .x b{font-size:13.5px}.ev .x small{display:block;color:var(--mut);font-size:12px}.ev .st{color:var(--amber);font-size:12px;letter-spacing:1px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;font:inherit;font-weight:900;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 0;cursor:pointer}.seg button.on{border-color:var(--red);background:rgba(240,100,110,.16)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}.opt.on{border-color:var(--red);background:rgba(240,100,110,.12)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--red);color:#fff;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🏅</div><div><h1>Chartership Tracker</h1><p>Datum Software · in EngineerXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="over" class="on">Overview</button><button data-tab="ev">Evidence</button><button data-tab="add">Add</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const AREAS={A:'Knowledge and understanding',B:'Design and development',C:'Responsibility, management and leadership',D:'Communication and interpersonal skills',E:'Professional commitment'};
const PRESETS={A:['Applied new analysis method on a live project','Completed a technical course','Mentored a graduate on theory'],B:['Led the design of a component','Solved a site problem under time pressure','Ran a design review'],C:['Managed a work package budget','Led a small project team','Wrote and ran a risk assessment'],D:['Presented to a client','Wrote a technical report','Resolved a disagreement between teams'],E:['Volunteered at a STEM outreach day','Logged a year of CPD','Applied the code of conduct to a real decision']};
const STR=['','Supporting','Good','Strong'];
const READY=6;
const seed=()=>({cpd:26,cpdTarget:30,items:[
  {a:'A',t:'Finite element analysis of a bracket redesign',s:3,off:-300},{a:'A',t:'Completed a fatigue design course',s:2,off:-210},
  {a:'B',t:'Led the design of a conveyor drive',s:3,off:-180},{a:'B',t:'Ran a design review with manufacturing',s:2,off:-90},{a:'B',t:'Solved a site misalignment under time pressure',s:2,off:-40},
  {a:'C',t:'Managed a £60K work package',s:2,off:-120},{a:'C',t:'Wrote and ran a risk assessment for commissioning',s:2,off:-60},
  {a:'D',t:'Wrote the commissioning report',s:2,off:-50},
  {a:'E',t:'Volunteered at a STEM outreach day',s:2,off:-150},{a:'E',t:'Applied the code of conduct to a safety concern',s:3,off:-30},{a:'E',t:'Kept a year of CPD records',s:1,off:-10}]});
let C,S={tab:'over',shared:false,f:{a:'D',p:0,s:2}};
GX.init({gateway:'EngineerXX',seed}).then(c=>{C=c;paint();});
const pts=a=>C.data.items.filter(x=>x.a===a).reduce((s,x)=>s+x.s,0);
const ready=()=>Object.keys(AREAS).filter(a=>pts(a)>=READY).length;
function tag(p){return p>=READY?'<span class="tag t-ok">READY</span>':p>=READY/2?'<span class="tag t-mid">BUILDING</span>':'<span class="tag t-lo">NEEDS MORE</span>';}
function vOver(){const r=ready(),weak=Object.keys(AREAS).filter(a=>pts(a)<READY);
  return `<div class="top"><div><b>${r}/5</b><small>AREAS READY</small></div><div><b>${C.data.items.length}</b><small>PIECES OF EVIDENCE</small></div><div><b>${C.data.cpd}h</b><small>CPD THIS YEAR</small></div></div>
  <div class="card"><h3>UK-SPEC competences</h3>${Object.keys(AREAS).map(a=>{const p=pts(a);return `<div class="ar"><div class="l"><span class="k">${a}</span><b>${AREAS[a]}</b>${tag(p)}</div><div class="meter"><i style="width:${Math.min(1,p/READY)*100}%;background:${p>=READY?'#2ED573':p>=READY/2?'#FFB000':'#F0646E'}"></i></div></div>`;}).join('')}</div>
  ${weak.length?`<div class="legend">Next: add evidence for <b>${weak.map(a=>a+' ('+AREAS[a].split(/[ ,]/)[0].toLowerCase()+')').join(', ')}</b></div>`:`<div class="legend">Every area is ready. Time to talk to your mentor about applying.</div>`}
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my progress to ${C.gateway}`}</button>`:''}
  <div class="legend">“Ready” is this app’s guide. Follow your institution’s guidance on what counts.</div>`;}
function vEv(){return Object.keys(AREAS).map(a=>{const it=C.data.items.filter(x=>x.a===a);return `<div class="card"><h3>${a} · ${AREAS[a]}</h3>${it.length?it.map(x=>`<div class="ev"><span class="k">${a}</span><div class="x"><b>${GX.esc(x.t)}</b><small>${GX.day(GX.today(x.off),{month:'short',year:'numeric'})} · ${STR[x.s]}</small></div><span class="st">${'★'.repeat(x.s)}</span></div>`).join(''):'<div class="legend" style="text-align:left">No evidence yet.</div>'}</div>`;}).join('');}
function vAdd(){const f=S.f;
  return `<div class="seg">${Object.keys(AREAS).map(a=>`<button data-a="${a}" class="${a===f.a?'on':''}">${a}</button>`).join('')}</div>
  <div class="legend" style="text-align:left;margin:0 0 8px">${AREAS[f.a]}</div>
  ${PRESETS[f.a].map((p,i)=>`<button class="opt ${i===f.p?'on':''}" data-p="${i}">${p}</button>`).join('')}
  <div class="seg" style="margin-top:6px">${[1,2,3].map(s=>`<button data-s="${s}" class="${s===f.s?'on':''}" style="font-size:12.5px">${'★'.repeat(s)} ${STR[s]}</button>`).join('')}</div>
  <button class="go" id="add">Add evidence</button>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='over'?vOver():S.tab==='ev'?vEv():vAdd();
  v.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{S.f.a=e.dataset.a;S.f.p=0;paint();});
  v.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{S.f.p=+e.dataset.p;paint();});
  v.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.f.s=+e.dataset.s;paint();});
  const a=document.getElementById('add');if(a)a.onclick=()=>{C.data.items.push({a:S.f.a,t:PRESETS[S.f.a][S.f.p],s:S.f.s,off:0});GX.save(C.data);S.tab='over';S.shared=false;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{
    GX.post(`Chartership progress: <b>${ready()} of 5</b> competence areas ready, ${C.data.items.length} pieces of evidence. On the road to CEng 🏅`,'CHARTERSHIP').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
