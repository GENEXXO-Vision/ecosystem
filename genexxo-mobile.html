<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="metaTheme">
<title>GENEXXO</title>
<!-- ── PWA · add-to-home-screen launches full-screen (standalone). Icons + manifest.json live at the deploy root. ── -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GENEXXO">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!--
  GENEXXO MOBILE — NAV SHELL PROTOTYPE (rebuild, step 0)
  ══════════════════════════════════════════════════════
  One universal shell, many front doors:
  · open normally            → boots as GENEXXO (genexxo.com, hub entry)
  · open with ?entry=climb   → boots as ClimbXX (climbxx.com install simulation)
  · also: ?entry=ski / surf / cycle / sail
  Rules proven here:
  · fixed 5-tab bottom bar: Home · Discover · Feed · Saved · Profile
  · persistent GENEXXO mark, always returns to hub
  · hub chrome stays neutral; gateway content carries sector personality
  · sectors are first-class navigation: Home → sector → gateway
  · tab bar accent tracks the active gateway (open question — easy to flip)
  Data (sectors, gateway themes, spaces, brand zones) extracted from desktop V1
  (genexxo-deck copy.html). No build step, no dependencies — open in a browser,
  ideally in device emulation / a phone.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111116; --muted:rgba(17,17,22,.45); --line:rgba(17,17,22,.08);
    --bg:#F7F7F8; --card:#fff; --accent:#111116;
    --bar-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
    --font:'Plus Jakarta Sans',-apple-system,sans-serif;
    --cond:'Barlow Condensed','Plus Jakarta Sans',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{font-family:var(--font);background:#E9E9EC;color:var(--ink)}
  #frame{--top-h:53px;max-width:430px;margin:0 auto;height:100dvh;overflow:hidden;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.12);display:flex;flex-direction:column}
  #screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding-bottom:calc(var(--bar-h) + var(--safe-b) + 12px);-webkit-overflow-scrolling:touch}
  ::-webkit-scrollbar{display:none}

  /* ── top chrome (neutral, persistent) ── */
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;background:rgba(247,247,248,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}
  .gx-mark{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
  .gx-dot{width:26px;height:26px;border-radius:8px;background:#111116;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:-.5px}
  .gx-mono{width:18px;height:18px;background-color:currentColor;-webkit-mask:url(mark-mask.png) center/contain no-repeat;mask:url(mark-mask.png) center/contain no-repeat}
  .gx-word{font-weight:800;font-size:14px;letter-spacing:.22em}
  .domain-pill{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:#fff;white-space:nowrap}
  .top.gw{border-bottom:none}
  .top.gw .domain-pill{background:transparent}

  /* ── bottom tab bar ── */
  #tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b));transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}

  /* ── auto-hide chrome on scroll (X-style): down hides top+bottom off-frame,
        up snaps them back; sticky sub-tabs ride up to pin at the top edge ── */
  .gw-tabs,.substick{transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}
  #frame.chrome-hidden .top{transform:translateY(-112%)}
  #frame.chrome-hidden #tabbar{transform:translateX(-50%) translateY(130%)}
  /* ── WELCOME SPLASH — a quick GENEXXO flash on boot, then it clears to reveal the control ── */
  #splash{position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 90% at 50% 38%,#191922 0%,#0b0b0f 70%);color:#fff;animation:splashIn .55s cubic-bezier(.2,.75,.2,1);transition:opacity .32s ease,transform .32s ease}
  #splash.out{opacity:0;transform:scale(1.04)}
  #splash .splash-word{font-family:var(--cond);font-weight:800;font-size:48px;letter-spacing:.05em;line-height:1}
  #splash .splash-word b{color:#F5B800;font-weight:800}
  #splash .splash-rule{width:0;height:2px;border-radius:2px;background:#F5B800;box-shadow:0 0 14px rgba(245,184,0,.6);animation:splashRule .6s .25s cubic-bezier(.2,.75,.2,1) forwards}
  #splash .splash-sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  /* staggered tagline lines — each fades up one at a time after the wordmark + rule */
  #splash .splash-sup{font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.52);opacity:0;animation:splashLine .6s .95s cubic-bezier(.2,.75,.2,1) forwards}
  #splash .splash-tag{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.015em;color:rgba(255,255,255,.9);opacity:0;animation:splashLine .6s 1.55s cubic-bezier(.2,.75,.2,1) forwards}
  @keyframes splashIn{0%{opacity:0;transform:scale(.93)}100%{opacity:1;transform:scale(1)}}
  @keyframes splashRule{to{width:132px}}
  @keyframes splashLine{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  #frame.chrome-hidden .gw-tabs,#frame.chrome-hidden .substick{transform:translateY(calc(-100% - 56px))}

  /* ── Network feed tabs (replaces the Sectors|Feed switcher) ── */
  .netbar{position:sticky;top:var(--top-h,53px);z-index:30;display:flex;gap:6px;padding:7px 14px}
  .ntab{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.5);padding:7px 0;border-radius:99px;cursor:pointer;transition:color .15s,background .15s}
  .ntab.on{color:#fff;background:rgba(255,255,255,.15)}
  .ntab.idt{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── Left sector drawer (X-style edge swipe) ── */
  /* half-moon handle — bulges from the left edge to just touch the feed; global nav */
  #edge{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:50px;border-radius:0 50px 50px 0;background:rgba(17,17,22,.12);color:rgba(17,17,22,.5);z-index:44;cursor:pointer;display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:1px 0 6px rgba(0,0,0,.08);transition:width .16s ease,background .16s}
  #edge::before{content:'\203A';font-size:15px;font-weight:800;line-height:1;transform:translateX(-1px)}
  #edge::after{content:'';position:absolute;left:0;top:-26px;bottom:-26px;width:36px}   /* wider invisible hit/grab zone */
  #edge:hover{width:20px;background:rgba(17,17,22,.2)}
  #frame.drawer-avail #edge{display:flex}
  #frame.drawer-open #edge{opacity:0;pointer-events:none}
  #scrim{position:absolute;left:0;right:0;bottom:0;top:94px;background:rgba(10,10,16,.42);opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}
  #frame.drawer-open #scrim{opacity:1;pointer-events:auto}
  #drawer{position:absolute;left:0;bottom:0;top:94px;width:76%;max-width:322px;background:#fff;transform:translateX(-102%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:61;box-shadow:10px 0 44px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
  #frame.drawer-open #drawer{transform:none}
  #drawerHead,#drawerRHead{display:flex;align-items:center;gap:8px;padding:14px 18px 11px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  #drawerList,#drawerRList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0}
  .drow{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer}
  .drow:active,.drow:hover{background:var(--bg)}
  .drow .dic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex-shrink:0}
  .drow .dnm{font-size:13.5px;font-weight:700;line-height:1.15}
  .drow .dct{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .dic-sm{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;font-size:12px;color:#fff;flex-shrink:0}

  /* ── Right gateways drawer — mirror of the sector drawer, handle sits lower for the thumb ── */
  #edgeR{position:absolute;right:0;top:63%;transform:translateY(-50%);width:16px;height:50px;border-radius:50px 0 0 50px;background:rgba(17,17,22,.12);color:rgba(17,17,22,.5);z-index:44;cursor:pointer;display:none;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:-1px 0 6px rgba(0,0,0,.08);transition:width .16s ease,background .16s}
  #edgeR::before{content:'\2039';font-size:15px;font-weight:800;line-height:1;transform:translateX(1px)}
  #edgeR::after{content:'';position:absolute;right:0;top:-26px;bottom:-26px;width:36px}
  #edgeR:hover{width:20px;background:rgba(17,17,22,.2)}
  #frame.gw-avail #edgeR{display:flex}
  #frame.drawer-open-r #edgeR{opacity:0;pointer-events:none}
  #scrimR{position:absolute;left:0;right:0;bottom:0;top:94px;background:rgba(10,10,16,.42);opacity:0;pointer-events:none;transition:opacity .28s;z-index:60}
  #frame.drawer-open-r #scrimR{opacity:1;pointer-events:auto}
  #drawerR{position:absolute;right:0;bottom:0;top:94px;width:76%;max-width:322px;background:#fff;transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:61;box-shadow:-10px 0 44px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
  #frame.drawer-open-r #drawerR{transform:none}
  /* on dark gateway themes, flip the glass handles light so they stay visible */
  #frame.on-dark #edge,#frame.on-dark #edgeR{background:rgba(255,255,255,.17);color:rgba(255,255,255,.62);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  #frame.on-dark #edge:hover,#frame.on-dark #edgeR:hover{background:rgba(255,255,255,.28);color:#fff}
  /* First-run nudges: each pulses until used ONCE (localStorage), then gone forever.
     Half-moons breathe black↔grey; the gateway ★ glows gold after the first scroll. */
  @keyframes edgeNudge{0%,100%{background:rgba(17,17,22,.12)}50%{background:rgba(17,17,22,.6);color:rgba(255,255,255,.9);box-shadow:0 0 14px rgba(17,17,22,.35)}}
  #edge.nudge,#edgeR.nudge{animation:edgeNudge 1.5s ease-in-out infinite}
  @keyframes starNudge{50%{color:#F5B800;opacity:1;text-shadow:0 0 12px rgba(245,184,0,.7);transform:scale(1.15)}}
  #gwStar.star-nudge{animation:starNudge 1.4s ease-in-out infinite}
  /* Feed-bar nudges: Network (home) then Gateways (sector) pulse gold until first tapped */
  @keyframes barNudge{50%{color:#F5B800;background:rgba(245,184,0,.16);box-shadow:0 0 12px rgba(245,184,0,.45)}}
  .ntab.bar-nudge{animation:barNudge 1.5s ease-in-out infinite}
  @keyframes arrowNudge{50%{color:#111116;background:rgba(0,0,0,.32);text-shadow:0 0 10px rgba(0,0,0,.5);transform:scale(1.14)}}
  .ntab.arrow-nudge{animation:arrowNudge 1.4s ease-in-out infinite}

  /* ── Pull-to-refresh spinner ── */
  #ptr{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:20;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.4,0,.2,1)}
  #ptr .ptr-spin{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(17,17,22,.16);border-top-color:#111116;transition:transform .12s}
  #ptr.ready .ptr-spin{transform:rotate(180deg)}
  #ptr.spin .ptr-spin{animation:ptrspin .6s linear infinite}
  @keyframes ptrspin{to{transform:rotate(360deg)}}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;color:rgba(17,17,22,.38);transition:color .15s}
  .tab svg{width:22px;height:22px}
  .tab .lb{font-size:9.5px;font-weight:700;letter-spacing:.02em}
  .tab.on{color:var(--accent)}

  /* ── shared cards / sections ── */
  .sect{padding:18px 16px 4px}
  .sect-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .sect-h .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .sect-h .a{font-size:11.5px;font-weight:700;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}

  /* ── your gateways rail ── */
  .rail{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 6px}
  .gwv{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;width:62px}
  .gwv .ring{width:58px;height:58px;border-radius:50%;padding:2.5px;display:flex}
  .gwv .face{flex:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;border:2.5px solid var(--bg)}
  .gwv .nm{font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap}

  /* ── featured sector cards ── */
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
  .feat .fc{border-radius:18px;padding:16px 14px;color:#fff;cursor:pointer;position:relative;overflow:hidden;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end}
  .feat .fc .ic{position:absolute;top:12px;left:14px;font-size:20px}
  .feat .fc .nm{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .feat .fc .tg{font-size:10.5px;opacity:.75;font-weight:600;margin-top:2px}

  /* ── all-sector tiles ── */
  .segrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
  .setile{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
  .setile .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
  .setile .nm{font-size:12px;font-weight:700;line-height:1.15}
  .setile .ct{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}

  /* ── pushed screens (sector / gateway) ── */
  .push{animation:slidein .22s ease}
  @keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
  .backrow{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer;padding:12px 16px 0;color:inherit;opacity:.7}

  /* sector screen */
  .sec-hero{margin:12px 16px 0;border-radius:20px;padding:22px 18px;color:#fff}
  .sec-hero .ic{font-size:26px}
  .sec-hero .nm{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
  .sec-hero .tg{font-size:12px;opacity:.8;font-weight:600;margin-top:2px}
  .gwrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 8px;cursor:pointer}
  .gwrow .em{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
  .gwrow .nm{font-size:14px;font-weight:800}
  .gwrow .dm{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
  .gwrow .badge{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:99px;flex-shrink:0}
  .gwrow .badge.live{background:rgba(22,163,74,.12);color:#16A34A}
  .gwrow .badge.soon{background:rgba(17,17,22,.06);color:var(--muted)}

  /* gateway screen — themed via inline vars */
  .gw-hero{padding:18px 16px 14px}
  .gw-hero .row1{display:flex;align-items:center;gap:12px}
  .gw-hero .em{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px}
  .gw-hero .nm{font-size:23px;font-weight:800;letter-spacing:-.02em;font-family:var(--cond);letter-spacing:.01em}
  .gw-hero .tg{font-size:11.5px;opacity:.65;font-weight:600}
  .gw-stats{display:flex;gap:18px;margin-top:14px}
  .gw-stats .s .v{font-size:15px;font-weight:800}
  .gw-stats .s .k{font-size:9.5px;font-weight:700;letter-spacing:.06em;opacity:.5;text-transform:uppercase;margin-top:1px}
  .gw-tabs{display:flex;gap:6px;padding:4px 16px 12px;position:sticky;top:var(--top-h,53px);z-index:30}
  .gw-tab{font-size:12px;font-weight:700;padding:7px 15px;border-radius:99px;cursor:pointer;border:1px solid transparent}
  .spaces{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px}
  .space{font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap;cursor:pointer;border:1px solid}
  .gcard{border-radius:16px;margin:0 16px 10px;padding:14px;border:1px solid}
  .gcard .hd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .gcard .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
  .gcard .an{font-size:12.5px;font-weight:800}
  .gcard .as{font-size:10px;opacity:.5;font-weight:600}
  .gcard .bdg{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:99px}
  .gcard .tx{font-size:13px;line-height:1.5}
  .gcard .media{border-radius:12px;height:170px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:38px}
  .gcard .eng{display:flex;gap:16px;margin-top:10px;font-size:11px;font-weight:700;opacity:.55}
  .trend{display:flex;gap:7px;flex-wrap:wrap;padding:2px 16px 14px}
  .trend .t{font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px}

  /* discover */
  .searchbox{margin:14px 16px 4px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .searchbox input{border:none;outline:none;flex:1;font-family:var(--font);font-size:13.5px;background:transparent;color:var(--ink)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 4px}
  .chip{font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap;cursor:pointer;color:var(--muted)}
  .chip.on{background:#111116;color:#fff;border-color:#111116}

  /* network feed */
  .nfcard{background:#fff;border:1px solid var(--line);border-radius:18px;margin:0 16px 12px;overflow:hidden}
  .nfcard .bar{height:3px}
  .nfcard .in{padding:13px 14px}

  /* saved / profile bits */
  .wapp{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 16px 8px}
  .wapp .lg{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}
  .btn{font-size:11px;font-weight:800;padding:7px 14px;border-radius:99px;cursor:pointer;border:none;font-family:var(--font)}
  .empty{margin:8px 16px;padding:26px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:12px;font-weight:600;line-height:1.6}

  /* ask */
  .bub{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.5;margin:0 16px 10px}
  .prompts{display:flex;flex-direction:column;gap:8px;padding:4px 16px}
  .prompt{font-size:12.5px;font-weight:600;padding:11px 14px;border-radius:13px;cursor:pointer;border:1px solid}
  /* AI thread: user bubbles right/dark; agent bubbles carry the gateway accent */
  .bub.user{background:#111116;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
  .agent-tag{display:flex;align-items:center;gap:6px;margin:2px 20px 4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

s. Netflix just walked in and bought one. The unbundling of television is complete.","engagement":"♡ 36.6K|💬 7.8K|↗ 4.2K","gwName":"StreamXX","gwAccent":"#DC2626","avatar":{"bg":"linear-gradient(135deg,#DC2626,#EF4444)"},"badge":{"text":"COMMUNITY","bg":"rgba(34,197,94,.15)","color":"#4ADE80"}},{"gateway":"journalism","author":"JournalismXX Editorial","authorSub":"Industry · 3h ago","text":"The Guardian just became the first major newspaper to hit 2M digital subscribers without a paywall. Their model: voluntary contributions driven by quality journalism and transparency about costs. The New York Times charges £12/month. The Guardian asks nicely and earns more per reader. The future of journalism isn’t behind a wall — it’s in front of a community.","engagement":"♡ 24.6K|💬 4.4K|↗ 3.0K","gwName":"JournalismXX","gwAccent":"#475569","avatar":{"bg":"linear-gradient(135deg,#1a1a2e,#475569)","text":"JX"},"badge":{"text":"ANALYSIS","bg":"rgba(26,26,46,.15)","color":"#475569"},"img":{"fit":true,"bg":"linear-gradient(135deg,#0f172a,#1e293b)","url":"https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800&h=400&fit=crop&q=80"}},{"gateway":"animation","author":"AnimationXX Editorial","authorSub":"Studio Spotlight · 4h ago","text":"Watch: Studio Ghibli’s first fully hand-drawn feature in 8 years just dropped its trailer. Hayao Miyazaki’s protégé Hayashi directs “The Sea Carries Everything.” 74,000 hand-painted frames over 4 years. In an age of AI-generated imagery, Ghibli is doubling down on craft. The trailer has 22M views in 6 hours.","engagement":"♡ 58.4K|💬 8.2K|↗ 9.4K","gwName":"AnimationXX","gwAccent":"#0891B2","avatar":{"bg":"linear-gradient(135deg,#0891B2,#22D3EE)","text":"AX"},"badge":{"text":"TRAILER","bg":"rgba(8,145,178,.15)","color":"#0891B2"},"videoUrl":"https://images.unsplash.com/photo-1534972195531-d756b9bfa9f2?w=800&h=400&fit=crop&q=80"},{"gateway":"blog","author":"@indie_writer","authorSub":"BlogXX · Newsletter Era · 5h ago","text":"Substack’s top 50 w ustomers, and that 5% disproportionately includes problem gamblers. Responsible gambling isn’t optional anymore — it’s regulated.","engagement":"♡ 18.4K|💬 5.6K|↗ 2.4K","gwName":"BettingXX","gwAccent":"#1E40AF","avatar":{"bg":"linear-gradient(135deg,#1E40AF,#3B82F6)"},"badge":{"text":"COMMUNITY","bg":"rgba(34,197,94,.15)","color":"#4ADE80"}},{"gateway":"arcade","author":"ArcadeXX Editorial","authorSub":"Retro Revival · 3h ago","text":"The barcade boom has crossed the Atlantic. London now has 14 dedicated arcade bars, up from 2 in 2021. Four Quarters, NQ64, and Puttshack are leading a £180M UK market. The formula: craft cocktails, classic cabinets, and zero mobile phones. Gen Z is discovering the joy of physical buttons and CRT screens. The arcade never died — it just needed a bar licence.","engagement":"♡ 22.8K|💬 3.8K|↗ 2.8K","gwName":"ArcadeXX","gwAccent":"#7C3AED","avatar":{"bg":"linear-gradient(135deg,#7C3AED,#A78BFA)","text":"AX"},"badge":{"text":"TREND","bg":"rgba(124,58,237,.15)","color":"#7C3AED"},"img":{"fit":true,"bg":"linear-gradient(135deg,#2e1065,#4c1d95)","url":"https://images.unsplash.com/photo-1511882150382-421056c89033?w=800&h=400&fit=crop&q=80"}},{"gateway":"lottery","author":"LotteryXX Editorial","authorSub":"Jackpots · 4h ago","text":"Watch: The moment a syndicate of 12 PHS nurses from Manchester discovered they’d won £184M on EuroMillions. The largest UK jackpot in history. Security footage from the break room went viral — pure, unfiltered disbelief. They’ve pledged £20M to build a new cancer ward at their hospital. The best lottery story ever told.","engagement":"♡ 86.4K|💬 12.2K|↗ 14.8K","gwName":"LotteryXX","gwAccent":"#CA8A04","avatar":{"bg":"linear-gradient(135deg,#CA8A04,#FACC15)","text":"LX"},"badge":{"text":"RECORD","bg":"rgba(202,138,4,.15)","color":"#CA8A04"},"videoUrl":"https://images.unsplash.com/photo-1518688248740-7c31f1a945c4?w=800&h=400&fit=crop&q=80"},{"gateway":"slot","author":"@reels_reviewer","authorSub":"SlotXX · Reviews · 5h a k from M&S and Zara outlets, photograph it properly (natural light, white background, measurements in the description), and price 40% below retail. Average item sells in 3 days. The resale economy is real and it’s wide open.","engagement":"♡ 24.8K|💬 4.6K|↗ 3.2K","gwName":"SellXX","gwAccent":"#15803D","avatar":{"bg":"linear-gradient(135deg,#15803D,#4ADE80)"},"badge":{"text":"COMMUNITY","bg":"rgba(34,197,94,.15)","color":"#4ADE80"}},{"gateway":"reward","author":"RewardXX Editorial","authorSub":"Loyalty · 3h ago","text":"Tesco Clubcard just became the most valuable loyalty programme in the UK. Points are now worth 3x at restaurant and experience partners. A £50 Clubcard voucher gets you £150 at Pizza Express, Cineworld, or English Heritage. The data-for-discounts trade has never been more explicit — and consumers are overwhelmingly saying yes.","engagement":"♡ 32.4K|💬 5.2K|↗ 4.0K","gwName":"RewardXX","gwAccent":"#B45309","avatar":{"bg":"linear-gradient(135deg,#B45309,#F59E0B)","text":"RX"},"badge":{"text":"GUIDE","bg":"rgba(180,83,9,.15)","color":"#B45309"},"img":{"fit":true,"bg":"linear-gradient(135deg,#451a03,#78350f)","url":"https://images.unsplash.com/photo-1556742031-c6961e8560b0?w=800&h=400&fit=crop&q=80"}},{"gateway":"claim","author":"ClaimXX Editorial","authorSub":"Consumer Rights · 4h ago","text":"Watch: How to claim flight delay compensation in under 5 minutes. EU261 rules mean airlines owe you up to €600 for delays over 3 hours — and it applies to UK departures too. We built a step-by-step walkthrough. Airlines reject 80% of first claims hoping you’ll give up. Don’t. The law is on your side.","engagement":"♡ 44.6K|💬 6.8K|↗ 8.4K","gwName":"ClaimXX","gwAccent":"#DC2626","avatar":{"bg":"linear-gradient(135deg,#DC2626,#EF4444)","text":"CX"},"badge":{"text":"KNOW YOUR RIGHTS","bg":"rgba(220,38,38,.15)","color":"#DC2626"},"videoUrl":"https://images.unsplash.com/photo-1521791136064-7986c2920216?w=800&h=400&fit=crop&q=80"},{"gateway":"discount","author":"@bargain_hunter","authorSub":"DiscountXX · Tips · 5h ago","text":"PSA: Most UK retailers legally have to honour pricing errors if you complete checkout before they notice. Just got a £1,200 Herman Miller chair for £120 because someone at John Lewis misplaced a decimal. Order confirmed, dispatched, delivered. The Consumer Rights Act 2015 is the most powerful tool in your shopping arsenal. Learn it.","engagement":"♡ 38.2K|💬 7.6K|↗ 6.2K","gwName":"DiscountXX","gwAccent":"#EA580C","avatar":{"bg":"linear-gradient(135deg,#EA580C,#F97316)"},"badge":{"text":"COMMUNITY","bg":"rgba(34,197,94,.15)","color":"#4ADE80"}},{"gateway":"customer","author":"CustomerXX Editorial","authorSub":"Cross-Gateway · 6h ago","text":"GENEXXO’s consumer ecosystem is revealing the full spending lifecycle. SearchXX for discovery, CouponXX and DiscountXX for price optimisation, RewardXX for loyalty maximisation, ClaimXX when things go wrong. Users who engage across 4+ consumer gateways save an average of £2,400/year. The informed consumer has never been more powerful.","engagement":"♡ 16.4K|💬 2.6K|↗ 1.8K","gwName":"CustomerXX","gwAccent":"#0EA5E9","avatar":{"bg":"linear-gradient(135deg,#0EA5E9,#38BDF8)","text":"CX"},"badge":{"text":"ECOSYSTEM","bg":"rgba(139,92,246,.15)","color":"#8B5CF6"}},{"gateway":"survey","author":"SurveyXX Editorial","authorSub":"Earn · 8h ago","text":"The paid survey economy just got legitimate. Prolific, the academic research platform, now pays an average of £12/hour for survey participation — up from £6 in 2022. Universities and brands are competing for respondents, driving rates up. Top earners report £400-600/month for 1-2 hours daily. The side hustle that actually respects your time.","engagement":"♡ 22.8K|💬 4.2K|↗ 3.4K","gwName":"SurveyXX","gwAccent":"#0891B2","avatar":{"bg":"linear-gradient(135deg,#0891B2,#22D3EE)","text":"SX"},"badge":{"text":"EDITORIAL","bg":"rgba(8,145,178,.15)","color":"#0891B2"},"img":{"fit":true,"bg":"linear-gradient(135deg,#083344,#155e75)","url":"https:// es faster than funded teams of 12. My only expenses: hosting (£340/month), API costs (£890/month), and too much coffee. The one-person unicorn era is coming.","engagement":"♡ 42.8K|💬 6.8K|↗ 5.4K","gwName":"EntrepreneurXX","gwAccent":"#B45309","avatar":{"bg":"linear-gradient(135deg,#B45309,#F59E0B)"},"badge":{"text":"COMMUNITY","bg":"rgba(34,197,94,.15)","color":"#4ADE80"}},{"gateway":"marketing","author":"MarketingXX Editorial","authorSub":"Strategy · 3h ago","text":"Performance marketing is dying and brand marketing is back. Google’s cookie deprecation, Apple’s ATT, and rising CPMs have made acquisition-at-all-costs unsustainable. The brands winning now — Liquid Death, Surreal, Gymshark — are the ones investing in creative, community, and organic reach. The CMO’s job just got harder and more interesting.","engagement":"♡ 26.8K|💬 4.4K|↗ 3.2K","gwName":"MarketingXX","gwAccent":"#7C3AED","avatar":{"bg":"linear-gradient(135deg,#7C3AED,#A78BFA)","text":"MX"},"badge":{"text":"TREND","bg":"rgba(124,58,237,.15)","color":"#7C3AED"},"img":{"fit":true,"bg":"linear-gradient(135deg,#2e1065,#4c1d95)","url":"https://images.unsplash.com/photo-1533750349088-cd871a92f312?w=800&h=400&fit=crop&q=80"}},{"gateway":"franchise","author":"FranchiseXX Editorial","authorSub":"Opportunities · 4h ago","text":"Watch: The dark side of franchise ownership. We investigated 200 UK franchise agreements and found that 34% contain clauses that would be unenforceable in court. Non-compete radiuses of 50 miles, mandatory supplier markups of 40%, and termination penalties exceeding the initial investment. Essential viewing before you sign anything.","engagement":"♡ 38.4K|💬 7.2K|↗ 6.4K","gwName":"FranchiseXX","gwAccent":"#DC2626","avatar":{"bg":"linear-gradient(135deg,#DC2626,#EF4444)","text":"FX"},"badge":{"text":"INVESTIGATION","bg":"rgba(220,38,38,.15)","color":"#DC2626"},"videoUrl":"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=800&h=400&fit=crop&q=80"},{"gateway":"recruitment","autho
