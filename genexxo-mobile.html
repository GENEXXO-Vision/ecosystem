/* ═════════ MEDIA PIPELINE (2026-07-25, origin switched 2026-07-31) ═════════
   Feed video lives in the genexxo-videos/ folder of the repo, served from the SAME
   GitHub Pages origin that hosts this app (genexxo-vision.github.io/ecosystem/).
   ▸ WHY NOT jsDelivr: jsDelivr caches a @branch file for 7 days AND the branch→commit
     pointer for ~12h, so OVERWRITING a clip at the same path (e.g. re-uploading
     sector.mp4) keeps serving the old one — purging the file edge doesn't refresh the
     pointer. GitHub Pages serves the repo directly with max-age=600 (~10 min) and is
     same-origin (no CORS), so swapped media shows up promptly with no purge/uninstall.
     To revert to the CDN, set this back to 'https://cdn.jsdelivr.net/gh/GENEXXO-Vision/ecosystem@main/'.
   Full URLs (Unsplash stills etc.) pass straight through untouched. */
const MEDIA_BASE = 'https://genexxo-vision.github.io/ecosystem/';   // same-origin as the hosted app (github.com/GENEXXO-Vision/ecosystem, Pages)
const mediaUrl = p => (!p || /^https?:/.test(p)) ? p : MEDIA_BASE + p;

/* One media block for any feed card. A post carries ONE of:
     video:'genexxo-videos/x.mp4'  → lazy <video> (loads only when scrolled near)
     img:'https://…'               → lazy <img>
     media:'🧗' (+ mediaBg)        → emoji tile fallback (handled inline by each caller)
   Returns '' when there's no video/img, so callers keep their own emoji fallback. */
function mediaBlock(f, bg, h){
  const height = h||150;
  if(f.video) return `<div style="border-radius:12px;overflow:hidden;margin-top:10px;background:#000"><video autoplay loop muted playsinline preload="none" data-vsrc="${mediaUrl(f.video)}" style="width:100%;height:${height}px;object-fit:cover;display:block"></video></div>`;
  if(f.img)   return `<div style="border-radius:12px;overflow:hidden;margin-top:10px;height:${height}px;background:${f.mediaBg||bg}"><img src="${mediaUrl(f.img)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  return '';
}

/* Lazy-load feed video — <video data-vsrc> gets its real src only when it scrolls
   within 400px of the viewport, then autoplays muted. Critical on mobile: never
   pull 50 clips over cellular at once. Ported from the desktop deck. Re-run after
   every render() so freshly-drawn cards get observed.
   Priority load (2026-08-01): the first EAGER_VIDEOS clips in DOM order (= top of
   whatever feed just rendered — the Network feed on load, a gateway's top clips the
   moment you tap in, sector feeds too, all via this one path) get their src set
   IMMEDIATELY instead of waiting for the observer, so above-the-fold video buffers on
   render. The rest stay lazy so we still never hammer cellular. Tune EAGER_VIDEOS.
   Kick-start pass (2026-08-04): sw.js v3 now caches clips (cache-first + background
   revalidate), _prefetchVids warms the next PREFETCH_VIDEOS clips after the eager ones,
   and the observer margin is 900px — together: repeat views play instantly from cache,
   and first views start downloading well before the card is on screen. */
/* ── Video debug HUD (2026-08-04) ─────────────────────────────────────────────
   Tap the "GENEXXO · build …" footer on the Profile tab FIVE times to toggle.
   Overlays a live log: per-clip time-to-playable, load errors, whether the service
   worker controls the page — turns "the videos feel random" into numbers readable
   straight off the phone. Persists across reopens via localStorage (gx_vdebug). */
let _vdebug = false; try{ _vdebug = localStorage.gx_vdebug==='1'; }catch(_){}
let _vdbgTaps = [];
function vdbgTap(){
  const now = Date.now();
  _vdbgTaps = _vdbgTaps.filter(t=>now-t<2500); _vdbgTaps.push(now);
  if(_vdbgTaps.length < 5) return;
  _vdbgTaps = []; _vdebug = !_vdebug;
  try{ localStorage.gx_vdebug = _vdebug?'1':'0'; }catch(_){}
  if(_vdebug){ vlog('debug ON · SW '+(navigator.serviceWorker&&navigator.serviceWorker.controller?'controlling':'NOT controlling')); }
  else { const el=document.getElementById('vdbg'); if(el) el.remove(); }
}
const _vlogLines = [];
function vlog(msg){
  if(!_vdebug) return;
  _vlogLines.push(`${(performance.now()/1000).toFixed(1)}s ${msg}`);
  while(_vlogLines.length>14) _vlogLines.shift();
  let el = document.getElementById('vdbg');
  if(!el){
    el = document.createElement('div'); el.id='vdbg';
    el.style.cssText='position:fixed;left:6px;right:6px;bottom:64px;z-index:99999;background:rgba(0,0,0,.82);color:#7CFC9A;font:9px/1.5 monospace;padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre-wrap;word-break:break-all';
    document.body.appendChild(el);
  }
  el.textContent = _vlogLines.join('\n');
}
// First HUD line each session: which build is running and whether the SW controls the
// page — a "NOT CONTROLLING" here means every clip is going straight to the network
// (no cache), which explains any across-the-board slowness in the log that follows.
window.addEventListener('load', ()=>{ if(_vdebug) setTimeout(()=>vlog(`BUILD ${BUILD} · SW ${(navigator.serviceWorker&&navigator.serviceWorker.controller)?'controlling':'NOT CONTROLLING'}`), 800); });

let _vidObserver = null;
let _playObserver = null;   // pauses clips that scroll away / resumes on return — see lazyMedia
const EAGER_VIDEOS = 2;
function _loadVid(v){
  if(!v.isConnected || !v.dataset.vsrc) return;   // detached = a card from a page we already left — never start its download
  const name = v.dataset.vsrc.split('/').pop(), t0 = performance.now();
  if(_vdebug){
    vlog(`▶ ${name}`);
    v.addEventListener('canplay', ()=>vlog(`✓ ${name} ${Math.round(performance.now()-t0)}ms`), {once:true});
    v.addEventListener('error',   ()=>vlog(`✗ ${name} ERROR code=${v.error&&v.error.code}`), {once:true});
    setTimeout(()=>{ if(v.isConnected && v.readyState<3) vlog(`… ${name} STUCK @8s ready=${v.readyState} net=${v.networkState}`); }, 8000);
  }
  v.preload = 'auto';                         // commit to buffering — the tag ships as preload="none"
  v.src = v.dataset.vsrc; v.removeAttribute('data-vsrc');
  const go = ()=>v.play().catch(()=>{});
  go();                                       // try now (may reject — nothing buffered yet)
  v.addEventListener('canplay', go, {once:true});   // …then again the moment it's ready (fixes eager top-of-feed clips, esp. big gateway videos)
  if(_playObserver) _playObserver.observe(v); // hand playback control to the on/off-screen observer
  // Stall watchdog (2026-08-04, from HUD field data): on a weak-signal moment a clip's
  // stream can sit at ready=0 for 10-30s while the SW's background cache-fill of the SAME
  // clip quietly completes on its own connection. If the element still has NO data after
  // 10s, re-kick it (load() re-requests the src) — by then the fill has usually landed,
  // so the retry answers instantly from the cache. Repeats every 12s until data arrives;
  // never touches a clip that has started (readyState>=2).
  const kick = ()=>{
    if(!v.isConnected || v.readyState >= 2) return;
    vlog(`↻ ${name} re-kick @${Math.round((performance.now()-t0)/1000)}s`);
    v.load(); v.play().catch(()=>{});
    v.addEventListener('canplay', go, {once:true});
    setTimeout(kick, 12000);
  };
  setTimeout(kick, 10000);
}
/* Eager-load the top-of-feed clips SEQUENTIALLY, not all at once. Loading them together
   made them split the (cellular) pipe with each other AND with the render-time image burst,
   so the top 1–2 cards crawled while a clip scrolled to later loaded fast on an idle pipe.
   Chaining gives the very top clip the whole pipe first; the next starts once this one has
   data (loadeddata) or after a short fallback so a stalled clip can't block the chain. */
function _loadEager(vids, i){
  if(i >= Math.min(EAGER_VIDEOS, vids.length)) return;
  const v = vids[i];
  let advanced = false;
  const next = ()=>{ if(advanced) return; advanced = true; _loadEager(vids, i+1); };
  _loadVid(v);
  v.addEventListener('loadeddata', next, {once:true});
  setTimeout(next, 1200);                     // don't let a stalled top clip block the next
}
/* Warm-the-pipe prefetch (2026-08-04): once the eager top clips have had the pipe to
   themselves, quietly fetch() the NEXT few clips in feed order so their bytes are already
   in the service worker's media cache (or the plain HTTP cache) BEFORE the user scrolls
   to them — the observer then flips src on a fully-local file and it plays instantly
   instead of stalling mid-scroll. Sequential (one clip owns the pipe at a time), skips
   clips the observer already claimed, cancelled by the next render() via the token so an
   old feed's prefetch never fights a fresh feed's own clips. Respects Data Saver. */
const PREFETCH_VIDEOS = 4;
let _prefetchToken = 0;
/* Sibling-gateway hero warm-up (2026-08-04): the clip a gateway opens on is the FIRST
   video in its feed — so while sitting anywhere in a sector context (sector page or a
   gateway in it), quietly pull the hero clip of every OTHER built gateway in that sector
   into the cache. This is the "kick-start trigger" for rapid gateway-hopping: by the
   time a sibling gateway is tapped, its opening clip is already local. ~4 clips ×
   ~0.4MB once per sector; the SW media cache makes every later pass a cheap 304. */
function _sectorHeroUrls(){
  const sk = activeSectorKey();
  if(!sk || !SECTOR_GATEWAYS[sk]) return [];
  const cur = (state.screen==='gateway' && state._gwObj) ? gwKeyFromName(state._gwObj.name) : null;
  const urls = [];
  SECTOR_GATEWAYS[sk].forEach(n=>{
    if(isGwHeader(n)) return;                 // '#Group' divider, not a gateway
    const k = gwKeyFromName(n);
    if(k === cur) return;                     // the one we're in is already playing
    const g = GATEWAYS[k];
    const f = g && g.feed && g.feed.find(x=>x.video);
    if(f) urls.push(mediaUrl(f.video));
  });
  return urls;
}
function _prefetchVids(vids){
  const token = ++_prefetchToken;
  if(navigator.connection && navigator.connection.saveData) return;
  // This feed's next clips first (the user is about to scroll to them)…
  const feedUrls = Array.prototype.slice.call(vids, EAGER_VIDEOS, EAGER_VIDEOS + PREFETCH_VIDEOS)
                     .map(v => v.dataset.vsrc).filter(Boolean);
  const seen = new Set(feedUrls);
  // …then the sector's sibling-gateway hero clips (the user may hop to them)…
  const heroes = _sectorHeroUrls().filter(u => !seen.has(u));
  heroes.forEach(u => seen.add(u));
  // …then EVERY other built gateway's hero (2026-08-04): over a session the whole app
  // warms — each clip is pulled once EVER (SW media cache), an already-cached one costs
  // a headers-only revalidate — so "first visit to a new gateway" stops being a cold
  // start. Sequential + token-cancelled, so it only ever uses idle pipe. ~20 clips ×
  // ~0.4MB one-time on a fresh device; set WARM_ALL_HEROES=false to keep it sector-only.
  const WARM_ALL_HEROES = true;
  if(WARM_ALL_HEROES) Object.keys(GATEWAYS).forEach(k=>{
    const g = GATEWAYS[k];
    const f = g && g.feed && g.feed.find(x=>x.video);
    if(f){ const u = mediaUrl(f.video); if(!seen.has(u)){ seen.add(u); heroes.push(u); } }
  });
  let list = feedUrls.map(u => ({u, feed:true})).concat(heroes.map(u => ({u})));
  // Politeness gate (2026-08-04): never warm while an ON-SCREEN clip is still fighting
  // for its first frame — on a weak signal the warm-up otherwise competes with the very
  // video the user is looking at. "Fighting" = playing (autoplay committed) but below
  // HAVE_FUTURE_DATA; clips paused offscreen by _playObserver don't count.
  const busy = ()=>{
    const vs = document.querySelectorAll('video[src]');
    for(const v of vs){ if(v.isConnected && !v.paused && v.readyState < 3) return true; }
    return false;
  };
  let i = 0;
  const failed = []; let retried = false;
  const next = ()=>{
    if(token !== _prefetchToken) return;
    if(i >= list.length){
      // Retry pass (2026-08-04): a warm fetch that dies (dead-socket window, signal dip)
      // used to be skipped for the whole session — leaving random cold holes in the cache
      // that bite exactly when a gateway is opened later. Re-queue the failures ONCE after
      // the chain finishes; a clip that fails twice waits for the next session.
      if(failed.length && !retried){ retried = true; list = failed.slice(); failed.length = 0; i = 0; setTimeout(next, 5000); }
      return;
    }
    if(busy()){ setTimeout(next, 800); return; }   // stand aside, re-check shortly
    const it = list[i++];
    if(it.feed && !document.querySelector(`video[data-vsrc="${it.u}"]`)){ next(); return; }   // observer got there first
    // 20s abort-timeout (2026-08-04): a warm fetch that starts just as the link drops out
    // used to hang for a minute-plus, WEDGING the whole sequential chain — HUD showed
    // gateway heroes still cold after 3+ min in-app. Now a hung fetch fails fast into the
    // retry pile and the chain moves on.
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const tid = setTimeout(()=>{ if(ctrl) ctrl.abort(); }, 20000);
    const done = ()=>{ clearTimeout(tid); next(); };
    fetch(it.u, ctrl ? {signal: ctrl.signal} : {})
      .then(r => { if(!r.ok) throw 0; return r.blob(); })   // .blob() = pull the full body into cache
      .catch(()=>{ failed.push(it); }).then(done, done);
  };
  setTimeout(next, 3000);                     // eager clips own the pipe first
}
function lazyMedia(){
  const vids = document.querySelectorAll('video[data-vsrc]');
  if(!vids.length) return;
  // Decoder relief (2026-08-04): every loaded clip used to autoplay-loop FOREVER, so a
  // long scroll left 15+ videos playing at once — phones have a hard cap on concurrent
  // video decoders, and once it's hit, newly-started clips stall at random waiting for
  // a slot (part of the "sticky with no pattern" report). This observer pauses any clip
  // that scrolls out of view (+150px grace) and resumes it on return — only the clips
  // actually on screen ever hold a decoder. Buffered data is kept, so resume is instant.
  if(_playObserver) _playObserver.disconnect();
  if('IntersectionObserver' in window){
    _playObserver = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        const v = en.target;
        if(en.isIntersecting){ if(v.paused) v.play().catch(()=>{}); }
        else if(!v.paused) v.pause();
      });
    }, { rootMargin:'150px 0px' });
  }
  // Eager-load the top-of-feed clips right now — sequentially (see _loadEager).
  _loadEager(vids, 0);
  _prefetchVids(vids);
  const rest = Array.prototype.slice.call(vids, EAGER_VIDEOS);
  if(!rest.length) return;
  if(!('IntersectionObserver' in window)){ rest.forEach(_loadVid); return; }
  if(_vidObserver) _vidObserver.disconnect();
  _vidObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ _loadVid(en.target); _vidObserver.unobserve(en.target); } });
  }, { rootMargin:'900px 0px' });             // ~1.5 screens ahead — start the download well before the card is looked at
  rest.forEach(v=>_vidObserver.observe(v));
}

/* Post body with an X-style "Show more" (2026-08-06). Short posts render whole; long ones
   truncate at a word boundary and reveal the rest in place — a local DOM toggle, so the feed
   never re-renders or jumps scroll. `state`-free on purpose: expansion is throwaway view state. */
function heroTextBlock(text, style){
  const LIMIT = 220;
  const base = `font-size:13.5px;line-height:1.5;color:var(--ink);${style||''}`;
  if(!text) return '';
  if(text.length <= LIMIT) return `<div style="${base}">${text}</div>`;
  const cut = text.slice(0, LIMIT).replace(/\s+\S*$/,'');
  return `<div class="htext" style="${base}">`
    + `<span class="short">${cut}… <span onclick="event.stopPropagation();heroMore(this)" style="color:var(--muted);font-weight:800;cursor:pointer">Show more</span></span>`
    + `<span class="full" style="display:none">${text}</span>`
    + `</div>`;
}
function heroMore(link){
  const box = link.closest('.htext'); if(!box) return;
  const s = box.querySelector('.short'), f = box.querySelector('.full');
  if(s) s.style.display='none'; if(f) f.style.display='';
}

/* ── Link-follow history ────────────────────────────────────────────────
   Every time you tap a link that carries you to another page in the ecosystem
   (a gateway from a feed card, a brand zone, a sector, an event → its gateway…)
   we stash a snapshot of exactly where you were — the screen AND its scroll
   position. Back (goBack) then rewinds those, one by one, dropping you straight
   back into the feed you came from, right where you left off. Kept separate from
   the utility-tab toggle memory (_before) and the altitude fallback below. */
let _navSilent = false;   // set while goBack does its own altitude descent, so those hops don't re-record
function navSnapshot(){
  // A bottom-bar utility tab (Discover/AI/Events/Profile) is a toggleable overlay you
  // open/close by tapping it — never a real destination, so Back must not land you back
  // inside one. When a tab is open, the place worth remembering is the content BENEATH it
  // (state._before, captured with its own scroll when the tab was opened). Following a link
  // out of a tab therefore records the feed you came from, not the tab.
  if (UTIL_TABS.includes(state.tab)) return state._before ? {...state._before} : null;
  return {
    tab:state.tab, screen:state.screen, sector:state.sector, gateway:state.gateway,
    _gwObj:state._gwObj, gwTab:state.gwTab, space:state.space, returnGw:state.returnGw,
    gwZones:state.gwZones, gwZoneTab:state.gwZoneTab, gwBarPage:state.gwBarPage,
    zone:state.zone, zoneTab:state.zoneTab, zoneBarPage:state.zoneBarPage,
    scroll:$('screen').scrollTop,
  };
}
function pushHist(){
  if(_navSilent) return;
  const snap = navSnapshot();
  if(!snap) return;   // nothing real beneath (e.g. a tab opened straight from a cold start) → don't record
  (state._hist || (state._hist=[])).push(snap);
}
function navRestore(b){
  state.tab=b.tab; state.screen=b.screen; state.sector=b.sector; state.gateway=b.gateway;
  state._gwObj=b._gwObj; state.gwTab=b.gwTab; state.space=b.space; state.returnGw=b.returnGw;
  state.gwZones=b.gwZones; state.gwZoneTab=b.gwZoneTab; state.gwBarPage=b.gwBarPage||'commerce';
  state.zone=b.zone||null; state.zoneTab=b.zoneTab||'feed'; state.zoneBarPage=b.zoneBarPage||'main';
  state.zoneProduct=null; state._zoneIn=!!b.zone; state.showFavs=false; state._before=null;
  render(); $('screen').scrollTo(0, b.scroll||0);

}

  state.gwZones = false; state.gwZoneTab = 'brands'; state.gwBarPage = 'commerce';

  state._before = null; state.tab = 'home';   // committed to a real place — tab toggle memory resets

/* Home always takes you home. The other four are toggles: first tap opens the tab

const UTIL_TABS = ['discover','ai','events','profile'];
function setTab(t){

/* The intelligent Back (replaces the old bottom-left Home, 2026-07-23) — one thoughtless
   step toward the Network hub. An open utility tab pops shut first; otherwise Back descends
   the ladder, one rung per tap:

       brand zone → its Brands layer → the gateway feed → the sector feed → the Network hub

   ✏️ 2026-08-26 — ALTITUDE NOW OUTRANKS HISTORY. It used to pop `_hist` first, so a jump
   made from a favourite or a feed card returned to that feed in a single tap and skipped
   every rung between. That made Back's depth unpredictable — sometimes one tap home, some-
   times four — and meant arriving at Bullheart from the ★ panel never showed you the gateway
   or sector it belongs to. The network HAS altitude; Back's job is to climb it, and the
   climb is what teaches the structure. History is still honoured, but only once there is no
   altitude left to descend.

   The two controls are now complementary rather than overlapping: the GENEXXO ‘G’ mark is
   the one-tap teleport all the way home, Back is the one-rung climb. If you want out fast,
   the G is right there. */
function backTarget(){
  if (UTIL_TABS.includes(state.tab)) return 'restore';   // Discover / AI / Events / Profile is open
  if (state.screen==='zone')    return 'zone';
  if (state.screen==='gateway') return 'gateway';
  if (state.screen==='sector')  return 'sector';
  return null;   // already at the Network hub with nothing stacked
}
function goBack(){
  // 1) an open utility tab (Discover/AI/Events/Profile) → toggle it shut, restoring _before
  if (UTIL_TABS.includes(state.tab)){ setTab(state.tab); return; }
  // 2) a product sheet is open in a zone → just close the sheet
  if (state.zoneProduct!=null){ closeProduct(); return; }
  // 3) a commercial layer (Brands/Apps/Pro's) is open on a gateway → collapse to its feed first
  if (state.screen==='gateway' && state.gwZones){ gwHome(); return; }
  // 4) descend one rung of altitude. This runs BEFORE history on purpose — see above.
  _navSilent = true;                                      // these moves are a climb, not a new jump
  const rung = backTarget();
  switch(rung){
    case 'zone':    zoneToGateway(); break;               // zone → its Brands layer
    case 'gateway':{
      const gw = state._gwObj;                            // gateway feed → up to its sector
      const sec = gw && (gwSecOf(gw) || gw.sector);
      if (sec) openSector(sec); else goHub();
      break;
    }
    case 'sector':  goHub(); break;                       // sector → the Network hub
  }
  _navSilent = false;
  if (rung) return;
  // 5) no altitude left — you are at the hub. Honour a recorded jump if there is one, so a
  //    deep-link entry still has somewhere to go rather than dead-ending.
  if (state._hist && state._hist.length){ navRestore(state._hist.pop()); return; }
}

/* ═════════ FIRST-RUN NUDGES ═════════
   One-time pulses walk a new user through the key nav, in the order they meet it:
   home → Network on the feed bar + left half-moon (sectors), first sector →
   Gateways on the bar + right half-moon, first scroll inside a gateway → the ★
   (commercial layer). Each pulses until used once, then vanishes forever
   (localStorage). ?nudges=reset re-arms them all. */
function nudgeDone(k){ try{ return localStorage.getItem('gx_nudge_'+k)==='1'; }catch(e){ return true; } }
function clearNudge(k){
  try{ localStorage.setItem('gx_nudge_'+k,'1'); }catch(e){}
  if(k==='edgeL') $('edge').classList.remove('nudge');
  if(k==='edgeR') $('edgeR').classList.remove('nudge');
  if(k==='star'){ const st=document.getElementById('gwStar'); if(st) st.classList.remove('star-nudge'); }
  if(k==='barNet'||k==='barGws') document.querySelectorAll('.bar-nudge').forEach(el=>el.classList.remove('bar-nudge'));
  if(k==='barMore') document.querySelectorAll('.arrow-nudge').forEach(el=>el.classList.remove('arrow-nudge'));

        <div class="dic" style="background:${real?real.gradient:home.g}">${real?real.emoji:home.icon}</div>
        <div style="flex:1;min-width:0"><div class="dnm">${gwLabel(name)}</div><div class="dwhere">${label}</div></div>
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">${real?LIVE_DOT:''}${rowStar(key)}</div>
      </div>`;
    };
    /* ── "Built & live" shortcut (2026-08-19) ────────────────────────────────
       A shortcut band at the top of the gateway drawer so someone seeing the demo
       for the first time can reach a built-out gateway immediately instead of
       scrolling a 400-row structural list looking for a green dot.
       Only 12 of 69 sectors contain a live gateway, so where the sector has none
       it falls back to the network's live builds, reusing the same "elsewhere"
       row treatment as search. Purely additive — the full list still renders
       below, unchanged, and the shortcut is suppressed while searching.
       Set LIVE_FIRST = false to remove it entirely. */
    const liveBand = () => {
      if(!LIVE_FIRST) return '';
      const localLive = names.filter(n=>!isGwHeader(n) && gwIsLive(n));
      if(localLive.length){
        // white dot, not LIVE_DOT — the standard green dot is invisible on a green pill
        return `<div class="gwsec gwsec-live"><span class="livepill"><i class="livedot"></i>Live Demo Gateways</span><span class="livect">${localLive.length}</span></div>`
             + localLive.map(gwRow).join('');
      }
      // None built out in this sector yet — say so plainly rather than filling the space with
      // other sectors' gateways, which read as a distraction from the list you actually opened.
      return `<div class="gwsec gwsec-soon">Live Demo Gateways · coming soon</div>`;
    };
    const q=(state.gwQuery||'').trim().toLowerCase();
    let out;
    if(q){
      // Searching → flatten across sub-groups, drop dividers, live first. Matches name + tags.
      const local = names.filter(n=>!isGwHeader(n))
        .filter(n=>{ const hay=gwSearchText(n); return gwQueryForms(q).some(f=>hay.includes(f)); })
        .sort((a,b)=>(gwIsLive(b)?1:0)-(gwIsLive(a)?1:0));
      out = local.map(gwRow).join('');
      // Second tier: the same query across every other sector. A gateway can legitimately live
      // in several tiles (CardiologyXX is in Health AND Education), and a related one often sits
      // in a neighbouring tile entirely — without this, searching "cardiology" from Sports finds
      // nothing at all. Kept visually separate and clearly attributed.
      const elsewhere = gwFindElsewhere(q, sk, new Set(local.map(n=>n.toLowerCase())));
      if(elsewhere.length){
        out += `<div class="gwsec gwsec-wide">Elsewhere in the network · ${elsewhere.length}</div>`
             + elsewhere.map(h=>gwWideRow(h.name,h.sectors)).join('');
      }
    } else if(hasGwGroups(sk)){
      // Grouped sector — file order; sticky sub-group dividers double as jump anchors (id=gwsec-N).
      let gi=-1;
      out = liveBand() + names.map(n => isGwHeader(n)
        ? `<div class="gwanchor" id="gwsec-${++gi}"></div><div class="gwsec">${n.slice(1)}</div>`
        : gwRow(n)).join('');
    } else {
      // Built-out (live) gateways rise to the top; favourites rise first within each tier.
      const rank = n => (gwIsLive(n)?0:2) + (isFav(n)?0:1);
      out = liveBand() + [...names].sort((a,b)=>rank(a)-rank(b)).map(gwRow).join('');
    }
    $('drawerRList').innerHTML = out || `<div class="empty">No gateways match “${escHtml(state.gwQuery)}”.</div>`;
    updateGwJump(sk, q);   // show the "Jump ▾" control only for grouped sectors while browsing
  }
}

function tabBar(){
  // The main ecosystem bar (Back·Discover·AI·Events·Profile) now continues UNCHANGED into the
  // brand zones — Feed & Shop moved up to the zone top bar. In a zone the bar re-skins to the
  // parent gateway, exactly as it does one rung up, so the transition reads as continuous.
  const gw = (state.screen==='gateway' || state.screen==='zone') && state._gwObj;
  const t = gw && gw.theme;
  // active tab = the gateway's OWN text colour (same as the domain name in the top bar), so it
  // always reads against the bar — the brand accent could sit too close to the bar and vanish.
  const active = gw ? t.text : '#111116';

  const tb = $('tabbar');

  const canBack = !!backTarget() || !!(state._hist && state._hist.length) || (state.screen==='gateway' && state.gwZones) || state.zoneProduct!=null;
  const dead = gw ? `${t.text}24` : 'rgba(17,17,22,.16)';   // Back with nowhere to go
  tb.innerHTML = tabs.map(([k,lb]) => {
    if (k==='back'){
      const col = canBack ? idle : dead;
      return `<div class="tab" style="color:${col}${canBack?'':';pointer-events:none'}" onclick="goBack()">${ICONS.back}<div class="lb">${lb}</div></div>`;
    }
    return `<div class="tab ${state.tab===k?'on':''}" style="color:${state.tab===k?active:idle}" onclick="setTab('${k}')">${ICONS[k]}<div class="lb">${lb}</div></div>`;
  }).join('');
}

/* ═════════ THE CONTROL — Network · Sectors · Gateways (2026-07-22) ═════════
   The original top bar stays exactly as the shell always had it (topBar / topBar(gw)).
   The ecosystem control lives in this altitude-coloured sub-bar directly beneath it, and
   doubles as a live breadcrumb: the middle slot becomes the sector once you're in one, the
   third becomes the gateway once you open one. Replaces the old [place]·Feed·[below] feed-
   bar grammar — the sub-bar is now navigation, the feed is just the content beneath it. */
function navSubBar(){
  const gw = (state.screen==='gateway') ? state._gwObj : null;
  const secKey = activeSectorKey();
  const s = secKey ? sectorOf(secKey) : null;
  const barBg = gw ? gw.gradient : (s ? s.g : '#26262b');

  const netOn = state.screen==='root';
  const secOn = state.screen==='sector';
  const gwOn  = state.screen==='gateway';
  const secLabel = s ? s.name : 'Sectors';   // no icon — the name alone carries the slot
  const gwLabel  = gw ? gw.name : 'Gateways';
  // teach Gateways the first time you're standing in a sector (same barGws gold pulse)
  const gwNudge = secOn && !nudgeDone('barGws');

  // The "tablet" is the .ntab.on highlight — it sits on the live tab and eases between
  // tabs via .ntab's existing background transition. Text stays evenly weighted (.idt).
  const item = (lb, act, on, title, nudge) =>
    `<div onclick="${act}" title="${title||lb}" class="ntab idt${on?' on':''}${nudge?' bar-nudge':''}">${lb}</div>`;

  return `<div class="substick netbar" style="background:${barBg}">
    ${item('Network', 'goHub()', netOn, 'Network feed')}
    ${item(secLabel, 'openDrawer()', secOn, s?'Switch sector':'Choose a sector')}
    ${item(gwLabel, gwNudge?"clearNudge('barGws');gatewaysTap()":'gatewaysTap()', gwOn, gw?`${gw.name} — switch gateway`:'Gateways', gwNudge)}
  </div>`;
}
/* Keep the Network·Sectors·Gateways sub-bar highlight in sync with an OPEN drawer (2026-08-06).
   Opening a drawer lights its slot as "tapped" even before a sector/gateway is chosen; closing
   without a selection reverts to the slot the current screen implies (Network at home). Toggles the
   `.ntab.on` class directly (no full re-render → the feed keeps its scroll). Early-returns on the
   gateway/zone screens, whose Feed·Brands·Apps bar reuses `.netbar` — so a drawer there never lights
   the wrong slot. */
function syncNetbar(){
  if (state.screen==='gateway' || state.screen==='zone') return;
  const scr=$('screen'); if(!scr) return;
  const bar=scr.querySelector('.netbar'); if(!bar) return;
  const tabs=bar.querySelectorAll('.ntab'); if(tabs.length<3) return;
  let idx = state.screen==='gateway' ? 2 : state.screen==='sector' ? 1 : 0;   // screen default
  if(state.drawerOpen) idx=1;                                                  // sector drawer open
  else if($('frame').classList.contains('drawer-open-r')) idx=2;               // gateway drawer open
  tabs.forEach((t,i)=>t.classList.toggle('on', i===idx));
}
/* Gateways only makes sense once you're in a sector. Tap it too early → a friendly
   nudge, and the sectors drawer opens so the fix is right there. */
function gatewaysTap(){
  if(activeSectorKey()){ openDrawerR(); return; }
  toast('👋 Choose a sector first — its gateways open here');

}
function toast(msg){
  const f=$('frame'); let el=$('navToast');
  if(!el){
    el=document.createElement('div'); el.id='navToast';
    el.style.cssText='position:absolute;left:50%;bottom:98px;transform:translateX(-50%) translateY(8px);z-index:80;background:#111116;color:#fff;font-size:12.5px;font-weight:700;padding:11px 17px;border-radius:99px;box-shadow:0 12px 32px rgba(0,0,0,.32);opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;pointer-events:none;max-width:88%';
    f.appendChild(el);
  }
  el.textContent=msg;
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)'; });
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(8px)'; }, 2100);
}
/* ═════════ DESKTOP · gateway gutter panels ═════════
   Brand Zones left, Apps & Tools right — the pair the legacy deck carried, rebuilt here
   against the shared data (gw.brandZones / gw.apps) rather than the deck's own
   BRAND_DIRECTORY. Same reason the desktop layout is not a second app: a separate copy of
   this is what rotted last time.
   Colour is applied INLINE from the gateway theme rather than through a class, because
   every gateway carries its own palette — there is no fixed set of themes to enumerate in
   the stylesheet. Structure lives in .gw-panel / .gwp-* in the 1120px query. */
function buildGwPanels(){
  const L=$('gwPanelL'), R=$('gwPanelR'); if(!L||!R) return;
  // Same fallback renderZonePage() uses — a zone reached without _gwObj still knows its gateway.
  const _z = (state.screen==='zone') ? ZONES[state.zone] : null;
  const gw = state._gwObj || (_z && GATEWAYS[_z.gw]);
  if(!gw){ L.innerHTML=''; R.innerHTML=''; $('screen').style.background=''; return; }
  const t = gw.theme || {};
  const ink = t.text || 'var(--ink)';
  [L,R].forEach(p=>{ p.style.background = t.bg || 'var(--bg)'; p.style.color = ink; });
  /* The gateway's own background is on .push, which #screen>* caps at the 600px centre
     measure — so between the feed and each panel a strip of the app's neutral --bg showed
     through, splitting one themed page into three. Paint #screen to match: the feed keeps
     its own .push background (same colour), and the strips join the panels. */
  $('screen').style.background = t.bg || '';
  L.style.borderRight = '1px solid ' + (t.cardBorder||'var(--line)');
  R.style.borderLeft  = '1px solid ' + (t.cardBorder||'var(--line)');

  /* Two different places, two different jobs — this is the distinction that was collapsed
     at first. A GATEWAY (climbxx.com) is the domain: its gutters list what lives inside it,
     Brand Zones and Apps. A BRAND ZONE (Lithos Sport) is one brand's own space inside that
     gateway: its gutters are that brand's shop windows. Commerce frames belong to the
     second only — a gateway is not a shop. */
  const z = (state.screen==='zone') ? ZONES[state.zone] : null;
  const accent = z ? z.color : (t.accent||'var(--ink)');
  const head = label => `<div class="gwp-h" style="color:${accent}">${label}</div>`;

  if(z){
    /* One commerce slot: an image frame over a two-line caption. Deliberately EMPTY — the
       template the creative drops into, not a rendering of z.products. It carries the
       brand's colour so the shape of the page is right at a glance while the inventory
       that fills it is still being decided. */
    const frame = () => `
      <div class="gwp-frame" style="border-color:${t.cardBorder||'var(--line)'};background:${t.cardBg||'#fff'}">
        <div class="gwp-img" style="border-color:${t.cardBorder||'var(--line)'};color:${accent}">▣</div>
        <div class="gwp-cap">
          <span style="background:${t.text||'var(--ink)'};width:64%"></span>
          <span style="background:${t.text||'var(--ink)'};width:38%"></span>
        </div>
      </div>`;
    const wall = label => head(label) + frame() + frame() + frame();
    L.innerHTML = wall(z.name);
    R.innerHTML = wall('Featured');
    return;
  }

  const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const empty = msg =>
    `<div class="gwp-empty" style="border-color:${t.cardBorder||'var(--line)'}">${msg}</div>`;
  const card = (o) => `
    <div class="gwp-card${o.click?' tap':''}" style="background:${t.cardBg||'#fff'};border-color:${t.cardBorder||'var(--line)'}"
      ${o.click?`onclick="${o.click}"`:''}
      ${o.click?`onmouseover="this.style.borderColor='${accent}'" onmouseout="this.style.borderColor='${t.cardBorder||'rgba(17,17,22,.08)'}'"`:''}>
      <div class="gwp-av" style="background:${o.logo?'#fff':o.color}${o.logo?';padding:3px':''}">${
        o.logo ? `<img src="${mediaUrl(o.logo)}" alt="${esc(o.name)}">` : initials(o.name)}</div>
      <div class="gwp-tx"><div class="gwp-nm">${o.name}</div><div class="gwp-sb">${o.sub}</div></div>
    </div>`;

  const zones = gw.brandZones || [];
  L.innerHTML = head('◆ Brand Zones') + (zones.length
    ? zones.map(b=>card({ name:b.name, sub:b.tag||b.tier, color:b.color, logo:b.logo,
        click: (b.key && ZONES[b.key]) ? `openZone('${b.key}')` : '' })).join('')
    : empty(`Brand Zones open here when ${esc(gw.name)} goes live.`));

  const apps = gw.apps || [];
  R.innerHTML = head('⚙ Apps &amp; Tools') + (apps.length
    ? apps.map(a=>card({ name:a.name, sub:a.desc, color:a.color })).join('')
    : empty(`Gateway apps land here when ${esc(gw.name)} goes live.`));
}
function renderHome(){

    : (i.video || i.img || i.media) ? heroFeedCard(i.gw,i,true)

/* ═════════ SECTOR (pushed) — a real place: its feed + its gateways ═════════ */
function renderSector(){
  const s = sectorOf(state.sector);

    const card = f => f.videoOnly ? videoCard(state.gateway, f, false) : `
      <div class="gcard" style="background:${t.cardBg};border-color:${t.cardBorder};color:${t.text}">

    body = feed.length ? withExplainer(feed.map(card), explainerCard(GATEWAY_EXPLAINER)).join('')

  // Still parked: gw.spaces (sub-feeds), gw.trending, the hero stat block, and the Ask
  // surface (the network AI tab covers it for now).

  return `${topBar(gw)}
  ${favPanelHtml()}
  <div class="push" style="background:${t.bg};color:${t.text};min-height:calc(100dvh - 53px);margin-top:-1px">

    <div style="height:20px"></div>

/* ═════════ IN-PLACE GATEWAY REPAINT (2026-08-09) ═════════
   render() replaces #screen wholesale — top bar, sub-bar, feed, everything. Inside a
   gateway that's overkill: flipping the bar's page or opening a zone would rebuild the
   whole screen, tearing down every <video> and resetting scroll. That's the flicker.
   repaintGateway() re-runs renderGateway() but grafts across ONLY what changed:
     • the sub-bar (gradient, lit tabs, arrow) — keeping the element so the track can animate
     • #gwBody, and only when the body actually differs
   The top bar, favourites panel and scroll position are left completely alone. */
function repaintGateway(opt){
  opt = opt || {};
  const scr = $('screen');
  const curBar = scr.querySelector('.substick.netbar'), curBody = scr.querySelector('#gwBody');
  if (state.screen!=='gateway' || !curBar || !curBody){ render(); $('screen').scrollTo(0,0); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = renderGateway();
  const newBar = tmp.querySelector('.substick.netbar'), newBody = tmp.querySelector('#gwBody');
  if (!newBar || !newBody){ render(); $('screen').scrollTo(0,0); return; }

  // ── the bar. Swap its contents, then (if asked) run the track from where it actually is
  //    to where it should be — so tapping the › arrow now slides exactly like a swipe does.
  const oldTrack = curBar.querySelector('.gwbar-track');
  const from = oldTrack ? oldTrack.style.transform : '';
  curBar.style.background = newBar.style.background;
  curBar.innerHTML = newBar.innerHTML;
  const track = curBar.querySelector('.gwbar-track');
  if (track && opt.animateBar && from){
    track.classList.remove('snap');
    track.style.transform = from;
    void track.offsetWidth;                    // force a reflow so the start position takes
    track.classList.add('snap');
    track.style.transform = state.gwBarPage==='more' ? 'translateX(-50%)' : 'translateX(0%)';
  }

  // ── the body, only when it's genuinely different content
  if (opt.body){
    curBody.querySelectorAll('video[src]').forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} });
    curBody.innerHTML = newBody.innerHTML;
    lazyMedia();
    scr.scrollTo(0,0);
    if (window.__syncChrome) window.__syncChrome();
  }
  // Changing layer changes what the drawers are FOR, and a repaint is not a render — so the
  // drawer chrome has to be re-synced here or it keeps describing the layer you just left.
  try { syncGwChrome(); } catch(_){}
}

function toggleApp(name,color,gwName){

  render();
}

  // Optional `tab` deep-links a sub-view (e.g. 'events' from the network calendar); the sub-bar
  // page follows it — Media/About/Events live on page 2 ('more'), everything else on page 1.
  const landTab = tab||'feed';

          ${f.type==='media'?`<div style="margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:99px;background:${z.color}14;color:${z.color}">MEDIA</div>`:''}
        </div>
        <div style="font-size:13px;line-height:1.5">${f.text}</div>
        ${(f.video||f.img)?mediaBlock(f,z.gradient,f.type==='media'?200:180):(f.media?`<div style="border-radius:12px;height:150px;margin-top:10px;background:${f.mediaBg||z.gradient};display:flex;align-items:center;justify-content:center;font-size:${f.type==='media'?'26':'36'}px;color:#fff">${f.media}</div>`:'')}
        ${prodRow}
        <div style="margin-top:9px;font-size:11px;font-weight:700;color:var(--muted)">${f.eng}</div>
      </div>`;
  }).join('');
  // Event ↔ zone Events tab: the feed surfaces the zone's FEATURED event as a card that taps
  // straight into the brand's Events view (`setZoneTab('events')`), where the full list lives.
  const fe = zoneFeaturedEvent(z);
  const feMore = zoneEventList(z).length - 1;   // how many more events sit behind the featured one
  const pct = (fe && fe.capacity) ? Math.round(fe.registered/fe.capacity*100) : 0;
  const eventCard = !fe ? '' : (fe.live ? `
    <div class="zcard" style="border:1.5px solid ${z.color}55;cursor:pointer;overflow:hidden;padding:0" onclick="setZoneTab('events')">
      <div style="position:relative;height:158px;background:#000">
        <img src="${mediaUrl(fe.poster)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block;opacity:.82">
        <span style="position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:#EF4444;color:#fff">🔴 LIVE</span>
        <span style="position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff">👁 ${fe.viewers}</span>
        <div style="position:absolute;left:12px;right:12px;bottom:10px;color:#fff">
          <div style="font-size:15px;font-weight:800;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.6)">${fe.title}</div>
          <div style="font-size:11.5px;font-weight:600;opacity:.92;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)">${fe.now}</div>
        </div>
      </div>
      <div style="padding:11px 13px 13px">
        <div style="font-size:12.5px;line-height:1.45;color:var(--muted)">${fe.subtitle}</div>
        <div style="margin-top:9px;font-size:10.5px;font-weight:800;color:${z.color}">Watch live in Events${feMore>0?` · +${feMore} more`:''} ›</div>
      </div>
    </div>` : `
    <div class="zcard" style="border:1.5px solid ${z.color}55;cursor:pointer" onclick="setZoneTab('events')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:99px;background:${z.color};color:#fff">📅 ${fe.tag}</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted)">${fe.when}</span>
      </div>
      <div style="font-size:15px;font-weight:800;line-height:1.3">${fe.title}</div>
      <div style="font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:5px">${fe.desc}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:11px">
        <div style="flex:1;height:5px;border-radius:99px;background:${z.color}22;overflow:hidden"><div style="width:${pct}%;height:100%;background:${z.color}"></div></div>
        <div style="font-size:10px;font-weight:800;color:${z.color};white-space:nowrap">${fe.registered.toLocaleString()} / ${fe.capacity.toLocaleString()}</div>
      </div>
      <div style="margin-top:10px;font-size:10.5px;font-weight:800;color:${z.color}">See it in Events${feMore>0?` · +${feMore} more`:''} ›</div>
    </div>`);
  return hero + eventCard + cards;
}

function zoneProducts(z){
  // Optional category filter (set by the Shop overlay). 'specials' → the brand's flagged picks;
  // any other key → products tagged with that collection. Cells map BACK to the original index so
  // openProduct(i) still hits the right item in the unfiltered z.products array.
  const cat = state.shopCat;
  const hasCats = Array.isArray(z.shopCats) && z.shopCats.length;
  const shown = !cat ? z.products
    : cat==='specials' ? z.products.filter(p=>p.special)
    : z.products.filter(p=>p.cat===cat);
  const catObj = cat && cat!=='specials' && hasCats ? z.shopCats.find(c=>c.key===cat) : null;
  const catLabel = cat==='specials' ? 'Brand Specials' : (catObj?catObj.label:'');
  const catIcon  = cat==='specials' ? '★' : (catObj?catObj.icon:'');

  const cells = shown.map(p=>{
    const i = z.products.indexOf(p);
    return `
    <div class="zprod" onclick="openProduct(${i})">
      <div style="height:92px;background:${z.color}10;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative">${p.emoji}
        ${p.tag?`<div style="position:absolute;top:8px;left:8px;font-size:7.5px;font-weight:800;letter-spacing:.07em;padding:3px 7px;border-radius:99px;background:${z.color};color:#fff">${p.tag}</div>`:''}
      </div>
      <div style="padding:10px 11px 11px">
        <div style="font-size:12px;font-weight:800;line-height:1.25">${p.name}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px"><div style="font-size:13px;font-weight:800;color:${z.color}">${p.price}</div><div style="font-size:10px;color:var(--muted);font-weight:700">★ ${p.rating}</div></div>
      </div>
    </div>`;
  }).join('');

  // Header: filtered → chip showing the active collection (tap to change) + Clear; unfiltered → a
  // "Shop by category" pill that re-opens the overlay (only when the brand actually defines tiles).
  const header = cat
    ? `<div style="padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
         <div onclick="openShopMenu()" style="display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:${z.color}12;border:1px solid ${z.color}44;cursor:pointer">
           <span style="font-size:14px">${catIcon}</span>
           <span style="font-size:12.5px;font-weight:800;color:${z.color}">${catLabel}</span>
           <span style="font-size:11px;font-weight:700;color:var(--muted)">${shown.length}</span>
           <span style="font-size:11px;color:${z.color};font-weight:800">▾</span>
         </div>
         <div onclick="clearShopCat()" style="font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 4px">Clear ✕</div>
       </div>`
    : (hasCats
      ? `<div style="padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px">
           <div style="font-size:11px;color:var(--muted);font-weight:600">${z.products.length} of ${z.stats.products} products · the full range lands with the live build</div>
           <div onclick="openShopMenu()" style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:${z.color};color:#fff;font-size:12px;font-weight:800;cursor:pointer">▤ Categories</div>
         </div>`
      : `<div style="padding:14px 16px 10px;font-size:11px;color:var(--muted);font-weight:600">${z.products.length} of ${z.stats.products} products · the full range lands with the live build</div>`);

  const body = shown.length
    ? `<div class="zgrid">${cells}</div>`
    : `<div class="empty">Nothing in this collection yet —<br>tap ${catLabel||'the filter'} to pick another.</div>`;
  return header + body;
}

// Products tab = the full catalogue list (tap a product → its page), like any commerce store.

}

// A single event shape: a live stream {live,now,viewers,poster} OR a scheduled event
// {zoneEvent,when,desc,registered,capacity}. A zone carries either a list `z.events` OR a
// single `z.event` (kept working via the fallback below), so old zones need no data change.
function zoneEventList(z){ return z.events && z.events.length ? z.events : (z.event ? [z.event] : []); }
/* The featured event — a live stream floats to the top, else the first scheduled one.
   Used by both the zone feed's event card and the zone Events view's hero. */
function zoneFeaturedEvent(z){ const l=zoneEventList(z); return l.length ? [...l].sort((a,b)=>(b.live?1:0)-(a.live?1:0))[0] : null; }

/* Big hero card — the featured event (a live stream floats to the top, else the first). */
function zoneEventHero(z, e){
  const live=!!e.live;
  const pct = (e.registered && e.capacity) ? Math.min(100, Math.round(e.registered/e.capacity*100)) : null;
  const hero = e.poster
    ? `<div style="height:150px;background:#000 url('${e.poster}') center/cover no-repeat;position:relative">
        ${live?`<div style="position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:#EF4444;color:#fff">🔴 LIVE</div>`:''}
       </div>`
    : `<div style="height:88px;background:${z.gradient}"></div>`;
  return `
  <div class="zcard" style="margin-top:12px;padding:0;overflow:hidden">
    ${hero}
    <div style="padding:14px 15px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:${live?'#EF4444':z.color+'18'};color:${live?'#fff':z.color}">${live?'LIVE NOW':'UPCOMING'}</span>
        <span style="font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--muted)">${(e.tag||'EVENT').toUpperCase()}</span>
      </div>
      <div style="font-size:16px;font-weight:800;line-height:1.25">${e.title}</div>
      <div style="font-size:12.5px;line-height:1.55;color:rgba(17,17,22,.72);margin-top:6px">${e.subtitle||e.desc||''}</div>
      ${live
        ? `<div style="display:flex;align-items:center;gap:12px;margin-top:11px;font-size:11px;font-weight:700">
             <span style="color:#EF4444">● ${e.now||'Live now'}</span>
             ${e.viewers?`<span style="color:var(--muted)">${e.viewers} watching</span>`:''}
           </div>
           <div onclick="toast('${esc(z.name)} live opens with the live build')" style="margin-top:13px;text-align:center;font-size:13px;font-weight:800;padding:13px 0;border-radius:14px;background:#EF4444;color:#fff;cursor:pointer">Watch live ›</div>`
        : `${e.when?`<div style="font-size:11.5px;font-weight:800;color:${z.color};margin-top:11px">${e.when}</div>`:''}
           ${pct!=null?`<div style="margin-top:11px">
             <div style="height:6px;border-radius:99px;background:${z.color}18;overflow:hidden"><div style="height:100%;width:${pct}%;background:${z.color}"></div></div>
             <div style="font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px">${e.registered.toLocaleString()} registered · ${e.capacity.toLocaleString()} capacity</div>
           </div>`:''}
           <div onclick="toast('RSVP to ${esc(e.title)} opens with the live build')" style="margin-top:13px;text-align:center;font-size:13px;font-weight:800;padding:13px 0;border-radius:14px;background:${z.color};color:#fff;cursor:pointer">RSVP · reserve your place ›</div>`}
    </div>
  </div>`;
}

/* Compact row — every event after the hero. Whole row taps to RSVP/watch (toast for now). */
function zoneEventRow(z, e){
  const live=!!e.live;
  const meta = live ? (e.now||'Live now') : (e.when||'');
  const cta = live ? `${esc(z.name)} live opens with the live build` : `RSVP to ${esc(e.title)} opens with the live build`;
  return `
  <div class="zcard" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="toast('${cta}')">
    <div style="width:46px;height:46px;border-radius:12px;background:${live?'#EF4444':z.color+'14'};display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:${live?'#fff':z.color}">
      <div style="font-size:8px;font-weight:800;letter-spacing:.04em">${live?'LIVE':'SOON'}</div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--muted)">${(e.tag||'EVENT').toUpperCase()}</div>
      <div style="font-size:13.5px;font-weight:800;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.title}</div>
      ${meta?`<div style="font-size:11px;font-weight:700;color:${live?'#EF4444':z.color};margin-top:2px">${meta}</div>`:''}
    </div>
    <div style="font-size:16px;color:var(--muted);flex-shrink:0">›</div>
  </div>`;
}

function zoneEvents(z){
  // A brand's own events surface — its live sessions, launches and community meetups.
  const list = zoneEventList(z);
  if(!list.length) return `<div class="empty" style="margin-top:12px">Events land with the live build —<br>${z.name}'s live sessions, launches and community meetups will live here.</div>`;
  // Live floats to the top as the featured hero (stable order otherwise); the rest are rows.
  const ordered = [...list].sort((a,b)=>(b.live?1:0)-(a.live?1:0));
  const [hero, ...rest] = ordered;
  return `${zoneEventHero(z, hero)}
  ${rest.map(e=>zoneEventRow(z, e)).join('')}
  <div class="empty" style="margin-top:2px">More ${z.name} events — community meetups, drops and live sessions — collect here as they're scheduled.</div>`;
}

    <div style="text-align:center;font-size:10px;color:var(--muted);font-weight:600;margin-top:9px">Sold &amp; shipped by ${z.name} · you buy direct · GENEXXO files your receipt</div>
  </div>`;

/* ═════════ ZONE — full-page, reuses the gateway shell one rung deeper ═════════
   A Brand / App / Pro zone is a pushed screen like a gateway is: brand-themed top
   bar (breadcrumb back up to the gateway), the same feed-first bar ([brand] · Feed ·
   Brands), and a REPURPOSED bottom bar (Feed · Shop · Bag · Ask · ‹Gateway). This is
   the framework only — Shop/Bag are stubs; the brand feed is the one real body. */
function zoneBag(z){
  if(!state.bag.length) return `<div class="empty">Your bag is empty —<br>add something from Shop and it lands here.</div>`;
  const rows = state.bag.map(id=>{
    const [zk,name]=id.split('/'); const zz=ZONES[zk]; if(!zz) return '';
    const p=zz.products.find(x=>x.name===name); if(!p) return '';
    return `<div class="zcard" style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <div style="width:46px;height:46px;border-radius:12px;background:${zz.color}10;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${p.emoji}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800">${p.name}</div><div style="font-size:11px;color:var(--muted);font-weight:600">${zz.name} · ${p.price}</div></div>
      <div onclick="state.bag.splice(state.bag.indexOf('${esc(id)}'),1);render()" style="font-size:16px;color:var(--muted);cursor:pointer;padding:4px 2px">✕</div>
    </div>`;}).join('');
  const nBrands=bagBrands().length;
  const firstZ=ZONES[bagBrands()[0]];
  const cta = nBrands>1 ? `Checkout · pay each brand direct` : `Checkout with ${firstZ?firstZ.name:'brand'}`;
  return `<div style="padding:14px 16px 2px;font-size:11px;color:var(--muted);font-weight:700">${state.bag.length} in your bag${nBrands>1?` · ${nBrands} brands`:''} · you buy direct from each brand</div>
    ${rows}
    <button class="btn" style="width:calc(100% - 32px);margin:16px 16px 4px;padding:14px 0;border-radius:15px;font-size:13px;background:${firstZ?firstZ.color:'#111116'};color:#fff" onclick="startCheckout()">${cta}</button>
    <div style="text-align:center;font-size:10px;color:var(--muted);font-weight:600;margin:0 16px 8px;line-height:1.5">Payment happens on the brand's own checkout. GENEXXO never handles funds — it files your receipt in My Purchases.</div>`;
}

// (ZICONS removed 2026-07-27 s3 — its only consumer was the retired zone bottom bar.)
function renderZonePage(){
  const z=ZONES[state.zone]; if(!z){ state.screen='gateway'; return renderGateway(); }
  const gw=state._gwObj || GATEWAYS[z.gw];
  document.title = z.name; $('metaTheme').content = z.color;
  // Tidied 2026-07-23: just G · brand on the zone top bar — the sector chip, the sibling-
  // brand deck, and the ‹ClimbXX tablet are gone. The one way back to the main domain
  // (the gateway) lives on the shared bottom bar; brand-switching lives in the Brands sub-tab.
  // (2026-07-27 s3: AI & Profile are ecosystem-level now — no in-zone peek borrows this bar.)
  const head = `<div class="top gw" style="background:${z.gradient};color:#fff">
    <div class="gx-mark" onclick="goHub()" title="GENEXXO hub"><div class="gx-dot" style="background:#fff;color:${z.color}"><span class="gx-mono"></span></div></div>
    <div onclick="zoneToFeed()" title="${esc(z.name)} feed" style="font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.01em;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">${z.name}</div>
    <div onclick="event.stopPropagation();toggleFavPanel()" title="Favourites"
      style="margin-left:auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:99px;cursor:pointer;font-size:19px;line-height:1;color:#fff;opacity:${state.showFavs?'1':'.72'};${state.showFavs?'background:rgba(255,255,255,.18)':''}">${state.showFavs?'★':'☆'}</div>
  </div>`;

  const bag=state.bag.length;
  // Two-page zone sub-bar — same grammar as the gateway commercial bar: a › / ‹ arrow on the
  // right flips between two triads. Page 1 = Feed · Shop · Bag, page 2 = Media · About · Events.
  // On the second page the gradient mirrors (135deg → 225deg) as a subtle flipped-page cue.
  const Z_PAGE1 = [['feed','Feed'],['shop','Shop'],['bag',bag?`Bag·${bag}`:'Bag']];
  const Z_PAGE2 = [['media','Media'],['about','About'],['events','Events']];
  const onMore = state.zoneBarPage==='more';
  const zTabs = onMore ? Z_PAGE2 : Z_PAGE1;
  const zBarArrow = onMore ? '‹' : '›';
  const zBarBg = onMore ? z.gradient.replace('135deg','225deg') : z.gradient;
  // Shop is special: it stays tappable even when active, because tapping it toggles the category
  // overlay (open ⇄ close). Every other heading locks (pointer-events:none) once it's the live view.
  const cTab=(k,lb)=> k==='shop'
    ? `<div class="ntab${state.zoneTab==='shop'?' on':''}" onclick="tapShop()">${lb}</div>`
    : state.zoneTab===k
      ? `<div class="ntab on" style="pointer-events:none">${lb}</div>`
      : `<div class="ntab" onclick="setZoneTab('${k}')">${lb}</div>`;
  const bar = `<div class="substick netbar" style="background:${zBarBg}">
      ${zTabs.map(([k,lb])=>cTab(k,lb)).join('')}
      <div class="ntab" style="flex:0 0 30px;font-size:17px;font-weight:800;opacity:.9;line-height:1;margin-top:-2px" onclick="tapZoneBarPage()" title="${onMore?'Back to Feed · Shop · Bag':'More — Media · About · Events'}">${zBarArrow}</div>
    </div>`;

  const body = state.zoneTab==='products' ? zoneProductList(z)
    : state.zoneTab==='shop' ? zoneProducts(z)
    : state.zoneTab==='bag' ? zoneBag(z)
    : state.zoneTab==='about' ? zoneAbout(z)
    : state.zoneTab==='media' ? zoneMedia(z)
    : state.zoneTab==='events' ? zoneEvents(z)
    : zoneFeed(z);
  return `${head}
  <div class="push" style="background:#FBFBFC;color:var(--ink);min-height:calc(100dvh - 53px);margin-top:-1px">
    ${bar}
    <div style="height:6px"></div>
    ${body}
    <div style="height:20px"></div>
  </div>
  ${favPanelHtml()}
  ${zoneSheetHtml()}
  ${zoneShopMenuHtml()}
  ${checkoutSheetHtml()}`;
}

/* ═════════ CHECKOUT — always DIRECT with the brand ═════════
   GENEXXO never processes funds. Checkout opens the BRAND's own payment surface (brand
   colour, brand pay widget); paying files a receipt into My Purchases with the brand's
   own order reference. A bag spanning brands checks out one brand at a time, because you
   can't pay two different brands in one transaction. */
function brandCode(z){
  const parts=(z.name||'').trim().split(/\s+/);
  if(parts.length>1) return parts.map(w=>w[0]).join('').toUpperCase().slice(0,3);
  return (z.name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
}
function bagItemsForBrand(bk){
  return state.bag.filter(id=>id.split('/')[0]===bk).map(id=>{
    const [zk,name]=id.split('/'); const zz=ZONES[zk]; const p=zz&&zz.products.find(x=>x.name===name);
    return p?{id,p}:null;
  }).filter(Boolean);
}
function bagTotalNum(items){ return items.reduce((s,{p})=>s+(parseFloat((p.price||'').replace(/[^0-9.]/g,''))||0),0); }
function money(n){ return '£'+n.toLocaleString('en-GB'); }
function bagBrands(){ const seen=[]; state.bag.forEach(id=>{const b=id.split('/')[0]; if(!seen.includes(b))seen.push(b);}); return seen; }

function startCheckout(){
  if(!state.bag.length) return;
  state.checkoutBrand = bagBrands()[0];   // first brand in the bag
  state.checkoutDone=null; state.zoneProduct=null; render();
}
function closeCheckout(){ state.checkoutBrand=null; state.checkoutDone=null; render(); }
function placeOrder(){
  const bk=state.checkoutBrand, z=ZONES[bk]; if(!z) return;
  const items=bagItemsForBrand(bk); if(!items.length){ closeCheckout(); return; }
  state.orderSeq=(state.orderSeq||0)+1;
  const ref=brandCode(z)+'-'+(4820+state.orderSeq);
  const now=new Date();
  const order={
    brand:z.key, brandName:z.name, color:z.color, gradient:z.gradient, gw:z.gw,
    ref, ts:now.getTime(),
    date:now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),
    total:money(bagTotalNum(items)),
    items:items.map(({p})=>({name:p.name, price:p.price, emoji:p.emoji})),
  };
  state.purchases.unshift(order);
  state.bag=state.bag.filter(id=>id.split('/')[0]!==bk);   // clear this brand's lines
  savePurchases();
  state.checkoutBrand=null; state.checkoutDone=order; render();
}
function finishCheckout(){
  state.checkoutDone=null;
  if(state.bag.length) startCheckout();   // more brands to pay → straight into the next one
  else render();
}

/* ═════════ DISCOVER ═════════
   `bodyOnly` returns just the contents of #discoverBody, so onDiscoverSearch() can redraw
   the results without touching the search input — see the focus note there. */
function renderDiscover(bodyOnly){
  const q = state.discoverQ.toLowerCase().trim();
  const gwrow = (name, sk) => {
    const real = GATEWAYS[gwKeyFromName(name)];
    const s = sectorOf(sk); if(!s) return '';
    const seen = state.discoverMemo && state.discoverMemo.gw===name;
    return `<div class="gwrow${seen?' seen':''}" onclick="discRemember('${name}');state._gwFrom='root';openGateway('${name}','${sk}')">
      <div class="em" style="background:${real?real.gradient:s.g}">${real?real.emoji:s.icon}</div>
      <div style="flex:1;min-width:0"><div class="nm">${gwLabel(name)}</div><div class="dm">${s.name}</div></div>
      <div class="badge ${real?'live':'soon'}">${real?'LIVE':'STRUCTURAL'}</div>
    </div>`;
  };
  let inner;
  if(q){
    // Ranked search — relevance first (exact → name-prefix → tag-prefix), then live, then A–Z.
    // Before this, Discover matched on a raw substring and sorted only live-first: "art"
    // returned hundreds of rows led by conditions carrying a "heart" tag, with ArtXX nowhere.
    const seen=new Set(), hits=[];
    Object.keys(SECTOR_GATEWAYS).forEach(sk=>{
      if(!sectorOf(sk)) return;
      (SECTOR_GATEWAYS[sk]||[]).forEach(n=>{
        if(isGwHeader(n)) return;
        const k=gwKeyFromName(n); if(seen.has(k)) return;
        const r=gwRank(n,q); if(r<0) return;
        seen.add(k); hits.push({n,sk,r});
      });
    });
    hits.sort((a,b)=> a.r-b.r || (gwIsLive(b.n)?1:0)-(gwIsLive(a.n)?1:0) || a.n.localeCompare(b.n));
    const count = hits.length ? `<div class="gwsec gwsec-wide">${hits.length} ${hits.length===1?'result':'results'}</div>` : '';
    const rows = hits.map(h=>gwrow(h.n,h.sk)).join('')
      || `<div class="empty">No gateways match “${escHtml(state.discoverQ)}”</div>`;
    inner = `${count}${rows}`;
  } else if(state.discoverSector){
    // ── STATE 2: DRILL-DOWN — one sector's gateways, with its sub-group dividers ──
    const sk=state.discoverSector, s=sectorOf(sk);
    if(!s){ state.discoverSector=null; return renderDiscover(bodyOnly); }
    let rows=''; const raw=SECTOR_GATEWAYS[sk]||[];
    const grouped = hasGwGroups(sk);
    if(grouped){
      // Sticky category dividers doubling as jump anchors — same contract as the drawers,
      // where the anchor index is the Nth header in file order (see gwGroupsOf).
      let gi=-1;
      raw.forEach(n=> rows += isGwHeader(n)
        ? `<div class="gwanchor" id="dsec-${++gi}"></div><div class="dsec">${n.slice(1)}</div>`
        : gwrow(n,sk));
    } else {
      [...raw].filter(n=>!isGwHeader(n))
        .sort((a,b)=>(gwIsLive(b)?1:0)-(gwIsLive(a)?1:0)).forEach(n=> rows += gwrow(n,sk));
    }
    if(!rows) rows=`<div class="empty">${s.name} has no gateways yet.</div>`;
    const jumpBtn = grouped ? `<button id="discJumpBtn" onclick="toggleDiscJump(event)" aria-label="Jump to section">Jump ▾</button>` : '';
    const head = `<div class="discbar" id="discBar">
        <button class="discback" aria-label="Back to all sectors"
                onclick="state.discoverSector=null;render();$('screen').scrollTo(0,0)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="discmid" role="button" tabindex="0" title="Open the ${s.name} feed"
             onclick="discRemember(null);openSector('${sk}')">
          <div class="ic" style="background:${s.g}">${s.icon}</div>
          <div class="nmwrap"><div class="nm">${s.name}</div>${sectorIsLive(sk)?LIVE_DOT:''}</div>
          <svg class="discgo" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>${jumpBtn}</div>
      <div id="discJump" class="gwjump discjump" hidden></div>`;
    inner = head + rows;
  } else {
    // ── STATE 3: REST — sector cards grouped by neighbourhood ──
    const gchips = `<div class="chips"><div class="chip ${!state.discoverGroup?'on':''}" onclick="state.discoverGroup=null;render()">All</div>`
      + SECTOR_GROUPS.map(g=>`<div class="chip ${state.discoverGroup===g.key?'on':''}" onclick="state.discoverGroup='${g.key}';render()">${g.label}</div>`).join('')
      + `</div>`;
    let body='';
    for(const grp of SECTOR_GROUPS){
      if(state.discoverGroup && state.discoverGroup!==grp.key) continue;
      const tiles=SECTORS.filter(x=>x.group===grp.key); if(!tiles.length) continue;
      body += `<div class="secgrouphd">${grp.label}</div><div class="seccards">`
        + tiles.map(s=>{
            const live=sectorIsLive(s.key), c=gwCount(s.key);
            return `<div class="seccard${live?' live':''}" onclick="state.discoverSector='${s.key}';render();$('screen').scrollTo(0,0)">
              <div class="ic" style="background:${s.g}">${s.icon}</div>
              <div class="nm">${s.name}${live?'<i class="seclivedot"></i>':''}</div>
              <div class="mt">${c} ${c===1?'gateway':'gateways'}</div>
            </div>`;
          }).join('')
        + `</div>`;
    }
    inner = gchips + body;
  }
  if(bodyOnly) return inner;
  // The search input is STATIC DOM — only #discoverBody is rewritten while typing, so the
  // field keeps focus and the caret.
  return `${topBar()}
  ${favPanelHtml()}
  ${applyPanelHtml()}

        <input id="discoverSearch" placeholder="Search gateways, brands, anything…" value="${esc(state.discoverQ)}"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
               oninput="onDiscoverSearch(this.value)">

/* Discover drill-down "Jump ▾" — same contract as the drawer jumps, but the scroller is the
   page (#screen) rather than a drawer list, so the target must clear the sticky top bar and
   the sticky sector bar. Reuses gwGroupsOf() so the popover indices and the dsec-N anchors
   can never drift apart. */
function toggleDiscJump(e){
  if(e) e.stopPropagation();
  const p=$('discJump'); if(!p) return;
  if(!p.hidden){ p.hidden=true; return; }
  p.innerHTML = `<div class="gwjump-h">Jump to section</div>`+gwGroupsOf(state.discoverSector).map(g=>
    `<div class="gwjump-item" onclick="discJumpTo(${g.index})">${g.name}<span>${g.count}</span></div>`).join('');
  p.hidden=false;
}
function discJumpTo(i){
  const p=$('discJump'); if(p) p.hidden=true;
  const sc=$('screen'), el=$('dsec-'+i); if(!sc||!el) return;
  const top=document.querySelector('#screen .top'), bar=$('discBar');
  const sea=document.querySelector('#screen .searchstick');
  const offset=(top?top.getBoundingClientRect().height:0)+(sea?sea.getBoundingClientRect().height:0)
              +(bar?bar.getBoundingClientRect().height:0);
  const y = sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top - offset;
  sc.scrollTo({top:Math.max(0,y), behavior:'smooth'});
  // Adopt the new position without the auto-hide-chrome listener treating it as a user scroll.
  if(window.__syncChrome) window.__syncChrome();
}
/* Discover search — mirrors onGwSearch: state + a targeted redraw, never a full render().
   The input is outside #discoverBody, so it is never replaced and focus is retained. */
function onDiscoverSearch(v){
  const wasEmpty = !state.discoverQ;
  state.discoverQ = v;
  state.discoverSector = null;            // typing always returns to the flat result list
  const el = $('discoverBody');
  if(el) el.innerHTML = renderDiscover(true);
  else render();                          // defensive: body missing → fall back to a full draw
  /* ⚠️ ANDROID: do NOT scroll #screen on every keystroke.
     scrollTo() fires the auto-hide-chrome scroll listener, which adds/removes `chrome-hidden`
     on #frame. That relayouts the frame, and on Android Chrome — with the soft keyboard open and
     the visual viewport already shrunk — the relayout blurs the focused input, so the user is
     thrown out of the field after every letter. Desktop never shows it: no soft keyboard, and the
     chrome toggle doesn't disturb focus.
     The drawer searches were immune only by accident: initAutoHideChrome() early-returns while a
     drawer is open, so their scrolls never toggle the chrome. Discover is not a drawer.
     So: reset the scroll only when ENTERING search (0 → 1 characters), never while refining, and
     use __syncChrome() to adopt the new position without treating the jump as a user scroll. */
  if(wasEmpty && v){
    const sc = $('screen');
    if(sc){ sc.scrollTop = 0; if(window.__syncChrome) window.__syncChrome(); }
  }
}

/* ═════════ FEED TAB — same Network surface as Home, opened on the Feed view.
   Home tab = The Network › Sectors, Feed tab = The Network › Feed; the switcher and
   the bottom bar stay in sync. Sector feeds live on their sector screens. ═════════ */
/* ═════════ AI — the GENEXXO Host (2026-07-22: conversational) ═════════
   The Host is network-level; gateway agents are the specialists. The hand-off
   happens IN-THREAD: a gateway-shaped question gets a network-layer answer plus
   a hand-off card — accepting brings that gateway's agent into the same thread
   (accent-tagged bubbles, slim agent strip with open-gateway + back-to-Host).
   The agents rail starts an agent chat here too — no navigation, one AI surface.
   Answers are canned, keyword-routed, built from the prototype's own data
   (EVENTS_FEED, trending, brand zones) — the hook for a real model later.
   The thread lives in state, so the utility-tab toggle keeps your conversation. */
const AI_ROUTES = [
  {re:/climb|crag|boulder|hangboard|belay|chamonix|malham/i, gw:'climb'},
  {re:/ski|snow|avalanche|powder|piste|jacket|resort/i, gw:'ski'},
  {re:/surf|swell|wave|tide|reef/i, gw:'surf'},
  {re:/cycl|bike|ftp|watt|gravel|fondo/i, gw:'cycle'},
  {re:/sail|boat|yacht|crossing|passage/i, gw:'sail'},
];
const escHtml = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function aiScrollEnd(){ const s=$('screen'); requestAnimationFrame(()=>s.scrollTo({top:s.scrollHeight,behavior:'smooth'})); }

function sendAIFromInput(){ const el=$('aiInput'); if(!el||!el.value.trim()) return; const v=el.value; el.value=''; sendAI(v); }
function sendAI(text){
  const q=(text||'').trim(); if(!q||state.aiTyping) return;
  state.aiThread.push({who:'user', html:escHtml(q)});
  state.aiTyping=true; render(); aiScrollEnd();
  setTimeout(()=>{
    state.aiTyping=false;
    if(state.aiAgent){
      state.aiThread.push({who:'agent', gw:state.aiAgent, html:agentAnswer(state.aiAgent,q,false)});
    } else {
      const r=AI_ROUTES.find(r=>r.re.test(q));
      if(r && GATEWAYS[r.gw]){
        state.aiPendingQ=q;
        state.aiThread.push({who:'host', html:hostShort(r.gw)});
        state.aiThread.push({who:'handoff', gw:r.gw});
      } else {
        state.aiThread.push({who:'host', html:hostAnswer(q)});
      }
    }
    render(); aiScrollEnd();
  }, 850);
}
/* accepting the hand-off card: the specialist joins the SAME thread */
function aiHandoff(gw){
  state.aiThread=state.aiThread.filter(m=>m.who!=='handoff');
  state.aiAgent=gw;
  state.aiTyping=true; render(); aiScrollEnd();
  setTimeout(()=>{
    state.aiTyping=false;
    state.aiThread.push({who:'agent', gw, html:agentAnswer(gw, state.aiPendingQ, true)});
    state.aiPendingQ='';
    render(); aiScrollEnd();
  }, 800);
}
function aiAgentChat(k){
  const g=GATEWAYS[k]; if(!g) return;
  state.aiAgent=k;
  state.aiThread.push({who:'agent', gw:k, html:`I’m the ${g.name} specialist — everything inside ${g.domain}: the feed, the brands, the community, live conditions. What do you need?`});
  render(); aiScrollEnd();
}
function aiBackToHost(){
  state.aiAgent=null;
  state.aiThread.push({who:'host', html:'Back with you across the whole network — where next?'});
  render(); aiScrollEnd();
}
function aiReset(){ state.aiThread=[]; state.aiAgent=null; state.aiTyping=false; state.aiPendingQ=''; render(); $('screen').scrollTo(0,0); }

function hostAnswer(q){
  if(/plan|week|schedule|diary/i.test(q)){
    const picks=EVENTS_FEED.filter(e=>e.gw&&['Event','Podcast','Bookmark','Drop'].includes(e.type)).slice(0,5);
    const rows=picks.map(e=>`<div style="display:flex;gap:7px;align-items:baseline;margin-top:7px"><span>${e.icon}</span><b style="white-space:nowrap">${e.time}</b><span style="opacity:.75">${e.title}</span></div>`).join('');
    return `Here’s your week across your gateways:${rows}<div style="margin-top:9px;opacity:.65;font-size:12px">The full network calendar is in your Events tab — three streams are live right now.</div>`;
  }
  if(/trend/i.test(q)){
    const tags=YOUR_GATEWAYS.flatMap(k=>(GATEWAYS[k].trending||[]).slice(0,2)).slice(0,6);
    return `Across your Adventure gateways right now: ${tags.map(t=>`<b>${t}</b>`).join(' · ')}. The sharpest spike is <b>${tags[0]}</b> on ClimbXX — up 3× this week.`;
  }
  return `I can take that across the whole network — gateways, brands, events, people. If it turns specialist, I’ll bring the right gateway agent into this thread.`;
}
function hostShort(k){
  const g=GATEWAYS[k];
  return `That runs deep in <b>${g.name}</b>. I can give you the network view, but the ${g.name} Agent sits on the live data — conditions, community and every brand inside the gateway.`;
}
function agentAnswer(k,q,joining){
  const g=GATEWAYS[k]; q=q||'';
  const hello=joining?`<div style="opacity:.6;font-size:11.5px;margin-bottom:7px">Picking this up from the Host —</div>`:'';
  if(k==='climb'&&/partner|chamonix/i.test(q)) return hello+`Three members near Chamonix are looking for partners this week — two sport climbers (7a–7c) and an alpine pair heading for the Cosmiques Arête. Easiest intro: the <b>Chamonix Bloc Session</b> this Friday, 40+ going, and the Chamonix Guides Collective Pro Zone hosts a newcomers’ table.`;
  if(k==='climb'&&/hangboard|train|plan/i.test(q)) return hello+`Six-week block: 2× max hangs and 1× repeaters weekly, deload on week 4, retest week 6. I’ve sketched it in <b>Training Plan</b> — add the app from the ★ layer and it personalises to your logbook.`;
  if(k==='climb'&&/shoe|boulder/i.test(q)) return hello+`For steep bouldering the community verdict is the <b>Lithos Vertex Comp</b> — aggressive downturn, sticky heel. 4.7 from 890 reviews in the Lithos Sport Brand Zone; sizing runs a half size small.`;
  if(k==='ski'&&/jacket|shell|outerwear/i.test(q)) return hello+`Top-rated shells across SkiXX this season: <b>Sabran Ridgeline Pro</b> (4.8 · 2.1K reviews), <b>Sabran Corniche</b> (4.7) and <b>Atrion Face Shell</b> (4.6). The Ridgeline wins on breathability for touring — the full comparison lives in the Sabran Brand Zone.`;
  const app=(g.apps||[])[0];
  return hello+`Ask me anything inside ${g.name} — community beta, gear, conditions, events.${app?` A good place to start is <b>${app.name}</b>: ${app.desc.toLowerCase()}.`:''}`;
}

/* resolve an event's gateway label / accent / tap-target — live or structural */
function evMeta(e){
  if(e.gw && GATEWAYS[e.gw]){ const g=GATEWAYS[e.gw]; return {label:g.name, accent:g.theme.accent, name:g.name, sector:gwSecOf(g)}; }
  const s = sectorOf(e.sector)||SECTORS[0];
  return {label:e.label, accent:e.accentC||accentOf(s), name:e.label, sector:e.sector};
}
const EV_TYPE_BG = {Live:'rgba(239,68,68,.1)',Breaking:'rgba(239,68,68,.1)',Drop:'rgba(249,115,22,.1)',Bookmark:'rgba(245,158,11,.1)',Deal:'rgba(232,77,58,.1)',Alert:'rgba(59,130,246,.1)'};

   in a long feed. Tapping a card records where you were; coming back to the tab restores
   that scroll and marks the card you opened. Arriving any other way — Home, another
   utility tab, a filter change — is a fresh journey and clears it. */

   cost you Garden. Records the drill-down you were in — tile, neighbourhood chip, search text
   and scroll — so reopening the tab returns you there with that gateway marked. `gw` is null

  };

      <div style="margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:#EF4444;font-weight:700;white-space:nowrap"><span class="livedot"></span>${liveCount} Live</div>
