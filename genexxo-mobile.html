<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENEXXO</title>

<!-- ══════════════════════════════════════════════════════════════════════════════════════
     RENAMED — 2026-08-28.  The app is now genexxo-app.html.

     This path was the shell for the whole life of the prototype. The name stopped being true
     once one file started serving both layouts — under 1120px the phone UI, above it a
     three-column desktop — and a link you ask someone to open on a laptop should not say
     "mobile". That is not cosmetic: the misnomer was talking people out of the click.

     WHY THIS FILE STILL EXISTS
     - Every link already shared, bookmarked or pasted into a message points here.
     - Installed PWAs launch their start_url, which for anyone who installed before today is
       this path. They land here and are forwarded.
     Deleting it would break both, silently, on other people's devices.

     DO NOT restore the app to this path, and do not copy it here. The service worker's SHELL
     constant, manifest.json's start_url, index.html and genexxo-deck.html all now name
     genexxo-app.html; two live copies is the twin that rotted the old desktop build.
     ══════════════════════════════════════════════════════════════════════════════════════ -->

<link rel="canonical" href="genexxo-app.html">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=genexxo-app.html">
<script>
  (function () {
    try {
      // replace(), so Back does not bounce off this page straight back into it.
      // search + hash carried across: a deep link shared from the old path still works.
      location.replace('genexxo-app.html' + location.search + location.hash);
    } catch (e) {
      location.href = 'genexxo-app.html';
    }
  })();
</script>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
       background:#0b0b0f;color:rgba(255,255,255,.82);
       font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       text-align:center;padding:24px}
  .w{max-width:340px}
  .mark{font-weight:800;font-size:15px;letter-spacing:.22em;color:#fff}
  .rule{width:0;height:2px;margin:16px auto;border-radius:2px;background:#F5B800;
        box-shadow:0 0 14px rgba(245,184,0,.6);animation:r .5s .1s cubic-bezier(.2,.75,.2,1) forwards}
  @keyframes r{to{width:96px}}
  p{font-size:13.5px;line-height:1.6;margin:0 0 18px;color:rgba(255,255,255,.55)}
  a{display:inline-block;padding:11px 20px;border-radius:99px;background:#F5B800;color:#141414;
    font-weight:700;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <!-- Only ever seen if both the script and the meta refresh fail. -->
  <div class="w">
    <div class="mark">GENEXXO</div>
    <div class="rule"></div>
    <p>GENEXXO has moved to one app for phone and desktop.</p>
    <a href="genexxo-app.html">Open GENEXXO &rsaquo;</a>
  </div>
</body>
</html>
