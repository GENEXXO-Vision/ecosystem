/* deck feed item → mobile post. avatar text falls back to author initials; the deck's
   videoSrc (real mp4) → video, its img{url,bg} / videoUrl (Unsplash still) → img;
   engagement pipes become the mobile "·" separator. */
function initialsFromAuthor(a){
  const parts=(a||'').replace(/^@/,'').replace(/[^A-Za-z0-9_ ]/g,'').split(/[_\s]+/).filter(Boolean);
  return ((parts[0]?parts[0][0]:'')+(parts[1]?parts[1][0]:((parts[0]||'')[1]||''))).toUpperCase()||'GX';
}
function sectorPost(d, sk){
  const p={ av:(d.avatar&&d.avatar.text)||initialsFromAuthor(d.author), avBg:(d.avatar&&d.avatar.bg)||'#33333a',
    author:d.author, sub:d.authorSub, badge:d.badge&&d.badge.text, text:d.text,
    eng:(d.engagement||'').replace(/\|/g,' · '), _sk:sk };
  if(d.videoSrc) p.video=d.videoSrc;
  else if(d.img){ p.img=d.img.url; p.mediaBg=d.img.bg; }
  else if(d.videoUrl) p.img=d.videoUrl;
  // gateway not built in this prototype → render a non-clickable preview card from the deck item's own identity
  if(!GATEWAYS[d.gateway]){
    const grad=(d.avatar&&d.avatar.bg)||`linear-gradient(135deg,${d.gwAccent||'#888'},${d.gwAccent||'#888'})`;
    p._stubGw={ name:d.gwName||d.gateway, sector:sk, gradient:grad,
      emoji:(d.gwName||'?').replace(/XX$/,'').slice(0,1).toUpperCase(), theme:{accent:d.gwAccent||'#888'} };
  }
  return p;
}
function sectorFeedItems(sk){
  const curated = SECTOR_FEED[sk];
  if(curated && curated.length) return curated.map(d=>({gw:d.gateway, post:sectorPost(d, sk)}));
  const gws = Object.keys(GATEWAYS).filter(k=>GATEWAYS[k].sector===sk);
  const items=[]; let i=0, added=true;
  while(added){ added=false; gws.forEach(k=>{ const f=GATEWAYS[k].feed||[]; if(f[i]){items.push({gw:k,post:f[i]});added=true;} }); i++; }
  return items;
}

/* ═════════ MEDIA PIPELINE (2026-07-25, origin switched 2026-07-31) ═════════
   Feed video lives in the genexxo-videos/ folder of the repo, served from the SAME
   GitHub Pages origin that hosts this app (genexxo-vision.github.io/ecosystem/).
   ▸ WHY NOT jsDelivr: jsDelivr caches a @branch file for 7 days AND the branch→commit
     pointer for ~12h, so OVERWRITING a clip at the same path (e.g. re-uploading
     sector.mp4) keeps serving the old one — purging the file edge doesn't refresh the
     pointer. GitHub Pages serves the repo directly with max-age=600 (~10 min) and is
     same-origin (no CORS), so swapped media shows up promptly with no purge/uninstall.
     To revert to the CDN, set this back to 'https://cdn.jsdelivr.net/gh/GENEXXO-Vision/ecosystem@main/'.
   Full URLs (Unsplash stills etc.) pass straight through untouched. */
const MEDIA_BASE = 'https://genexxo-vision.github.io/ecosystem/';   // same-origin as the hosted app (github.com/GENEXXO-Vision/ecosystem, Pages)
const mediaUrl = p => (!p || /^https?:/.test(p)) ? p : MEDIA_BASE + p;

/* One media block for any feed card. A post carries ONE of:
     video:'genexxo-videos/x.mp4'  → lazy <video> (loads only when scrolled near)
     img:'https://…'               → lazy <img>
     media:'🧗' (+ mediaBg)        → emoji tile fallback (handled inline by each caller)
   Returns '' when there's no video/img, so callers keep their own emoji fallback. */
function mediaBlock(f, bg, h){
  const height = h||150;
  if(f.video) return `<div style="border-radius:12px;overflow:hidden;margin-top:10px;background:#000"><video autoplay loop muted playsinline preload="none" data-vsrc="${mediaUrl(f.video)}" style="width:100%;height:${height}px;object-fit:cover;display:block"></video></div>`;
  if(f.img)   return `<div style="border-radius:12px;overflow:hidden;margin-top:10px;height:${height}px;background:${f.mediaBg||bg}"><img src="${mediaUrl(f.img)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  return '';
}

/* Lazy-load feed video — <video data-vsrc> gets its real src only when it scrolls
   within 400px of the viewport, then autoplays muted. Critical on mobile: never
   pull 50 clips over cellular at once. Ported from the desktop deck. Re-run after
   every render() so freshly-drawn cards get observed.
   Priority load (2026-08-01): the first EAGER_VIDEOS clips in DOM order (= top of
   whatever feed just rendered — the Network feed on load, a gateway's top clips the
   moment you tap in, sector feeds too, all via this one path) get their src set
   IMMEDIATELY instead of waiting for the observer, so above-the-fold video buffers on
   render. The rest stay lazy so we still never hammer cellular. Tune EAGER_VIDEOS.
   Kick-start pass (2026-08-04): sw.js v3 now caches clips (cache-first + background
   revalidate), _prefetchVids warms the next PREFETCH_VIDEOS clips after the eager ones,
   and the observer margin is 900px — together: repeat views play instantly from cache,
   and first views start downloading well before the card is on screen. */
let _vidObserver = null;
let _playObserver = null;   // pauses clips that scroll away / resumes on return — see lazyMedia
const EAGER_VIDEOS = 2;
function _loadVid(v){
  if(!v.isConnected || !v.dataset.vsrc) return;   // detached = a card from a page we already left — never start its download
  v.preload = 'auto';                         // commit to buffering — the tag ships as preload="none"
  v.src = v.dataset.vsrc; v.removeAttribute('data-vsrc');
  const go = ()=>v.play().catch(()=>{});
  go();                                       // try now (may reject — nothing buffered yet)
  v.addEventListener('canplay', go, {once:true});   // …then again the moment it's ready (fixes eager top-of-feed clips, esp. big gateway videos)
  if(_playObserver) _playObserver.observe(v); // hand playback control to the on/off-screen observer
}
/* Eager-load the top-of-feed clips SEQUENTIALLY, not all at once. Loading them together
   made them split the (cellular) pipe with each other AND with the render-time image burst,
   so the top 1–2 cards crawled while a clip scrolled to later loaded fast on an idle pipe.
   Chaining gives the very top clip the whole pipe first; the next starts once this one has
   data (loadeddata) or after a short fallback so a stalled clip can't block the chain. */
function _loadEager(vids, i){
  if(i >= Math.min(EAGER_VIDEOS, vids.length)) return;
  const v = vids[i];
  let advanced = false;
  const next = ()=>{ if(advanced) return; advanced = true; _loadEager(vids, i+1); };
  _loadVid(v);
  v.addEventListener('loadeddata', next, {once:true});
  setTimeout(next, 1200);                     // don't let a stalled top clip block the next
}
/* Warm-the-pipe prefetch (2026-08-04): once the eager top clips have had the pipe to
   themselves, quietly fetch() the NEXT few clips in feed order so their bytes are already
   in the service worker's media cache (or the plain HTTP cache) BEFORE the user scrolls
   to them — the observer then flips src on a fully-local file and it plays instantly
   instead of stalling mid-scroll. Sequential (one clip owns the pipe at a time), skips
   clips the observer already claimed, cancelled by the next render() via the token so an
   old feed's prefetch never fights a fresh feed's own clips. Respects Data Saver. */
const PREFETCH_VIDEOS = 4;
let _prefetchToken = 0;
/* Sibling-gateway hero warm-up (2026-08-04): the clip a gateway opens on is the FIRST
   video in its feed — so while sitting anywhere in a sector context (sector page or a
   gateway in it), quietly pull the hero clip of every OTHER built gateway in that sector
   into the cache. This is the "kick-start trigger" for rapid gateway-hopping: by the
   time a sibling gateway is tapped, its opening clip is already local. ~4 clips ×
   ~0.4MB once per sector; the SW media cache makes every later pass a cheap 304. */
function _sectorHeroUrls(){
  const sk = activeSectorKey();
  if(!sk || !SECTOR_GATEWAYS[sk]) return [];
  const cur = (state.screen==='gateway' && state._gwObj) ? gwKeyFromName(state._gwObj.name) : null;
  const urls = [];
  SECTOR_GATEWAYS[sk].forEach(n=>{
    const k = gwKeyFromName(n);
    if(k === cur) return;                     // the one we're in is already playing
    const g = GATEWAYS[k];
    const f = g && g.feed && g.feed.find(x=>x.video);
    if(f) urls.push(mediaUrl(f.video));
  });
  return urls;
}
function _prefetchVids(vids){
  const token = ++_prefetchToken;
  if(navigator.connection && navigator.connection.saveData) return;
  // This feed's next clips first (the user is about to scroll to them)…
  const feedUrls = Array.prototype.slice.call(vids, EAGER_VIDEOS, EAGER_VIDEOS + PREFETCH_VIDEOS)
                     .map(v => v.dataset.vsrc).filter(Boolean);
  const seen = new Set(feedUrls);
  // …then the sector's sibling-gateway hero clips (the user may hop to them)…
  const heroes = _sectorHeroUrls().filter(u => !seen.has(u));
  heroes.forEach(u => seen.add(u));
  // …then EVERY other built gateway's hero (2026-08-04): over a session the whole app
  // warms — each clip is pulled once EVER (SW media cache), an already-cached one costs
  // a headers-only revalidate — so "first visit to a new gateway" stops being a cold
  // start. Sequential + token-cancelled, so it only ever uses idle pipe. ~20 clips ×
  // ~0.4MB one-time on a fresh device; set WARM_ALL_HEROES=false to keep it sector-only.
  const WARM_ALL_HEROES = true;
  if(WARM_ALL_HEROES) Object.keys(GATEWAYS).forEach(k=>{
    const g = GATEWAYS[k];
    const f = g && g.feed && g.feed.find(x=>x.video);
    if(f){ const u = mediaUrl(f.video); if(!seen.has(u)){ seen.add(u); heroes.push(u); } }
  });
  const list = feedUrls.map(u => ({u, feed:true})).concat(heroes.map(u => ({u})));
  let i = 0;
  const next = ()=>{
    if(token !== _prefetchToken || i >= list.length) return;
    const it = list[i++];
    if(it.feed && !document.querySelector(`video[data-vsrc="${it.u}"]`)){ next(); return; }   // observer got there first
    fetch(it.u).then(r => r.ok ? r.blob() : null).catch(()=>{}).then(next, next);  // .blob() = pull the full body into cache
  };
  setTimeout(next, 3000);                     // eager clips own the pipe first
}
function lazyMedia(){
  const vids = document.querySelectorAll('video[data-vsrc]');
  if(!vids.length) return;
  // Decoder relief (2026-08-04): every loaded clip used to autoplay-loop FOREVER, so a
  // long scroll left 15+ videos playing at once — phones have a hard cap on concurrent
  // video decoders, and once it's hit, newly-started clips stall at random waiting for
  // a slot (part of the "sticky with no pattern" report). This observer pauses any clip
  // that scrolls out of view (+150px grace) and resumes it on return — only the clips
  // actually on screen ever hold a decoder. Buffered data is kept, so resume is instant.
  if(_playObserver) _playObserver.disconnect();
  if('IntersectionObserver' in window){
    _playObserver = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        const v = en.target;
        if(en.isIntersecting){ if(v.paused) v.play().catch(()=>{}); }
        else if(!v.paused) v.pause();
      });
    }, { rootMargin:'150px 0px' });
  }
  // Eager-load the top-of-feed clips right now — sequentially (see _loadEager).
  _loadEager(vids, 0);
  _prefetchVids(vids);
  const rest = Array.prototype.slice.call(vids, EAGER_VIDEOS);
  if(!rest.length) return;
  if(!('IntersectionObserver' in window)){ rest.forEach(_loadVid); return; }
  if(_vidObserver) _vidObserver.disconnect();
  _vidObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ _loadVid(en.target); _vidObserver.unobserve(en.target); } });

  rest.forEach(v=>_vidObserver.observe(v));
}

  const tile = (grad, glyph, fs) => `<div style="width:32px;height:32px;border-radius:9px;background:${grad};display:flex;align-items:center;justify-content:center;font-size:${fs||15}px;font-weight:800;color:#fff;flex-shrink:0">${glyph}</div>`;
  const shell = (inner, click, cur) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;cursor:pointer;${cur?'background:rgba(255,255,255,.13)':''}" onclick="${click}">${inner}</div>`;
  const nm  = (main, sub) => `<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${main}</div>${sub?`<div style="font-size:10.5px;opacity:.5;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div>`:''}</div>`;

  const secRow = k => { const s=sectorOf(k); if(!s) return ''; const live=sectorIsLive(k);
    return shell(`${starFor(state.sectorFavs.includes(k),'toggleSectorFav',k)}${tile(s.g,s.icon)}

      `state.showFavs=false;openSector('${k}')`, k===active); };
  const gwRow = k => { const g=gwMetaFromKey(k); if(!g) return ''; const s=sectorOf(g.sector);
    return shell(`${starFor(state.favs.includes(k),'toggleFav',k)}${tile(g.gradient,g.emoji)}
      ${nm(g.name+'<span style="opacity:.5;font-weight:600">.com</span>', (s?s.name:'')+(g.live?' · live':''))}${g.live?LIVE_DOT:''}`,
      `state.showFavs=false;openGateway('${g.name}','${g.sector}')`, k===state.gateway); };
  const brRow = k => { const z=ZONES[k]; if(!z) return ''; const gm=gwMetaFromKey(z.gw);
    const mono=z.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

      `openZoneFav('${k}')`, k===state.zone); };

  const section = (title, rows, note) => {
    const body = rows.filter(Boolean).join('');
    return `<div style="margin:14px 2px 0">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;opacity:.5;padding:0 8px 5px">${title}</div>
      ${body || `<div style="padding:4px 10px 6px;font-size:11.5px;opacity:.4;font-weight:600;line-height:1.5">${note}</div>`}

  const addRow = (label, fn, key) => `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;cursor:pointer;opacity:.8" onclick="${fn}('${key}')">

  let bodyHtml;
  if(tab==='favs'){
    const curSec = active && !state.sectorFavs.includes(active) ? sectorOf(active) : null;
    const curGw  = state.gateway && !state.favs.includes(state.gateway) ? gwMetaFromKey(state.gateway) : null;
    const curBr  = state.zone && ZONES[state.zone] && !state.brandFavs.includes(state.zone) ? ZONES[state.zone] : null;
    bodyHtml =
      section('SECTORS', [...state.sectorFavs.map(secRow), curSec?addRow(curSec.name,'toggleSectorFav',active):''],
        'No sectors pinned yet — tap ☆ on any sector to keep it here.') +
      section('GATEWAYS', [...state.favs.map(gwRow), curGw?addRow(curGw.name,'toggleFav',state.gateway):''],
        'No gateways pinned yet — tap ☆ on any gateway.') +
      section('BRANDS', [...state.brandFavs.map(brRow), curBr?addRow(curBr.name,'toggleBrandFav',state.zone):''],
        'No brands pinned yet — tap ☆ on any brand zone.') +
      section('OTHER', [], 'Pro Zones, apps and communities you pin will collect here as the ecosystem opens up.');

      section('SECTORS', of('sector').map(secRow), 'Sectors you open will appear here.') +
      section('GATEWAYS', of('gateway').map(gwRow), 'Gateways you visit will appear here.') +
      section('BRANDS', of('brand').map(brRow), 'Brand zones you open will appear here.') +
      section('OTHER', [], 'Pro Zones, apps and communities will appear here as you explore them.');
  }

  const tabBtn = (k, label) => `<div onclick="setFavTab('${k}')" style="flex:1;text-align:center;padding:9px 6px;border-radius:11px;font-weight:800;font-size:12.5px;cursor:pointer;transition:background .18s;${tab===k?'background:#F5B800;color:#141414':'background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)'}">${label}</div>`;

  return `
    <div style="position:fixed;left:50%;transform:translateX(-50%);top:0;bottom:0;width:100%;max-width:430px;z-index:60;display:flex;flex-direction:column;background:rgba(14,14,20,.9);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);color:#fff">
      <div style="flex-shrink:0;padding:calc(12px + env(safe-area-inset-top,0px)) 15px 8px">

function infoPanelHtml(){

function setInfoTab(t){
  const changed = state.infoTab!==t;

}

      </div>
      <h3 class="stitle">${s.title}</h3>
      ${body}
    </div>
  </div>`;
}
function ifDeck(deck){
  return `<div class="feedwrap">${deck.map((s,i)=>ifSlide(s,i,deck.length)).join('')}</div>`;
}

/* ═════════ FIRST-RUN NUDGES ═════════
   One-time pulses walk a new user through the key nav, in the order they meet it:
   home → Network on the feed bar + left half-moon (sectors), first sector →
   Gateways on the bar + right half-moon, first scroll inside a gateway → the ★
   (commercial layer). Each pulses until used once, then vanishes forever
   (localStorage). ?nudges=reset re-arms them all. */
function nudgeDone(k){ try{ return localStorage.getItem('gx_nudge_'+k)==='1'; }catch(e){ return true; } }
function clearNudge(k){
  try{ localStorage.setItem('gx_nudge_'+k,'1'); }catch(e){}
  if(k==='edgeL') $('edge').classList.remove('nudge');

function washFor(grad){

  // The Network · ⚡Sector · Gateways control sub-bar sits under the original top bar.
  const bar = navSubBar();

  const body = feedItems.length
    ? withExplainer(feedItems.map(x=>feedCard(x.gw,x.post,false)), explainerCard(SECTOR_EXPLAINER)).join('')
    : `<div class="empty">The ${s.name} feed lights up when its gateways go live —<br>the best of each gateway feed rises here.</div>`;
  return `${topBar()}
  ${favPanelHtml()}
  <div class="push">
    ${bar}
    <div style="height:8px"></div>
    ${body}
    <div style="height:14px"></div>
  </div>`;
}

/* ═════════ GATEWAY (pushed, re-skinned) ═════════ */
function renderGateway(){
  const gw = state._gwObj; const t = gw.theme;
  document.title = gw.name; $('metaTheme').content = t.bg;
  // Feed-first shell — same shape as Network + sectors: the control sub-bar sits under
  // the top bar, the gateway's feed beneath it. The ★ on the top bar flips this same
  // bar into the commercial layer: Brands · Apps · Pro's.
  let bar, body;

  const zoneCard = b => { const openable = b.key && ZONES[b.key]; return `
    <div class="gcard" style="background:${t.cardBg};border-color:${t.cardBorder};color:${t.text};cursor:pointer" ${openable?`onclick="openZone('${b.key}')"`:''}>
      <div class="hd" style="margin-bottom:6px"><div class="av" style="background:${b.color};border-radius:12px">${b.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
        <div><div class="an">${b.name}</div><div class="as">${b.tier}</div></div>
        <div class="bdg" style="background:${t.accent}26;color:${t.accent}">${b.tier==='Pro Zone'?'PRO':'ZONE'}</div></div>
      <div class="tx" style="opacity:.7;font-size:12px">${b.tag}</div>
      ${openable?`<div style="margin-top:9px;font-size:10px;font-weight:800;letter-spacing:.04em;color:${t.accent}">Open zone ›</div>`:''}
    </div>`;};

  // Themed placeholder card for the "more" layers (Communities / Business) — no live data yet.
  const infoCard = (initials, title, sub, tag, cta) => `
    <div class="gcard" style="background:${t.cardBg};border-color:${t.cardBorder};color:${t.text}">
      <div class="hd" style="margin-bottom:6px"><div class="av" style="background:${t.accent};border-radius:12px">${initials}</div>
        <div style="flex:1;min-width:0"><div class="an">${title}</div><div class="as">${sub}</div></div>
        ${tag?`<div class="bdg" style="background:${t.accent}26;color:${t.accent}">${tag}</div>`:''}</div>
      ${cta?`<div style="margin-top:9px;font-size:10px;font-weight:800;letter-spacing:.04em;color:${t.accent}">${cta}</div>`:''}
    </div>`;

  // The gateway sub-bar carries the domain's own views. Feed leads it now (2026-07-27) — an
  // explicit tab that lights when you're on the feed (previously the feed was the unlit default).
  // Tap a tab to open it; tap the active one again toggles back to the feed. (2026-07-23 —
  // replaced the Network·Sector·Gateway control; Back + the G mark + tapping the domain carry nav.)
  // Two pages of headings, flipped by the › / ‹ arrow on the right (2026-07-24, upd. 2026-07-27):
  // page 1 = Feed · Brands · Apps, page 2 = Pro's · Communities · Business. (Apply moved off —
  // it's finding a new home.)
  const GW_PAGE1 = [['feed','Feed'],['brands','Brands'],['apps','Apps']];
  const GW_PAGE2 = [['pros','Pros'],['communities','Communities'],['business','Business']];
  const onMore = state.gwBarPage==='more';
  const zTabs = onMore ? GW_PAGE2 : GW_PAGE1;
  const barArrow = onMore ? '‹' : '›';
  // On the 'more' page the gradient mirrors horizontally (135deg → 225deg) so the shading
  // reads right-to-left — a subtle cue that you've flipped pages.
  const barBg = onMore ? gw.gradient.replace('135deg','225deg') : gw.gradient;
  // First-run: the arrow pulses black until first tapped, then vanishes forever (barMore nudge).
  const arrowNudge = (!onMore && !nudgeDone('barMore')) ? ' arrow-nudge' : '';
  // Feed lights when you're NOT in a commercial layer (!gwZones); every other tab lights on match.
  const gwTabOn = k => k==='feed' ? !state.gwZones : (state.gwZones && state.gwZoneTab===k);
  bar = `<div class="substick netbar" style="background:${barBg}">
    ${zTabs.map(([k,lb])=>`<div class="ntab ${gwTabOn(k)?'on':''}" onclick="tapGwZone('${k}')">${lb}</div>`).join('')}
    <div class="ntab${arrowNudge}" style="flex:0 0 30px;font-size:17px;font-weight:800;opacity:.9;line-height:1;margin-top:-2px" onclick="tapGwBarPage()" title="${onMore?'Back to Feed · Brands · Apps':'More — Pros · Communities · Business'}">${barArrow}</div>
  </div>`;

  if (state.gwZones){
    const z = state.gwZoneTab;
    if (z==='apps'){
      body = gw.apps.length ? gw.apps.map(a=>{
        const inW = state.wallet.some(w=>w.name===a.name);
        return `<div class="gcard" style="background:${t.cardBg};border-color:${t.cardBorder};color:${t.text}">
          <div class="hd" style="margin-bottom:6px"><div class="av" style="background:${a.color};border-radius:11px">${a.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
            <div style="flex:1"><div class="an">${a.name}</div><div class="as">${a.desc}</div></div>
            <button class="btn" style="background:${inW?t.cardBg:t.accent};color:${inW?t.text:'#fff'};border:1px solid ${inW?t.cardBorder:t.accent}" onclick="toggleApp('${esc(a.name)}','${a.color}','${gw.name}')">${inW?'Added ✓':'Add'}</button></div>
        </div>`;}).join('')
        : `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.55">Gateway apps land here when ${gw.name} goes live.</div>`;
    } else if (z==='pros'){
      body = (gw.pros||[]).length ? gw.pros.map(zoneCard).join('')
        : `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.55">Pro Zones — guides, coaches, specialists —<br>open here when ${gw.name} goes live.</div>`;
    } else if (z==='communities'){
      // Outside groups — clubs, forums, chapters. Placeholder cards for the shell.
      body = [
        ['CL',`${gw.name} Collective`,'Community group · 4.2K members','GROUP','View community ›'],
        ['LC','Local Chapters','Meetups & crews near you','MEETUP','Find a chapter ›'],
        ['BB','The Beta Board','Forum · gear talk & trip reports','FORUM','Open forum ›'],
      ].map(a=>infoCard(a[0],a[1],a[2],a[3],a[4])).join('')
        + `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.5;margin-top:2px">External communities plug in here — placeholder cards for now.</div>`;
    } else if (z==='business'){
      // Corporate / manufacturers / services — the B2B side of the gateway. Placeholder cards.
      body = [
        ['MF','Manufacturing Partners','OEM & white-label production','MAKERS','View partners ›'],
        ['CW','Corporate & Wholesale','Bulk supply & B2B accounts','B2B','Enquire ›'],
        ['SV','Services Directory','Logistics, fulfilment & retail ops','SERVICES','Browse ›'],
      ].map(a=>infoCard(a[0],a[1],a[2],a[3],a[4])).join('')
        + `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.5;margin-top:2px">Corporate, manufacturers & services list here — placeholder for now.</div>`;
    } else {
      body = gw.brandZones.length ? gw.brandZones.map(zoneCard).join('')
        : `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.55">Brand Zones open here when ${gw.name} goes live.</div>`;
    }
    // "Stake your claim" CTA below the cards in every zone layer (Brands · Apps · Pro's · Community · Business)
    body += zoneCtaCard(ZONE_CTA[z]);
  } else {
    // Feed (default) — no tab lit; the gateway's own feed sits under the Brands·Apps·Pro's bar.
    const card = f => `
      <div class="gcard" style="background:${t.cardBg};border-color:${t.cardBorder};color:${t.text}">
        <div class="hd"><div class="av" style="background:${f.avBg}">${f.av}</div>
          <div><div class="an">${f.author}</div><div class="as">${f.sub}</div></div>
          ${f.badge?`<div class="bdg" style="background:${t.accent}26;color:${t.accent}">${f.badge}</div>`:''}
        </div>
        <div class="tx">${f.text}</div>
        ${(f.video||f.img)?mediaBlock(f,t.accent,170):(f.media?`<div class="media" style="background:${f.mediaBg}">${f.media}</div>`:'')}
        <div class="eng">${f.eng}</div>
      </div>`;

    const feed = gw.feed || [];
    body = feed.length ? withExplainer(feed.map(card), explainerCard(GATEWAY_EXPLAINER)).join('')
      : `<div class="empty" style="border-color:${t.cardBorder};color:${t.text};opacity:.55">Structural gateway — same shell, ${gw.name} skin.<br>Content lands when this gateway goes live.</div>`;
  }

  // Still parked: gw.spaces (sub-feeds), gw.trending, the hero stat block, and the Ask
  // surface (the network AI tab covers it for now).

  return `${topBar(gw)}
  ${favPanelHtml()}
  <div class="push" style="background:${t.bg};color:${t.text};min-height:calc(100dvh - 53px);margin-top:-1px">
    ${bar}
    <div style="height:8px"></div>
    ${body}
    <div style="height:20px"></div>
  </div>`;
}

function toggleApp(name,color,gwName){
  const i = state.wallet.findIndex(w=>w.name===name);
  if (i>=0) state.wallet.splice(i,1); else state.wallet.push({name,color,gw:gwName});
  render();
}

const zoneInitials = n => n.split(/[\s·]+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

function openZone(k, tab){
  if(!ZONES[k]) return;
  // Full-page: the zone is the next rung on the shell ladder, not an overlay sheet.
  // The parent gateway stays in state (_gwObj/gateway) so the breadcrumb + drawers work.
  // Optional `tab` deep-links a sub-view (e.g. 'events' from the network calendar); the sub-bar
  // page follows it — Media/About/Events live on page 2 ('more'), everything else on page 1.
  const landTab = tab||'feed';
  state.zone=k; state.zoneTab=landTab; state.zoneProduct=null; state.zoneSize=null;
  state.shopMenu=false; state.shopCat=null;   // fresh zone → no lingering Shop overlay/filter
  state.zoneBarPage = (landTab==='events'||landTab==='about'||landTab==='media') ? 'more' : 'main';
  state.screen='zone'; state._before=null; state.showFavs=false;
  state.tab='home';   // committing to a real place — clear any open util tab (mirrors openGateway)
  logVisit('brand', k);
  render(); $('screen').scrollTo(0,0); if(window.__resetChrome) window.__resetChrome();
}
function zoneToGateway(){   // escape up one rung — land on the ★ layer where you entered
  state.zone=null; state.zoneProduct=null; state.screen='gateway';
  state.gwZones=true; state.gwZoneTab='brands';
  render(); $('screen').scrollTo(0,0); if(window.__resetChrome) window.__resetChrome();
}
function zoneSwitch(k){   // deck swatch / drawer: switch brand in place, KEEPING your tab
  if(k===state.zone || !ZONES[k]) return;
  state.zone=k; state.zoneProduct=null; state.zoneSize=null; render();
  $('screen').scrollTo(0,0);
}
function pickZone(k){ closeDrawerR(); zoneSwitch(k); }
function setZoneTab(t){ state.zoneTab=t; state.zoneProduct=null; state.shopMenu=false; if(t!=='shop') state.shopCat=null; render(); $('screen').scrollTo(0,0); }
/* Tapping the brand name on the zone top bar returns to the brand feed (Feed · Shop · Bag page). */
function zoneToFeed(){ state.zoneTab='feed'; state.zoneBarPage='main'; state.zoneProduct=null; state.shopMenu=false; state.shopCat=null; render(); $('screen').scrollTo(0,0); }
/* ── Shop category overlay ──────────────────────────────────────────────
   Tapping the Shop heading opens a 3/4 bottom overlay of the brand's own
   collections. It's a toggle: tap Shop again (or the scrim, or pick a tile,
   or open a product) and it dismisses. Picking a tile filters the grid;
   the grid header lets you reopen the overlay or clear back to everything. */
function tapShop(){
  if(state.zoneTab==='shop'){ state.shopMenu=!state.shopMenu; render(); return; }
  state.zoneTab='shop'; state.zoneProduct=null; state.shopMenu=true; render(); $('screen').scrollTo(0,0);
}
function openShopMenu(){ state.shopMenu=true; render(); }
function closeShopMenu(){ state.shopMenu=false; render(); }
function pickShopCat(k){ state.shopCat=k; state.shopMenu=false; render(); $('screen').scrollTo(0,0); }
function clearShopCat(){ state.shopCat=null; render(); $('screen').scrollTo(0,0); }
/* The › / ‹ arrow on the zone sub-bar flips between the two heading pages —
   'main' (Feed · Shop · Bag) and 'more' (Media · About · Events). Flipping only swaps
   the visible triad; the current view stays put until you tap one of the new headings. */
function tapZoneBarPage(){ state.zoneBarPage = state.zoneBarPage==='more' ? 'main' : 'more'; render(); $('screen').scrollTo(0,0); }
function toggleZoneFollow(k){ state.zoneFollow[k]=!state.zoneFollow[k]; render(); }

      <div onclick="openProduct(${f.product})" style="display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:13px;cursor:pointer;background:#FAFAFB">
        <div style="width:38px;height:38px;border-radius:10px;background:${z.color}14;display:flex;align-items:center;justify-content:center;font-size:18px">${p.emoji}</div>
        <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="font-size:10.5px;color:var(--muted);font-weight:700">${p.price} · ★ ${p.rating} (${p.reviews})</div></div>
        <div style="font-size:10px;font-weight:800;color:${z.color};white-space:nowrap">VIEW ›</div>
      </div>`)(z.products[f.product]) : '';
    if(f.type==='community') return `
      <div class="zcard">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
          <div style="width:32px;height:32px;border-radius:50%;background:${f.whoBg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff">${f.who.split(' ').map(w=>w[0]).join('')}</div>
          <div><div style="font-size:12.5px;font-weight:800">${f.who}</div><div style="font-size:10px;color:var(--muted);font-weight:600">${f.sub}</div></div>
        </div>
        <div style="font-size:13px;line-height:1.5">${f.text}</div>
        ${f.reply?`<div style="margin-top:10px;padding:10px 12px;border-left:3px solid ${z.color};background:${z.color}0d;border-radius:0 12px 12px 0">
          <div style="font-size:10px;font-weight:800;color:${z.color};margin-bottom:4px">↳ ${z.name} replied</div>
          <div style="font-size:12.5px;line-height:1.5">${f.reply}</div></div>`:''}
        <div style="margin-top:9px;font-size:11px;font-weight:700;color:var(--muted)">${f.eng}</div>
      </div>`;
    return `
      <div class="zcard">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
          <div style="width:32px;height:32px;border-radius:10px;background:${z.gradient};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff">${zoneInitials(z.name)}</div>
          <div><div style="font-size:12.5px;font-weight:800">${z.name}</div><div style="font-size:10px;color:var(--muted);font-weight:600">${f.sub}</div></div>
          ${f.type==='media'?`<div style="margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:99px;background:${z.color}14;color:${z.color}">MEDIA</div>`:''}
        </div>
        <div style="font-size:13px;line-height:1.5">${f.text}</div>
        ${(f.video||f.img)?mediaBlock(f,z.gradient,f.type==='media'?200:180):(f.media?`<div style="border-radius:12px;height:150px;margin-top:10px;background:${f.mediaBg||z.gradient};display:flex;align-items:center;justify-content:center;font-size:${f.type==='media'?'26':'36'}px;color:#fff">${f.media}</div>`:'')}
        ${prodRow}
        <div style="margin-top:9px;font-size:11px;font-weight:700;color:var(--muted)">${f.eng}</div>
      </div>`;
  }).join('');
  // Event ↔ zone Events tab: the feed surfaces the zone's FEATURED event as a card that taps
  // straight into the brand's Events view (`setZoneTab('events')`), where the full list lives.
  const fe = zoneFeaturedEvent(z);
  const feMore = zoneEventList(z).length - 1;   // how many more events sit behind the featured one
  const pct = (fe && fe.capacity) ? Math.round(fe.registered/fe.capacity*100) : 0;
  const eventCard = !fe ? '' : (fe.live ? `
    <div class="zcard" style="border:1.5px solid ${z.color}55;cursor:pointer;overflow:hidden;padding:0" onclick="setZoneTab('events')">
      <div style="position:relative;height:158px;background:#000">
        <img src="${mediaUrl(fe.poster)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block;opacity:.82">
        <span style="position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:#EF4444;color:#fff">🔴 LIVE</span>
        <span style="position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff">👁 ${fe.viewers}</span>
        <div style="position:absolute;left:12px;right:12px;bottom:10px;color:#fff">
          <div style="font-size:15px;font-weight:800;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.6)">${fe.title}</div>
          <div style="font-size:11.5px;font-weight:600;opacity:.92;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)">${fe.now}</div>
        </div>
      </div>
      <div style="padding:11px 13px 13px">
        <div style="font-size:12.5px;line-height:1.45;color:var(--muted)">${fe.subtitle}</div>
        <div style="margin-top:9px;font-size:10.5px;font-weight:800;color:${z.color}">Watch live in Events${feMore>0?` · +${feMore} more`:''} ›</div>
      </div>
    </div>` : `
    <div class="zcard" style="border:1.5px solid ${z.color}55;cursor:pointer" onclick="setZoneTab('events')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:99px;background:${z.color};color:#fff">📅 ${fe.tag}</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted)">${fe.when}</span>
      </div>
      <div style="font-size:15px;font-weight:800;line-height:1.3">${fe.title}</div>
      <div style="font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:5px">${fe.desc}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:11px">
        <div style="flex:1;height:5px;border-radius:99px;background:${z.color}22;overflow:hidden"><div style="width:${pct}%;height:100%;background:${z.color}"></div></div>
        <div style="font-size:10px;font-weight:800;color:${z.color};white-space:nowrap">${fe.registered.toLocaleString()} / ${fe.capacity.toLocaleString()}</div>
      </div>
      <div style="margin-top:10px;font-size:10.5px;font-weight:800;color:${z.color}">See it in Events${feMore>0?` · +${feMore} more`:''} ›</div>
    </div>`);
  return hero + eventCard + cards;
}

function zoneProducts(z){
  // Optional category filter (set by the Shop overlay). 'specials' → the brand's flagged picks;
  // any other key → products tagged with that collection. Cells map BACK to the original index so
  // openProduct(i) still hits the right item in the unfiltered z.products array.
  const cat = state.shopCat;
  const hasCats = Array.isArray(z.shopCats) && z.shopCats.length;
  const shown = !cat ? z.products
    : cat==='specials' ? z.products.filter(p=>p.special)
    : z.products.filter(p=>p.cat===cat);
  const catObj = cat && cat!=='specials' && hasCats ? z.shopCats.find(c=>c.key===cat) : null;
  const catLabel = cat==='specials' ? 'Brand Specials' : (catObj?catObj.label:'');
  const catIcon  = cat==='specials' ? '★' : (catObj?catObj.icon:'');

  const cells = shown.map(p=>{
    const i = z.products.indexOf(p);
    return `
    <div class="zprod" onclick="openProduct(${i})">
      <div style="height:92px;background:${z.color}10;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative">${p.emoji}
        ${p.tag?`<div style="position:absolute;top:8px;left:8px;font-size:7.5px;font-weight:800;letter-spacing:.07em;padding:3px 7px;border-radius:99px;background:${z.color};color:#fff">${p.tag}</div>`:''}
      </div>
      <div style="padding:10px 11px 11px">
        <div style="font-size:12px;font-weight:800;line-height:1.25">${p.name}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px"><div style="font-size:13px;font-weight:800;color:${z.color}">${p.price}</div><div style="font-size:10px;color:var(--muted);font-weight:700">★ ${p.rating}</div></div>
      </div>
    </div>`;
  }).join('');

  // Header: filtered → chip showing the active collection (tap to change) + Clear; unfiltered → a
  // "Shop by category" pill that re-opens the overlay (only when the brand actually defines tiles).
  const header = cat
    ? `<div style="padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
         <div onclick="openShopMenu()" style="display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:${z.color}12;border:1px solid ${z.color}44;cursor:pointer">
           <span style="font-size:14px">${catIcon}</span>
           <span style="font-size:12.5px;font-weight:800;color:${z.color}">${catLabel}</span>
           <span style="font-size:11px;font-weight:700;color:var(--muted)">${shown.length}</span>
           <span style="font-size:11px;color:${z.color};font-weight:800">▾</span>
         </div>
         <div onclick="clearShopCat()" style="font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 4px">Clear ✕</div>
       </div>`
    : (hasCats
      ? `<div style="padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px">
           <div style="font-size:11px;color:var(--muted);font-weight:600">${z.products.length} of ${z.stats.products} products · the full range lands with the live build</div>
           <div onclick="openShopMenu()" style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:${z.color};color:#fff;font-size:12px;font-weight:800;cursor:pointer">▤ Categories</div>
         </div>`
      : `<div style="padding:14px 16px 10px;font-size:11px;color:var(--muted);font-weight:600">${z.products.length} of ${z.stats.products} products · the full range lands with the live build</div>`);

  const body = shown.length
    ? `<div class="zgrid">${cells}</div>`
    : `<div class="empty">Nothing in this collection yet —<br>tap ${catLabel||'the filter'} to pick another.</div>`;
  return header + body;
}

// Products tab = the full catalogue list (tap a product → its page), like any commerce store.
// The list itself is a later build; for now a placeholder holds the slot.
function zoneProductList(z){
  return `<div class="empty">Product list lands with the live build —<br>tap Shop to browse the featured range for now.</div>`;
}

// Media tab = the brand's video / gallery / press reel. Stub for now — the reel lands later.

}

function zoneAbout(z){

  </div>`;

// A single event shape: a live stream {live,now,viewers,poster} OR a scheduled event
// {zoneEvent,when,desc,registered,capacity}. A zone carries either a list `z.events` OR a
// single `z.event` (kept working via the fallback below), so old zones need no data change.
function zoneEventList(z){ return z.events && z.events.length ? z.events : (z.event ? [z.event] : []); }
/* The featured event — a live stream floats to the top, else the first scheduled one.
   Used by both the zone feed's event card and the zone Events view's hero. */
function zoneFeaturedEvent(z){ const l=zoneEventList(z); return l.length ? [...l].sort((a,b)=>(b.live?1:0)-(a.live?1:0))[0] : null; }

/* Big hero card — the featured event (a live stream floats to the top, else the first). */
function zoneEventHero(z, e){
  const live=!!e.live;
  const pct = (e.registered && e.capacity) ? Math.min(100, Math.round(e.registered/e.capacity*100)) : null;
  const hero = e.poster
    ? `<div style="height:150px;background:#000 url('${e.poster}') center/cover no-repeat;position:relative">
        ${live?`<div style="position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:#EF4444;color:#fff">🔴 LIVE</div>`:''}
       </div>`
    : `<div style="height:88px;background:${z.gradient}"></div>`;
  return `
  <div class="zcard" style="margin-top:12px;padding:0;overflow:hidden">
    ${hero}
    <div style="padding:14px 15px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:9px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:${live?'#EF4444':z.color+'18'};color:${live?'#fff':z.color}">${live?'LIVE NOW':'UPCOMING'}</span>
        <span style="font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--muted)">${(e.tag||'EVENT').toUpperCase()}</span>
      </div>
      <div style="font-size:16px;font-weight:800;line-height:1.25">${e.title}</div>
      <div style="font-size:12.5px;line-height:1.55;color:rgba(17,17,22,.72);margin-top:6px">${e.subtitle||e.desc||''}</div>
      ${live
        ? `<div style="display:flex;align-items:center;gap:12px;margin-top:11px;font-size:11px;font-weight:700">
             <span style="color:#EF4444">● ${e.now||'Live now'}</span>
             ${e.viewers?`<span style="color:var(--muted)">${e.viewers} watching</span>`:''}
           </div>
           <div onclick="toast('${esc(z.name)} live opens with the live build')" style="margin-top:13px;text-align:center;font-size:13px;font-weight:800;padding:13px 0;border-radius:14px;background:#EF4444;color:#fff;cursor:pointer">Watch live ›</div>`
        : `${e.when?`<div style="font-size:11.5px;font-weight:800;color:${z.color};margin-top:11px">${e.when}</div>`:''}
           ${pct!=null?`<div style="margin-top:11px">
             <div style="height:6px;border-radius:99px;background:${z.color}18;overflow:hidden"><div style="height:100%;width:${pct}%;background:${z.color}"></div></div>
             <div style="font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px">${e.registered.toLocaleString()} registered · ${e.capacity.toLocaleString()} capacity</div>
           </div>`:''}
           <div onclick="toast('RSVP to ${esc(e.title)} opens with the live build')" style="margin-top:13px;text-align:center;font-size:13px;font-weight:800;padding:13px 0;border-radius:14px;background:${z.color};color:#fff;cursor:pointer">RSVP · reserve your place ›</div>`}
    </div>
  </div>`;
}

/* Compact row — every event after the hero. Whole row taps to RSVP/watch (toast for now). */
function zoneEventRow(z, e){
  const live=!!e.live;
  const meta = live ? (e.now||'Live now') : (e.when||'');
  const cta = live ? `${esc(z.name)} live opens with the live build` : `RSVP to ${esc(e.title)} opens with the live build`;
  return `
  <div class="zcard" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="toast('${cta}')">
    <div style="width:46px;height:46px;border-radius:12px;background:${live?'#EF4444':z.color+'14'};display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:${live?'#fff':z.color}">
      <div style="font-size:8px;font-weight:800;letter-spacing:.04em">${live?'LIVE':'SOON'}</div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--muted)">${(e.tag||'EVENT').toUpperCase()}</div>
      <div style="font-size:13.5px;font-weight:800;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.title}</div>
      ${meta?`<div style="font-size:11px;font-weight:700;color:${live?'#EF4444':z.color};margin-top:2px">${meta}</div>`:''}
    </div>
    <div style="font-size:16px;color:var(--muted);flex-shrink:0">›</div>
  </div>`;
}

function zoneEvents(z){
  // A brand's own events surface — its live sessions, launches and community meetups.
  const list = zoneEventList(z);
  if(!list.length) return `<div class="empty" style="margin-top:12px">Events land with the live build —<br>${z.name}'s live sessions, launches and community meetups will live here.</div>`;
  // Live floats to the top as the featured hero (stable order otherwise); the rest are rows.
  const ordered = [...list].sort((a,b)=>(b.live?1:0)-(a.live?1:0));
  const [hero, ...rest] = ordered;
  return `${zoneEventHero(z, hero)}
  ${rest.map(e=>zoneEventRow(z, e)).join('')}
  <div class="empty" style="margin-top:2px">More ${z.name} events — community meetups, drops and live sessions — collect here as they're scheduled.</div>`;
}

function zoneSheetHtml(){
  const z=ZONES[state.zone]; if(!z || state.zoneProduct==null) return '';
  const p=z.products[state.zoneProduct];

      <div style="width:72px;height:72px;border-radius:18px;background:${z.color}10;display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0">${p.emoji}</div>
      <div style="flex:1;min-width:0">
        ${p.tag?`<div style="display:inline-block;font-size:8px;font-weight:800;letter-spacing:.07em;padding:3px 7px;border-radius:99px;background:${z.color};color:#fff;margin-bottom:4px">${p.tag}</div>`:''}
        <div style="font-size:16px;font-weight:800;line-height:1.2">${p.name}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">★ ${p.rating} · ${p.reviews} community reviews</div>
      </div>
      <div style="font-size:17px;font-weight:800;color:${z.color}">${p.price}</div>
    </div>
    <div style="font-size:12.5px;line-height:1.55;color:rgba(17,17,22,.75);margin-top:11px">${p.desc}</div>
    ${p.sizes?`<div style="font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:13px 0 7px">SIZE</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${p.sizes.map(s=>`<div class="zsize" style="${state.zoneSize===s?`background:${z.color};color:#fff;border-color:${z.color}`:''}" onclick="pickSize('${s}')">${s}</div>`).join('')}</div>`:''}
    <div style="margin-top:13px">${p.features.map(f=>`<div style="display:flex;gap:8px;font-size:12px;line-height:1.5;margin-bottom:4px"><span style="color:${z.color};font-weight:800">✓</span><span>${f}</span></div>`).join('')}</div>
    ${p.review?`<div style="margin-top:12px;padding:11px 13px;border-radius:13px;background:var(--bg)">
      <div style="font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px">COMMUNITY · ${p.review.who.toUpperCase()}</div>
      <div style="font-size:12.5px;line-height:1.5;font-style:italic">“${p.review.text}”</div></div>`:''}
    <button class="btn" style="width:100%;margin-top:15px;padding:14px 0;border-radius:15px;font-size:13px;background:${inBag?'#16A34A':needSize?'rgba(17,17,22,.08)':z.color};color:${needSize?'var(--muted)':'#fff'}" onclick="bagToggle()">${inBag?'Added to bag ✓ · tap to remove':needSize?'Select a size':'Add to bag · '+p.price}</button>
    <div style="text-align:center;font-size:10px;color:var(--muted);font-weight:600;margin-top:9px">Sold &amp; shipped by ${z.name} · you buy direct · GENEXXO files your receipt</div>
  </div>`;
}

/* ═════════ ZONE — full-page, reuses the gateway shell one rung deeper ═════════
   A Brand / App / Pro zone is a pushed screen like a gateway is: brand-themed top
   bar (breadcrumb back up to the gateway), the same feed-first bar ([brand] · Feed ·
   Brands), and a REPURPOSED bottom bar (Feed · Shop · Bag · Ask · ‹Gateway). This is
   the framework only — Shop/Bag are stubs; the brand feed is the one real body. */
function zoneBag(z){
  if(!state.bag.length) return `<div class="empty">Your bag is empty —<br>add something from Shop and it lands here.</div>`;
  const rows = state.bag.map(id=>{
    const [zk,name]=id.split('/'); const zz=ZONES[zk]; if(!zz) return '';
    const p=zz.products.find(x=>x.name===name); if(!p) return '';
    return `<div class="zcard" style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <div style="width:46px;height:46px;border-radius:12px;background:${zz.color}10;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${p.emoji}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800">${p.name}</div><div style="font-size:11px;color:var(--muted);font-weight:600">${zz.name} · ${p.price}</div></div>
      <div onclick="state.bag.splice(state.bag.indexOf('${esc(id)}'),1);render()" style="font-size:16px;color:var(--muted);cursor:pointer;padding:4px 2px">✕</div>
    </div>`;}).join('');
  const nBrands=bagBrands().length;

/* ═════════ CHECKOUT — always DIRECT with the brand ═════════
   GENEXXO never processes funds. Checkout opens the BRAND's own payment surface (brand
   colour, brand pay widget); paying files a receipt into My Purchases with the brand's
   own order reference. A bag spanning brands checks out one brand at a time, because you
   can't pay two different brands in one transaction. */
function brandCode(z){
  const parts=(z.name||'').trim().split(/\s+/);
  if(parts.length>1) return parts.map(w=>w[0]).join('').toUpperCase().slice(0,3);
  return (z.name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
}
function bagItemsForBrand(bk){
  return state.bag.filter(id=>id.split('/')[0]===bk).map(id=>{
    const [zk,name]=id.split('/'); const zz=ZONES[zk]; const p=zz&&zz.products.find(x=>x.name===name);
    return p?{id,p}:null;
  }).filter(Boolean);
}
function bagTotalNum(items){ return items.reduce((s,{p})=>s+(parseFloat((p.price||'').replace(/[^0-9.]/g,''))||0),0); }
function money(n){ return '£'+n.toLocaleString('en-GB'); }
function bagBrands(){ const seen=[]; state.bag.forEach(id=>{const b=id.split('/')[0]; if(!seen.includes(b))seen.push(b);}); return seen; }

function startCheckout(){
  if(!state.bag.length) return;
  state.checkoutBrand = bagBrands()[0];   // first brand in the bag
  state.checkoutDone=null; state.zoneProduct=null; render();
}
function closeCheckout(){ state.checkoutBrand=null; state.checkoutDone=null; render(); }
function placeOrder(){
  const bk=state.checkoutBrand, z=ZONES[bk]; if(!z) return;
  const items=bagItemsForBrand(bk); if(!items.length){ closeCheckout(); return; }
  state.orderSeq=(state.orderSeq||0)+1;
  const ref=brandCode(z)+'-'+(4820+state.orderSeq);
  const now=new Date();
  const order={
    brand:z.key, brandName:z.name, color:z.color, gradient:z.gradient, gw:z.gw,
    ref, ts:now.getTime(),
    date:now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),
    total:money(bagTotalNum(items)),
    items:items.map(({p})=>({name:p.name, price:p.price, emoji:p.emoji})),
  };
  state.purchases.unshift(order);
  state.bag=state.bag.filter(id=>id.split('/')[0]!==bk);   // clear this brand's lines
  savePurchases();
  state.checkoutBrand=null; state.checkoutDone=order; render();
}
function finishCheckout(){
  state.checkoutDone=null;
  if(state.bag.length) startCheckout();   // more brands to pay → straight into the next one
  else render();
}

function renderDiscover(){
  const q = state.discoverQ.toLowerCase();
  const chips = `<div class="chips"><div class="chip ${!state.discoverSector?'on':''}" onclick="state.discoverSector=null;render()">All</div>${SECTORS.map(s=>`<div class="chip ${state.discoverSector===s.key?'on':''}" onclick="state.discoverSector='${s.key}';render()">${s.icon} ${s.name}</div>`).join('')}</div>`;
  let rows='';
  const secs = (state.discoverSector ? [state.discoverSector] : Object.keys(SECTOR_GATEWAYS))
    .sort((a,b)=>(sectorIsLive(b)?1:0)-(sectorIsLive(a)?1:0));   // built-out sectors first
  secs.forEach(sk=>{
    const s = sectorOf(sk); if(!s) return;
    [...(SECTOR_GATEWAYS[sk]||[])].sort((a,b)=>(gwIsLive(b)?1:0)-(gwIsLive(a)?1:0)).forEach(name=>{
      if (q && !name.toLowerCase().includes(q)) return;

      rows += `<div class="gwrow" onclick="state._gwFrom='root';openGateway('${name}','${sk}')">

        <div class="badge ${real?'live':'soon'}">${real?'LIVE':'STRUCTURAL'}</div>

    });
  });
  if (!rows) rows = `<div class="empty">No gateways match "${state.discoverQ}"</div>`;

}

/* ═════════ FEED TAB — same Network surface as Home, opened on the Feed view.
   Home tab = The Network › Sectors, Feed tab = The Network › Feed; the switcher and
   the bottom bar stay in sync. Sector feeds live on their sector screens. ═════════ */
/* ═════════ AI — the GENEXXO Host (2026-07-22: conversational) ═════════
   The Host is network-level; gateway agents are the specialists. The hand-off
   happens IN-THREAD: a gateway-shaped question gets a network-layer answer plus
   a hand-off card — accepting brings that gateway's agent into the same thread
   (accent-tagged bubbles, slim agent strip with open-gateway + back-to-Host).
   The agents rail starts an agent chat here too — no navigation, one AI surface.
   Answers are canned, keyword-routed, built from the prototype's own data
   (EVENTS_FEED, trending, brand zones) — the hook for a real model later.
   The thread lives in state, so the utility-tab toggle keeps your conversation. */
const AI_ROUTES = [
  {re:/climb|crag|boulder|hangboard|belay|chamonix|malham/i, gw:'climb'},
  {re:/ski|snow|avalanche|powder|piste|jacket|resort/i, gw:'ski'},
  {re:/surf|swell|wave|tide|reef/i, gw:'surf'},
  {re:/cycl|bike|ftp|watt|gravel|fondo/i, gw:'cycle'},
  {re:/sail|boat|yacht|crossing|passage/i, gw:'sail'},
];
const escHtml = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function aiScrollEnd(){ const s=$('screen'); requestAnimationFrame(()=>s.scrollTo({top:s.scrollHeight,behavior:'smooth'})); }

function sendAIFromInput(){ const el=$('aiInput'); if(!el||!el.value.trim()) return; const v=el.value; el.value=''; sendAI(v); }
function sendAI(text){
  const q=(text||'').trim(); if(!q||state.aiTyping) return;
  state.aiThread.push({who:'user', html:escHtml(q)});
  state.aiTyping=true; render(); aiScrollEnd();
  setTimeout(()=>{
    state.aiTyping=false;
    if(state.aiAgent){
      state.aiThread.push({who:'agent', gw:state.aiAgent, html:agentAnswer(state.aiAgent,q,false)});
    } else {
      const r=AI_ROUTES.find(r=>r.re.test(q));
      if(r && GATEWAYS[r.gw]){
        state.aiPendingQ=q;
        state.aiThread.push({who:'host', html:hostShort(r.gw)});
        state.aiThread.push({who:'handoff', gw:r.gw});
      } else {
        state.aiThread.push({who:'host', html:hostAnswer(q)});
      }
    }
    render(); aiScrollEnd();
  }, 850);
}
/* accepting the hand-off card: the specialist joins the SAME thread */
function aiHandoff(gw){
  state.aiThread=state.aiThread.filter(m=>m.who!=='handoff');
  state.aiAgent=gw;
  state.aiTyping=true; render(); aiScrollEnd();
  setTimeout(()=>{
    state.aiTyping=false;
    state.aiThread.push({who:'agent', gw, html:agentAnswer(gw, state.aiPendingQ, true)});
    state.aiPendingQ='';
    render(); aiScrollEnd();
  }, 800);
}
function aiAgentChat(k){
  const g=GATEWAYS[k]; if(!g) return;
  state.aiAgent=k;
  state.aiThread.push({who:'agent', gw:k, html:`I’m the ${g.name} specialist — everything inside ${g.domain}: the feed, the brands, the community, live conditions. What do you need?`});
  render(); aiScrollEnd();
}
function aiBackToHost(){
  state.aiAgent=null;
  state.aiThread.push({who:'host', html:'Back with you across the whole network — where next?'});
  render(); aiScrollEnd();
}
function aiReset(){ state.aiThread=[]; state.aiAgent=null; state.aiTyping=false; state.aiPendingQ=''; render(); $('screen').scrollTo(0,0); }

function hostAnswer(q){
  if(/plan|week|schedule|diary/i.test(q)){
    const picks=EVENTS_FEED.filter(e=>e.gw&&['Event','Podcast','Bookmark','Drop'].includes(e.type)).slice(0,5);
    const rows=picks.map(e=>`<div style="display:flex;gap:7px;align-items:baseline;margin-top:7px"><span>${e.icon}</span><b style="white-space:nowrap">${e.time}</b><span style="opacity:.75">${e.title}</span></div>`).join('');
    return `Here’s your week across your gateways:${rows}<div style="margin-top:9px;opacity:.65;font-size:12px">The full network calendar is in your Events tab — three streams are live right now.</div>`;
  }
  if(/trend/i.test(q)){
    const tags=YOUR_GATEWAYS.flatMap(k=>(GATEWAYS[k].trending||[]).slice(0,2)).slice(0,6);
    return `Across your Adventure gateways right now: ${tags.map(t=>`<b>${t}</b>`).join(' · ')}. The sharpest spike is <b>${tags[0]}</b> on ClimbXX — up 3× this week.`;
  }
  return `I can take that across the whole network — gateways, brands, events, people. If it turns specialist, I’ll bring the right gateway agent into this thread.`;
}
function hostShort(k){
  const g=GATEWAYS[k];
  return `That runs deep in <b>${g.name}</b>. I can give you the network view, but the ${g.name} Agent sits on the live data — conditions, community and every brand inside the gateway.`;
}
function agentAnswer(k,q,joining){
  const g=GATEWAYS[k]; q=q||'';
  const hello=joining?`<div style="opacity:.6;font-size:11.5px;margin-bottom:7px">Picking this up from the Host —</div>`:'';
  if(k==='climb'&&/partner|chamonix/i.test(q)) return hello+`Three members near Chamonix are looking for partners this week — two sport climbers (7a–7c) and an alpine pair heading for the Cosmiques Arête. Easiest intro: the <b>Chamonix Bloc Session</b> this Friday, 40+ going, and the Chamonix Guides Collective Pro Zone hosts a newcomers’ table.`;
  if(k==='climb'&&/hangboard|train|plan/i.test(q)) return hello+`Six-week block: 2× max hangs and 1× repeaters weekly, deload on week 4, retest week 6. I’ve sketched it in <b>Training Plan</b> — add the app from the ★ layer and it personalises to your logbook.`;
  if(k==='climb'&&/shoe|boulder/i.test(q)) return hello+`For steep bouldering the community verdict is the <b>Lithos Vertex Comp</b> — aggressive downturn, sticky heel. 4.7 from 890 reviews in the Lithos Sport Brand Zone; sizing runs a half size small.`;
  if(k==='ski'&&/jacket|shell|outerwear/i.test(q)) return hello+`Top-rated shells across SkiXX this season: <b>Sabran Ridgeline Pro</b> (4.8 · 2.1K reviews), <b>Sabran Corniche</b> (4.7) and <b>Atrion Face Shell</b> (4.6). The Ridgeline wins on breathability for touring — the full comparison lives in the Sabran Brand Zone.`;
  const app=(g.apps||[])[0];
  return hello+`Ask me anything inside ${g.name} — community beta, gear, conditions, events.${app?` A good place to start is <b>${app.name}</b>: ${app.desc.toLowerCase()}.`:''}`;
}

/* Reusable AI conversation pieces for the GENEXXO Host tab (renderAI). (2026-07-23;
   the in-zone AI surface was retired 2026-07-27 s3 — AI is ecosystem-level everywhere now.) */
function aiInputRow(){
  return `<div style="display:flex;gap:8px;margin:14px 16px 6px">
      <input id="aiInput" placeholder="${state.aiAgent?'Ask the '+GATEWAYS[state.aiAgent].name+' Agent…':'Ask anything across GENEXXO…'}" onkeydown="if(event.key==='Enter')sendAIFromInput()" style="flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:var(--font);font-size:13px;outline:none">
      <button class="btn" style="background:#111116;color:#fff;border-radius:14px" onclick="sendAIFromInput()">→</button>
    </div>`;
}
function aiMsgsHtml(){
  const msgs = state.aiThread.map(m=>{
    if(m.who==='user') return `<div class="bub user">${m.html}</div>`;
    if(m.who==='host') return `<div class="bub" style="background:#fff;border:1px solid var(--line)">${m.html}</div>`;
    if(m.who==='agent'){ const g=GATEWAYS[m.gw]; return `
      <div class="agent-tag" style="color:${g.theme.accent}"><span style="font-size:12px">${g.emoji}</span>${g.name} Agent</div>
      <div class="bub" style="background:#fff;border:1px solid var(--line);border-left:3px solid ${g.theme.accent}">${m.html}</div>`; }
    if(m.who==='handoff'){ const g=GATEWAYS[m.gw]; return `
      <div class="gwrow" style="margin:2px 16px 12px" onclick="aiHandoff('${m.gw}')">
        <div class="em" style="background:${g.gradient}">${g.emoji}</div>
        <div style="flex:1"><div class="nm">Continue with the ${g.name} Agent</div><div class="dm">The gateway’s specialist joins this thread — live data from ${g.domain}</div></div>
        <div style="font-size:17px;color:var(--muted)">›</div>
      </div>`; }
    return '';
  }).join('');
  const typing = state.aiTyping ? `<div class="bub" style="background:#fff;border:1px solid var(--line);width:58px"><div class="tdots"><i></i><i></i><i></i></div></div>` : '';
  return msgs + typing;
}

function renderAI(){
  const inputRow=aiInputRow();

  if(!state.aiThread.length){
    const prompts = [
      'Plan my week across my gateways',
      'What’s trending in Adventure right now?',
      'Find me a climbing partner near Chamonix',
      'Compare the top 3 ski jackets my gateways rate',
    ];
    // Gateway agents rail — ordered by where you ARE and where you've BEEN: the gateway you
    // opened AI from leads (highlighted "here now"), then most-recently-visited (reusing
    // state.recent), then your core gateways. So SpaXX's agent sits first the moment you open
    // AI inside SpaXX, and earlier agents drift right as you move around the ecosystem.
    const ctxObj = ((state.screen==='gateway'||state.screen==='zone') && state._gwObj) ? state._gwObj
                 : (state._before && state._before._gwObj) ? state._before._gwObj : null;
    const ctxKey = ctxObj ? gwKeyFromName(ctxObj.name) : null;
    const order = [];
    if(ctxKey && GATEWAYS[ctxKey]) order.push(ctxKey);
    state.recent.filter(r=>r.t==='gateway').forEach(r=>{ if(GATEWAYS[r.k] && !order.includes(r.k)) order.push(r.k); });
    YOUR_GATEWAYS.forEach(k=>{ if(GATEWAYS[k] && !order.includes(k)) order.push(k); });
    const ctxG = ctxKey ? GATEWAYS[ctxKey] : null;
    const agents = order.slice(0,14).map(k=>{const g=GATEWAYS[k]; const here=k===ctxKey; return `
      <div class="gwv" onclick="aiAgentChat('${k}')">
        <div class="ring" style="background:${g.gradient};position:relative;${here?`box-shadow:0 0 0 3px var(--bg,#fff),0 0 0 5px ${g.theme.accent}`:''}"><div class="face">${g.emoji}</div>${here?`<span title="You're here" style="position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:50%;background:${g.theme.accent};border:2.5px solid var(--bg,#fff)"></span>`:''}</div>
        <div class="nm"${here?` style="font-weight:800;color:${g.theme.accent}"`:''}>${g.name}</div>
      </div>`;}).join('');
    const agentNote = ctxG
      ? `You're in <b>${ctxG.name}</b> — its agent leads below, ready to join this chat. Tap any to bring in a specialist.`
      : `Each gateway has its own expert agent — tap one and it joins this chat.`;
    return `${topBar()}
    <div class="push">
      <div class="sect" style="display:flex;align-items:center;gap:12px;padding-top:20px">
        <div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#111116,#3a3a44);display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px">✦</div>
        <div><div style="font-size:16.5px;font-weight:800">GENEXXO Host</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600">One AI across every gateway you belong to</div></div>
      </div>
      <div class="bub" style="background:#fff;border:1px solid var(--line)">Hi Sean — I can work across your whole network: your gateways, their brands, agents and communities. Where do we start?</div>
      <div class="prompts">${prompts.map(p=>`<div class="prompt" style="background:#fff;border-color:var(--line)" onclick="sendAI(this.textContent)">${p}</div>`).join('')}</div>
      ${inputRow}
      <div class="sect"><div class="sect-h"><div class="t">Gateway agents</div><div class="a">specialists</div></div></div>
      <div style="padding:0 16px 4px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5">${agentNote}</div>
      <div class="rail" style="padding-top:10px">${agents}</div>
      <div style="height:16px"></div>
    </div>`;
  }

  // conversation view — same surface, the thread takes over
  const ag = state.aiAgent ? GATEWAYS[state.aiAgent] : null;
  const agentStrip = ag ? `<div style="display:flex;align-items:center;gap:8px;margin:0 16px 12px;padding:8px 12px;border-radius:12px;background:${ag.theme.accent}12;border:1px solid ${ag.theme.accent}30">
      <span style="width:22px;height:22px;border-radius:7px;background:${ag.gradient};display:flex;align-items:center;justify-content:center;font-size:11px">${ag.emoji}</span>
      <span style="font-size:11.5px;font-weight:800">${ag.name} Agent</span>
      <span onclick="state._gwFrom='root';openGateway('${ag.name}','${ag.sector}')" style="margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap">Open ${ag.domain} ›</span>
      <span onclick="aiBackToHost()" title="Back to the Host" style="font-size:13px;color:var(--muted);cursor:pointer;padding:0 2px">✕</span>
    </div>` : '';
  const msgs = aiMsgsHtml();
  const agentPrompts = (ag && state.aiThread.length===1 && state.aiThread[0].who==='agent')
    ? `<div class="prompts">${(ag.prompts||[]).map(p=>`<div class="prompt" style="background:#fff;border-color:var(--line)" onclick="sendAI(this.textContent)">${p}</div>`).join('')}</div>` : '';
  return `${topBar()}
  <div class="push">
    <div class="sect" style="display:flex;align-items:center;gap:10px;padding-top:16px;padding-bottom:12px">
      <div style="width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#111116,#3a3a44);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px">✦</div>
      <div style="font-size:14px;font-weight:800">GENEXXO Host</div>
      <div onclick="aiReset()" style="margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:#fff">New chat</div>
    </div>
    ${agentStrip}
    ${msgs}
    ${agentPrompts}
    ${inputRow}
    <div style="height:16px"></div>
  </div>`;
}

/* ═════════ RENDER ═════════ */
function render(){
  let html='';
  if (state.screen==='gateway') html = renderGateway();
  else if (state.screen==='zone') html = renderZonePage();
  else if (state.screen==='sector') html = renderSector();
  else {
    document.title = 'GENEXXO'; $('metaTheme').content = '#ffffff';
    html = {home:renderHome, discover:renderDiscover, ai:renderAI, events:renderEvents, profile:renderProfile}[state.tab]();
  }
  // Kill the OUTGOING page's in-flight video downloads BEFORE replacing it (2026-08-04).
  // Rapid gateway-hopping otherwise leaves each abandoned page's half-loaded clips
  // silently downloading in the background — detached from the DOM but still on the
  // pipe — so the new page's top clip queues behind them: the "frozen start" on quick
  // clicks. pause + drop src + load() is the standard abort — the element stops issuing
  // requests; a small clip the SW already started fetching typically completes into the
  // media cache anyway (fine: the abandoned page comes back pre-warmed).
  $('screen').querySelectorAll('video[src]').forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} });
  $('screen').innerHTML = html;
  // Pin the sticky sub-bar (Network·Sectors·Gateways / gateway tabs) flush under the top
  // bar on EVERY device: drive its sticky offset from the top bar's real rendered height
  // instead of a hard-coded 53px, so sub-pixel/DPR rounding can't leave it ~10% tucked under.
  const topEl = $('screen').querySelector('.top');
  if (topEl) $('frame').style.setProperty('--top-h', topEl.getBoundingClientRect().height + 'px');
  lazyMedia();   // observe any <video data-vsrc> the fresh render just drew
  tabBar();
  // Sectors drawer: every page. Gateways drawer: any sector context — a sector page OR a
  // gateway (shows its sibling gateways). Close both on any navigation.
  $('frame').classList.add('drawer-avail');
  $('frame').classList.toggle('gw-avail', !!activeSectorKey());
  // dark gateway themes need light-tinted edge handles or they vanish into the background
  $('frame').classList.toggle('on-dark', state.screen==='gateway' && !!(state._gwObj && state._gwObj.theme.dark));
  $('frame').classList.remove('drawer-open','drawer-open-r'); state.drawerOpen=false;
  // first-run nudges: left half-moon pulses on the home feed, right one on a first sector visit
  $('edge').classList.toggle('nudge', !nudgeDone('edgeL') && state.screen==='root' && state.tab==='home');
  $('edgeR').classList.toggle('nudge', !nudgeDone('edgeR') && state.screen==='sector');
  if (window.__resetChrome) window.__resetChrome();
}

/* ═════════ AUTO-HIDE CHROME ON SCROLL (X-style) ═════════
   Scroll down inside #screen → slide the top bar and tab bar off-frame for a
   full-height read; scroll up → snap them back as if waiting just out of sight.
   Sticky sub-tabs ride up to pin at the top edge. Near the top, always shown. */
(function initAutoHideChrome(){
  const screen = $('screen'), frame = $('frame');
  let lastY = 0, ticking = false;
  function update(){
    if (frame.classList.contains('drawer-open') || frame.classList.contains('drawer-open-r')){ ticking=false; return; }  // hold chrome while a drawer is open
    const y = screen.scrollTop;
    if (y <= 6) frame.classList.remove('chrome-hidden');          // at the top → always show
    else if (y > lastY + 4) frame.classList.add('chrome-hidden');  // scrolling down → hide
    else if (y < lastY - 4) frame.classList.remove('chrome-hidden');// scrolling up → reveal
    // the ★ nudge waits for the first real scroll inside a gateway, then pulses gold
    // (now inviting discovery of the favourite-gateways panel behind the star)
    if (!nudgeDone('star') && state.screen==='gateway' && y > 40){
      const st = document.getElementById('gwStar');
      if (st) st.classList.add('star-nudge');
    }
    lastY = y; ticking = false;
  }
  screen.addEventListener('scroll', () => {
    if (!ticking){ ticking = true; requestAnimationFrame(update); }
  }, { passive:true });
  window.__resetChrome = () => { lastY = 0; frame.classList.remove('chrome-hidden'); };
  // after a programmatic scroll (e.g. restoring your place), adopt the new position
  // without treating the jump as a scroll — chrome stays put until YOU scroll again
  window.__syncChrome = () => { lastY = screen.scrollTop; frame.classList.remove('chrome-hidden'); };
})();

/* ═════════ LEFT SECTOR DRAWER — content + edge-swipe gestures ═════════ */
// Built-out sectors (those with live gateways) rise to the top and carry a green light.

(function initDrawerSwipe(){
  const frame=$('frame'); let sx=0, sy=0, fromL=false, fromR=false;
  frame.addEventListener('touchstart', e=>{
    if (state.showInfo){ fromL=fromR=false; return; }   // deck open → its own swipe owns horizontal gestures
    const t=e.changedTouches[0], r=frame.getBoundingClientRect(); sx=t.clientX; sy=t.clientY;
    fromL = (sx - r.left) < 30;
    fromR = (r.right - sx) < 30;
  }, {passive:true});
  frame.addEventListener('touchend', e=>{
    if (state.showInfo) return;                                     // deck open → ignore edge-drawer swipes
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;   // needs a clear horizontal swipe
    if (frame.classList.contains('drawer-open')){ if(dx<0) closeDrawer(); }
    else if (frame.classList.contains('drawer-open-r')){ if(dx>0) closeDrawerR(); }
    else if (fromL && dx>0) openDrawer();                           // swipe in from the left → sectors
    else if (fromR && dx<0) openDrawerR();                          // swipe in from the right → gateways
  }, {passive:true});
})();

/* ═════════ PULL-TO-REFRESH ═════════
   Pull down past the top of any feed → spinner → re-render the current screen.
   Static data for now (the motion is real; wire to live data later). */
(function initPullToRefresh(){
  const screen=$('screen'), frame=$('frame'), ptr=$('ptr');
  const THRESH=64, MAX=92;
  let startY=0, dist=0, pulling=false, busy=false;
  const reset=()=>{ ptr.style.transition=''; ptr.style.transform=''; ptr.style.opacity=0; ptr.classList.remove('ready'); };
  screen.addEventListener('touchstart', e=>{
    pulling = screen.scrollTop<=0 && !busy
      && state.screen!=='zone'   // brand zones opt out — the gesture got in the way of the Shop/grid
      && !state.showInfo         // the ⓘ vision deck is a self-contained overlay — no pull-to-refresh
      && !frame.classList.contains('drawer-open') && !frame.classList.contains('drawer-open-r');
    if(pulling){ startY=e.touches[0].clientY; dist=0; ptr.style.transition='none'; }
  }, {passive:true});
  screen.addEventListener('touchmove', e=>{
    if(!pulling) return;
    dist = e.touches[0].clientY - startY;
    if(dist<=0){ ptr.style.transform='translateX(-50%)'; ptr.style.opacity=0; ptr.classList.remove('ready'); return; }
    const d = Math.min(dist*.55, MAX);                       // rubber-band
    ptr.style.transform=`translateX(-50%) translateY(${d}px)`;
    ptr.style.opacity=Math.min(1, d/THRESH);
    ptr.classList.toggle('ready', dist>=THRESH);
  }, {passive:true});
  screen.addEventListener('touchend', ()=>{
    if(!pulling) return; pulling=false;
    ptr.style.transition='';
    if(dist>=THRESH){
      busy=true; ptr.classList.add('spin'); ptr.classList.remove('ready');
      ptr.style.transform=`translateX(-50%) translateY(${THRESH}px)`; ptr.style.opacity=1;
      setTimeout(()=>{ render(); screen.scrollTo(0,0); ptr.classList.remove('spin'); reset(); busy=false; }, 750);
    } else reset();
    dist=0;
  }, {passive:true});
})();

/* ═════════ UPDATE CHECK — Tier A (2026-07-31) — no service worker ═════════
   The app polls a tiny version.json; if the DEPLOYED build differs from this file's embedded
   BUILD, a tappable "Update" banner appears and reloads cache-busted. Runs on load and every
   time the app regains focus (the exact moment an installed PWA is reopened) — so users get
   new gateways/builds without uninstalling or clearing cache. On EVERY deploy, bump BOTH the
   `BUILD` constant above AND version.json to the same new value, or the banner won't fire. */
/* Dismissal is PERSISTED per-build (2026-08-01): without a service worker an installed
   PWA reopens at its cached start page, so if that page is an OLD build it will keep
   detecting the newer version.json and re-nag on every open — an endless loop. We record
   the acknowledged build in localStorage (`gx_updDismissed`) the moment the user taps
   Update OR dismisses, so a given build prompts at most once; a genuinely NEW deploy
   (different build string) still prompts afresh. Tier B (network-first SW, [[genexxo-mobile-update-strategy]])
   is the durable fix that also makes the reload actually replace the cached page. */
let _updDismissed = null;
try{ _updDismissed = localStorage.getItem('gx_updDismissed') || null; }catch(e){}
function _setUpdDismissed(build){ _updDismissed = build||null; try{ if(build) localStorage.setItem('gx_updDismissed', build); }catch(e){} }
function reloadForUpdate(build){
  _setUpdDismissed(build);   // acknowledge so we don't loop if the reload can't replace the cached start page
  try{ const u=new URL(location.href); u.searchParams.set('v', build||String(Date.now())); location.replace(u.toString()); }
  catch(e){ location.reload(); }
}
function dismissUpdate(){ const b=$('updateBar'); if(b){ _setUpdDismissed(b.dataset.build||null); b.remove(); } }
function showUpdateBanner(build){
  if($('updateBar')) return;
  const bar=document.createElement('div');
  bar.id='updateBar'; bar.dataset.build=build;
  bar.innerHTML=`<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:12.5px">New version available</div><div style="font-size:10.5px;opacity:.7;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Tap update for the latest gateways &amp; features</div></div>
    <button onclick="reloadForUpdate('${build}')" style="border:0;background:#F5B800;color:#141414;font-weight:800;font-size:12px;padding:8px 15px;border-radius:99px;cursor:pointer;flex-shrink:0">Update</button>
    <div onclick="dismissUpdate()" title="Dismiss" style="width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.6);font-size:14px;flex-shrink:0">✕</div>`;
  bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + var(--safe-b) + 14px);z-index:70;width:calc(100% - 24px);max-width:406px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(20,20,26,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.42);color:#fff';
  ($('frame')||document.body).appendChild(bar);
}
async function checkForUpdate(){
  try{
    const r=await fetch('version.json?_='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(j && j.build && j.build!==BUILD && j.build!==_updDismissed) showUpdateBanner(j.build);
  }catch(e){}
}
checkForUpdate();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });

/* Service worker (Tier B, 2026-08-01) — registers sw.js, a NETWORK-FIRST app-shell worker.
   This is what makes updates actually "take": on every online reopen the SW fetches the
   freshest genexxo-mobile.html from the network (cached copy only as an offline fallback),
   so an installed PWA no longer reopens stuck on an old cached build. Registered after load
   so it never blocks first paint; fails silently off-https (e.g. file://). Pairs with the
   version.json banner above (in-session signal) — the SW makes that banner's reload real. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
