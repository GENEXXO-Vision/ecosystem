<!DOCTYPE html>
<html lang="en">
<head>

<title>GENEXXO</title>

<!-- ══════════════════════════════════════════════════════════════════════════════════════
     PHASE 3 CUTOVER — 2026-08-28

     This file WAS the desktop app. It is now a redirect to genexxo-app.html, which
     serves phone and desktop from one shell: under 1120px the phone UI, above it a
     three-column layout. The separate desktop build had rotted to 5% of the gateway set
     (40 tiles / 349 gateways against 68 / 6,184) precisely because it was separate.

     WHY THIS FILENAME SURVIVES, EMPTY OF ITS APP
     Fifteen pages link here — index.html, about.html and all twelve vision-series pages,
     sixteen references in total, every one a bare "genexxo-deck.html" with no hash or
     query. Keeping the name means not one of them had to change, and any bookmark or
     shared link from the deck's whole life still lands somewhere real.

     DO NOT paste the shell's contents in here to "remove the hop". That rebuilds the exact
     twin this cutover exists to end: two copies drifting apart, which is how the old
     desktop died. It would also break installed PWAs — the service worker's SHELL constant
     and every cached entry key off the genexxo-app.html path.

     The real deck is kept at Archive/genexxo-deck-legacy.html. It is the only place PROS,
     PRO_TIERS and SIGNUP_TYPES exist — 20 gateways of professionals, 4 tiers, 5 signup
     flows — which are not yet carried across into the shared data. See HANDOVER.md.
     ══════════════════════════════════════════════════════════════════════════════════════ -->

<link rel="canonical" href="genexxo-app.html">
<meta name="robots" content="noindex,follow">
<!-- Belt and braces: the meta refresh fires even with JS disabled; the script beats it to
     the punch and, unlike the meta, can carry a hash or query string across. -->
<meta http-equiv="refresh" content="0; url=genexxo-app.html">
<script>
  (function () {
    try {
      // replace() rather than assign() so Back does not bounce off this page and land here
      // again — the redirect must not become a trap between the site and the app.
      location.replace('genexxo-app.html' + location.search + location.hash);
    } catch (e) {
      location.href = 'genexxo-app.html';
    }
  })();
</script>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
       background:#0b0b0f;color:rgba(255,255,255,.82);
       font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       text-align:center;padding:24px}
  .w{max-width:340px}
  .mark{font-weight:800;font-size:15px;letter-spacing:.22em;color:#fff}
  .rule{width:0;height:2px;margin:16px auto;border-radius:2px;background:#F5B800;
        box-shadow:0 0 14px rgba(245,184,0,.6);animation:r .5s .1s cubic-bezier(.2,.75,.2,1) forwards}
  @keyframes r{to{width:96px}}
  p{font-size:13.5px;line-height:1.6;margin:0 0 18px;color:rgba(255,255,255,.55)}
  a{display:inline-block;padding:11px 20px;border-radius:99px;background:#F5B800;color:#141414;
    font-weight:700;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <!-- Only ever seen if both the script and the meta refresh fail. -->
  <div class="w">
    <div class="mark">GENEXXO</div>
    <div class="rule"></div>
    <p>The demo now lives in one app that fits both desktop and phone.</p>
    <a href="genexxo-app.html">Open GENEXXO &rsaquo;</a>
  </div>
</body>
</html>
