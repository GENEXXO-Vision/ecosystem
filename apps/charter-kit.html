<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Charter Kit</title>
<style>
/* Charter Kit, by Weatherdeck (fictional), 2026-11-23. A GENEXXO app for YachtXX.
   A packing list for a week's yacht charter by category, a crew list with who brings what, and a countdown. */
:root{--bg:#F1F8F6;--card:#fff;--line:rgba(14,50,46,.1);--ink:#0E2B28;--mut:rgba(14,43,40,.55);--glass:#3E8E86;--sand:#B08850}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#A7E3DA,#3E8E86);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--glass)}
.cd{background:linear-gradient(135deg,#0F4C5C,#3E8E86);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}.cd .n{font-size:40px;font-weight:900;line-height:1}.cd b{display:block;font-size:16px}.cd small{opacity:.85;font-size:12px}
.bar{height:8px;border-radius:99px;background:#DDEBE8;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--glass)}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;cursor:pointer}.chk .b{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0}.chk.on .b{background:var(--glass);border-color:var(--glass)}.chk.on span{text-decoration:line-through;color:var(--mut)}.chk em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;color:var(--sand)}
.crew{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}.av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}.crew .x{flex:1}.crew b{display:block}.crew p{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:6px;margin-top:8px}input,select{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
.mini{font:inherit;font-size:12.5px;font-weight:800;border:0;background:var(--glass);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--glass);color:#fff;cursor:pointer}.go:disabled{background:#DDEBE8;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🧳</div><div><h1>Charter Kit</h1><p>Weatherdeck · in YachtXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="p" class="on">Packing</button><button data-tab="c">Crew</button><button data-tab="t">Trip</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const LIST={'Bags & basics':['Soft bag (no suitcases)','Passport and charter papers','Phone charger and 12V adapter','Head torch'],'On deck':['Non-marking deck shoes','Sunglasses with a strap','Sun hat that ties on','Sun cream, high factor','Light waterproof jacket'],'Swim & snorkel':['Swimwear × 2','Quick-dry towel','Mask and snorkel','Reef-safe sun cream'],'Health':['Seasickness bands or tablets','Plasters and after-sun','Any regular medicines'],'Evenings':['Warm layer for night','Something smart for a harbour dinner']};
const COL=['#0F6E7A','#B08850','#3E8E86','#7C3AED','#DC2626','#0284C7'];
const seed=()=>({packed:['Soft bag (no suitcases)','Passport and charter papers','Swimwear × 2','Sun cream, high factor'],crew:[{n:'Fran',r:'Organiser',b:['Seasickness bands or tablets']},{n:'Mike',r:'Navigator',b:['Head torch','Phone charger and 12V adapter']},{n:'Bea',r:'Chief cook',b:['Mask and snorkel']},{n:'Sam',r:'Crew',b:[]}],dep:GX.iso(190),boat:'Aurelia Sol, 45ft catamaran',from:'Split'});
let C,S={tab:'p',shared:false};
GX.init({gateway:'YachtXX',seed}).then(c=>{C=c;paint();});
const all=()=>Object.values(LIST).flat();
const days=()=>Math.max(0,Math.round((new Date(C.data.dep+'T12:00:00')-GX.today(0))/864e5));
const who=x=>{const c=C.data.crew.find(m=>m.b.includes(x));return c?c.n:'';};
function vP(){const d=C.data,n=d.packed.length,t=all().length;return `<div class="cd"><div class="n">${days()}</div><div><b>days to go</b><small>${GX.esc(d.boat)} from ${GX.esc(d.from)}</small></div></div>
  <div class="bar"><i style="width:${n/t*100}%"></i></div><div class="legend" style="margin-top:4px">${n} of ${t} packed</div>`+
  Object.entries(LIST).map(([cat,items])=>`<div class="lbl">${cat}</div>`+items.map(x=>`<div class="chk ${d.packed.includes(x)?'on':''}" data-p="${GX.esc(x)}"><div class="b">✓</div><span>${x}</span>${who(x)?`<em>${GX.esc(who(x))} brings</em>`:''}</div>`).join('')).join('');}
function vC(){const d=C.data;return `<div class="lbl">${d.crew.length} crew</div>`+d.crew.map((m,i)=>`<div class="crew"><div class="av" style="background:${COL[i%COL.length]}">${GX.esc(m.n[0])}</div><div class="x"><b>${GX.esc(m.n)} · ${GX.esc(m.r)}</b><p>${m.b.length?'Bringing: '+m.b.map(GX.esc).join(', '):'Nothing assigned yet'}</p></div></div>`).join('')+
  `<div class="lbl">Who brings what</div><div class="row"><select id="wi">${all().filter(x=>!who(x)).map(x=>`<option>${x}</option>`).join('')}</select><select id="wm">${d.crew.map((m,i)=>`<option value="${i}">${GX.esc(m.n)}</option>`).join('')}</select><button class="mini" id="assign">Assign</button></div>
  <div class="lbl">Add crew</div><div class="row"><input id="cn" placeholder="Name"><button class="mini" id="cadd">Add</button></div>`;}
function vT(){const d=C.data;return `<div class="cd"><div class="n">⛵</div><div><b>${GX.esc(d.boat)}</b><small>From ${GX.esc(d.from)} · ${GX.day(d.dep,{weekday:'long',day:'numeric',month:'long'})}</small></div></div>
  <div class="lbl">Good to know</div><div class="chk"><span>🧳 Soft bags fold into lockers. Suitcases don’t.</span></div><div class="chk"><span>👟 Shoes with dark soles mark the deck. Bring non-marking ones.</span></div><div class="chk"><span>💧 Water tanks are limited: short showers on board.</span></div>`+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share the countdown'}</button>`:'');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='p'?vP():S.tab==='c'?vC():vT();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p,i=d.packed.indexOf(p);i<0?d.packed.push(p):d.packed.splice(i,1);sv();});
  const a=document.getElementById('assign');if(a)a.onclick=()=>{const it=document.getElementById('wi').value;if(!it)return;d.crew[+document.getElementById('wm').value].b.push(it);sv();};
  const ca=document.getElementById('cadd');if(ca)ca.onclick=()=>{const n=document.getElementById('cn').value.trim();if(!n)return;d.crew.push({n,r:'Crew',b:[]});sv();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{GX.post(`${days()} days until ${d.crew.length} of us set sail from ${GX.esc(d.from)} on ${GX.esc(d.boat)}. Bags (soft ones) half packed 🧳`,'CHARTER KIT').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
