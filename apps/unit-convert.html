<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unit Convert</title>
<style>
/* Unit Convert, by "Datum Software" (fictional), 2026-11-16. A GENEXXO app for EngineerXX.
   Every unit is a factor to SI (temperature is the exception, converted through kelvin). Factors are the exact or
   standard definitions: inch 0.0254 m, lbf 4.4482216152605 N, psi 6894.757 Pa, hp (mechanical) 745.69987 W,
   BTU (IT) 1055.05585 J, kgf 9.80665 N. Type in either box and the other follows. */
:root{--bg:#0A1630;--card:rgba(255,255,255,.05);--line:rgba(234,242,255,.1);--ink:#EAF2FF;--mut:rgba(234,242,255,.55);--amber:#FFB000;--cyan:#4FC3F7;--red:#F0646E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto;
  background-image:linear-gradient(rgba(79,195,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(79,195,247,.05) 1px,transparent 1px);background-size:22px 22px}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4FC3F7,#1565A8);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--cyan)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.qs button{font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer}.qs button.on{border-color:var(--cyan);background:rgba(79,195,247,.16)}
.box{background:#0F2148;border:1px solid rgba(79,195,247,.25);border-radius:16px;padding:12px}
.box input{width:100%;font:inherit;font-size:30px;font-weight:900;background:none;border:0;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.units{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.units button{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:5px 9px;cursor:pointer}.units button.on{color:#0A1630;background:var(--cyan);border-color:var(--cyan)}
.box.b2 .units button.on{background:var(--amber);border-color:var(--amber)}
.sw{display:flex;justify-content:center;margin:-6px 0;position:relative;z-index:1}.sw button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(79,195,247,.35);background:#14306A;color:var(--ink);font-size:17px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.step{display:flex;align-items:center;gap:8px}.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}.step span{min-width:26px;text-align:center;font-weight:900}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-variant-numeric:tabular-nums}.r+.r{border-top:1px solid var(--line)}.r b{font-weight:800}.r span{color:var(--mut);font-size:12.5px}.r .eq{color:var(--amber);font-weight:900}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--cyan);color:#0A1630;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📐</div><div><h1>Unit Convert</h1><p>Datum Software · in EngineerXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="conv" class="on">Convert</button><button data-tab="recent">Recent</button><button data-tab="ref">Quick ref</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const Q={
  length:{name:'Length',u:{mm:.001,cm:.01,m:1,km:1000,in:.0254,ft:.3048,yd:.9144,mi:1609.344}},
  force:{name:'Force',u:{N:1,kN:1000,lbf:4.4482216152605,kgf:9.80665}},
  pressure:{name:'Pressure',u:{Pa:1,kPa:1000,MPa:1e6,bar:1e5,psi:6894.757293,atm:101325}},
  torque:{name:'Torque',u:{'N·m':1,'lbf·ft':1.3558179483,'lbf·in':.1129848290,'kgf·m':9.80665}},
  power:{name:'Power',u:{W:1,kW:1000,MW:1e6,hp:745.69987158,'BTU/h':.29307107}},
  energy:{name:'Energy',u:{J:1,kJ:1000,kWh:3.6e6,cal:4.184,BTU:1055.05585}},
  temp:{name:'Temperature',u:{'°C':0,'°F':0,K:0}}};
const toK={'°C':v=>v+273.15,'°F':v=>(v-32)*5/9+273.15,K:v=>v},fromK={'°C':v=>v-273.15,'°F':v=>(v-273.15)*9/5+32,K:v=>v};
function conv(q,v,a,b){if(q==='temp')return fromK[b](toK[a](v));return v*Q[q].u[a]/Q[q].u[b];}
const seed=()=>({q:'pressure',a:'bar',b:'psi',v:6,sf:4,recent:[
  {q:'torque',a:'N·m',b:'lbf·ft',v:85},{q:'length',a:'in',b:'mm',v:2.5},{q:'power',a:'hp',b:'kW',v:150},{q:'force',a:'kN',b:'lbf',v:12},{q:'temp',a:'°F',b:'°C',v:350}]});
let C,S={tab:'conv',shared:false,from:'a'};
GX.init({gateway:'EngineerXX',seed}).then(c=>{C=c;paint();});
const fmt=(x,sf)=>{if(!isFinite(x))return '—';if(x===0)return '0';const a=Math.abs(x);
  if(a>=1e9||a<1e-4)return x.toExponential(sf-1).replace('e+','e');return (+x.toPrecision(sf)).toLocaleString('en-GB',{maximumSignificantDigits:sf});};
function result(){const d=C.data;return conv(d.q,d.v,d.a,d.b);}
function remember(){const d=C.data,k=JSON.stringify([d.q,d.a,d.b,d.v]);d.recent=[{q:d.q,a:d.a,b:d.b,v:d.v}].concat(d.recent.filter(r=>JSON.stringify([r.q,r.a,r.b,r.v])!==k)).slice(0,8);GX.save(d);}
function vConv(){const d=C.data,us=Object.keys(Q[d.q].u),r=result();
  return `<div class="qs">${Object.keys(Q).map(k=>`<button data-q="${k}" class="${k===d.q?'on':''}">${Q[k].name}</button>`).join('')}</div>
  <div class="box"><input id="ia" inputmode="decimal" value="${fmt(d.v,8)}"><div class="units">${us.map(u=>`<button data-a="${u}" class="${u===d.a?'on':''}">${u}</button>`).join('')}</div></div>
  <div class="sw"><button id="swap" title="Swap">⇅</button></div>
  <div class="box b2"><input id="ib" inputmode="decimal" value="${fmt(r,d.sf)}"><div class="units">${us.map(u=>`<button data-b="${u}" class="${u===d.b?'on':''}">${u}</button>`).join('')}</div></div>
  <div class="row"><div><b>Significant figures</b></div><div class="step"><button data-sf="-1">–</button><span>${d.sf}</span><button data-sf="1">+</button></div></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share this conversion to ${C.gateway}`}</button>`:''}`;}
function vRecent(){return `<div class="card"><h3>Recent conversions</h3>${C.data.recent.map((r,i)=>`<div class="r" data-r="${i}" style="cursor:pointer"><div><b>${fmt(r.v,6)} ${r.a}</b><br><span>${Q[r.q].name}</span></div><div class="eq">= ${fmt(conv(r.q,r.v,r.a,r.b),C.data.sf)} ${r.b}</div></div>`).join('')}</div><div class="legend">Tap one to open it again.</div>`;}
function vRef(){const rows=[['1 bar','14.50 psi'],['1 MPa','145.0 psi'],['1 N·m','0.7376 lbf·ft'],['1 hp (mech)','0.7457 kW'],['1 kWh','3.6 MJ'],['1 inch','25.4 mm (exact)'],['g (standard)','9.80665 m/s²'],['Steel density','≈ 7,850 kg/m³'],['Steel, Young’s modulus','≈ 200 GPa']];
  return `<div class="card"><h3>Engineer’s quick reference</h3>${rows.map(r=>`<div class="r"><b>${r[0]}</b><div class="eq">${r[1]}</div></div>`).join('')}</div><div class="legend">Material values are typical; check the spec for your grade.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='conv'?vConv():S.tab==='recent'?vRecent():vRef();
  v.querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>{d.q=e.dataset.q;const us=Object.keys(Q[d.q].u);d.a=us[0];d.b=us[1];d.v=d.q==='temp'?20:1;S.shared=false;GX.save(d);paint();});
  v.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{d.a=e.dataset.a;S.shared=false;remember();paint();});
  v.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{d.b=e.dataset.b;S.shared=false;remember();paint();});
  v.querySelectorAll('[data-sf]').forEach(e=>e.onclick=()=>{d.sf=Math.min(8,Math.max(2,d.sf+(+e.dataset.sf)));GX.save(d);paint();});
  v.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{Object.assign(d,d.recent[+e.dataset.r]);S.tab='conv';paint();});
  const ia=document.getElementById('ia'),ib=document.getElementById('ib');
  if(ia)ia.oninput=()=>{const x=parseFloat(ia.value.replace(/,/g,''));if(!isNaN(x)){d.v=x;ib.value=fmt(result(),d.sf);S.shared=false;}};
  if(ib)ib.oninput=()=>{const x=parseFloat(ib.value.replace(/,/g,''));if(!isNaN(x)){d.v=conv(d.q,x,d.b,d.a);ia.value=fmt(d.v,8);S.shared=false;}};
  [ia,ib].forEach(el=>el&&(el.onchange=remember));
  const sw=document.getElementById('swap');if(sw)sw.onclick=()=>{const r=result();[d.a,d.b]=[d.b,d.a];d.v=+r.toPrecision(d.sf);remember();paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{
    GX.post(`<b>${fmt(d.v,8)} ${d.a} = ${fmt(result(),d.sf)} ${d.b}</b>. Worked out in Unit Convert 📐`,'UNIT CONVERT').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
