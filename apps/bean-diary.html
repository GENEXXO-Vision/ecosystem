<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bean Diary</title>
<style>
/* Bean Diary, by Ember & Bean Roasters (fictional), 2026-11-21. A GENEXXO app for CoffeeXX.
   A note for each bag: origin, process, roaster, flavours (picked from a short wheel) and a score out of 10. The
   favourites view averages scores by origin and by process. Roasters other than Ember & Bean are fictional. */
:root{--bg:#15100C;--card:rgba(255,255,255,.05);--line:rgba(245,237,228,.1);--ink:#F5EDE4;--mut:rgba(245,237,228,.55);--crema:#D4A373;--ember:#E8783A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#E8783A,#A23B10);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--ember)}
.bag{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.bag .t{display:flex;justify-content:space-between;align-items:baseline}.bag b{font-size:14.5px}.bag .sc{font-size:20px;font-weight:900;color:var(--crema)}
.bag small{display:block;color:var(--mut);font-size:12px}.fl{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.fl i{font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(232,120,58,.14);color:#F4A27A}
.lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:6px 11px;cursor:pointer}.chip.on{background:var(--ember);border-color:var(--ember);color:#fff}
.score{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}.score b{font-size:36px;font-weight:900;color:var(--crema);min-width:60px;text-align:center}
.st{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:20px;font-weight:900;cursor:pointer;color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:7px 0}.bar span{width:96px;font-weight:700;font-size:13px}.bar .b{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.bar .b i{display:block;height:100%;background:linear-gradient(90deg,#D4A373,#E8783A)}.bar b{width:36px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--ember);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📓</div><div><h1>Bean Diary</h1><p>Ember & Bean Roasters · in CoffeeXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="d" class="on">Diary</button><button data-tab="a">Add a coffee</button><button data-tab="f">Favourites</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const ORI=['Ethiopia','Kenya','Colombia','Brazil','Guatemala','Rwanda'],PRO=['Washed','Natural','Honey'],FLV=['Blueberry','Jasmine','Chocolate','Caramel','Citrus','Stone fruit','Nutty','Floral','Berry','Brown sugar'];
const seed=()=>({log:[
 {o:'Ethiopia',p:'Natural',r:'Ember & Bean',f:['Blueberry','Jasmine'],s:9.2,d:-2},{o:'Kenya',p:'Washed',r:'Hillcrest Roasters',f:['Berry','Citrus'],s:8.8,d:-9},
 {o:'Brazil',p:'Natural',r:'Ember & Bean',f:['Chocolate','Nutty'],s:7.4,d:-15},{o:'Colombia',p:'Washed',r:'Peak Roastery',f:['Caramel','Stone fruit'],s:8.1,d:-22},
 {o:'Rwanda',p:'Washed',r:'Hillcrest Roasters',f:['Floral','Citrus'],s:8.6,d:-30},{o:'Guatemala',p:'Honey',r:'Peak Roastery',f:['Brown sugar','Chocolate'],s:7.8,d:-38}],
 draft:{o:'Ethiopia',p:'Washed',f:['Floral'],s:8.0}});
let C,S={tab:'d',shared:false};
GX.init({gateway:'CoffeeXX',seed}).then(c=>{C=c;paint();});
const avg=(k)=>{const g={};C.data.log.forEach(l=>{(g[l[k]]=g[l[k]]||[]).push(l.s);});return Object.entries(g).map(([n,a])=>[n,a.reduce((x,y)=>x+y,0)/a.length]).sort((a,b)=>b[1]-a[1]);};
function vD(){return C.data.log.slice().sort((a,b)=>b.d-a.d).map(l=>`<div class="bag"><div class="t"><b>${l.o} · ${l.p}</b><span class="sc">${l.s.toFixed(1)}</span></div><small>${GX.esc(l.r)} · ${l.d===0?'today':GX.day(GX.today(l.d),{day:'numeric',month:'short'})}</small><div class="fl">${l.f.map(f=>`<i>${f}</i>`).join('')}</div></div>`).join('');}
function vA(){const d=C.data.draft;return `<div class="lbl">Origin</div><div class="chips">${ORI.map(o=>`<button class="chip ${d.o===o?'on':''}" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="lbl">Process</div><div class="chips">${PRO.map(p=>`<button class="chip ${d.p===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>
  <div class="lbl">What did you taste?</div><div class="chips">${FLV.map(f=>`<button class="chip ${d.f.includes(f)?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
  <div class="lbl">Score</div><div class="score"><button class="st" id="sdn">−</button><b>${d.s.toFixed(1)}</b><button class="st" id="sup">+</button></div>
  <button class="go" id="save">Save to my diary</button>`;}
function vF(){const o=avg('o'),p=avg('p'),top=o[0];return `<div class="card"><h3>By origin</h3>${o.map(([n,s])=>`<div class="bar"><span>${n}</span><div class="b"><i style="width:${s*10}%"></i></div><b>${s.toFixed(1)}</b></div>`).join('')}</div>
  <div class="card"><h3>By process</h3>${p.map(([n,s])=>`<div class="bar"><span>${n}</span><div class="b"><i style="width:${s*10}%"></i></div><b>${s.toFixed(1)}</b></div>`).join('')}</div>
  <div class="legend">You love ${top[0]} most. Next bag: try another ${p[0][0].toLowerCase()} ${top[0]}.</div>
  ${GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my favourite coffee`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='d'?vD():S.tab==='a'?vA():vF();const d=C.data,dr=d.draft,sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{dr.o=b.dataset.o;sv();});v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{dr.p=b.dataset.p;sv();});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=dr.f.indexOf(b.dataset.f);k<0?(dr.f.length<4&&dr.f.push(b.dataset.f)):dr.f.splice(k,1);sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('sup',()=>{dr.s=Math.min(10,Math.round((dr.s+0.2)*10)/10);sv();});on('sdn',()=>{dr.s=Math.max(1,Math.round((dr.s-0.2)*10)/10);sv();});
  on('save',()=>{d.log.push({o:dr.o,p:dr.p,r:'My bag',f:dr.f.slice(),s:dr.s,d:0});S.tab='d';S.shared=false;sv();});
  on('share',()=>{const b=d.log.slice().sort((a,b)=>b.s-a.s)[0];GX.post(`Coffee of the month: a <b>${b.p.toLowerCase()} ${b.o}</b> from ${GX.esc(b.r)}, ${b.f.join(' and ').toLowerCase()}, ${b.s.toFixed(1)}/10. Logged in Bean Diary 📓`,'BEAN DIARY').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
