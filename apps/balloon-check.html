<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balloon Check</title>
<style>
/* Balloon Check, by Bubble Font Foundry (fictional), 2026-11-21. A GENEXXO app for ComicXX.
   Reads a script page ("PANEL n" lines, then "NAME: words" for balloons and "CAPTION: words") and counts words per
   balloon and per panel. Common lettering rules of thumb: a balloon over ~25 words or a panel over ~50 is crowded.
   Guidance, not law: big quiet panels can hold more. */
:root{--bg:#FFFCF3;--card:#fff;--line:rgba(29,27,36,.12);--ink:#1D1B24;--mut:rgba(29,27,36,.55);--sun:#C9851A;--pop:#E11D2E;--ok:#2F7D4A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F7C844,#C9851A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sun)}
textarea{width:100%;min-height:330px;font:13px/1.5 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);resize:vertical}
.sum{display:flex;gap:8px}.sum div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}.sum b{display:block;font-size:22px;font-weight:900}.sum small{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.pn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:9px}.pn.bad{border-color:rgba(225,29,46,.45)}
.pn h3{display:flex;justify-content:space-between;font-size:13px;font-weight:900}.pn h3 span{font-size:12px;font-weight:800}
.bl{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px}.bl+.bl{border-top:1px dashed var(--line)}.bl i{font-style:normal;font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;white-space:nowrap}.bl p{flex:1}
.tip{margin-top:6px;font-size:12px;color:var(--pop);font-weight:700}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sun);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#F1ECDD;color:var(--mut)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}.g b{display:block}.g p{color:var(--mut);font-size:13px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">💬</div><div><h1>Balloon Check</h1><p>Bubble Font Foundry · in ComicXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="c" class="on">Check</button><button data-tab="s">Script</button><button data-tab="t">Tips</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const SAMPLE=`PANEL 1
CAPTION: The allotment, six in the morning.
NAN: You're late. The slugs were up an hour ago.
PANEL 2
ZARA: I brought tea. And biscuits. And I'm sorry about yesterday, I didn't mean what I said about the shed, I was tired and the bus was late and everything just felt like too much and I took it out on you, which wasn't fair at all.
NAN: Biscuits first. Apologies after.
PANEL 3
NAN: Your grandad built that shed in 1974. Every summer he said he'd paint it. Every summer he found something better to do, like sitting in it with a flask of tea and the cricket on the radio, pretending to sort seeds while I did all the digging, and I wouldn't change a single minute of it.
PANEL 4
ZARA: So... we paint it?
NAN: We paint it.`;
const seed=()=>({script:SAMPLE,fixed:0});
let C,S={tab:'c',shared:false};
GX.init({gateway:'ComicXX',seed}).then(c=>{C=c;paint();});
function parse(t){const P=[];let cur=null;t.split('\n').forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^PANEL\s+(\d+)/i);if(m){cur={n:+m[1],b:[]};P.push(cur);return;}const k=l.match(/^([A-Z][A-Z .'’-]{0,20}):\s*(.*)$/);if(k&&cur)cur.b.push({who:k[1],txt:k[2],w:k[2].split(/\s+/).filter(Boolean).length});});return P;}
function vC(){const P=parse(C.data.script),bal=P.flatMap(p=>p.b),crowd=bal.filter(b=>b.w>25).length,busy=P.filter(p=>p.b.reduce((a,b)=>a+b.w,0)>50).length;
  return `<div class="sum"><div><b>${P.length}</b><small>PANELS</small></div><div><b>${bal.length}</b><small>BALLOONS</small></div><div><b style="color:${crowd?'var(--pop)':'var(--ok)'}">${crowd}</b><small>TOO LONG</small></div></div>
  ${P.map(p=>{const tot=p.b.reduce((a,b)=>a+b.w,0),bad=tot>50;return `<div class="pn ${bad?'bad':''}"><h3>Panel ${p.n}<span style="color:${bad?'var(--pop)':'var(--ok)'}">${tot} words${bad?' · crowded':''}</span></h3>
    ${p.b.map(b=>`<div class="bl"><i style="background:${b.w>25?'#FDE8EA':'#E8F1EA'};color:${b.w>25?'var(--pop)':'var(--ok)'}">${b.w}</i><p><b>${GX.esc(b.who)}:</b> ${GX.esc(b.txt.length>90?b.txt.slice(0,90)+'…':b.txt)}</p></div>`).join('')}
    ${bad||p.b.some(b=>b.w>25)?`<div class="tip">✂️ Split the long balloon in two, or move half to a new panel. Let the art carry some of it.</div>`:''}</div>`;}).join('')}
  ${crowd||busy?`<button class="go" id="fix">Try the suggested split</button>`:`${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share: script passes the balloon check`}</button>`:''}`}`;}
function vS(){return `<textarea id="sc" spellcheck="false">${GX.esc(C.data.script)}</textarea><button class="go alt" id="reset">Load the sample page</button><div class="legend">Write “PANEL 1”, then “NAME: words” for each balloon.</div>`;}
function vT(){return [['About 25 words a balloon','More than that and the balloon covers the art and the reader skims.'],['About 50 words a panel','A crowded panel slows everything down. Give big speeches their own panels.'],['Read it aloud','If you run out of breath, the reader will too.'],['Let the picture talk','If the art shows it, the words don’t need to say it.']].map(([b,p])=>`<div class="g"><b>${b}</b><p>${p}</p></div>`).join('')+`<div class="legend">Rules of thumb used by many letterers, not laws.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='c'?vC():S.tab==='s'?vS():vT();const d=C.data;
  const sc=document.getElementById('sc');if(sc)sc.oninput=()=>{d.script=sc.value;S.shared=false;GX.save(d);};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('reset',()=>{d.script=SAMPLE;GX.save(d);paint();});
  on('fix',()=>{d.script=d.script.replace(/ZARA: I brought tea\. And biscuits\. And I'm sorry about yesterday, [^\n]*/,"ZARA: I brought tea. And biscuits.\nZARA: And I'm sorry about yesterday. I was tired, and I took it out on you.")
    .replace(/NAN: Your grandad built that shed in 1974\. [^\n]*/,"NAN: Your grandad built that shed in 1974.\nNAN: Every summer he said he'd paint it. Every summer he sat in it with the cricket on instead.\nNAN: I wouldn't change a minute.");d.fixed++;GX.save(d);paint();});
  on('share',()=>GX.post(`Script page checked: <b>${parse(d.script).flatMap(p=>p.b).length} balloons</b>, none over 25 words. Fewer words, better comics 💬`,'BALLOON CHECK').then(o=>{if(o){S.shared=true;paint();}}));}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
