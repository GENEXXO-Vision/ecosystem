<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Row Counter</title>
<style>
/* Row Counter, by "Purl Labs" (fictional), 2026-11-20. A GENEXXO app for KnitXX.
   A row count and a pattern-repeat count for each project; reminders on rows that matter (decreases, colour
   changes) show as you approach them; progress through the pattern. */
:root{--bg:#FBF7F2;--card:#fff;--line:rgba(42,34,48,.1);--ink:#2A2230;--mut:rgba(42,34,48,.55);--hea:#9333EA;--rose:#BE4BA8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#A855F7,#6B21A8);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--hea)}
.pj{font-size:13px;font-weight:800;color:var(--mut);text-align:center}
.big{text-align:center;padding:10px 0}.big b{display:block;font-size:84px;font-weight:900;line-height:1;color:var(--hea);font-variant-numeric:tabular-nums}.big span{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.08em}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0}
.plus{width:120px;height:120px;border-radius:50%;border:0;background:var(--hea);color:#fff;font:inherit;font-size:54px;font-weight:300;cursor:pointer;box-shadow:0 8px 24px rgba(147,51,234,.3)}
.minus{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:26px;cursor:pointer;color:var(--ink)}
.rep{display:flex;gap:4px;justify-content:center;margin-top:10px}.rep i{width:22px;height:8px;border-radius:99px;background:#EADCF3}.rep i.on{background:var(--rose)}
.alert{margin-top:12px;border-radius:14px;padding:11px 13px;background:#FBEAF6;color:#7A1F62;font-weight:700;font-size:13px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.bar{height:8px;border-radius:99px;background:#EFE6F5;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--hea)}
.pr{display:flex;gap:11px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:8px;cursor:pointer}.pr.on{border-color:var(--hea);box-shadow:0 0 0 1px var(--hea) inset}
.pr .e{font-size:24px}.pr .x{flex:1}.pr .x b{display:block}.pr .x small{color:var(--mut);font-size:12px}
.rm{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px}.rm+.rm{border-top:1px solid var(--line)}.rm span{color:var(--mut)}
.del{font:inherit;background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--hea);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#EEE6F3;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🧶</div><div><h1>Row Counter</h1><p>Purl Labs · in KnitXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="count" class="on">Count</button><button data-tab="proj">Projects</button><button data-tab="rem">Reminders</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const seed=()=>({sel:0,p:[
  {n:'First jumper: back',e:'🧥',row:112,total:184,repLen:8,rem:[{r:120,t:'Start armhole decreases'},{r:150,t:'Shoulder shaping'}]},
  {n:'Fair Isle hat',e:'🧢',row:38,total:80,repLen:12,rem:[{r:42,t:'Change to colour B'},{r:64,t:'Crown decreases'}]},
  {n:'Christmas socks',e:'🧦',row:20,total:150,repLen:4,rem:[{r:60,t:'Heel flap'}]}]});
let C,S={tab:'count',shared:false};
GX.init({gateway:'KnitXX',seed}).then(c=>{C=c;paint();});
const P=()=>C.data.p[C.data.sel];
const next=p=>p.rem.filter(r=>r.r>=p.row).sort((a,b)=>a.r-b.r)[0];
function vCount(){const p=P(),pos=p.repLen?((p.row-1)%p.repLen)+1:0,nx=next(p),pct=Math.min(100,Math.round(100*p.row/p.total));
  return `<div class="pj">${p.e} ${GX.esc(p.n)}</div><div class="big"><b>${p.row}</b><span>ROW · ${pct}% OF THE PATTERN</span></div>
  <div class="ctl"><button class="minus" id="dn" aria-label="Back one row">−</button><button class="plus" id="up" aria-label="Add a row">+</button><button class="minus" id="rs" aria-label="Reset repeat" style="font-size:14px;font-weight:800">↺</button></div>
  ${p.repLen?`<div class="rep">${Array.from({length:p.repLen},(_,i)=>`<i class="${i<pos?'on':''}"></i>`).join('')}</div><div class="legend" style="margin-top:6px">Row ${pos} of the ${p.repLen}-row repeat</div>`:''}
  ${nx?`<div class="alert">${nx.r===p.row?'🔔 This row: ':nx.r-p.row<=3?`🔔 In ${nx.r-p.row} row${nx.r-p.row>1?'s':''}: `:`Next at row ${nx.r}: `}${GX.esc(nx.t)}</div>`:''}`;}
function vProj(){return C.data.p.map((p,i)=>`<div class="pr ${i===C.data.sel?'on':''}" data-sel="${i}"><div class="e">${p.e}</div><div class="x"><b>${GX.esc(p.n)}</b><small>Row ${p.row} of ${p.total}</small><div class="bar"><i style="width:${Math.min(100,Math.round(100*p.row/p.total))}%"></i></div></div></div>`).join('')+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my progress to ${C.gateway}`}</button>`:'');}
function vRem(){const p=P();return `<div class="card"><b>${p.e} ${GX.esc(p.n)}</b>${p.rem.sort((a,b)=>a.r-b.r).map((r,i)=>`<div class="rm"><div>Row ${r.r}<br><span>${GX.esc(r.t)}</span></div>${r.r<p.row?'<span>✓ done</span>':`<button class="del" data-del="${i}">✕</button>`}</div>`).join('')||'<div class="legend">No reminders yet.</div>'}</div>
  <button class="go alt" id="add">+ Remind me in 10 rows</button><div class="legend">Reminders pop up three rows before.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='count'?vCount():S.tab==='proj'?vProj():vRem();const p=P();
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('up',()=>{p.row=Math.min(p.total,p.row+1);GX.save(C.data);paint();});on('dn',()=>{p.row=Math.max(0,p.row-1);GX.save(C.data);paint();});
  on('rs',()=>{if(p.repLen)p.row=p.row-((p.row-1)%p.repLen);GX.save(C.data);paint();});
  on('add',()=>{p.rem.push({r:p.row+10,t:'Check the pattern'});GX.save(C.data);paint();});
  v.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{C.data.sel=+b.dataset.sel;S.shared=false;GX.save(C.data);paint();});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{p.rem.splice(+b.dataset.del,1);GX.save(C.data);paint();});
  on('share',()=>GX.post(`Row ${p.row} of ${p.total} on my <b>${GX.esc(p.n.toLowerCase())}</b>: ${Math.round(100*p.row/p.total)}% there. Counted with Row Counter 🧶`,'ROW COUNTER').then(o=>{if(o){S.shared=true;paint();}}));}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
