<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pointe Log</title>
<style>
/* Pointe Log, by Pointe & Ribbon (fictional), 2026-11-21. A GENEXXO app for BalletXX.
   Hours danced per pair of pointe shoes, a softness score after each session, two-pair rotation and an
   order-again nudge. It never says when to go on pointe or which shoe to wear: that's the teacher and fitter. */
:root{--bg:#FBF6EE;--card:#fff;--line:rgba(42,34,24,.1);--ink:#2A2218;--mut:rgba(42,34,24,.55);--gold:#B8893A;--rose:#D6466E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#E9C77B,#A9822E);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.pair{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.pair .top{display:flex;align-items:center;gap:10px}.pair .top b{flex:1;font-size:15px}.pair .top small{color:var(--mut);font-weight:700;font-size:12px}
.pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(184,137,58,.15);color:#8A6420}.pill.warn{background:rgba(214,70,110,.13);color:var(--rose)}.pill.on{background:#2A2218;color:#fff}
.meter{height:8px;border-radius:9px;background:#F1E8DA;overflow:hidden;margin:10px 0 4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#E9C77B,#D6466E)}
.row{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:700}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{flex:1;height:5px;border-radius:9px;background:#F1E8DA}.dots i.f{background:var(--gold)}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:56px;font:inherit;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:10px 6px;cursor:pointer}.seg button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.go{width:100%;margin-top:14px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--gold);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#EEE6D8;color:var(--mut)}
.note{font-size:12.5px;background:rgba(214,70,110,.08);border:1px solid rgba(214,70,110,.2);border-radius:12px;padding:10px 12px;margin-top:10px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">👣</div><div><h1>Pointe Log</h1><p>Pointe &amp; Ribbon · in BalletXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="p" class="on">My pairs</button><button data-tab="a">Log a class</button><button data-tab="o">Order</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const LIFE=20; /* a rough guide; it varies a lot by dancer, shoe and shank */
const seed=()=>({cur:0,pairs:[
  {name:'Pair A · Studio Pointe, medium shank',start:-34,hrs:16.5,soft:4,done:false},
  {name:'Pair B · Studio Pointe, medium shank',start:-12,hrs:7,soft:2,done:false},
  {name:'Old pair · Studio Pointe, soft shank',start:-80,hrs:22,soft:5,done:true}],sess:{h:1.5,soft:3},ordered:false});
let C,S={tab:'p',shared:false,saved:false};
GX.init({gateway:'BalletXX',seed}).then(c=>{C=c;paint();});
const SOFT=['','Brand new','Settling in','Just right','Getting soft','Too soft'];
function card(p,i){const pct=Math.min(100,100*p.hrs/LIFE),warn=p.soft>=4||p.hrs>=LIFE*.8;
  return `<div class="pair"><div class="top"><b>${GX.esc(p.name)}</b>${p.done?'<span class="pill">Retired</span>':i===C.data.cur?'<span class="pill on">Next on</span>':warn?'<span class="pill warn">Nearly done</span>':'<span class="pill">Resting</span>'}</div>
  <div class="meter"><i style="width:${pct}%"></i></div><div class="row"><span>${p.hrs} hours</span><span>since ${GX.day(GX.today(p.start),{day:'numeric',month:'short'})}</span></div>
  <div class="dots">${[1,2,3,4,5].map(n=>`<i class="${n<=p.soft?'f':''}"></i>`).join('')}</div><div class="row" style="margin-top:4px"><span>${SOFT[p.soft]}</span></div></div>`;}
function vP(){const live=C.data.pairs.map((p,i)=>[p,i]).filter(x=>!x[0].done),old=C.data.pairs.map((p,i)=>[p,i]).filter(x=>x[0].done);
  return live.map(([p,i])=>card(p,i)).join('')+`<div class="legend">Rotating two pairs lets each one dry out between classes, so both last longer.</div>`+old.map(([p,i])=>card(p,i)).join('');}
function vA(){const live=C.data.pairs.map((p,i)=>[p,i]).filter(x=>!x[0].done),s=C.data.sess;
  return `<label>Which pair</label><div class="seg">${live.map(([p,i])=>`<button data-pair="${i}" class="${C.data.cur===i?'on':''}">${p.name.split(' · ')[0]}</button>`).join('')}</div>
  <label>Time on pointe</label><div class="seg">${[0.5,1,1.5,2,3].map(h=>`<button data-h="${h}" class="${s.h===h?'on':''}">${h} h</button>`).join('')}</div>
  <label>How do they feel now?</label><div class="seg">${[1,2,3,4,5].map(n=>`<button data-soft="${n}" class="${s.soft===n?'on':''}">${n}</button>`).join('')}</div><div class="legend" style="text-align:left">${SOFT[s.soft]}</div>
  <button class="go" id="log" ${S.saved?'disabled':''}>${S.saved?'✓ Logged. Swap pairs next class':'Log this class'}</button>
  <div class="note">Any pain in the toes, ankles or shins that lasts after class: stop and tell your teacher. Shoes that are too soft don’t support you.</div>`;}
function vO(){const live=C.data.pairs.filter(p=>!p.done),near=live.filter(p=>p.soft>=4||p.hrs>=LIFE*.8);
  return `<div class="pair"><div class="top"><b>${near.length?near.length+' pair'+(near.length>1?'s':'')+' nearly done':'Both pairs are fine'}</b></div><p style="color:var(--mut);font-size:13px;margin-top:6px">${near.length?'Order the next pair now so you can break it in before the old one goes.':'We’ll nudge you when a pair gets soft.'}</p></div>
  <div class="pair"><div class="top"><b>Studio Pointe, medium shank</b><small>£58</small></div><p style="color:var(--mut);font-size:13px;margin-top:6px">Same as your fitter chose last time. Changing shoe or shank? Book a re-fit first.</p>
  <button class="go" id="order" ${C.data.ordered?'disabled':''}>${C.data.ordered?'✓ Ordered · arrives in 3 days':'Order the same again'}</button></div>
  ${GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my pointe hours'}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='p'?vP():S.tab==='a'?vA():vO();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{d.cur=+b.dataset.pair;S.saved=false;sv();});
  v.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{d.sess.h=+b.dataset.h;S.saved=false;sv();});
  v.querySelectorAll('[data-soft]').forEach(b=>b.onclick=()=>{d.sess.soft=+b.dataset.soft;S.saved=false;sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('log',()=>{const p=d.pairs[d.cur];p.hrs=Math.round((p.hrs+d.sess.h)*10)/10;p.soft=Math.max(p.soft,d.sess.soft);const other=d.pairs.findIndex((q,i)=>!q.done&&i!==d.cur);if(other>=0)d.cur=other;S.saved=true;sv();});
  on('order',()=>{d.ordered=true;sv();});
  on('share',()=>{const h=d.pairs.reduce((a,p)=>a+p.hrs,0);GX.post(`<b>${h} hours on pointe</b> across ${d.pairs.length} pairs, logged in Pointe Log. Rotating two pairs really does help 🩰`,'POINTE LOG').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
