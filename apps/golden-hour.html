<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Hour</title>
<style>
/* Golden Hour, by Halden Cameras (fictional), 2026-11-21. A GENEXXO app for CameraXX.
   Real sun times from the NOAA approximation (declination + equation of time), shown in UK local time.
   Sunrise/sunset at −0.833°, golden hour while the sun is between −4° and +6°, blue hour between −6° and −4°. */
:root{--bg:#120F0C;--card:rgba(255,255,255,.05);--line:rgba(250,240,228,.1);--ink:#FAF0E4;--mut:rgba(250,240,228,.55);--gold:#F5B342;--blue:#7AA2F7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F5B342,#C2410C);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
select{width:100%;font:inherit;font-weight:700;font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#1D1814;color:var(--ink)}
.sky{margin-top:12px;border-radius:18px;padding:16px;background:linear-gradient(180deg,#2A1A3A 0%,#C2410C 70%,#F5B342 100%);position:relative;overflow:hidden}
.sky small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#FFE2B0}.sky h2{font-size:26px;font-weight:900;margin:2px 0}.sky p{font-size:13px;color:#FFE9CC}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.blk small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--mut)}.blk b{font-size:17px;font-weight:900}.blk.g small{color:var(--gold)}.blk.b small{color:var(--blue)}
.tl{position:relative;height:26px;border-radius:9px;background:#0B0A10;margin-top:12px;overflow:hidden}.tl i{position:absolute;top:0;bottom:0}
.tlx{display:flex;justify-content:space-between;color:var(--mut);font-size:10.5px;font-weight:700;margin-top:3px}
.wk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:7px}.wk b{width:74px;font-size:13px}.wk span{flex:1;font-size:12.5px;color:var(--mut)}.wk em{font-style:normal;color:var(--gold);font-weight:800}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:9px 0;cursor:pointer}.seg button.on{background:var(--gold);border-color:var(--gold);color:#1E1305}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--gold);color:#1E1305;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🌅</div><div><h1>Golden Hour</h1><p>Halden Cameras · in CameraXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Today</button><button data-tab="w">This week</button><button data-tab="p">Plan a shoot</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CITIES=[['Glasgow',55.864,-4.252],['Edinburgh',55.953,-3.189],['Newcastle',54.978,-1.618],['Lake District (Keswick)',54.601,-3.134],['Belfast',54.597,-5.930],['Leeds',53.800,-1.549],['Manchester',53.481,-2.243],['Birmingham',52.486,-1.890],['Cardiff',51.481,-3.179],['Bristol',51.455,-2.588],['London',51.507,-0.128],['Brighton',50.822,-0.137]];
const seed=()=>({city:0,plans:[{d:2,when:'Evening',city:3,note:'Buttermere, the lone tree'}],pd:1,pw:'Evening'});
let C,S={tab:'t',saved:false,shared:false};
GX.init({gateway:'CameraXX',seed}).then(c=>{C=c;paint();});
const rad=Math.PI/180;
function sun(off,ci){const c=CITIES[ci],d=GX.today(off),y0=Date.UTC(d.getFullYear(),0,1),n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-y0)/864e5)+1,g=2*Math.PI/365*(n-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const noon=720-4*c[2]-eq,lat=c[1]*rad,base=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const at=h=>{const x=(Math.sin(h*rad)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec));if(x<-1||x>1)return null;const H=Math.acos(x)/rad;return [base+(noon-4*H)*6e4,base+(noon+4*H)*6e4];};
  const r=at(-0.833),g6=at(6),g4=at(-4),b6=at(-6),maxAlt=90-c[1]+dec/rad;
  return {rise:r[0],set:r[1],am:[b6[0],g4[0],g6?g6[0]:base+noon*6e4],pm:[g6?g6[1]:base+noon*6e4,g4[1],b6[1]],len:(r[1]-r[0])/36e5,maxAlt,base};}
const T=ms=>new Date(ms).toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'});
const sel=()=>`<select id="city">${CITIES.map((c,i)=>`<option value="${i}" ${C.data.city===i?'selected':''}>${c[0]}</option>`).join('')}</select>`;
function vT(){const s=sun(0,C.data.city),pc=ms=>100*(ms-s.base)/864e5,now=Date.now(),next=now<s.am[1]?['Morning golden hour starts',s.am[1]]:now<s.am[2]?['Golden hour now · ends',s.am[2]]:now<s.pm[0]?['Evening golden hour starts',s.pm[0]]:now<s.pm[1]?['Golden hour now · ends',s.pm[1]]:['Tomorrow’s golden hour starts',sun(1,C.data.city).am[1]];
  const mins=Math.max(0,Math.round((next[1]-now)/6e4));
  return sel()+`<div class="sky"><small>${next[0].toUpperCase()}</small><h2>${T(next[1])}</h2><p>${next[0].startsWith('Golden hour now')?'Get outside: '+(mins>=60?Math.floor(mins/60)+' h '+mins%60+' min':mins+' min')+' of good light left':(mins>=60?Math.floor(mins/60)+' h '+mins%60+' min':mins+' min')+' from now'} · ${Math.round(s.len*10)/10} hours of daylight · sun peaks at ${Math.round(s.maxAlt)}°</p></div>
  <div class="tl"><i style="left:${pc(s.am[0])}%;width:${pc(s.am[1])-pc(s.am[0])}%;background:#3B4FA0"></i><i style="left:${pc(s.am[1])}%;width:${pc(s.am[2])-pc(s.am[1])}%;background:#F5B342"></i><i style="left:${pc(s.am[2])}%;width:${pc(s.pm[0])-pc(s.am[2])}%;background:#8FB3E8"></i><i style="left:${pc(s.pm[0])}%;width:${pc(s.pm[1])-pc(s.pm[0])}%;background:#F5B342"></i><i style="left:${pc(s.pm[1])}%;width:${pc(s.pm[2])-pc(s.pm[1])}%;background:#3B4FA0"></i></div>
  <div class="tlx"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
  <div class="blocks"><div class="blk b"><small>MORNING BLUE HOUR</small><b>${T(s.am[0])}–${T(s.am[1])}</b></div><div class="blk g"><small>MORNING GOLDEN HOUR</small><b>${T(s.am[1])}–${T(s.am[2])}</b></div>
  <div class="blk"><small>SUNRISE</small><b>${T(s.rise)}</b></div><div class="blk"><small>SUNSET</small><b>${T(s.set)}</b></div>
  <div class="blk g"><small>EVENING GOLDEN HOUR</small><b>${T(s.pm[0])}–${T(s.pm[1])}</b></div><div class="blk b"><small>EVENING BLUE HOUR</small><b>${T(s.pm[1])}–${T(s.pm[2])}</b></div></div>`;}
function vW(){return sel()+Array.from({length:7},(_,o)=>{const s=sun(o,C.data.city);return `<div class="wk"><b>${o===0?'Today':GX.day(GX.today(o),{weekday:'short',day:'numeric'})}</b><span>Rise ${T(s.rise)} · Set ${T(s.set)}</span><em>${T(s.pm[0])}</em></div>`;}).join('')+`<div class="legend">Gold = evening golden hour starts. Winter sun stays low, so the light is good for longer.</div>`;}
function vP(){const d=C.data,s=sun(d.pd,d.city),w=d.pw==='Morning'?[s.am[1],s.am[2]]:[s.pm[0],s.pm[1]];
  return sel()+`<label>Day</label><div class="seg">${[0,1,2,3,4,5,6].map(o=>`<button data-pd="${o}" class="${d.pd===o?'on':''}">${o===0?'Today':GX.day(GX.today(o),{weekday:'short'})}</button>`).join('')}</div>
  <div class="seg">${['Morning','Evening'].map(x=>`<button data-pw="${x}" class="${d.pw===x?'on':''}">${x}</button>`).join('')}</div>
  <div class="blk g" style="margin-top:10px"><small>${d.pw.toUpperCase()} GOLDEN HOUR · ${GX.day(GX.today(d.pd),{weekday:'long',day:'numeric',month:'short'}).toUpperCase()}</small><b>${T(w[0])}–${T(w[1])}</b><p style="color:var(--mut);font-size:12.5px">Be set up by ${T(w[0]-20*6e4)}.</p></div>
  <button class="go" id="plan" ${S.saved?'disabled':''}>${S.saved?'✓ Shoot planned':'Plan this shoot'}</button>
  <label>Planned</label>${d.plans.map(p=>{const q=sun(p.d,p.city),x=p.when==='Morning'?q.am[1]:q.pm[0];return `<div class="wk"><b>${p.d===0?'Today':GX.day(GX.today(p.d),{weekday:'short',day:'numeric'})}</b><span>${GX.esc(CITIES[p.city][0])}${p.note?' · '+GX.esc(p.note):''}</span><em>${T(x)}</em></div>`;}).join('')}
  ${GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my next shoot'}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='t'?vT():S.tab==='w'?vW():vP();const sv=()=>{S.saved=false;GX.save(d);paint();};
  const cs=document.getElementById('city');if(cs)cs.onchange=()=>{d.city=+cs.value;sv();};
  v.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{d.pd=+b.dataset.pd;sv();});
  v.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{d.pw=b.dataset.pw;sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('plan',()=>{d.plans.push({d:d.pd,when:d.pw,city:d.city,note:''});d.plans.sort((a,b)=>a.d-b.d);GX.save(d);S.saved=true;paint();});
  on('share',()=>{const p=d.plans[0],q=sun(p.d,p.city),x=p.when==='Morning'?q.am[1]:q.pm[0];GX.post(`Golden hour shoot: <b>${GX.esc(CITIES[p.city][0])}</b>, ${GX.day(GX.today(p.d),{weekday:'long'})} from ${T(x)}. Who’s coming? 🌅`,'GOLDEN HOUR').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
