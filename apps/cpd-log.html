<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPD Log</title>
<style>
/* CPD Log, by "Ward Round Press" (fictional), 2026-11-16. A GENEXXO app for DoctorXX.
   A personal log of CPD activity with credits (1 credit = 1 hour, as most UK medical colleges count it), split into
   clinical, non-clinical and personal. The yearly target defaults to 50, the figure many UK colleges use; the app
   says to check your own college. The appraisal year runs from 1 April. */
:root{--bg:#071A1F;--card:rgba(255,255,255,.05);--line:rgba(232,243,241,.1);--ink:#E8F3F1;--mut:rgba(232,243,241,.55);--teal:#19B3A6;--coral:#FF6B6B;--ind:#7A6CF0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FF7B7B,#C23B4E);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--coral)}
.ring{display:flex;align-items:center;gap:16px;background:linear-gradient(150deg,#0E3B41,#0A2A30);border:1px solid rgba(25,179,166,.25);border-radius:18px;padding:16px}
.ring .t b{font-size:30px;font-weight:900;display:block;line-height:1.1}.ring .t small{color:var(--mut);font-weight:700;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cat{margin:8px 0}.cat .l{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:4px}.cat .bar{height:9px;border-radius:9px;background:rgba(232,243,241,.08);overflow:hidden}.cat .bar i{display:block;height:100%;border-radius:9px}
.e{display:flex;gap:10px;padding:10px 0}.e+.e{border-top:1px solid var(--line)}
.e .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.e .x{flex:1}.e .x b{font-size:14px}.e .x small{display:block;color:var(--mut);font-size:12px}.e .x p{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:3px}
.e .cr{font-weight:900;color:var(--teal);white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 4px;cursor:pointer}.seg button.on{border-color:var(--coral);background:rgba(255,107,107,.14)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}.opt.on{border-color:var(--coral);background:rgba(255,107,107,.12)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:4px}
.step{display:flex;align-items:center;gap:8px}.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}.step span{min-width:40px;text-align:center;font-weight:900;font-size:16px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--coral);color:#2A0A0F;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📒</div><div><h1>CPD Log</h1><p>Ward Round Press · in DoctorXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="year" class="on">This year</button><button data-tab="log">Log</button><button data-tab="add">Add</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CAT={clinical:{name:'Clinical',ic:'🩺',c:'#19B3A6'},non:{name:'Non-clinical',ic:'🧭',c:'#7A6CF0'},personal:{name:'Personal',ic:'🌱',c:'#FF6B6B'}};
const PRESETS={clinical:['Regional cardiology update','Grand round: sepsis pathways','Online module: acute kidney injury','Journal club'],non:['Teaching medical students','Leadership course, day 1','Audit presentation','Appraiser training'],personal:['Reading: a medical memoir','Wellbeing workshop','Peer support group','Language course']};
const seed=()=>({target:50,items:[
  {off:-210,cat:'clinical',t:'Regional cardiology update',cr:6,ref:'New heart failure pathway: changed how I start treatment on the ward.'},
  {off:-180,cat:'non',t:'Teaching medical students',cr:4,ref:'Bedside teaching works better in pairs than fours.'},
  {off:-150,cat:'clinical',t:'Online module: acute kidney injury',cr:3,ref:'Refreshed fluid assessment; shared with my team.'},
  {off:-120,cat:'personal',t:'Wellbeing workshop',cr:2,ref:'Booked my leave properly for the first time in a year.'},
  {off:-96,cat:'non',t:'Audit presentation',cr:3,ref:'Re-audit planned for spring.'},
  {off:-70,cat:'clinical',t:'Grand round: sepsis pathways',cr:1,ref:'Earlier escalation on nights.'},
  {off:-41,cat:'clinical',t:'Simulation day: acute medicine',cr:7,ref:'Practised a deteriorating patient scenario with the team.'},
  {off:-22,cat:'non',t:'Leadership course, day 1',cr:6,ref:'Started weekly 15-minute team huddles.'},
  {off:-6,cat:'clinical',t:'Journal club',cr:1,ref:'Discussed a trial on early mobilisation.'}]});
let C,S={tab:'year',shared:false,f:{cat:'clinical',p:0,cr:2}};
GX.init({gateway:'DoctorXX',seed}).then(c=>{C=c;paint();});
const total=()=>C.data.items.reduce((a,x)=>a+x.cr,0);
const byCat=k=>C.data.items.filter(x=>x.cat===k).reduce((a,x)=>a+x.cr,0);
function ring(p){const r=42,c=2*Math.PI*r;return `<svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="${r}" stroke="rgba(232,243,241,.1)" stroke-width="10" fill="none"/><circle cx="52" cy="52" r="${r}" stroke="#FF6B6B" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 52 52)"/><text x="52" y="58" text-anchor="middle" font-size="19" font-weight="900" fill="#E8F3F1">${Math.round(p*100)}%</text></svg>`;}
function vYear(){const t=total(),tg=C.data.target,left=Math.max(0,tg-t);
  return `<div class="ring">${ring(t/tg)}<div class="t"><b>${t} of ${tg}</b><small>credits this appraisal year</small><br><small>${left?`${left} to go`:'Target reached 🎉'}</small></div></div>
  <div class="card"><h3>By category</h3>${Object.keys(CAT).map(k=>{const v=byCat(k);return `<div class="cat"><div class="l"><span>${CAT[k].ic} ${CAT[k].name}</span><span>${v}</span></div><div class="bar"><i style="width:${v/Math.max(1,t)*100}%;background:${CAT[k].c}"></i></div></div>`;}).join('')}</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my progress to ${C.gateway}`}</button>`:''}
  <div class="legend">Many UK colleges ask for 50 credits a year. Check your own college and appraisal guidance.</div>`;}
function vLog(){return `<div class="card"><h3>${C.data.items.length} activities</h3>${C.data.items.slice().reverse().map(x=>`<div class="e"><div class="ic" style="background:${CAT[x.cat].c}22">${CAT[x.cat].ic}</div><div class="x"><b>${GX.esc(x.t)}</b><small>${GX.day(GX.today(x.off))} · ${CAT[x.cat].name}</small>${x.ref?`<p>“${GX.esc(x.ref)}”</p>`:''}</div><div class="cr">+${x.cr}</div></div>`).join('')}</div>`;}
function vAdd(){const f=S.f;
  return `<div class="seg">${Object.keys(CAT).map(k=>`<button data-cat="${k}" class="${k===f.cat?'on':''}">${CAT[k].ic} ${CAT[k].name}</button>`).join('')}</div>
  ${PRESETS[f.cat].map((p,i)=>`<button class="opt ${i===f.p?'on':''}" data-p="${i}">${p}</button>`).join('')}
  <div class="row"><div><b>Credits</b><div style="color:var(--mut);font-size:12px">One credit per hour</div></div><div class="step"><button data-cr="-1">–</button><span>${f.cr}</span><button data-cr="1">+</button></div></div>
  <button class="go" id="add">Log activity</button><div class="legend">You can add a reflection from your Profile later.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='year'?vYear():S.tab==='log'?vLog():vAdd();
  v.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{S.f.cat=e.dataset.cat;S.f.p=0;paint();});
  v.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{S.f.p=+e.dataset.p;paint();});
  v.querySelectorAll('[data-cr]').forEach(e=>e.onclick=()=>{S.f.cr=Math.min(20,Math.max(1,S.f.cr+(+e.dataset.cr)));paint();});
  const a=document.getElementById('add');if(a)a.onclick=()=>{C.data.items.push({off:0,cat:S.f.cat,t:PRESETS[S.f.cat][S.f.p],cr:S.f.cr,ref:''});GX.save(C.data);S.tab='year';S.shared=false;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{
    GX.post(`<b>${total()} of ${C.data.target}</b> CPD credits logged this appraisal year. Steady progress in CPD Log 📒`,'CPD LOG').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
