<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cargo Bike Check</title>
<style>
/* Cargo Bike Check, by Pedalfreight Cargo Bikes (fictional), 2026-11-24. A GENEXXO app for CourierXX.
   A two-minute pre-ride check, a service log and when the next service is due (every 1,000 km here, illustrative).
   If anything fails the check, don't ride: see a mechanic. */
:root{--bg:#F7F8F5;--card:#fff;--line:rgba(22,32,26,.1);--ink:#16201A;--mut:rgba(22,32,26,.55);--acc:#475569;--g:#15803D;--vis:#EA580C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#64748B,#1E293B);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--vis)}
.ck{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px;cursor:pointer}.ck .e{font-size:22px}.ck .x{flex:1}.ck b{display:block;font-size:14px}.ck small{color:var(--mut)}
.box2{width:26px;height:26px;border-radius:8px;border:2px solid rgba(22,32,26,.2);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}.ck.on{border-color:rgba(21,128,61,.4);background:#F2FAF4}.ck.on .box2{background:var(--g);border-color:var(--g)}
.prog{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.prog b{font-size:22px;font-weight:900}.prog small{color:var(--mut);font-weight:700}
.ring{width:56px;height:56px}
.hero{background:linear-gradient(135deg,#1E293B,#475569);color:#fff;border-radius:18px;padding:16px}.hero small{opacity:.7;font-weight:700}.hero b{display:block;font-size:30px;font-weight:900}.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#FB923C}
.it{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}.it .x{flex:1}.it b{display:block;font-size:13.5px}.it small{color:var(--mut)}.it span{font-weight:800;color:var(--mut);font-size:12.5px}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btns button{font:inherit;font-weight:800;font-size:12.5px;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--vis);color:#fff;cursor:pointer}.go:disabled{background:rgba(22,32,26,.08);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🔧</div><div><h1>Cargo Bike Check</h1><p>Pedalfreight Cargo Bikes · in CourierXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="c" class="on">Today’s check</button><button data-tab="s">Service</button><button data-tab="l">Log</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const ITEMS=[['🛑','Brakes','Both levers firm, pads not worn to the line'],['🛞','Tyres','Pressure good, no cuts or glass'],['💡','Lights','Front and rear, charged and bright'],['🔋','Battery','Charged, locked in, no damage'],['📦','Load box','Lid shuts, lock works, nothing loose'],['⛓️','Chain','Clean, oiled, not slipping']];
const EVERY=1000;
const seed=()=>({ticks:[0,1,2],km:6840,lastService:6120,checks:[GX.iso(-1),GX.iso(-2),GX.iso(-3),GX.iso(-4),GX.iso(-6),GX.iso(-7),GX.iso(-8)],log:[[GX.iso(-12),'Full service','New brake pads front and rear',6120],[GX.iso(-41),'Puncture','Rear inner tube replaced',5480],[GX.iso(-63),'Full service','Chain and cassette replaced',5110]],checkedToday:false});
let C,S={tab:'c',shared:false};
GX.init({gateway:'CourierXX',seed}).then(c=>{C=c;paint();});
function vC(){const d=C.data,n=d.ticks.length,f=n/ITEMS.length,c=2*Math.PI*22;
  return `<div class="prog"><div><small>${d.checkedToday?'Checked today ✓':'Before you ride'}</small><br><b>${n} of ${ITEMS.length}</b></div><svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(22,32,26,.08)" stroke-width="7"/><circle cx="28" cy="28" r="22" fill="none" stroke="${f===1?'#15803D':'#EA580C'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 28 28)"/></svg></div>`+
  ITEMS.map((it,i)=>`<div class="ck ${d.ticks.includes(i)?'on':''}" data-i="${i}"><span class="e">${it[0]}</span><div class="x"><b>${it[1]}</b><small>${it[2]}</small></div><span class="box2">${d.ticks.includes(i)?'✓':''}</span></div>`).join('')+
  `<button class="go" id="done" ${n<ITEMS.length||d.checkedToday?'disabled':''}>${d.checkedToday?'✓ Logged for today':'All good: log my check'}</button><div class="legend">Anything not right? Don’t ride. See a mechanic first.</div>`;}
function vS(){const d=C.data,since=d.km-d.lastService,left=Math.max(0,EVERY-since);
  return `<div class="hero"><small>Next service in</small><b>${left} km</b><div class="bar"><i style="width:${Math.min(100,since/EVERY*100)}%"></i></div><small>${since} km since the last one · ${d.km.toLocaleString('en-GB')} km in total</small></div>
  <div class="lbl">Add today’s riding</div><div class="btns">${[20,40,60].map(k=>`<button data-km="${k}">+${k} km</button>`).join('')}</div>
  <button class="go" id="svc" style="background:var(--acc)">Log a full service</button>`+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my mileage'}</button>`:'');}
function vL(){const d=C.data,days=[...Array(14)].map((_,i)=>GX.iso(i-13)),done=days.filter(x=>d.checks.includes(x)).length;
  return `<div class="it"><div class="x"><b>Daily checks, last 14 days</b><small>${done} of 14 days</small></div><span>${'●'.repeat(Math.min(done,14))}</span></div><div class="lbl">Services and repairs</div>`+
  d.log.map(l=>`<div class="it"><div class="x"><b>${GX.esc(l[1])}</b><small>${GX.esc(l[2])}</small></div><span>${GX.day(l[0],{day:'numeric',month:'short'})}<br>${l[3].toLocaleString('en-GB')} km</span></div>`).join('');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='c'?vC():S.tab==='s'?vS():vL();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,x=d.ticks.indexOf(i);x<0?d.ticks.push(i):d.ticks.splice(x,1);sv();});
  const dn=document.getElementById('done');if(dn)dn.onclick=()=>{d.checkedToday=true;if(!d.checks.includes(GX.iso(0)))d.checks.unshift(GX.iso(0));sv();};
  v.querySelectorAll('[data-km]').forEach(b=>b.onclick=()=>{d.km+=+b.dataset.km;sv();});
  const s=document.getElementById('svc');if(s)s.onclick=()=>{d.lastService=d.km;d.log.unshift([GX.iso(0),'Full service','Logged in the app',d.km]);S.tab='l';sv();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`${d.km.toLocaleString('en-GB')} km on the cargo bike and still going strong. Checked every morning, serviced every thousand 🚲`,'BIKE CHECK').then(o=>{if(o){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
