<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logbook Pro</title>
<style>
/* Logbook Pro, by "Bosun Software" (fictional), 2026-10-09. A GENEXXO app. A paper logbook's calm, light look —
   deliberately unlike the dark apps, because each third party brings its own design. */
:root{--bg:#F4F1EA;--card:#FFFDF8;--line:rgba(30,40,30,.12);--ink:#1F2A22;--mut:rgba(31,42,34,.55);--acc:#16A34A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Georgia,"Times New Roman",serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px}
.hd h1{font-size:20px;font-weight:700}.hd p{font-size:11.5px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:2px solid var(--ink)}
.tabs button{font:600 14px Georgia,serif;color:var(--mut);background:none;border:0;padding:8px 10px;cursor:pointer}
.tabs button.on{color:var(--ink);background:var(--card);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
label{display:block;font:800 10.5px -apple-system,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 5px}label:first-child{margin-top:0}
input,select{width:100%;font:16px Georgia,serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;-webkit-appearance:none;appearance:none}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font:700 12.5px -apple-system,sans-serif;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut);cursor:pointer;background:#fff}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(22,163,74,.08)}
.go{width:100%;font:800 15px -apple-system,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;margin-top:14px}
.ghost{background:transparent;border:1.5px solid var(--acc);color:var(--acc)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tot div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tot b{display:block;font-size:22px}.tot span{font:800 10px -apple-system,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.p{padding:11px 0;border-bottom:1px dashed var(--line)}.p:last-child{border:0}
.p .t{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.p .t span{font:700 12px -apple-system,sans-serif;color:var(--mut)}
.p .m{font:12px -apple-system,sans-serif;color:var(--mut);margin-top:2px}
.chk{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}.chk:last-child{border:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chk.done .box{background:var(--acc);border-color:var(--acc);color:#fff}.chk.done b{text-decoration:line-through;color:var(--mut)}
.chk b{font-size:14.5px}.chk span{margin-left:auto;font:700 11px -apple-system,sans-serif;color:var(--mut);white-space:nowrap}
.due{color:#B45309!important}
</style></head><body>
<div class="hd"><div class="logo">📒</div><div><h1>Logbook Pro</h1><p class="sans">by Bosun Software · <i>Saltwater</i>, 34ft sloop</p></div></div>
<div class="tabs" id="tabs"><button data-tab="log" class="on">Log entry</button><button data-tab="passages">Passages</button><button data-tab="boat">Boat</button></div>
<main id="v"></main>
<script src="gx-sdk.js"></script>
<script>
const COND = ['Calm','F3 · pleasant','F4–5 · lively','F6+ · reefed','Fog'];
let C, S = { tab:'log', d:{cond:'F3 · pleasant', crew:2}, last:null, shared:false };
GX.init({gateway:'SailXX', seed:()=>({
  pass:[{from:'Cowes',to:'Poole',nm:24,hrs:4.5,crew:3,cond:'F4–5 · lively',d:GX.iso(-3)},{from:'Poole',to:'Weymouth',nm:22,hrs:4,crew:2,cond:'F3 · pleasant',d:GX.iso(-10)},
        {from:'Weymouth',to:'Dartmouth',nm:46,hrs:8.5,crew:3,cond:'F4–5 · lively',d:GX.iso(-12)},{from:'Hamble',to:'Cowes',nm:8,hrs:1.5,crew:2,cond:'Calm',d:GX.iso(-19)}],
  jobs:[{n:'Engine oil & filter',due:GX.iso(5),done:false},{n:'Check rig & split pins',due:GX.iso(-1),done:false},{n:'Antifoul',due:GX.iso(40),done:false},
        {n:'Service winches',due:GX.iso(12),done:false},{n:'Flares in date',due:GX.iso(-30),done:true},{n:'Liferaft service',due:GX.iso(90),done:false}] }) })
  .then(c=>{ C=c; paint(); });

function vLog(){ const d=S.d;
  const done = S.last ? `<div class="card" style="border-color:var(--acc)"><b style="font-size:16px">✓ Logged ${GX.esc(S.last.from)} → ${GX.esc(S.last.to)}</b>
      <div class="sans" style="font-size:12px;color:var(--mut)">${S.last.nm} nm in ${S.last.hrs} h · ${S.last.cond}</div>
      ${GX.can('feed')?`<button class="go ghost" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share to the ${C.gateway} feed`}</button>`:''}</div>` : '';
  return done + `<div class="card"><div class="row2"><div><label>From</label><input id="from" placeholder="Cowes" value="${GX.esc(d.from||'')}"></div><div><label>To</label><input id="to" placeholder="Cherbourg" value="${GX.esc(d.to||'')}"></div></div>
    <div class="row3"><div><label>Distance nm</label><input id="nm" type="number" inputmode="decimal" placeholder="60" value="${d.nm||''}"></div><div><label>Hours</label><input id="hrs" type="number" inputmode="decimal" placeholder="9" value="${d.hrs||''}"></div>
    <div><label>Crew</label><select id="crew">${[1,2,3,4,5,6].map(n=>`<option ${n==d.crew?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <label>Conditions</label><div class="chips">${COND.map(c=>`<div class="chip ${c===d.cond?'on':''}" data-c="${c}">${c}</div>`).join('')}</div>
    <button class="go" id="save">Write it in the log</button></div>`; }
function vPass(){ const p=C.data.pass, season=p.reduce((a,x)=>a+(+x.nm||0),0), hrs=p.reduce((a,x)=>a+(+x.hrs||0),0);
  return `<div class="tot"><div><b>${season}</b><span>nm season</span></div><div><b>${p.length}</b><span>Passages</span></div><div><b>${Math.round(hrs)}</b><span>Hours</span></div></div>
    <div class="card">${p.map(x=>`<div class="p"><div class="t">${GX.esc(x.from)} → ${GX.esc(x.to)}<span>${x.nm} nm</span></div><div class="m">${GX.day(x.d)} · ${x.hrs} h · crew ${x.crew} · ${x.cond}</div></div>`).join('')}</div>`; }
function vBoat(){ const j=C.data.jobs; const due=j.filter(x=>!x.done&&x.due<=GX.iso(7)).length;
  return `<div class="card sans" style="font-size:13px"><b>Engine</b> 1,284 h · next service at 1,300 h${due?` · <span class="due" style="font-weight:800">${due} job${due>1?'s':''} due this week</span>`:''}</div>
    <div class="card">${j.map((x,i)=>{ const late=!x.done&&x.due<GX.iso(0), soon=!x.done&&x.due<=GX.iso(7);
      return `<div class="chk ${x.done?'done':''}" data-j="${i}"><div class="box">${x.done?'✓':''}</div><b>${x.n}</b><span class="${soon?'due':''}">${x.done?'Done':late?'Overdue':'Due '+GX.day(x.due,{day:'numeric',month:'short'})}</span></div>`; }).join('')}</div>`; }
function paint(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'); v.innerHTML=S.tab==='log'?vLog():S.tab==='passages'?vPass():vBoat();
  const keep=()=>{ ['from','to','nm','hrs','crew'].forEach(k=>{ const e=document.getElementById(k); if(e) S.d[k]=e.value; }); };
  v.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{keep();S.d.cond=e.dataset.c;paint();});
  v.querySelectorAll('[data-j]').forEach(e=>e.onclick=()=>{const x=C.data.jobs[+e.dataset.j]; x.done=!x.done; GX.save(C.data); paint();});
  const sv=document.getElementById('save'); if(sv) sv.onclick=()=>{ keep(); const d=S.d; if(!d.from||!d.to){ document.getElementById(d.from?'to':'from').focus(); return; }
    S.last={from:d.from.trim(),to:d.to.trim(),nm:+d.nm||0,hrs:+d.hrs||0,crew:+d.crew||1,cond:d.cond,d:GX.iso(0)}; C.data.pass.unshift(S.last); GX.save(C.data); S.d={cond:'F3 · pleasant',crew:2}; S.shared=false; paint(); };
  const sh=document.getElementById('share'); if(sh) sh.onclick=()=>{ const l=S.last;
    GX.post(`Logged a passage: <b>${GX.esc(l.from)} → ${GX.esc(l.to)}</b>, ${l.nm} nm in ${l.hrs} hours. ${l.cond}.`, 'PASSAGE').then(ok=>{ if(ok){S.shared=true;paint();} }); }; }
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; paint();};
</script></body></html>
