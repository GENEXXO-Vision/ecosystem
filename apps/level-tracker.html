<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Level Tracker</title>
<style>
/* Level Tracker, by "Nivel Analytics" (fictional), 2026-11-14. A GENEXXO app for PadelXX.
   A padel level on the 1.0–7.0 scale, moved by each result like an Elo rating: beat a stronger pair and you
   climb more; lose to a weaker one and you drop more. expected = 1/(1+e^(-2(mine-theirs))), change = 0.15 × (result − expected). */
:root{--bg:#08162E;--card:#0F2347;--line:rgba(198,244,50,.15);--ink:#EEF3FF;--mut:rgba(238,243,255,.58);--lime:#C6F432;--blue:#2F8CFF;--teal:#14B8A6;--red:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#14B8A6,#0B6B63);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--teal)}
.lv{background:linear-gradient(135deg,rgba(20,184,166,.20),rgba(47,140,255,.14));border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.lv .n{font-size:58px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.lv .d{font-weight:900;font-size:13px;margin-top:6px}
.lv small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-top:4px}
.scale{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,#2F8CFF,#14B8A6,#C6F432);margin:14px 6px 4px}
.scale i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--bg);transform:translateX(-50%)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:800;padding:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.m{display:flex;align-items:center;gap:10px;padding:10px 0}.m+.m{border-top:1px solid var(--line)}
.r{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0}.r.w{background:rgba(198,244,50,.16);color:var(--lime)}.r.l{background:rgba(255,107,107,.15);color:var(--red)}
.m .x{flex:1}.m .x b{font-size:14px}.m .x small{display:block;color:var(--mut);font-size:12px}.m .dl{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.up{color:var(--lime)}.dn{color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.row b{font-size:14.5px}.row small{display:block;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:8px}.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}.step span{min-width:40px;text-align:center;font-weight:900;font-size:16px}
.tog{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.tog span{font-size:12.5px;font-weight:800;padding:7px 14px;color:var(--mut);cursor:pointer}.tog span.on{background:rgba(198,244,50,.15);color:var(--lime)}
input{font:inherit;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;width:100%;margin-bottom:8px}
.prev{text-align:center;font-weight:800;margin-top:6px;color:var(--mut);font-size:13px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--teal);color:#08162E;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📈</div><div><h1>Level Tracker</h1><p>Nivel Analytics · in PadelXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="level" class="on">My level</button><button data-tab="log">Log a match</button><button data-tab="hist">History</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const exp_=(a,b)=>1/(1+Math.exp(-2*(a-b))), K=.15;
const seed=()=>{const r=GX.rng('level-tracker'),ps=['Gus','Kim','Lola','Pete','Vic','Sam'],sc=['6–4 6–3','6–3 7–5','4–6 6–4 6–2','6–2 6–4','7–6 6–4','3–6 6–3 6–4'],ls=['4–6 3–6','6–7 4–6','6–4 3–6 4–6','2–6 5–7'];
  let lv=2.8;const m=[];for(let i=0;i<18;i++){const opp=Math.round((lv+(r()-.45)*.9)*10)/10,p=exp_(lv,opp),win=r()<p+.12?1:0,d=K*(win-p);lv+=d;
    m.push({off:-(18-i)*5,partner:ps[i%ps.length],opp,win,score:win?sc[i%sc.length]:ls[i%ls.length],d:Math.round(d*100)/100});}
  return {start:2.8,matches:m};};
let C,S={tab:'level',shared:false,f:{partner:'',opp:3.5,win:1}};
GX.init({gateway:'PadelXX',seed}).then(c=>{C=c;paint();});
const level=()=>Math.round((C.data.start+C.data.matches.reduce((a,m)=>a+m.d,0))*100)/100;
const levelAt=n=>C.data.start+C.data.matches.slice(0,n).reduce((a,m)=>a+m.d,0);
function trend(){const ms=C.data.matches,pts=[C.data.start].concat(ms.map((_,i)=>levelAt(i+1)));
  const W=320,H=90,mn=Math.min(...pts)-.1,mx=Math.max(...pts)+.1,x=i=>i/(pts.length-1)*W,y=v=>H-(v-mn)/(mx-mn)*H;
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="-4 -6 ${W+8} ${H+12}" width="100%" height="104"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2F8CFF"/><stop offset="1" stop-color="#C6F432"/></linearGradient></defs><path d="${d}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="5" fill="#C6F432"/></svg>`;}
function vLevel(){const L=level(),last5=C.data.matches.slice(-5).reduce((a,m)=>a+m.d,0),best=Math.max(...C.data.matches.map((_,i)=>levelAt(i+1)));
  return `<div class="lv"><div class="n">${L.toFixed(2)}</div><div class="d ${last5>=0?'up':'dn'}">${last5>=0?'▲':'▼'} ${Math.abs(last5).toFixed(2)} over your last 5 matches</div>
    <div class="scale"><i style="left:${(L-1)/6*100}%"></i></div><div class="ticks"><span>1.0</span><span>2.0</span><span>3.0</span><span>4.0</span><span>5.0</span><span>6.0</span><span>7.0</span></div>
    <small>${L>=best-1e-9?'★ Your best ever level':`Best so far ${best.toFixed(2)}`} · ${C.data.matches.length} matches</small></div>
  <div class="card"><h3>Season trend</h3>${trend()}</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my level to ${C.gateway}`}</button>`:''}`;}
function vLog(){const f=S.f,L=level(),p=exp_(L,f.opp),d=K*(f.win-p);
  return `<input id="partner" placeholder="Partner (optional)" value="${GX.esc(f.partner)}">
  <div class="row"><div><b>Opponents’ level</b><small>Average of the other pair</small></div><div class="step"><button data-o="-0.1">–</button><span>${f.opp.toFixed(1)}</span><button data-o="0.1">+</button></div></div>
  <div class="row"><div><b>Result</b></div><div class="tog"><span data-w="1" class="${f.win?'on':''}">Won</span><span data-w="0" class="${f.win?'':'on'}">Lost</span></div></div>
  <div class="prev">This would move you <b class="${d>=0?'up':'dn'}">${d>=0?'+':''}${d.toFixed(2)}</b> to ${(L+d).toFixed(2)}</div>
  <button class="go" id="add">Log match</button><div class="legend">Beat a stronger pair and you climb further.</div>`;}
function vHist(){return `<div class="card">${C.data.matches.slice().reverse().map(m=>`<div class="m"><div class="r ${m.win?'w':'l'}">${m.win?'W':'L'}</div><div class="x"><b>with ${GX.esc(m.partner||'—')} · vs ${m.opp.toFixed(1)}</b><small>${GX.esc(m.score)} · ${GX.day(GX.today(m.off))}</small></div><div class="dl ${m.d>=0?'up':'dn'}">${m.d>=0?'+':''}${m.d.toFixed(2)}</div></div>`).join('')}</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='level'?vLevel():S.tab==='log'?vLog():vHist();
  const keep=()=>{const e=document.getElementById('partner');if(e)S.f.partner=e.value;};
  v.querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{keep();S.f.opp=Math.min(7,Math.max(1,Math.round((S.f.opp+(+e.dataset.o))*10)/10));paint();});
  v.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{keep();S.f.win=+e.dataset.w;paint();});
  const a=document.getElementById('add');if(a)a.onclick=()=>{keep();const f=S.f,L=level(),p=exp_(L,f.opp),d=Math.round(K*(f.win-p)*100)/100;
    C.data.matches.push({off:0,partner:f.partner.slice(0,20),opp:f.opp,win:f.win,score:f.win?'Won':'Lost',d});GX.save(C.data);S.f={partner:'',opp:f.opp,win:1};S.tab='level';S.shared=false;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const L=level();
    GX.post(`Padel level now <b>${L.toFixed(2)}</b> after ${C.data.matches.length} matches this season. Tracked in Level Tracker 📈🎾`,'LEVEL TRACKER').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
