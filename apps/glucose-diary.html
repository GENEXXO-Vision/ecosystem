<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glucose Diary</title>
<style>
/* Glucose Diary, by "Steady Software" (fictional), 2026-11-17. A GENEXXO app for DiabetesXX.
   Blood glucose readings in mmol/L with a tag (before or after a meal, bedtime, exercise) and a note. Week view:
   time in range against the person's own target (default 3.9–10.0 mmol/L, which many UK care teams use;
   adjustable), lows below the range, highs above, average, and a dot strip per day. Patterns: highs and lows by time
   of day. The app explains and records only. It never suggests a dose, and says so. Seed data is a plausible type 1 week. */
:root{--bg:#F4F8FD;--card:#fff;--line:rgba(20,33,61,.09);--ink:#14213D;--mut:rgba(20,33,61,.55);--blue:#1D6FD8;--or:#F28C28;--lo:#D64545;--ok:#1E9E6A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;box-shadow:0 6px 18px rgba(29,111,216,.06)}
.val{font-size:52px;font-weight:900;line-height:1;margin:6px 0 2px}.val small{font-size:15px;color:var(--mut);font-weight:700}
.zone{display:inline-block;font-size:11.5px;font-weight:900;border-radius:99px;padding:3px 10px}.z-in{background:rgba(30,158,106,.12);color:var(--ok)}.z-lo{background:rgba(214,69,69,.12);color:var(--lo)}.z-hi{background:rgba(242,140,40,.14);color:#C46A12}
.step{display:flex;gap:6px;justify-content:center;margin-top:12px}.step button{font:inherit;font-weight:900;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 0;width:56px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chips button{font:inherit;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 11px;cursor:pointer}.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.rd{display:flex;align-items:center;gap:10px;padding:7px 0}.rd+.rd{border-top:1px solid var(--line)}.rd b{width:44px;font-size:16px;font-weight:900}.rd .x{flex:1;font-size:13px}.rd .x small{display:block;color:var(--mut);font-size:11.5px}
.tir{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0}.tir i{display:block;height:100%}
.top{display:flex;gap:8px}.top div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}.top b{display:block;font-size:24px;font-weight:900}.top small{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.05em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10.5px;font-weight:800;color:var(--mut)}.days .col{display:flex;flex-direction:column;align-items:center;gap:3px}.days i{width:9px;height:9px;border-radius:50%;display:block}
.pat{display:flex;align-items:center;gap:10px;padding:9px 0}.pat+.pat{border-top:1px solid var(--line)}.pat .n{width:92px;font-weight:800;font-size:13px}.pat .bar{flex:1}.pat small{font-size:11.5px;color:var(--mut);font-weight:700;width:52px;text-align:right}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--blue);color:#fff;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut);border:1px solid var(--line)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📈</div><div><h1>Glucose Diary</h1><p>Steady Software · in DiabetesXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="log" class="on">Log</button><button data-tab="week">Week</button><button data-tab="pat">Patterns</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const TAGS=['Before breakfast','After breakfast','Before lunch','After lunch','Before dinner','After dinner','Bedtime','Exercise'];
const SLOTS=[['Night','00','06'],['Morning','06','12'],['Afternoon','12','18'],['Evening','18','24']];
function seed(){const r=GX.rng('glucose-diary-demo'),rd=[];
  const plan=[['07:20','Before breakfast',7.4],['09:30','After breakfast',9.6],['12:30','Before lunch',6.2],['14:30','After lunch',8.4],['18:00','Before dinner',6.8],['20:30','After dinner',9.1],['22:45','Bedtime',7.6]];
  for(let d=-6;d<=0;d++)plan.forEach(([t,tag,base],j)=>{if(d===0&&j>3)return;let v=base+(r()-.45)*3.2;
    if(tag==='Before breakfast'&&r()<.5)v+=3.6;if(d===-4&&j===3)v=3.5;if(d===-1&&j===5)v=12.8;if(d===-2&&j===2)v=4.4;
    rd.push({d,t,tag,v:Math.round(Math.max(2.9,v)*10)/10,note:d===-4&&j===3?'Long walk after lunch':''});});
  return {lo:3.9,hi:10.0,readings:rd,draft:{v:6.4,tag:'Before dinner'}};}
let C,S={tab:'log',shared:false,saved:false};
GX.init({gateway:'DiabetesXX',seed}).then(c=>{C=c;paint();});
const z=v=>v<C.data.lo?'lo':v>C.data.hi?'hi':'in';
const zl={lo:'Below range',in:'In range',hi:'Above range'},zc={lo:'#D64545',in:'#1E9E6A',hi:'#F28C28'};
const week=()=>C.data.readings.filter(x=>x.d>-7);
function stats(rs){const n=rs.length||1,c={lo:0,in:0,hi:0};rs.forEach(x=>c[z(x.v)]++);return {n:rs.length,lo:c.lo/n,in:c.in/n,hi:c.hi/n,avg:rs.reduce((a,x)=>a+x.v,0)/n};}
const bar=s=>`<div class="tir"><i style="width:${s.lo*100}%;background:${zc.lo}"></i><i style="width:${s.in*100}%;background:${zc.in}"></i><i style="width:${s.hi*100}%;background:${zc.hi}"></i></div>`;
function vLog(){const d=C.data.draft,zz=z(d.v),today=C.data.readings.filter(x=>x.d===0).sort((a,b)=>a.t<b.t?1:-1);
  return `<div class="entry"><div style="font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em">NEW READING</div><div class="val">${d.v.toFixed(1)} <small>mmol/L</small></div><span class="zone z-${zz}">${zl[zz]}</span>
    <div class="step">${[-1,-0.1,0.1,1].map(s=>`<button data-step="${s}">${s>0?'+':'−'}${Math.abs(s)}</button>`).join('')}</div>
    <div class="chips">${TAGS.map(t=>`<button data-tag="${t}" class="${t===d.tag?'on':''}">${t}</button>`).join('')}</div></div>
  <button class="go" id="save">${S.saved?'✓ Saved':'Save reading'}</button>
  <div class="card"><h3>Today</h3>${today.map(x=>`<div class="rd"><b style="color:${zc[z(x.v)]}">${x.v.toFixed(1)}</b><div class="x">${x.tag}<small>${x.t}${x.note?' · '+GX.esc(x.note):''}</small></div></div>`).join('')||'<div class="legend">No readings yet today.</div>'}</div>`;}
function vWeek(){const s=stats(week());
  return `<div class="top"><div><b style="color:var(--ok)">${Math.round(s.in*100)}%</b><small>IN RANGE</small></div><div><b>${s.avg.toFixed(1)}</b><small>AVERAGE</small></div><div><b style="color:var(--lo)">${Math.round(s.lo*s.n)}</b><small>LOWS</small></div></div>
  <div class="card"><h3>Time in range · last 7 days · ${s.n} readings</h3>${bar(s)}
    <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--mut)"><span>Below ${Math.round(s.lo*100)}%</span><span>In ${Math.round(s.in*100)}%</span><span>Above ${Math.round(s.hi*100)}%</span></div></div>
  <div class="card"><h3>Every reading</h3><div class="days">${[-6,-5,-4,-3,-2,-1,0].map(d=>`<div class="col">${GX.day(GX.today(d),{weekday:'narrow'})}${C.data.readings.filter(x=>x.d===d).map(x=>`<i style="background:${zc[z(x.v)]}"></i>`).join('')}</div>`).join('')}</div></div>
  <div class="card"><h3>Your target range</h3><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-weight:900;font-size:16px">${C.data.lo.toFixed(1)} – ${C.data.hi.toFixed(1)} mmol/L</span>
    <span class="chips" style="margin:0"><button data-rng="std">3.9–10.0</button><button data-rng="tight">4.0–7.0</button></span></div>
    <div class="legend" style="text-align:left">Use the range your diabetes team gave you.</div></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my week to ${C.gateway}`}</button>`:''}`;}
function vPat(){const rs=week();
  return `<div class="card"><h3>By time of day · last 7 days</h3>${SLOTS.map(([n,a,b])=>{const s=stats(rs.filter(x=>x.t>=a+':00'&&x.t<b+':00'));return s.n?`<div class="pat"><span class="n">${n}</span><div class="bar">${bar(s)}</div><small>${s.avg.toFixed(1)} avg</small></div>`:'';}).join('')}</div>
  <div class="card"><h3>Worth a look</h3>${(()=>{const m=stats(rs.filter(x=>x.tag==='Before breakfast'));return m.hi>0.25?`<div style="font-size:13.5px">Your <b>before-breakfast</b> readings were above range on ${Math.round(m.hi*m.n)} of ${m.n} mornings. Worth raising at your next review.</div>`:'<div style="font-size:13.5px">No clear pattern this week.</div>';})()}</div>
  <div class="legend">Glucose Diary records and explains. It does not advise on insulin or medicine doses: talk to your diabetes team about any change.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='log'?vLog():S.tab==='week'?vWeek():vPat();
  v.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{const d=C.data.draft;d.v=Math.min(33.3,Math.max(1.0,Math.round((d.v+ +e.dataset.step)*10)/10));S.saved=false;paint();});
  v.querySelectorAll('[data-tag]').forEach(e=>e.onclick=()=>{C.data.draft.tag=e.dataset.tag;S.saved=false;paint();});
  v.querySelectorAll('[data-rng]').forEach(e=>e.onclick=()=>{const t=e.dataset.rng==='tight';C.data.lo=t?4.0:3.9;C.data.hi=t?7.0:10.0;GX.save(C.data);paint();});
  const sv=document.getElementById('save');if(sv)sv.onclick=()=>{const n=new Date(),d=C.data.draft;
    C.data.readings.push({d:0,t:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),tag:d.tag,v:d.v,note:''});GX.save(C.data);S.saved=true;S.shared=false;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const s=stats(week());
    GX.post(`<b>${Math.round(s.in*100)}% time in range</b> this week, ${s.n} readings logged. Taking the pattern view to clinic. Glucose Diary 📈`,'GLUCOSE DIARY').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
