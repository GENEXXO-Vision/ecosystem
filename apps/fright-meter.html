<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fright Meter</title>
<style>
/* Fright Meter, by Midnight Matinee (fictional), 2026-11-21. A GENEXXO app for HorrorXX.
   Fictional books and films rated 1 (cosy chill) to 5 (lights on), with plain content notes. Pick by level and format,
   then rate what you've finished. Every title and author is fictional. */
:root{--bg:#0E0C0C;--card:rgba(255,255,255,.045);--line:rgba(238,231,226,.1);--ink:#EEE7E2;--mut:rgba(238,231,226,.55);--red:#D8343B;--amb:#F2B15A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#C0262D,#5E0F13);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.meter{border-radius:18px;padding:14px;background:linear-gradient(160deg,#2A1416,#120B0C);border:1px solid rgba(216,52,59,.25)}
.meter small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--amb)}.meter h2{font-size:20px;font-weight:900;margin:2px 0 10px}
.lv{display:flex;gap:6px}.lv button{flex:1;font:inherit;font-weight:900;font-size:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:12px;padding:10px 0;cursor:pointer}
.lv button.on{color:#fff;border-color:transparent}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 0;cursor:pointer}.seg button.on{background:var(--amb);border-color:var(--amb);color:#1E1305}
.t{display:flex;gap:11px;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.ic{width:42px;height:56px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.t .x{flex:1;min-width:0}.t b{display:block;font-size:14.5px}.t small{color:var(--mut);font-size:12px}
.sk{display:flex;gap:2px;margin-top:4px}.sk i{width:16px;height:6px;border-radius:3px;background:#3A3034}
.cn{margin-top:5px;font-size:11.5px;color:var(--mut)}.cn em{font-style:normal;color:#F9A8AE;font-weight:700}
.mini{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 10px;cursor:pointer;align-self:center;white-space:nowrap}
.stars{display:flex;gap:2px;margin-top:4px}.stars button{font-size:17px;background:none;border:0;cursor:pointer;color:#4A3E40;padding:0 1px}.stars button.on{color:var(--amb)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--red);color:#fff;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🌡️</div><div><h1>Fright Meter</h1><p>Midnight Matinee · in HorrorXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="p" class="on">Pick</button><button data-tab="l">My list</button><button data-tab="s">Scale</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const LV=[['','',''],['Cosy chill','#5E8C61','A shiver by the fire. Fine for most families.'],['Unsettling','#C9962B','Creepy atmosphere, a few jumps.'],['Properly scary','#D9734E','Dread that lingers. Maybe not alone.'],['Very scary','#C0262D','Intense and disturbing in places.'],['Lights on','#7F1D1D','The most frightening we list. You were warned.']];
const T=[
 {n:'Snow on the Fells',k:'Book',by:'Freya Lund',lv:1,len:'Short stories',cn:'none',em:'❄️'},
 {n:'The Quiet Lodger',k:'Film',by:'1951, dir. Harold Venn',lv:1,len:'78 min',cn:'none',em:'🕯️'},
 {n:'Twelve Winter Ghosts',k:'Book',by:'Blackthorn Press',lv:2,len:'Short stories',cn:'grief',em:'📕'},
 {n:'The Bell at Carrow',k:'Film',by:'2019, dir. Ines Abara',lv:2,len:'94 min',cn:'a child in danger',em:'🔔'},
 {n:'The Salt House',k:'Book',by:'Wren Holloway',lv:3,len:'Novel',cn:'drowning, grief',em:'🏚️'},
 {n:'Mirror Lane',k:'Film',by:'2023, dir. Tomas Reyes',lv:3,len:'101 min',cn:'jump scares',em:'🪞'},
 {n:'The Lantern in the Marsh',k:'Film',by:'2026, dir. Anwen Price',lv:4,len:'109 min',cn:'body horror (brief), isolation',em:'🏮'},
 {n:'Hollow Psalm',k:'Book',by:'Oren Black',lv:4,len:'Novel',cn:'religious horror, violence',em:'📖'},
 {n:'Under the Floorboards',k:'Film',by:'2022, dir. Mara Kell',lv:5,len:'96 min',cn:'violence, home invasion',em:'🚪'},
 {n:'The Night Nurse',k:'Book',by:'Ada Crane',lv:5,len:'Novel',cn:'medical horror, death',em:'🏥'}];
const seed=()=>({lv:2,kind:'Any',list:[{i:4,done:false},{i:1,done:true,stars:4},{i:2,done:true,stars:5},{i:5,done:true,stars:3}]});
let C,S={tab:'p',shared:false};
GX.init({gateway:'HorrorXX',seed}).then(c=>{C=c;paint();});
const sk=l=>`<div class="sk">${[1,2,3,4,5].map(n=>`<i style="${n<=l?'background:'+LV[l][1]:''}"></i>`).join('')}</div>`;
const ic=t=>`<div class="ic" style="background:${LV[t.lv][1]}33;border:1px solid ${LV[t.lv][1]}">${t.em}</div>`;
function vP(){const d=C.data,inList=i=>d.list.some(x=>x.i===i),r=T.map((t,i)=>[t,i]).filter(([t])=>t.lv===d.lv&&(d.kind==='Any'||t.k===d.kind));
  return `<div class="meter"><small>HOW SCARED DO YOU WANT TO BE?</small><h2>${d.lv} · ${LV[d.lv][0]}</h2><div class="lv">${[1,2,3,4,5].map(n=>`<button data-lv="${n}" class="${d.lv===n?'on':''}" style="${d.lv===n?'background:'+LV[n][1]:''}">${n}</button>`).join('')}</div>
  <p style="color:var(--mut);font-size:12.5px;margin-top:8px">${LV[d.lv][2]}</p></div>
  <div class="seg">${['Any','Book','Film'].map(k=>`<button data-k="${k}" class="${d.kind===k?'on':''}">${k==='Any'?'Books and films':k+'s'}</button>`).join('')}</div>
  ${r.map(([t,i])=>`<div class="t">${ic(t)}<div class="x"><b>${t.n}</b><small>${t.k} · ${t.by} · ${t.len}</small>${sk(t.lv)}<div class="cn">Content notes: <em>${t.cn}</em></div></div><button class="mini" data-add="${i}" ${inList(i)?'disabled':''}>${inList(i)?'✓ Listed':'+ List'}</button></div>`).join('')||'<div class="legend">Nothing at this level yet.</div>'}`;}
function vL(){const d=C.data;return d.list.map((x,k)=>{const t=T[x.i];return `<div class="t">${ic(t)}<div class="x"><b>${t.n}</b><small>${t.k} · level ${t.lv}</small>${x.done?`<div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${k}:${n}" class="${(x.stars||0)>=n?'on':''}">★</button>`).join('')}</div>`:`<div class="cn">Not finished yet</div>`}</div>${x.done?'':`<button class="mini" data-done="${k}">Finished</button>`}</div>`;}).join('')+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my scariest finish'}</button>`:'');}
function vS(){return [1,2,3,4,5].map(n=>`<div class="t"><div class="ic" style="background:${LV[n][1]};color:#fff;font-weight:900">${n}</div><div class="x"><b>${LV[n][0]}</b><small>${LV[n][2]}</small>${sk(n)}</div></div>`).join('')+`<div class="legend">Content notes never spoil the plot: they say what kind of scene, not when.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='p'?vP():S.tab==='l'?vL():vS();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{d.lv=+b.dataset.lv;sv();});
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{d.kind=b.dataset.k;sv();});
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{d.list.unshift({i:+b.dataset.add,done:false});sv();});
  v.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const x=d.list[+b.dataset.done];x.done=true;x.stars=0;sv();});
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const [k,n]=b.dataset.r.split(':').map(Number);d.list[k].stars=n;sv();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const f=d.list.filter(x=>x.done).map(x=>T[x.i]).sort((a,b)=>b.lv-a.lv)[0];if(!f)return;
    GX.post(`Survived <b>${f.n}</b>: Fright Meter level ${f.lv}, “${LV[f.lv][0]}”. Lights stayed on afterwards 🕯️`,'FRIGHT METER').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
