<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pull List</title>
<style>
/* Pull List, by Halftone Comics (fictional), 2026-11-21. A GENEXXO app for ComicXX.
   Series you follow (all fictional titles and publishers), this week's issues (new comic day = the coming Wednesday,
   relative to today), reserve at Halftone Comics in Leeds or York, an unread pile and a reading streak. */
:root{--bg:#FFFCF3;--card:#fff;--line:rgba(29,27,36,.12);--ink:#1D1B24;--mut:rgba(29,27,36,.55);--blue:#2453C9;--pop:#E11D2E;--sun:#C9851A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3B6FE0,#16337D);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.ncd{border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,#2453C9,#16337D);color:#fff;margin-bottom:6px;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px),linear-gradient(135deg,#2453C9,#16337D);background-size:8px 8px,auto}
.ncd small{font-size:11px;font-weight:900;letter-spacing:.1em;opacity:.85}.ncd h2{font-size:20px;font-weight:900}
.is{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.cv{width:44px;height:62px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--ink)}
.is .x{flex:1;min-width:0}.is .x b{display:block}.is .x small{display:block;color:var(--mut);font-size:12px}
.btn{font:inherit;font-weight:800;font-size:12px;border:1px solid var(--line);background:#F1ECDD;color:var(--ink);border-radius:99px;padding:7px 11px;cursor:pointer;white-space:nowrap}.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.streak{display:flex;gap:8px}.streak div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}.streak b{display:block;font-size:24px;font-weight:900;color:var(--pop)}.streak small{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--blue);color:#fff;cursor:pointer}.go:disabled{background:#F1ECDD;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}.empty{padding:22px;text-align:center;color:var(--mut)}
</style></head><body>
<div class="hd"><div class="logo">🗂️</div><div><h1>Pull List</h1><p>Halftone Comics · in ComicXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="w" class="on">This week</button><button data-tab="p">Unread pile</button><button data-tab="s">My series</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const SER=[{n:'Small Hours',pub:'Panel & Gutter',c:'#1E1B4B',e:'🌙',iss:7},{n:'Salt Road',pub:'Northlight Comics',c:'#0E7490',e:'⚓',iss:12},{n:'The Copper Fox',pub:'Hedgerow Press',c:'#B45309',e:'🦊',iss:3},{n:'Static Bloom',pub:'Panel & Gutter',c:'#BE185D',e:'🌸',iss:21},{n:'Night Bus 42',pub:'Kerbside Comics',c:'#4B5563',e:'🚌',iss:5},{n:'Moth & Lantern',pub:'Hedgerow Press',c:'#65A30D',e:'🦋',iss:9}];
const seed=()=>({follow:[0,1,2,3],res:[],pile:[{s:1,i:11},{s:3,i:20},{s:0,i:6}],read:46});
let C,S={tab:'w',shared:false};
GX.init({gateway:'ComicXX',seed}).then(c=>{C=c;paint();});
const wed=()=>{const t=GX.today(0);let o=(3-t.getDay()+7)%7;return o;};
const cover=s=>`<div class="cv" style="background:${s.c}">${s.e}</div>`;
function vW(){const o=wed(),out=C.data.follow;return `<div class="ncd"><small>NEW COMIC DAY</small><h2>${o===0?'Today':GX.day(GX.today(o),{weekday:'long',day:'numeric',month:'short'})}</h2></div>
  ${out.map(i=>{const s=SER[i],r=C.data.res.includes(i);return `<div class="is">${cover(s)}<div class="x"><b>${s.n} #${s.iss}</b><small>${s.pub}</small></div><button class="btn ${r?'on':''}" data-res="${i}">${r?'✓ Reserved':'Reserve'}</button></div>`;}).join('')}
  <div class="legend">Reserved issues wait at the counter at Halftone Comics in Leeds or York.</div>`;}
function vP(){const p=C.data.pile;return `<div class="streak"><div><b>${p.length}</b><small>UNREAD</small></div><div><b>${C.data.read}</b><small>READ THIS YEAR</small></div></div>
  ${p.length?p.map((x,k)=>{const s=SER[x.s];return `<div class="is">${cover(s)}<div class="x"><b>${s.n} #${x.i}</b><small>${s.pub}</small></div><button class="btn" data-read="${k}">Read it</button></div>`;}).join(''):'<div class="empty">Pile cleared! 🎉</div>'}
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my reading`}</button>`:''}`;}
function vS(){return SER.map((s,i)=>{const f=C.data.follow.includes(i);return `<div class="is">${cover(s)}<div class="x"><b>${s.n}</b><small>${s.pub} · issue ${s.iss} next</small></div><button class="btn ${f?'on':''}" data-f="${i}">${f?'✓ Following':'Follow'}</button></div>`;}).join('')+`<div class="legend">All series and publishers here are made up for this demo.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='w'?vW():S.tab==='p'?vP():vS();const d=C.data,sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{const i=+b.dataset.res,k=d.res.indexOf(i);k<0?d.res.push(i):d.res.splice(k,1);sv();});
  v.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{d.pile.splice(+b.dataset.read,1);d.read++;S.shared=false;sv();});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const i=+b.dataset.f,k=d.follow.indexOf(i);k<0?d.follow.push(i):d.follow.splice(k,1);sv();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`<b>${d.read} comics read this year</b>, ${d.pile.length} left on the pile. Currently loving ${SER[d.follow[0]].n} 🗂️`,'PULL LIST').then(o=>{if(o){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
