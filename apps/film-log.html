<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Film Log</title>
<style>
/* Film Log, by Silverline Film Lab (fictional), 2026-11-21. A GENEXXO app for CameraXX.
   Rolls in the camera, frame-by-frame settings, frames left, and a push/pull note for the lab when the rated ISO
   differs from box speed. Film stocks are fictional. */
:root{--bg:#0F1216;--card:rgba(255,255,255,.05);--line:rgba(236,240,245,.1);--ink:#ECF0F5;--mut:rgba(236,240,245,.55);--sil:#CBD5E1;--amb:#F5A524}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#94A3B8,#475569);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sil)}
.roll{border-radius:18px;padding:14px;background:linear-gradient(150deg,#26303D,#141A22);border:1px solid rgba(203,213,225,.2)}
.roll small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--amb)}.roll h2{font-size:20px;font-weight:900;margin:2px 0}.roll p{color:var(--mut);font-size:12.5px}
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px;background:#07090C;border-radius:8px;padding:6px}.strip i{width:calc((100% - 33px)/12);height:16px;border-radius:2px;background:#2A323D}.strip i.f{background:var(--amb)}
.push{margin-top:8px;font-size:12px;font-weight:800;color:#1A1205;background:var(--amb);display:inline-block;padding:3px 9px;border-radius:99px}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button{flex:1;min-width:52px;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 4px;cursor:pointer}.seg button.on{background:var(--sil);border-color:var(--sil);color:#10151C}
input{width:100%;font:inherit;font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.fr{display:flex;gap:10px;padding:9px 0;font-size:13px}.fr+.fr{border-top:1px solid var(--line)}.fr b{width:30px;color:var(--amb)}.fr span{flex:1}.fr em{font-style:normal;color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:10px}
.it{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}.it b{flex:1}.it span{color:var(--mut);font-size:12px;font-weight:700;text-align:right}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sil);color:#10151C;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
</style></head><body>
<div class="hd"><div class="logo">🎞️</div><div><h1>Film Log</h1><p>Silverline Film Lab · in CameraXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="r" class="on">In the camera</button><button data-tab="a">Log a frame</button><button data-tab="d">Finished rolls</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const AP=['f/2','f/2.8','f/4','f/5.6','f/8','f/11','f/16'],SH=['1/1000','1/500','1/250','1/125','1/60','1/30','1/15'];
const seed=()=>({cur:{film:'Halden 400',box:400,rated:800,cam:'Halden M6',size:12,start:-6,frames:[
  {a:4,s:3,n:'Frosty field, back lit'},{a:4,s:3,n:'Same, closer'},{a:2,s:4,n:'Fran at the gate'},{a:2,s:4,n:'Fran laughing'},{a:5,s:2,n:'Church tower'},{a:1,s:5,n:'Café window, dusk'},{a:0,s:5,n:'Street lights'}]},
  draft:{a:3,s:3,n:''},done:[{film:'Halden 400',cam:'Halden M6',size:12,d:-24,rated:400,note:'Lakes trip'},{film:'Coastline 100',cam:'Old rangefinder',size:36,d:-40,rated:100,note:'Brighton seafront'},{film:'Midnight 3200 (B&W)',cam:'Old rangefinder',size:36,d:-61,rated:3200,note:'Gig at the Barrowland'}]});
let C,S={tab:'r',saved:false,sent:false,shared:false};
GX.init({gateway:'CameraXX',seed}).then(c=>{C=c;paint();});
const stops=r=>Math.round(Math.log2(r.rated/r.box));
function vR(){const r=C.data.cur,n=r.frames.length,p=stops(r);
  return `<div class="roll"><small>IN THE CAMERA · DAY ${-r.start+1}</small><h2>${GX.esc(r.film)}</h2><p>${GX.esc(r.cam)} · ${n} of ${r.size} frames · ${r.size-n} left</p>
  <div class="strip">${Array.from({length:r.size},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</div>${p?`<span class="push">Rated at ${r.rated}: tell the lab PUSH +${p}</span>`:''}</div>
  <div class="card">${r.frames.map((f,i)=>`<div class="fr"><b>${i+1}</b><span>${GX.esc(f.n||'No note')}</span><em>${AP[f.a]} · ${SH[f.s]}</em></div>`).slice().reverse().join('')}</div>
  <button class="go" id="send" ${n>0&&!S.sent?'':'disabled'}>${S.sent?'✓ Sent to the lab':'Finish roll and send to the lab'}</button>`;}
function vA(){const d=C.data.draft,r=C.data.cur,full=r.frames.length>=r.size;
  return `<div class="roll"><small>FRAME ${Math.min(r.frames.length+1,r.size)} OF ${r.size}</small><h2>${AP[d.a]} at ${SH[d.s]}</h2><p>${GX.esc(r.film)}, rated at ISO ${r.rated}</p></div>
  <label>Aperture</label><div class="seg">${AP.map((x,i)=>`<button data-a="${i}" class="${d.a===i?'on':''}">${x}</button>`).join('')}</div>
  <label>Shutter</label><div class="seg">${SH.map((x,i)=>`<button data-s="${i}" class="${d.s===i?'on':''}">${x}</button>`).join('')}</div>
  <label>Note</label><input id="note" maxlength="60" placeholder="What was it?" value="${GX.esc(d.n)}">
  <button class="go" id="add" ${full?'disabled':''}>${full?'Roll full. Send it to the lab':S.saved?'✓ Logged · log the next one':'Log this frame'}</button>`;}
function vD(){return C.data.done.map(r=>`<div class="it"><b>${GX.esc(r.film)}<br><small style="color:var(--mut);font-weight:600">${GX.esc(r.cam)} · ${GX.esc(r.note)}</small></b><span>${r.size} frames<br>${GX.day(GX.today(r.d),{day:'numeric',month:'short'})}</span></div>`).join('')+
  (GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my film year'}</button>`:'');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='r'?vR():S.tab==='a'?vA():vD();
  v.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{d.draft.a=+b.dataset.a;S.saved=false;GX.save(d);paint();});
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{d.draft.s=+b.dataset.s;S.saved=false;GX.save(d);paint();});
  const nt=document.getElementById('note');if(nt)nt.oninput=()=>{d.draft.n=nt.value;S.saved=false;};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('add',()=>{d.cur.frames.push({a:d.draft.a,s:d.draft.s,n:d.draft.n.trim()});d.draft.n='';S.saved=true;S.sent=false;GX.save(d);paint();});
  on('send',()=>{const r=d.cur;d.done.unshift({film:r.film,cam:r.cam,size:r.frames.length,d:0,rated:r.rated,note:'Sent to Silverline'});d.cur={film:r.film,box:r.box,rated:r.box,cam:r.cam,size:12,start:0,frames:[]};S.sent=true;GX.save(d);paint();});
  on('share',()=>{const n=d.done.reduce((a,r)=>a+r.size,0);GX.post(`<b>${d.done.length} rolls, ${n} frames</b> of film this year, every one logged. Developed by hand at Silverline 🎞️`,'FILM LOG').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
