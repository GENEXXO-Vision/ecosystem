<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pronoun Card</title>
<style>
/* Pronoun Card, by Spectrum Books (fictional), 2026-11-19. A GENEXXO app for PrideXX.
   Make a card with your name and pronouns; five styles; big mode to show across a room; a short, kind guide for
   friends and colleagues. Nothing here is shared unless you choose to share it. */
:root{--bg:#120E18;--card:rgba(255,255,255,.05);--line:rgba(246,240,250,.1);--ink:#F6F0FA;--mut:rgba(246,240,250,.55);--pink:#FF5DA2;--sky:#7DD3FC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7DD3FC,#2563EB);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sky)}
.pc{border-radius:22px;padding:26px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;transition:all .2s}
.pc small{font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.75}.pc h2{font-size:38px;font-weight:900;line-height:1.05;margin:8px 0 6px;word-break:break-word}.pc .pr{font-size:24px;font-weight:800}.pc p{font-size:13px;margin-top:10px;opacity:.8}
.pc.big{min-height:440px}.pc.big h2{font-size:58px}.pc.big .pr{font-size:38px}
.s0{background:linear-gradient(135deg,#E40303,#FF8C00 20%,#FFED00 40%,#008026 60%,#004DFF 80%,#750787);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.s1{background:linear-gradient(135deg,#5BCEFA,#F5A9B8 35%,#fff 50%,#F5A9B8 65%,#5BCEFA);color:#1A1030}
.s2{background:#F6F0FA;color:#120E18}
.s3{background:linear-gradient(150deg,#3A1A4A,#1C1028);color:#fff;border:1px solid rgba(255,93,162,.4)}
.s4{background:linear-gradient(135deg,#FCF434,#fff 33%,#9C59D1 66%,#2C2C2C);color:#120E18}
.lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 7px}
input{width:100%;font:inherit;font-size:16px;font-weight:700;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--sky);border-color:var(--sky);color:#0A1A2A}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sw button{height:64px;border-radius:14px;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:900;font-size:12px}.sw button.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--bg) inset}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sky);color:#0A1A2A;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}.g b{display:block;font-size:14.5px;margin-bottom:3px}.g p{color:var(--mut);font-size:13px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">💬</div><div><h1>Pronoun Card</h1><p>Spectrum Books · in PrideXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="card" class="on">My card</button><button data-tab="style">Style</button><button data-tab="guide">Ally guide</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const seed=()=>({name:'River',pr:'they/them',style:0,note:'Thanks for asking!'});
const PR=['she/her','he/him','they/them','she/they','he/they','any pronouns','ask me'],ST=['Rainbow','Trans','Plain','Night','Non-binary'];
const GUIDE=[['Use the name and pronouns people give you','If someone says they use they/them, use they/them. It is that simple.'],
  ['Got it wrong? Say sorry, fix it, move on','“She, sorry, they said…” is perfect. A big apology makes it about you.'],
  ['Share yours too','Saying “I’m Alex, he/him” makes it normal for everyone, not just the people who have to.'],
  ['Never guess, never out','Do not tell others someone’s identity unless they have said you can.'],
  ['“Any pronouns” means any','And “ask me” means just that. Asking is kind.']];
let C,S={tab:'card',big:false,shared:false};
GX.init({gateway:'PrideXX',seed}).then(c=>{C=c;paint();});
const card=()=>`<div class="pc s${C.data.style} ${S.big?'big':''}" id="pc"><small>HELLO, MY NAME IS</small><h2>${GX.esc(C.data.name||'Your name')}</h2><div class="pr">${GX.esc(C.data.pr)}</div>${C.data.note?`<p>${GX.esc(C.data.note)}</p>`:''}</div>`;
function vCard(){return card()+(S.big?`<button class="go alt" id="big">Done</button>`:`
  <div class="lbl">Name</div><input id="nm" value="${GX.esc(C.data.name)}" maxlength="24" autocomplete="off">
  <div class="lbl">Pronouns</div><div class="chips">${PR.map(p=>`<button class="chip ${C.data.pr===p?'on':''}" data-pr="${p}">${p}</button>`).join('')}</div>
  <button class="go" id="big">Show across the room</button>`);}
function vStyle(){return card()+`<div class="lbl">Card style</div><div class="sw">${ST.map((s,i)=>`<button class="s${i} ${C.data.style===i?'on':''}" data-st="${i}" title="${s}"></button>`).join('')}</div>
  <div class="legend">${ST[C.data.style]} style. Your card is saved on this device.</div>`;}
function vGuide(){return `<div class="legend" style="text-align:left;margin:0 0 4px">Five things to know, for friends, family and colleagues.</div>`+GUIDE.map(([b,p])=>`<div class="g"><b>${b}</b><p>${p}</p></div>`).join('')+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share the guide to ${C.gateway}`}</button>`:'');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='card'?vCard():S.tab==='style'?vStyle():vGuide();
  const nm=document.getElementById('nm');if(nm)nm.oninput=()=>{C.data.name=nm.value.trim();GX.save(C.data);document.querySelector('#pc h2').textContent=C.data.name||'Your name';};
  v.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{C.data.pr=b.dataset.pr;GX.save(C.data);paint();});
  v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{C.data.style=+b.dataset.st;GX.save(C.data);paint();});
  const bg=document.getElementById('big');if(bg)bg.onclick=()=>{S.big=!S.big;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post('Five kind things to know about names and pronouns: use them, fix mistakes quickly, share yours, never out anyone, and just ask. From the Pronoun Card ally guide 💬','PRONOUN CARD').then(ok=>{if(ok){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.big=false;paint();};
</script></body></html>
