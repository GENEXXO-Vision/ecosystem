<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knit Along</title>
<style>
/* Knit Along, by Pattern Post (fictional), 2026-11-20. A GENEXXO app for KnitXX.
   The Christmas jumper knit-along: five clues, one released every five days from the start (relative to today, so
   the demo never goes stale). Tick off released clues; see how far the group has got (sample figures); share. */
:root{--bg:#F6F7F1;--card:#fff;--line:rgba(42,34,48,.1);--ink:#2A2230;--mut:rgba(42,34,48,.55);--moss:#56704A;--hea:#9333EA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#9CB58A,#56704A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--moss)}
.hero{border-radius:18px;padding:15px;background:linear-gradient(150deg,#56704A,#2F4229);color:#fff}.hero small{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.8}.hero h2{font-size:21px;font-weight:900;margin:3px 0}.hero p{font-size:12.5px;opacity:.88}
.cl{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}
.cl .n{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;background:#E7EDE2;color:var(--moss)}
.cl.done .n{background:var(--moss);color:#fff}.cl.locked{opacity:.55}
.cl .x{flex:1}.cl .x b{display:block}.cl .x small{color:var(--mut);font-size:12px}
.tick{font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:#F1F4EC;border-radius:99px;padding:7px 11px;cursor:pointer;color:var(--ink)}.tick.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}.row span{width:64px;font-weight:700;font-size:13px}.row .bar{flex:1;height:12px;border-radius:99px;background:#E7EDE2;overflow:hidden}.row .bar i{display:block;height:100%;background:var(--moss)}.row b{width:44px;text-align:right;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--moss);color:#fff;cursor:pointer}.go:disabled{background:#E7EDE2;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🎄</div><div><h1>Knit Along</h1><p>Pattern Post · in KnitXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="clues" class="on">Clues</button><button data-tab="group">The group</button><button data-tab="share">Share</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CLUES=[['Cast on and ribbing','Cast on, then 6cm of 1×1 rib in the main colour.'],['The body','Stockinette to the underarm, joining in the round.'],['Sleeves','Two sleeves, magic loop or two at a time.'],['The yoke','Join everything and knit the reindeer Fair Isle chart.'],['Neck and finishing','Neckband, weave in ends, wash and block.']];
const seed=()=>({start:-6,done:[true,false,false,false,false],kalers:4126});
let C,S={tab:'clues',shared:false};
GX.init({gateway:'KnitXX',seed}).then(c=>{C=c;paint();});
const rel=i=>C.data.start+i*5;
function vClues(){const d=C.data,mine=d.done.filter(Boolean).length,nx=CLUES.findIndex((_,i)=>rel(i)>0);
  return `<div class="hero"><small>CHRISTMAS JUMPER KNIT-ALONG</small><h2>${mine} of 5 clues done</h2><p>${nx<0?'All clues are out.':`Clue ${nx+1} lands ${GX.day(GX.today(rel(nx)),{weekday:'long',day:'numeric',month:'short'})}.`} ${d.kalers.toLocaleString('en-GB')} knitters taking part.</p></div>
  ${CLUES.map(([t,x],i)=>{const out=rel(i)<=0,dn=d.done[i];return `<div class="cl ${dn?'done':''} ${out?'':'locked'}"><div class="n">${dn?'✓':i+1}</div><div class="x"><b>${t}</b><small>${out?x:'Out '+GX.day(GX.today(rel(i)),{weekday:'short',day:'numeric',month:'short'})}</small></div>${out?`<button class="tick ${dn?'on':''}" data-c="${i}">${dn?'Done':'Mark done'}</button>`:'🔒'}</div>`;}).join('')}`;}
function vGroup(){const r=GX.rng('kal'),pct=CLUES.map((_,i)=>rel(i)>0?0:Math.max(4,Math.round((96-i*22)*(0.85+r()*0.15))));
  return `<div class="card"><h3>How far everyone has got</h3>${CLUES.map((c,i)=>`<div class="row"><span>Clue ${i+1}</span><div class="bar"><i style="width:${pct[i]}%"></i></div><b>${rel(i)>0?'—':pct[i]+'%'}</b></div>`).join('')}</div>
  <div class="legend">Sample figures for this demo knit-along.</div>`;}
function vShare(){const d=C.data,last=d.done.lastIndexOf(true);
  return `<div class="card"><h3>Your progress post</h3><p style="font-size:14px">${last<0?'Nothing finished yet. Cast on and come back!':`Clue ${last+1} done: <b>${CLUES[last][0].toLowerCase()}</b>. ${5-d.done.filter(Boolean).length} to go before Christmas.`}</p></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared||last<0?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share to ${C.gateway}`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='clues'?vClues():S.tab==='group'?vGroup():vShare();
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;C.data.done[i]=!C.data.done[i];S.shared=false;GX.save(C.data);paint();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const l=C.data.done.lastIndexOf(true);GX.post(`Christmas jumper knit-along: <b>clue ${l+1} done</b> (${CLUES[l][0].toLowerCase()}). ${5-C.data.done.filter(Boolean).length} to go 🎄`,'KNIT ALONG').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
