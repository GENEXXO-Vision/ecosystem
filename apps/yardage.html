<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yardage</title>
<style>
/* Yardage, by "Linksmith Clubs" (fictional), 2026-11-14. A GENEXXO app for GolfXX.
   Front / middle / back of the green and the hazards on each hole of a sample links course, from a chosen spot
   on the hole, with a club suggested from the player's own carry distances. Wind: into +10%, down −10%.
   Hole drawings are generated from each hole's length and dogleg. */
:root{--bg:#F5F3EA;--card:#FFFDF6;--line:rgba(16,38,28,.1);--ink:#10261C;--mut:rgba(16,38,28,.55);--green:#1F6B3F;--gold:#B8912F;--sand:#E8D9A8;--blue:#4A90C2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#D9B45A,#9C7A2A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.hn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hn button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.hn b{font-size:17px}.hn small{display:block;text-align:center;color:var(--mut);font-size:12px;font-weight:700}
.wrap{display:grid;grid-template-columns:118px 1fr;gap:10px}
.map{background:#CFE3C2;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.dist{display:flex;flex-direction:column;gap:8px}
.d{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline}
.d small{color:var(--mut);font-weight:800;font-size:11px;letter-spacing:.06em}.d b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.d.mid{background:linear-gradient(135deg,#1F6B3F,#0F3B26);color:#F5F3EA;border-color:transparent}.d.mid small{color:rgba(245,243,234,.75)}.d.mid b{font-size:38px}
.club{background:rgba(184,145,47,.13);border-radius:14px;padding:10px 12px;font-weight:800;font-size:13.5px}.club b{color:var(--gold);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{font-size:12.5px;font-weight:800;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--mut);cursor:pointer;background:var(--card)}.chip.on{background:rgba(31,107,63,.12);color:var(--green);border-color:transparent}
.hz{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.hz div{display:flex;justify-content:space-between;padding:9px 0;font-weight:700;font-size:13px}.hz div+div{border-top:1px solid var(--line)}.hz span{color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:7px}
.row b{font-size:14px}
.step{display:flex;align-items:center;gap:8px}.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}.step span{min-width:44px;text-align:center;font-weight:900;font-size:15px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
.slider{width:100%;margin-top:4px;accent-color:#1F6B3F}
</style></head><body>
<div class="hd"><div class="logo">📍</div><div><h1>Yardage</h1><p>Linksmith Clubs · in GolfXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="hole" class="on">Hole</button><button data-tab="bag">My bag</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
/* Eden Links (sample): par, yards to middle from the tee, green depth, dogleg (-1 left, 0, 1 right), hazards [name, yards from tee] */
const H=[[4,402,30,1,[['Fairway bunker (right)',245],['Greenside bunker',385]]],[4,431,28,0,[['Burn crossing',280],['Pot bunker',410]]],[3,168,26,0,[['Front bunker',150]]],[5,516,34,-1,[['Fairway bunkers',260],['Cross bunkers',420],['Greenside bunker',500]]],
 [4,452,30,1,[['Gorse (right)',230],['Burn short of green',430]]],[4,371,32,-1,[['Fairway bunker (left)',220],['Greenside bunkers',355]]],[3,155,24,0,[['Pot bunker (left)',140]]],[4,428,28,0,[['Fairway bunker',250]]],[4,410,30,1,[['Dunes (right)',240],['Greenside bunker',395]]],
 [4,386,30,0,[['Fairway bunker',230]]],[5,532,36,1,[['Burn',300],['Greenside bunkers',515]]],[3,174,28,0,[['Front bunkers',155]]],[4,446,30,-1,[['Gorse (left)',250],['Pot bunker',425]]],[4,420,28,0,[['Fairway bunkers',255]]],[3,182,30,0,[['Burn (left)',165]]],
 [5,524,34,-1,[['Fairway bunker',270],['Cross bunker',440]]],[4,458,32,1,[['Out of bounds (right)',240],['Valley short of green',430]]],[4,414,34,0,[['Road (right)',250],['Swale in front of green',395]]]];
const CLUBS=['Driver','3-wood','5-wood','4-hybrid','5-iron','6-iron','7-iron','8-iron','9-iron','PW','GW','SW'];
const seed=()=>({hole:4,pos:230,wind:'calm',bag:[240,220,205,190,175,163,150,138,126,114,100,85]});
let C,S={tab:'hole'};
GX.init({gateway:'GolfXX',seed}).then(c=>{C=c;paint();});
const D=()=>C.data;
function pickClub(y){const w=D().wind==='into'?1.1:D().wind==='down'?.9:1,eff=Math.round(y*w),b=D().bag;
  if(eff>b[0])return {eff,name:'Driver'};
  let best=0;for(let i=0;i<b.length;i++){if(b[i]>=eff)best=i;}return {eff,name:CLUBS[best]};}
function svg(h){const [par,len,,dog]=h,W=118,Ht=300,ty=Ht-22,gy=30,gx=W/2+dog*22,mx=W/2-dog*12,my=(ty+gy)/2+20;
  const pos=Math.min(D().pos,len-20),t=pos/len,px=(1-t)*(1-t)*(W/2)+2*(1-t)*t*mx+t*t*gx,py=(1-t)*(1-t)*ty+2*(1-t)*t*my+t*t*gy;
  const hz=h[4].map(z=>{const u=Math.min(.97,z[1]/len),x=(1-u)*(1-u)*(W/2)+2*(1-u)*u*mx+u*u*gx+(/right/.test(z[0])?16:/left/.test(z[0])?-16:(z[1]%2?10:-10)),y=(1-u)*(1-u)*ty+2*(1-u)*u*my+u*u*gy;
    return /Burn|burn/.test(z[0])?`<path d="M6 ${y} Q${W/2} ${y-8} ${W-6} ${y}" stroke="#4A90C2" stroke-width="5" fill="none" stroke-linecap="round"/>`:/Gorse|Dunes|Out of|Road|Valley|Swale/.test(z[0])?`<circle cx="${x}" cy="${y}" r="9" fill="#7FA36B" opacity=".9"/>`:`<ellipse cx="${x}" cy="${y}" rx="8" ry="6" fill="#E8D9A8" stroke="#C9B57A"/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" style="display:block"><rect width="${W}" height="${Ht}" fill="#BFD8AE"/>
    <path d="M${W/2} ${ty} Q${mx} ${my} ${gx} ${gy}" stroke="#8CC17A" stroke-width="34" fill="none" stroke-linecap="round"/>
    ${hz}<ellipse cx="${gx}" cy="${gy}" rx="20" ry="15" fill="#6FBF5E"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy-22}" stroke="#10261C" stroke-width="1.5"/><path d="M${gx} ${gy-22} l11 4 l-11 4z" fill="#B23A2B"/>
    <rect x="${W/2-7}" y="${ty-3}" width="14" height="8" rx="2" fill="#F5F3EA" stroke="#10261C" stroke-width=".8"/>
    <circle cx="${px}" cy="${py}" r="6.5" fill="#fff" stroke="#1F6B3F" stroke-width="3"/></svg>`;}
function dyn(){const i=D().hole,h=H[i],[,len,depth]=h,pos=Math.min(D().pos,len-20),mid=len-pos,f=mid-Math.round(depth/2),b=mid+Math.round(depth/2),c=pickClub(mid);
  const ahead=h[4].filter(z=>z[1]>pos).map(z=>[z[0],z[1]-pos]);
  return {top:`<div class="wrap"><div class="map">${svg(h)}</div><div class="dist">
    <div class="d"><small>BACK</small><b>${b}</b></div><div class="d mid"><small>MIDDLE</small><b>${mid}</b></div><div class="d"><small>FRONT</small><b>${f}</b></div>
    <div class="club">Hit <b>${c.name}</b><br><span style="color:var(--mut);font-size:12px">plays ${c.eff} yds${D().wind!=='calm'?' with the wind':''}</span></div></div></div>
  <div style="margin-top:12px;font-size:12px;font-weight:800;color:var(--mut)">You are ${pos?pos+' yds from the tee':'on the tee'}</div>`,
  hz:ahead.length?ahead.map(z=>`<div>${z[0]}<span>${z[1]} to reach</span></div>`).join(''):'<div>Clear to the green<span>—</span></div>'};}
function vHole(){const i=D().hole,[par,len]=H[i],pos=Math.min(D().pos,len-20),d=dyn();
  return `<div class="hn"><button data-h="-1">‹</button><div><b>Hole ${i+1} · Par ${par}</b><small>${len} yards · Eden Links</small></div><button data-h="1">›</button></div>
  <div id="dTop">${d.top}</div>
  <input type="range" class="slider" id="pos" min="0" max="${len-20}" step="5" value="${pos}">
  <div class="chips">${[['calm','Calm'],['into','Into the wind'],['down','Downwind']].map(([k,l])=>`<span class="chip ${D().wind===k?'on':''}" data-w="${k}">${l}</span>`).join('')}</div>
  <div class="hz" id="dHz">${d.hz}</div>`;}
function vBag(){return `${CLUBS.map((n,i)=>`<div class="row"><b>${n}</b><div class="step"><button data-b="${i}:-5">–</button><span>${D().bag[i]}</span><button data-b="${i}:5">+</button></div></div>`).join('')}
  <div class="legend">Your carry distance with each club, in yards. Yardage uses these to choose your club.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='hole'?vHole():vBag();
  v.querySelectorAll('[data-h]').forEach(e=>e.onclick=()=>{D().hole=(D().hole+(+e.dataset.h)+18)%18;D().pos=0;GX.save(D());paint();});
  v.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{D().wind=e.dataset.w;GX.save(D());paint();});
  const p=document.getElementById('pos');if(p){p.oninput=()=>{D().pos=+p.value;const d=dyn();document.getElementById('dTop').innerHTML=d.top;document.getElementById('dHz').innerHTML=d.hz;};p.onchange=()=>GX.save(D());}
  v.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{const [i,d]=e.dataset.b.split(':').map(Number);D().bag[i]=Math.min(330,Math.max(30,D().bag[i]+d));GX.save(D());paint();});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
