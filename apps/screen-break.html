<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screen Break</title>
<style>
/* Screen Break, by Ready Up (fictional), 2026-11-21. A GENEXXO app for EsportsXX.
   A play session clock with a break nudge every 60 minutes, a daily limit the player chooses, five simple stretches
   (general wellbeing, not treatment: pain or numbness → see a physio or GP), and a week of play-time. */
:root{--bg:#0B0F0A;--card:rgba(255,255,255,.045);--line:rgba(236,246,230,.1);--ink:#ECF6E6;--mut:rgba(236,246,230,.55);--lime:#A3E635;--cy:#22D3EE;--amb:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#A3E635,#3F6212);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--lime)}
.ring{display:flex;justify-content:center;margin:4px 0}.ring svg{width:210px;height:210px}
.nb{border-radius:16px;padding:12px 14px;background:linear-gradient(150deg,#26360F,#11180A);border:1px solid rgba(163,230,53,.3);text-align:center}.nb small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--lime)}.nb b{display:block;font-size:22px;font-weight:900}
.lim{margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}.lim .h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--mut)}.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--lime)}
.row{display:flex;gap:8px}.go{flex:1;width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--lime);color:#1A2606;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.sx{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}.sx .e{font-size:26px}.sx b{display:block}.sx p{color:var(--mut);font-size:13px}.sx .ck{margin-left:auto;align-self:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;font-weight:900;color:#1A2606}.sx .ck.on{background:var(--lime);border-color:var(--lime)}
.wk{position:relative;display:flex;align-items:flex-end;gap:8px;height:170px;padding:12px 10px 8px;background:var(--card);border:1px solid var(--line);border-radius:16px}.wk div{flex:1;text-align:center;z-index:1}.wk i{display:block;border-radius:7px 7px 2px 2px;margin:0 auto;width:75%}.wk small{display:block;font-size:10.5px;color:var(--mut);margin-top:3px}
.wk .ln{position:absolute;left:8px;right:8px;border-top:2px dashed var(--amb);z-index:0}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 0;cursor:pointer}.seg button.on{background:var(--lime);border-color:var(--lime);color:#1A2606}
.note{font-size:12.5px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:10px 12px;margin-top:10px;color:#FDE68A}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🧘</div><div><h1>Screen Break</h1><p>Ready Up · in EsportsXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="s" class="on">Session</button><button data-tab="x">Stretches</button><button data-tab="w">This week</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const X=[['🤲','Wrist circles','Ten slow circles each way, both wrists.'],['🙏','Prayer stretch','Palms together, lower your hands until you feel the stretch. Hold 15 seconds.'],['🖐️','Finger spread','Spread your fingers wide, then make a loose fist. Ten times.'],['🙆','Neck tilt','Ear towards shoulder, hold 10 seconds each side. No forcing.'],['👀','20-20-20','Look at something 20 feet away for 20 seconds.']];
const seed=()=>({limit:180,secs:3120,today:95,done:[],week:[120,150,90,200,110,240,95]});
let C,S={tab:'s',run:false,shared:false},tick=null;
GX.init({gateway:'EsportsXX',seed}).then(c=>{C=c;paint();});
const hm=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
function vS(){const d=C.data,inHr=d.secs%3600,left=Math.max(0,3600-inHr),pct=inHr/3600,R=88,L=2*Math.PI*R,tot=d.today+Math.floor(d.secs/60)-52;
  return `<div class="ring"><svg viewBox="0 0 210 210"><circle cx="105" cy="105" r="${R}" stroke="rgba(255,255,255,.08)" stroke-width="14" fill="none"/><circle cx="105" cy="105" r="${R}" stroke="${left<600?'#FBBF24':'#A3E635'}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-pct)}" transform="rotate(-90 105 105)"/>
  <text x="105" y="98" text-anchor="middle" font-size="34" font-weight="900" fill="#ECF6E6" font-family="-apple-system,sans-serif" id="clk">${Math.floor(d.secs/60)}:${String(d.secs%60).padStart(2,'0')}</text><text x="105" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(236,246,230,.55)" font-family="-apple-system,sans-serif">this session</text></svg></div>
  <div class="nb"><small>${left<600?'BREAK SOON':'NEXT BREAK IN'}</small><b>${Math.ceil(left/60)} min</b></div>
  <div class="lim"><div class="h"><span>Today: ${hm(Math.max(0,tot))}</span><span>Your limit: ${hm(d.limit)}</span></div><div class="bar"><i style="width:${Math.min(100,100*tot/d.limit)}%;${tot>d.limit?'background:#FBBF24':''}"></i></div></div>
  <div class="row"><button class="go" id="run">${S.run?'Pause':'Playing'}</button><button class="go alt" id="brk">Take a break now</button></div>`;}
function vX(){const d=C.data;return X.map((x,i)=>`<div class="sx"><span class="e">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div><button class="ck ${d.done.includes(i)?'on':''}" data-x="${i}">${d.done.includes(i)?'✓':''}</button></div>`).join('')+
  `<div class="note">Pain, tingling or numbness that doesn’t go away isn’t something to stretch through. See a physio or your GP.</div>`;}
function vW(){const d=C.data,mx=Math.max(d.limit,...d.week),days=Array.from({length:7},(_,i)=>GX.day(GX.today(i-6),{weekday:'narrow'}));
  return `<div class="wk"><span class="ln" style="bottom:${8+14+130*d.limit/mx}px"></span>${d.week.map((m,i)=>`<div><i style="height:${Math.max(4,130*m/mx)}px;background:${m>d.limit?'#FBBF24':'linear-gradient(#A3E635,#4D7C0F)'}"></i><small>${days[i]}</small></div>`).join('')}</div>
  <div class="legend">Dashed line: your daily limit. ${d.week.filter(m=>m>d.limit).length} day(s) over this week.</div>
  <div class="seg">${[120,180,240].map(m=>`<button data-l="${m}" class="${d.limit===m?'on':''}">${m/60} h a day</button>`).join('')}</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my healthy week'}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='s'?vS():S.tab==='x'?vX():vW();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const i=+b.dataset.x,k=d.done.indexOf(i);k<0?d.done.push(i):d.done.splice(k,1);sv();});
  v.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{d.limit=+b.dataset.l;sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('run',()=>{if(S.run){clearInterval(tick);S.run=false;}else{S.run=true;tick=setInterval(()=>{d.secs++;if(S.tab==='s'){if(d.secs%60===0)paint();else{const k=document.getElementById('clk');if(k)k.textContent=Math.floor(d.secs/60)+':'+String(d.secs%60).padStart(2,'0');}}},1000);}paint();});
  on('brk',()=>{clearInterval(tick);S.run=false;d.today+=Math.floor(d.secs/60)-52;d.secs=0;d.done=[];S.tab='x';sv();});
  on('share',()=>{const over=d.week.filter(m=>m>d.limit).length;GX.post(`This week: <b>${hm(d.week.reduce((a,m)=>a+m,0))}</b> of gaming, a break every hour, and ${over?over+' day over my limit':'every day under my limit'}. Stretches done 🧘`,'SCREEN BREAK').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
