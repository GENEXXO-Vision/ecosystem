<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conditions</title>
<style>
/* Conditions, by "Rockcast" (fictional), 2026-10-09. A GENEXXO app. Forecasts are seeded by date + crag:
   they change daily and hold steady within a day. */
:root{--bg:#0A1620;--card:#102231;--line:rgba(255,255,255,.08);--ink:#E6F4FF;--mut:rgba(230,244,255,.55);--acc:#0EA5E9;--good:#4ADE80;--ok:#FACC15;--bad:#F87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7DD3FC,#0369A1);display:flex;align-items:center;justify-content:center;font-size:20px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.crag{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.crag.on{border-color:var(--acc)}.crag b{display:block;font-size:14.5px}.crag span{font-size:11.5px;color:var(--mut);font-weight:600}
.dry{margin-left:auto;text-align:right}.dry b{font-size:20px}.dry small{display:block;font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase}
.sel{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:8px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px}
.fd{text-align:center}.fd small{display:block;font-size:10px;font-weight:800;color:var(--mut)}.fd i{display:block;font-style:normal;font-size:20px;margin:4px 0}
.fd b{font-size:13px}.fd em{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:700}
.bar{height:44px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 2px}.bar span{width:12px;border-radius:4px}
.legend{font-size:11px;color:var(--mut);margin-top:8px;text-align:center}
.win{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px}
.win h3{font-size:14.5px;font-weight:800}.win p{font-size:12px;color:var(--mut);margin-top:2px}
.go{width:100%;font:inherit;font-weight:900;font-size:14px;padding:12px;border:1px solid var(--acc);border-radius:12px;background:transparent;color:var(--acc);cursor:pointer;margin-top:10px}
</style></head><body>
<div class="hd"><div class="logo">⛅</div><div><h1>Conditions</h1><p>by Rockcast · crag weather</p></div></div>
<div class="tabs" id="tabs"><button data-tab="crags" class="on">Crags</button><button data-tab="forecast">7-day</button><button data-tab="windows">Best windows</button></div>
<main id="v"></main>
<script src="gx-sdk.js"></script>
<script>
const CRAGS = [
  {k:'stanage', n:'Stanage Edge', r:'Peak District · gritstone', aspect:'SW', wet:1.2},
  {k:'font', n:'Fontainebleau', r:'France · sandstone', aspect:'—', wet:1.0},
  {k:'kaly', n:'Kalymnos', r:'Greece · limestone', aspect:'W', wet:.4},
  {k:'siurana', n:'Siurana', r:'Spain · limestone', aspect:'S', wet:.5},
  {k:'ceuse', n:'Céüse', r:'France · limestone', aspect:'S', wet:.8},
];
let C, S = { tab:'crags', crag:'stanage', shared:false };
function day(c, off){ const r=GX.rng(c.k+GX.iso(off)); const rain=Math.max(0,(r()*10-5)*c.wet), temp=Math.round(8+r()*14+(c.wet<.6?8:0)), wind=Math.round(5+r()*30);
  const dry=Math.max(0,Math.min(100,Math.round(100-rain*14-(off===0?0:4)+(wind>18?6:0)))); const icon=rain>3?'🌧️':rain>.8?'🌦️':r()>.5?'☀️':'⛅';
  return {off, rain:Math.round(rain*10)/10, temp, wind, dry, icon}; }
const col = d => d>=75?'var(--good)':d>=45?'var(--ok)':'var(--bad)';
GX.init({gateway:'ClimbXX', seed:()=>({fav:'stanage'})}).then(c=>{ C=c; S.crag=c.data.fav||'stanage'; paint(); });

function vCrags(){ return CRAGS.map(c=>{ const t=day(c,0); return `<div class="crag ${c.k===S.crag?'on':''}" data-c="${c.k}">
  <div style="font-size:24px">${t.icon}</div><div><b>${c.n}</b><span>${c.r} · ${t.temp}°C · wind ${t.wind} km/h</span></div>
  <div class="dry"><b style="color:${col(t.dry)}">${t.dry}%</b><small>dry rock</small></div></div>`; }).join('')
  + `<div class="legend">Tap a crag to see its week. Dry-rock score blends rain, drying wind and aspect.</div>`; }
function vForecast(){ const c=CRAGS.find(x=>x.k===S.crag); const days=[0,1,2,3,4,5,6].map(o=>day(c,o));
  return `<div class="sel">${c.n} · ${c.r} · faces ${c.aspect}</div><div class="fc">${days.map(d=>`<div class="fd"><small>${d.off===0?'Today':GX.day(GX.today(d.off),{weekday:'short'})}</small><i>${d.icon}</i><b>${d.temp}°</b>
    <div class="bar"><span style="height:${Math.max(4,d.dry*.44)}px;background:${col(d.dry)}"></span></div><em>${d.dry}%</em><em>${d.rain}mm</em></div>`).join('')}</div>
    <div class="legend">Bars show the dry-rock score for each day.</div>`; }
function windows(){ const out=[]; CRAGS.forEach(c=>[0,1,2,3,4,5,6].forEach(o=>{ const d=day(c,o); out.push({c,d}); })); return out.sort((a,b)=>b.d.dry-a.d.dry||a.d.off-b.d.off).slice(0,4); }
function vWindows(){ const w=windows(); return w.map((x,i)=>`<div class="win"><h3>${i===0?'⭐ ':''}${x.c.n} · ${x.d.off===0?'Today':GX.day(GX.today(x.d.off))}</h3>
    <p>${x.d.icon} ${x.d.temp}°C · ${x.d.dry}% dry · wind ${x.d.wind} km/h${x.d.temp<14?' · cold, great friction':''}</p></div>`).join('')
  + (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share the best window to ${C.gateway}`}</button>`:''); }
function paint(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'); v.innerHTML=S.tab==='crags'?vCrags():S.tab==='forecast'?vForecast():vWindows();
  v.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{ S.crag=e.dataset.c; C.data.fav=S.crag; GX.save(C.data); S.tab='forecast'; paint(); });
  const sh=document.getElementById('share'); if(sh) sh.onclick=()=>{ const x=windows()[0];
    GX.post(`Best climbing window this week: <b>${x.c.n}</b>, ${x.d.off===0?'today':GX.day(GX.today(x.d.off),{weekday:'long'})}. ${x.d.dry}% dry rock, ${x.d.temp}°C.`, 'CONDITIONS').then(ok=>{ if(ok){S.shared=true;paint();} }); }; }
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; paint();};
</script></body></html>
