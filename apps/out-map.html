<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Out Map</title>
<style>
/* Out Map, by Out & Away Travel (fictional), 2026-11-19. A GENEXXO app for PrideXX.
   LGBTQ+-owned and -welcoming places, checked by the community, on a stylised map with filters (sober, step-free,
   under-18); save favourites; report a change. Places are fictional; cities and neighbourhoods are real. */
:root{--bg:#120E18;--card:rgba(255,255,255,.05);--line:rgba(246,240,250,.1);--ink:#F6F0FA;--mut:rgba(246,240,250,.55);--sun:#FFC94D;--pink:#FF5DA2;--sky:#7DD3FC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FFC94D,#E8590C);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sun)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:6px 11px;cursor:pointer}.chip.on{background:var(--sun);border-color:var(--sun);color:#2A1A00}
.map{position:relative;height:190px;border-radius:16px;overflow:hidden;background:#1B1626;border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:20px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));background:none;border:0}
.pin.sel{font-size:28px}
.pl{display:flex;gap:11px;align-items:center;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer}.pl.sel{border-color:var(--sun)}
.pl .e{width:40px;height:40px;border-radius:11px;background:rgba(255,201,77,.13);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pl .x{flex:1;min-width:0}.pl .x b{font-size:14px;display:block}.pl .x small{display:block;color:var(--mut);font-size:12px}
.tags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}.tags i{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(125,211,252,.13);color:var(--sky)}
.sv{font:inherit;font-size:18px;background:none;border:0;cursor:pointer;color:var(--mut)}.sv.on{color:var(--pink)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sun);color:#2A1A00;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
.ok{background:rgba(125,211,252,.1);border:1px solid rgba(125,211,252,.3);border-radius:14px;padding:14px;margin-top:12px;font-size:13.5px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}.empty{padding:26px 10px;text-align:center;color:var(--mut)}
</style></head><body>
<div class="hd"><div class="logo">📍</div><div><h1>Out Map</h1><p>Out & Away Travel · in PrideXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="near" class="on">Nearby</button><button data-tab="saved">Saved</button><button data-tab="report">Report a change</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const P={
 Leeds:[{n:'Rainbow Teapot',k:'Café',e:'☕',a:'Lower Briggate',x:46,y:42,tags:['sober','stepfree'],c:2},{n:'Spectrum North',k:'Bookshop',e:'📚',a:'Kirkgate',x:62,y:56,tags:['sober'],c:5},{n:'The Lock-In',k:'Bar',e:'🍸',a:'Call Lane',x:52,y:66,tags:['stepfree'],c:1},{n:'Out Youth Leeds',k:'Youth group',e:'🌱',a:'Merrion Street',x:34,y:28,tags:['under18','sober','stepfree'],c:9},{n:'Clear Head Club',k:'Sober social',e:'🫖',a:'Chapel Allerton',x:72,y:22,tags:['sober','stepfree'],c:4}],
 Manchester:[{n:'Village Bakehouse',k:'Café',e:'🥐',a:'Canal Street',x:55,y:48,tags:['sober','stepfree'],c:1},{n:'Hexagon Café',k:'Board games',e:'🎲',a:'Northern Quarter',x:40,y:32,tags:['sober'],c:3},{n:'The Lamplight',k:'Bar',e:'🍸',a:'Canal Street',x:60,y:56,tags:[],c:2},{n:'Proud Pages',k:'Bookshop',e:'📚',a:'Oxford Road',x:48,y:72,tags:['sober','stepfree'],c:6}],
 Brighton:[{n:'Spectrum Books',k:'Bookshop',e:'📚',a:'St James’s Street',x:58,y:52,tags:['sober','stepfree'],c:1},{n:'Seafront Kiosk',k:'Café',e:'🍦',a:'Madeira Drive',x:46,y:78,tags:['sober','stepfree'],c:3},{n:'The Pier Rooms',k:'Bar & brunch',e:'🥞',a:'Marine Parade',x:66,y:70,tags:['stepfree'],c:2}],
 Glasgow:[{n:'Merchant Cup',k:'Café',e:'☕',a:'Merchant City',x:52,y:50,tags:['sober','stepfree'],c:2},{n:'Proud Threads Mill Shop',k:'Shop',e:'🧶',a:'East End',x:74,y:58,tags:['stepfree'],c:4},{n:'Queer Youth Glasgow',k:'Youth group',e:'🌱',a:'Trongate',x:44,y:36,tags:['under18','sober'],c:7}]};
const FL={sober:'Sober',stepfree:'Step-free',under18:'Under-18s'},CH=['Closed down','New opening hours','No longer welcoming','Now step-free','Something else'];
const seed=()=>({city:'Leeds',saved:['Leeds:1','Manchester:1','Brighton:0']});
let C,S={tab:'near',f:{},sel:0,rp:null,rc:null,sent:false,shared:false};
GX.init({gateway:'PrideXX',seed}).then(c=>{C=c;paint();});
const tagsOf=p=>p.tags.map(t=>`<i>${FL[t]}</i>`).join('');
const id=(c,i)=>c+':'+i;
const card=(c,p,i,sel)=>`<div class="pl ${sel?'sel':''}" data-sel="${i}"><div class="e">${p.e}</div><div class="x"><b>${GX.esc(p.n)}</b><small>${p.k} · ${GX.esc(p.a)}, ${c} · checked ${p.c}d ago</small><div class="tags">${tagsOf(p)}</div></div><button class="sv ${C.data.saved.includes(id(c,i))?'on':''}" data-save="${id(c,i)}">${C.data.saved.includes(id(c,i))?'♥':'♡'}</button></div>`;
function vNear(){const c=C.data.city,list=P[c].map((p,i)=>[p,i]).filter(([p])=>Object.keys(S.f).every(k=>!S.f[k]||p.tags.includes(k)));
  if(!list.some(([,i])=>i===S.sel)&&list[0])S.sel=list[0][1];
  return `<div class="chips">${Object.keys(P).map(k=>`<button class="chip ${c===k?'on':''}" data-city="${k}">${k}</button>`).join('')}</div>
  <div class="map"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 60 Q30 52 50 62 T100 55" stroke="#2E5A7A" stroke-width="5" fill="none" opacity=".7"/><path d="M10 0 L30 100 M0 30 L100 40 M70 0 L60 100 M0 85 L100 78" stroke="#2A2338" stroke-width="2.2" fill="none"/></svg>
  ${list.map(([p,i])=>`<button class="pin ${i===S.sel?'sel':''}" style="left:${p.x}%;top:${p.y}%" data-sel="${i}">${p.e}</button>`).join('')}</div>
  <div class="chips" style="margin-top:10px">${Object.keys(FL).map(k=>`<button class="chip ${S.f[k]?'on':''}" data-f="${k}">${FL[k]}</button>`).join('')}</div>
  ${list.length?list.map(([p,i])=>card(c,p,i,i===S.sel)).join(''):'<div class="empty">No places match those filters here yet.</div>'}
  <div class="legend">Every place is checked by the PrideXX community.</div>`;}
function vSaved(){const s=C.data.saved.map(k=>{const [c,i]=k.split(':');return [c,P[c]&&P[c][+i],+i];}).filter(x=>x[1]);
  return s.length?s.map(([c,p,i])=>card(c,p,i,false)).join('')+(GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my favourite places to ${C.gateway}`}</button>`:''):'<div class="empty">Tap ♡ on a place to save it.</div>';}
function vReport(){const c=C.data.city;if(S.sent)return `<div class="ok">✓ Thanks. A community checker will look at <b>${GX.esc(P[c][S.rp].n)}</b> (${CH[S.rc].toLowerCase()}) within two days.</div><button class="go" id="again">Report something else</button>`;
  return `<div class="lbl">Which place in ${c}?</div><div class="chips">${P[c].map((p,i)=>`<button class="chip ${S.rp===i?'on':''}" data-rp="${i}">${p.e} ${GX.esc(p.n)}</button>`).join('')}</div>
  <div class="lbl">What has changed?</div><div class="chips">${CH.map((t,i)=>`<button class="chip ${S.rc===i?'on':''}" data-rc="${i}">${t}</button>`).join('')}</div>
  <button class="go" id="send" ${S.rp==null||S.rc==null?'disabled':''}>Send to the checkers</button><div class="legend">Reports are anonymous.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='near'?vNear():S.tab==='saved'?vSaved():vReport();
  v.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{C.data.city=b.dataset.city;S.sel=0;S.rp=null;GX.save(C.data);paint();});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f[b.dataset.f]=!S.f[b.dataset.f];paint();});
  v.querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-save]'))return;S.sel=+b.dataset.sel;paint();});
  v.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=C.data.saved,k=s.indexOf(b.dataset.save);k<0?s.push(b.dataset.save):s.splice(k,1);GX.save(C.data);paint();});
  v.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{S.rp=+b.dataset.rp;paint();});
  v.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{S.rc=+b.dataset.rc;paint();});
  const sd=document.getElementById('send');if(sd)sd.onclick=()=>{S.sent=true;paint();};
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{S.sent=false;S.rp=S.rc=null;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`My favourite welcoming places: <b>${C.data.saved.length} spots</b> saved on Out Map, all checked by the community 📍`,'OUT MAP').then(ok=>{if(ok){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
