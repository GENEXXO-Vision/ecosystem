<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Cards</title>
<style>
/* Study Cards, by Recall Cards (fictional), 2026-11-24. A GENEXXO app for PsychologyXX.
   Ten classic studies, summarised for revision. Check details against your own course notes. */
:root{--bg:#F6F6FB;--card:#FFFFFF;--line:rgba(0,0,0,.09);--off:rgba(0,0,0,.06);--ink:#15142B;--mut:rgba(21,20,43,.55);--acc:#3730A3;--accInk:#FFFFFF;--ok:#22C55E;--bad:#EF4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#818CF8,#3730A3);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.hero{text-align:center;padding:18px 14px}.hero small{display:block;color:var(--mut);font-weight:700;font-size:12px}.hero b{display:block;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1.15}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0;text-align:center}.grid small{display:block;color:var(--mut);font-weight:700;font-size:11.5px}.grid b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.row{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}.row b{flex:1;font-size:14px}.row span{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700;font-size:13px;text-align:right}.row em{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:600;display:block}
.row.warn{border-color:var(--acc)}.row.bad{border-color:var(--bad)}
.step{display:flex;align-items:center;gap:8px;margin-top:6px}.step label{flex:1;font-weight:700;font-size:13.5px}.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:900;font-size:17px;cursor:pointer}.step output{min-width:74px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
input.tx{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:8px}.bars div{flex:1;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px;position:relative}.bars div.dim{opacity:.45}.bars div.hi{background:var(--bad)}
.blab{display:flex;gap:4px}.blab span{flex:1;text-align:center;font-size:10px;color:var(--mut);font-weight:700}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--acc);color:var(--accInk);cursor:pointer}.go:disabled{background:var(--off);color:var(--mut)}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:900;border-radius:99px;padding:3px 9px;letter-spacing:.04em}.pill.ok{background:rgba(34,197,94,.16);color:var(--ok)}.pill.bad{background:rgba(239,68,68,.16);color:var(--bad)}.pill.due{background:var(--off);color:var(--acc)}
.prog{height:12px;border-radius:99px;background:var(--off);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.q b{display:block;font-size:16px;margin-top:4px}.q small{color:var(--mut);font-weight:700}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px;cursor:pointer}.opt.right{border-color:var(--ok);background:rgba(34,197,94,.12)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.1)}
.fc{text-align:center;padding:26px 16px}.fc b{font-size:22px;display:block}.fc small{color:var(--mut);font-weight:700}.det{text-align:left;margin-top:12px;font-size:13.5px}.det p{margin-top:6px}
</style></head><body>
<div class="hd"><div class="logo">🗂️</div><div><h1>Study Cards</h1><p>Recall Cards · in PsychologyXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="c" class="on">Cards</button><button data-tab="k">Progress</button><button data-tab="l">All studies</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
let C,S={tab:'c',shared:false};
const $=id=>document.getElementById(id),fmt=(n,d=0)=>Number(n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const shareBtn=(label)=>GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:label}</button>`:'';

const ST=[['Loftus & Palmer (1974)','Memory','Do leading questions change eyewitness memory?','Students watched car crashes; the verb in the question changed (smashed, hit, contacted).','“Smashed” gave the highest speed estimates.','Lab clips aren’t real crashes, so ecological validity is low.'],
 ['Milgram (1963)','Social influence','Will people obey an authority figure to harm someone?','Participants were told to give rising “shocks” to a learner (no real shocks).','65% went to the highest level, 450 volts.','Deception and distress raise serious ethical issues.'],
 ['Asch (1951)','Social influence','Do people conform to a group’s wrong answer?','Line-judging task with confederates giving wrong answers.','About a third of answers conformed; 75% conformed at least once.','Done in 1950s USA, so it may be a “child of its time”.'],
 ['Baddeley (1966)','Memory','How are words coded in short- and long-term memory?','Recall of similar-sounding or similar-meaning word lists.','Short-term memory is mainly acoustic; long-term mainly semantic.','Artificial word lists, not meaningful material.'],
 ['Peterson & Peterson (1959)','Memory','How long does short-term memory last?','Trigrams recalled after counting backwards for 3–18 seconds.','Recall fell to around 10% after 18 seconds.','Counting may have caused interference, not just decay.'],
 ['Godden & Baddeley (1975)','Memory','Does context help recall?','Divers learned words on land or underwater, then recalled in the same or other place.','Recall was better in the same context.','A very unusual setting, hard to generalise.'],
 ['Ainsworth (1970)','Attachment','How do infants differ in attachment?','The Strange Situation: separations and reunions with a caregiver and stranger.','Secure, insecure-avoidant and insecure-resistant types.','Mainly US middle-class families; cultural bias.'],
 ['Harlow (1958)','Attachment','Is comfort or food more important for attachment?','Infant monkeys with a wire “mother” with milk and a cloth “mother” without.','Monkeys preferred the cloth mother.','Animal research raises ethical and generalisation issues.'],
 ['Bowlby (1944)','Attachment','Does early separation affect later behaviour?','Case histories of 44 young people referred to a clinic.','Many had experienced early prolonged separation.','Correlation only; retrospective data.'],
 ['Zimbardo (1973)','Social influence','Do social roles change behaviour?','Students were randomly given guard or prisoner roles in a mock prison.','Guards became harsh; it was stopped after six days.','Zimbardo was also “superintendent”, so bias is possible.']];
const seed=()=>({i:0,known:[0,3]});
let SHOW=false;
const VIEWS={
 c(){const d=C.data,s=ST[d.i];return `<div class="card fc"><small>${s[1]} · card ${d.i+1} of ${ST.length}</small><b>${s[0]}</b>${SHOW?`<div class="det"><p><b style="display:inline;font-size:13.5px">Aim:</b> ${s[2]}</p><p><b style="display:inline;font-size:13.5px">Method:</b> ${s[3]}</p><p><b style="display:inline;font-size:13.5px">Result:</b> ${s[4]}</p><p><b style="display:inline;font-size:13.5px">Criticism:</b> ${s[5]}</p></div>`:''}</div>`+
  (SHOW?`<div class="grid"><button class="go alt" id="again">Still learning</button><button class="go" id="knew">I knew it</button></div>`:`<button class="go" id="show">Reveal</button>`);},
 k(){const k=C.data.known.length;return `<div class="card hero"><small>Studies you know</small><b>${k} / ${ST.length}</b><div class="prog"><i style="width:${k/ST.length*100}%"></i></div></div>`+['Memory','Social influence','Attachment'].map(t=>{const all=ST.filter(s=>s[1]===t).length,n=C.data.known.filter(i=>ST[i][1]===t).length;return `<div class="row"><b>${t}</b><span>${n} / ${all}</span></div>`;}).join('')+shareBtn('Share my progress');},
 l(){return ST.map((s,i)=>`<div class="row"><b>${s[0]}<em>${s[1]}</em></b>${C.data.known.includes(i)?'<span class="pill ok">KNOWN</span>':'<span class="pill due">LEARNING</span>'}</div>`).join('');}};
function bind(v){const d=C.data,nx=()=>{d.i=(d.i+1)%ST.length;SHOW=false;save();};
 const s=$('show');if(s)s.onclick=()=>{SHOW=true;paint();};
 const k=$('knew');if(k)k.onclick=()=>{if(!d.known.includes(d.i))d.known.push(d.i);S.shared=false;nx();};
 const a=$('again');if(a)a.onclick=()=>{d.known=d.known.filter(x=>x!==d.i);nx();};}
const shareText=()=>`I know ${C.data.known.length} of ${ST.length} key psychology studies 🗂️ Testing myself beats rereading.`;

function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=$('v');v.innerHTML=VIEWS[S.tab]();bind(v);
  const sh=$('share');if(sh)sh.onclick=()=>GX.post(shareText(),'STUDY CARDS').then(o=>{if(o){S.shared=true;paint();}});}
const save=()=>{GX.save(C.data);paint();};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
GX.init({gateway:'PsychologyXX',seed}).then(c=>{C=c;paint();});
</script></body></html>
