<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carat Size</title>
<style>
/* Carat Size, by Lumen Lab Diamonds (fictional), 2026-11-20. A GENEXXO app for DiamondXX.
   Draws diamonds at approximately real size (CSS mm; screens vary). Typical face-up sizes at 1ct: round 6.4mm,
   oval 7.7×5.7, emerald 7.0×5.0, pear 8.0×5.0, princess 5.5×5.5, cushion 6.0×6.0; other weights scale with the cube
   root of the carat ratio. Typical figures for well-cut stones; real stones vary. */
:root{--bg:#0C0E14;--card:rgba(255,255,255,.05);--line:rgba(241,243,248,.1);--ink:#F1F3F8;--mut:rgba(241,243,248,.55);--ice:#A5D8FF;--plat:#D1D5DB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#D1D5DB,#6B7280);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--plat)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:6px 11px;cursor:pointer}.chip.on{background:var(--plat);border-color:var(--plat);color:#111}
.stage{height:220px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#2A3448,#0F1420);display:flex;align-items:center;justify-content:center;gap:26px;position:relative;overflow:hidden}
.finger{position:absolute;width:21mm;height:100%;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#B98A72,#D9A98F 45%,#B98A72);border-radius:10mm 10mm 0 0;top:30px;opacity:.9}
.band{position:absolute;left:50%;transform:translateX(-50%);top:120px;width:23mm;height:2.2mm;background:linear-gradient(#EEF1F6,#A8AFBA);border-radius:2px}
.stone{position:relative;z-index:2;background:radial-gradient(circle at 35% 30%,#FFFFFF,#D8EEFF 30%,#9FC4E8 60%,#6E8FB5);box-shadow:0 0 18px rgba(165,216,255,.6),inset 0 0 0 1px rgba(255,255,255,.7)}
.info{text-align:center;margin-top:10px}.info b{font-size:20px;font-weight:900}.info small{display:block;color:var(--mut);font-size:12.5px}
.two{display:flex;gap:8px}.two>div{flex:1}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--plat);color:#111;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🔍</div><div><h1>Carat Size</h1><p>Lumen Lab Diamonds · in DiamondXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="s" class="on">On a hand</button><button data-tab="sh">Shapes</button><button data-tab="c">Compare</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const SH={Round:[6.4,6.4,'50%'],Oval:[5.7,7.7,'50%'],Emerald:[5.0,7.0,'8%'],Pear:[5.0,8.0,'50% 50% 50% 50% / 62% 62% 38% 38%'],Princess:[5.5,5.5,'4%'],Cushion:[6.0,6.0,'26%']};
const CT=[0.25,0.5,0.75,1,1.5,2,3];
const seed=()=>({shape:'Round',ct:1,a:{shape:'Round',ct:1},b:{shape:'Oval',ct:1}});
let C,S={tab:'s',shared:false};
GX.init({gateway:'DiamondXX',seed}).then(c=>{C=c;paint();});
const dims=(shape,ct)=>{const [w,h,r]=SH[shape],k=Math.cbrt(ct);return {w:+(w*k).toFixed(1),h:+(h*k).toFixed(1),r};};
const stone=(shape,ct)=>{const d=dims(shape,ct);return `<div class="stone" style="width:${d.w}mm;height:${d.h}mm;border-radius:${d.r}"></div>`;};
const ctChips=(sel,attr)=>`<div class="chips">${CT.map(c=>`<button class="chip ${sel===c?'on':''}" data-${attr}="${c}">${c}ct</button>`).join('')}</div>`;
const shChips=(sel,attr)=>`<div class="chips">${Object.keys(SH).map(s=>`<button class="chip ${sel===s?'on':''}" data-${attr}="${s}">${s}</button>`).join('')}</div>`;
function vS(){const d=C.data,m=dims(d.shape,d.ct);return `<div class="stage"><div class="finger"></div><div class="band"></div><div style="position:absolute;top:calc(121px - ${m.h/2}mm);left:50%;transform:translateX(-50%)">${stone(d.shape,d.ct)}</div></div>
  <div class="info"><b>${d.ct}ct ${d.shape.toLowerCase()}</b><small>about ${m.w===m.h?m.w+'mm across':m.h+' × '+m.w+'mm'} · roughly real size on most phones</small></div>${ctChips(d.ct,'ct')}`;}
function vSh(){const d=C.data;return `<div class="stage" style="flex-wrap:wrap;gap:18px;padding:16px">${Object.keys(SH).map(s=>`<div style="text-align:center">${stone(s,d.ct)}<div style="font-size:11px;color:var(--mut);margin-top:6px">${s}</div></div>`).join('')}</div>
  <div class="info"><b>All ${d.ct}ct</b><small>Same weight, different face-up size: ovals and pears look bigger than rounds.</small></div>${ctChips(d.ct,'ct')}`;}
function vC(){const {a,b}=C.data,ma=dims(a.shape,a.ct),mb=dims(b.shape,b.ct),area=x=>x.w*x.h,pct=Math.round(100*(area(mb)/area(ma)-1));
  return `<div class="stage">${stone(a.shape,a.ct)}${stone(b.shape,b.ct)}</div><div class="info"><b>${pct>=0?'+':''}${pct}% face-up area</b><small>${b.ct}ct ${b.shape.toLowerCase()} vs ${a.ct}ct ${a.shape.toLowerCase()}</small></div>
  <div class="two"><div>${shChips(a.shape,'as')}${ctChips(a.ct,'ac')}</div><div>${shChips(b.shape,'bs')}${ctChips(b.ct,'bc')}</div></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Ask ${C.gateway}: which looks better?`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='s'?vS():S.tab==='sh'?vSh():vC();const d=C.data,sv=()=>{S.shared=false;GX.save(d);paint();};
  v.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{d.ct=+b.dataset.ct;sv();});
  [['as','a','shape',String],['ac','a','ct',Number],['bs','b','shape',String],['bc','b','ct',Number]].forEach(([at,o,k,f])=>v.querySelectorAll(`[data-${at}]`).forEach(b=>b.onclick=()=>{d[o][k]=f(b.dataset[at]);sv();}));
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`Torn between a <b>${d.a.ct}ct ${d.a.shape.toLowerCase()}</b> and a <b>${d.b.ct}ct ${d.b.shape.toLowerCase()}</b>. Which would you pick? 🔍`,'CARAT SIZE').then(o=>{if(o){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
