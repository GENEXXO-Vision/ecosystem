<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Log</title>
<style>
/* Practice Log, by Gig Bag Co. (fictional), 2026-11-21. A GENEXXO app for GuitarXX.
   Time a session, tick what you worked on, save it. Streak = consecutive days with practice up to today (or yesterday).
   Weekly goal with a seven-day bar chart. Seeded with a long streak so the demo has a story. */
:root{--bg:#120F14;--card:rgba(255,255,255,.05);--line:rgba(243,239,246,.1);--ink:#F3EFF6;--mut:rgba(243,239,246,.55);--wood:#C99A6B;--lil:#C084FC;--sun:#F5B342}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#C99A6B,#6E4527);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--wood)}
.streak{border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,#3A2618,#1D130C);border:1px solid rgba(201,154,107,.3)}.streak b{font-size:42px;font-weight:900;color:var(--sun);line-height:1}.streak small{display:block;color:var(--mut);font-size:12.5px}
.timer{text-align:center;padding:12px 0}.timer b{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;display:block;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--wood);border-color:var(--wood);color:#1D130C}
.lg{display:flex;gap:10px;padding:9px 0;font-size:13px}.lg+.lg{border-top:1px solid var(--line)}.lg span{color:var(--mut);width:70px;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:10px}.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
.week{display:flex;gap:8px;align-items:flex-end;height:130px;padding-top:8px}.week div{flex:1;text-align:center}.week i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(#C084FC,#6B21A8);margin:0 auto;width:70%}.week small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.dim{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}.dim b{font-size:22px;font-weight:900;min-width:110px;text-align:center}
.st{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:18px;font-weight:900;cursor:pointer;color:var(--ink)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--wood);color:#1D130C;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📈</div><div><h1>Practice Log</h1><p>Gig Bag Co. · in GuitarXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="n" class="on">Practise</button><button data-tab="h">History</button><button data-tab="g">This week</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const FOCUS=['Chords','Strumming','A song','Scales','Fingerpicking','Theory'];
const seed=()=>{const r=GX.rng('practice'),log=[];for(let d=-411;d<=-1;d++){log.push({d,m:Math.round(15+r()*30),f:[FOCUS[Math.floor(r()*6)]]});}return {goal:150,log,focus:['Chords']};};
let C,S={tab:'n',run:false,secs:0,shared:false},tick=null;
GX.init({gateway:'GuitarXX',seed}).then(c=>{C=c;paint();});
function streak(){const days=new Set(C.data.log.map(l=>l.d));let s=0,d=days.has(0)?0:-1;while(days.has(d)){s++;d--;}return s;}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const week=()=>Array.from({length:7},(_,i)=>{const d=i-6;return {d,m:C.data.log.filter(l=>l.d===d).reduce((a,l)=>a+l.m,0)};});
function vN(){return `<div class="streak"><b>${streak()}</b><div><b style="font-size:15px;color:var(--ink)">day streak 🔥</b><small>${C.data.log.some(l=>l.d===0)?'Today’s done. Nice.':'Play today to keep it going.'}</small></div></div>
  <div class="timer"><b>${mmss(S.secs)}</b></div>
  <div class="chips">${FOCUS.map(f=>`<button class="chip ${C.data.focus.includes(f)?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
  <button class="go" id="run">${S.run?'Pause':S.secs?'Resume':'Start practising'}</button><button class="go alt" id="save" ${S.secs>=1?'':'disabled'}>${S.secs<60?'Save this session':`Save ${Math.round(S.secs/60)} minute${Math.round(S.secs/60)===1?'':'s'}`}</button>`;}
function vH(){const l=C.data.log.slice().sort((a,b)=>b.d-a.d).slice(0,12),tot=Math.round(C.data.log.reduce((a,x)=>a+x.m,0)/60);
  return `<div class="card"><h3>${C.data.log.length} sessions · ${tot} hours in total</h3>${l.map(x=>`<div class="lg"><span>${x.d===0?'Today':GX.day(GX.today(x.d),{weekday:'short',day:'numeric'})}</span><b style="flex:1;font-weight:600">${x.f.join(', ')}</b><span style="width:auto">${x.m} min</span></div>`).join('')}</div>`;}
function vG(){const w=week(),tot=w.reduce((a,x)=>a+x.m,0),mx=Math.max(30,...w.map(x=>x.m));
  return `<div class="card"><h3>${tot} of ${C.data.goal} minutes this week</h3><div class="week">${w.map(x=>`<div><i style="height:${Math.max(4,100*x.m/mx)}px"></i><small>${GX.day(GX.today(x.d),{weekday:'narrow'})}</small></div>`).join('')}</div></div>
  <div class="dim"><button class="st" id="gdn">−</button><b>${C.data.goal} min goal</b><button class="st" id="gup">+</button></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my ${streak()}-day streak`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='n'?vN():S.tab==='h'?vH():vG();const d=C.data,sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=d.focus.indexOf(b.dataset.f);k<0?d.focus.push(b.dataset.f):d.focus.splice(k,1);sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('run',()=>{if(S.run){clearInterval(tick);S.run=false;}else{S.run=true;tick=setInterval(()=>{S.secs++;if(S.tab==='n'){const t=document.querySelector('.timer b');if(t)t.textContent=mmss(S.secs);const s=document.getElementById('save');if(s&&s.disabled){paint();}}},1000);}paint();});
  on('save',()=>{clearInterval(tick);S.run=false;d.log.push({d:0,m:Math.max(1,Math.round(S.secs/60)),f:d.focus.length?d.focus.slice():['Practice']});S.secs=0;S.shared=false;sv();});
  on('gup',()=>{d.goal=Math.min(600,d.goal+15);sv();});on('gdn',()=>{d.goal=Math.max(30,d.goal-15);sv();});
  on('share',()=>GX.post(`<b>${streak()} days in a row</b> on the guitar, ${Math.round(d.log.reduce((a,x)=>a+x.m,0)/60)} hours in total. Twenty minutes a day adds up 📈`,'PRACTICE LOG').then(o=>{if(o){S.shared=true;paint();}}));}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
