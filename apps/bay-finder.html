<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bay Finder</title>
<style>
/* Bay Finder, by Lantern Truckstops (fictional), 2026-11-23. A GENEXXO app for TruckXX.
   Overnight truck parking on real roads at fictional truck stops: free bays tonight (seeded per day), facilities,
   reserve a bay, favourites. Prices and bay counts are illustrative. */
:root{--bg:#0F0D0A;--card:rgba(255,255,255,.05);--line:rgba(240,230,210,.1);--ink:#F2EBDD;--mut:rgba(242,235,221,.55);--amber:#F59E0B;--green:#22C55E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FBBF24,#B45309);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--amber);border-color:var(--amber);color:#1A1205}
.stop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.stop .tp{display:flex;align-items:flex-start;gap:10px}.stop .x{flex:1}.stop b{display:block;font-size:15px}.stop small{color:var(--mut);font-size:12px}
.free{text-align:center;min-width:60px}.free .n{font-size:22px;font-weight:900;color:var(--green);line-height:1}.free.low .n{color:var(--amber)}.free.full .n{color:#F87171}.free small{font-size:10.5px}
.fac{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.fac i{font-style:normal;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mut)}
.act{display:flex;gap:6px;margin-top:10px}.act button{font:inherit;font-weight:800;font-size:12.5px;padding:9px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}.act .p{background:var(--amber);border-color:var(--amber);color:#1A1205;flex:1}.act .p:disabled{background:rgba(255,255,255,.08);border-color:transparent;color:var(--mut)}.act .s.on{color:var(--amber);border-color:var(--amber)}
.ticket{background:linear-gradient(135deg,#B45309,#F59E0B);color:#1A1205;border-radius:20px;padding:18px}.ticket small{font-weight:800;opacity:.75;font-size:12px}.ticket b{display:block;font-size:20px;margin:2px 0 10px}.ticket .r{display:flex;justify-content:space-between;border-top:1px dashed rgba(26,18,5,.3);padding-top:10px;margin-top:10px;font-weight:800}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--amber);color:#1A1205;cursor:pointer}.go:disabled{background:rgba(255,255,255,.08);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🅿️</div><div><h1>Bay Finder</h1><p>Lantern Truckstops · in TruckXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Tonight</button><button data-tab="s">Saved</button><button data-tab="b">My bay</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const STOPS=[['l16','Lantern Stoke','M6 Junction 16','M6',28,70,['🚿 Showers','🍳 Food','🔒 Fenced','📹 CCTV']],['l1n','Lantern Doncaster','A1(M) Junction 35','A1',28,90,['🚿 Showers','🍳 Food','🔒 Fenced','🧺 Laundry']],['rb','Ridgeway Truck Park','M1 Junction 28, Derbyshire','M1',24,60,['🚿 Showers','🍳 Food','📹 CCTV']],['l62','Lantern Brighouse','M62 Junction 25','M62',28,54,['🚿 Showers','🍳 Food','🔒 Fenced']],['hh','Holly Hill Services','M6 Junction 36, Cumbria','M6',22,40,['🚿 Showers','☕ Café']],['nf','Northfield Lorry Park','A1 near Newark','A1',20,46,['🚿 Showers','🍔 Takeaway','📹 CCTV']],['lmk','Lantern Milton Keynes','M1 Junction 14','M1',30,80,['🚿 Showers','🍳 Food','🔒 Fenced','⚡ EV charging']]];
const seed=()=>({saved:['l16','l1n'],booking:{id:'l16',d:GX.iso(0),bay:'B24',ref:'LT482913'}});
let C,S={tab:'t',road:'All',shared:false};
GX.init({gateway:'TruckXX',seed}).then(c=>{C=c;paint();});
const R=GX.rng?GX.rng(GX.iso(0)):Math.random;const FREE={};STOPS.forEach(s=>FREE[s[0]]=Math.floor(R()*Math.min(18,s[5]*.3)));FREE.hh=0;
const card=s=>{const f=FREE[s[0]],d=C.data,bk=d.booking&&d.booking.id===s[0];return `<div class="stop"><div class="tp"><div class="x"><b>${s[1]}</b><small>${s[2]} · £${s[4]} a night</small></div><div class="free ${f===0?'full':f<5?'low':''}"><div class="n">${f}</div><small>free bays</small></div></div>
  <div class="fac">${s[6].map(x=>`<i>${x}</i>`).join('')}</div><div class="act"><button class="p" data-book="${s[0]}" ${f===0||bk?'disabled':''}>${bk?'✓ Reserved':f===0?'Full tonight':'Reserve a bay'}</button><button class="s ${d.saved.includes(s[0])?'on':''}" data-save="${s[0]}">${d.saved.includes(s[0])?'★':'☆'}</button></div></div>`;};
function vT(){const roads=['All','M1','M6','A1','M62'];return `<div class="chips">${roads.map(r=>`<button class="chip ${S.road===r?'on':''}" data-road="${r}">${r}</button>`).join('')}</div>`+
  STOPS.filter(s=>S.road==='All'||s[3]===S.road).sort((a,b)=>FREE[b[0]]-FREE[a[0]]).map(card).join('')+`<div class="legend">Free bays for tonight, ${GX.day(GX.today(0))}. Counts update through the evening.</div>`;}
function vS(){const L=STOPS.filter(s=>C.data.saved.includes(s[0]));return L.length?L.map(card).join(''):'<div class="legend">Tap ☆ on a stop to save it.</div>';}
function vB(){const b=C.data.booking;if(!b)return '<div class="legend" style="margin-top:30px">No bay reserved tonight. Find one in the Tonight tab.</div>';const s=STOPS.find(x=>x[0]===b.id);
  return `<div class="ticket"><small>Reserved for ${GX.day(b.d)}</small><b>${s[1]}</b>${s[2]}<div class="r"><span>Bay ${b.bay}</span><span>Ref ${b.ref}</span><span>£${s[4]}</span></div></div><div class="legend">Show your reference at the gate. Arrive by 23:00 or call ahead.</div>`+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share where I’m parked up'}</button>`:'');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='t'?vT():S.tab==='s'?vS():vB();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-road]').forEach(b=>b.onclick=()=>{S.road=b.dataset.road;paint();});
  v.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const k=b.dataset.save,i=d.saved.indexOf(k);i<0?d.saved.push(k):d.saved.splice(i,1);sv();});
  v.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const k=b.dataset.book;d.booking={id:k,d:GX.iso(0),bay:'B'+(10+Math.floor(Math.random()*60)),ref:'LT'+Math.floor(100000+Math.random()*900000)};FREE[k]--;S.tab='b';S.shared=false;sv();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const s=STOPS.find(x=>x[0]===d.booking.id);GX.post(`Parked up for the night at <b>${s[1]}</b> (${s[2]}). Hot shower, then bed 🌙`,'BAY FINDER').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
