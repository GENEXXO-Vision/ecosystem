<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Count</title>
<style>
/* Pitch Count, by "Arm Care Labs" (fictional), 2026-11-14. A GENEXXO app for BaseballXX.
   Counts pitches and works out rest days from widely used youth pitch-count guidelines (daily limits by age,
   rest by pitches thrown). A guide only: the app tells coaches to follow their own league's rules. */
:root{--bg:#0B1424;--card:#13213A;--line:rgba(224,164,88,.16);--ink:#F2EEE6;--mut:rgba(242,238,230,.58);--red:#D62839;--clay:#E0A458;--green:#4ADE80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#E0A458,#A8642A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--clay)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}.chip{font-size:12.5px;font-weight:800;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--mut);cursor:pointer}.chip.on{background:rgba(224,164,88,.16);color:var(--clay);border-color:transparent}
.big{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.big .n{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.big .of{color:var(--mut);font-weight:700;font-size:13px;margin-top:4px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);margin:14px 0 6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.big .rest{font-weight:800;font-size:13.5px}
.tap{width:100%;margin-top:12px;font:inherit;font-weight:900;font-size:20px;border:0;border-radius:20px;padding:22px;background:var(--clay);color:#0B1424;cursor:pointer}.tap:active{transform:scale(.98)}.tap:disabled{background:var(--card);color:var(--mut)}
.row2{display:flex;gap:8px;margin-top:8px}.row2 button{flex:1;font:inherit;font-weight:800;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:10px;background:none;color:var(--ink);cursor:pointer}
.p{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:rgba(224,164,88,.18);color:var(--clay);flex-shrink:0}
.p b{display:block;font-size:14.5px}.p small{color:var(--mut);font-size:12px}.p .st{margin-left:auto;text-align:right;font-weight:900;font-size:12.5px}
.ok{color:var(--green)}.wait{color:var(--clay)}.stop{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
th,td{padding:9px 12px;text-align:left}th{color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}tr+tr td{border-top:1px solid var(--line)}td:last-child,th:last-child{text-align:right;font-weight:800}
.h3{font-size:12px;font-weight:800;color:var(--mut);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--clay);color:#0B1424;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🔢</div><div><h1>Pitch Count</h1><p>Arm Care Labs · in BaseballXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="game" class="on">Game</button><button data-tab="staff">Staff</button><button data-tab="guide">Guide</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
/* daily max by age; rest days by pitches thrown (14 & under, and 15–18) */
const MAX=[[8,50],[10,75],[12,85],[14,95],[16,95],[18,105]];
const REST_Y=[[20,0],[35,1],[50,2],[65,3],[999,4]], REST_O=[[30,0],[45,1],[60,2],[75,3],[999,4]];
const maxFor=a=>(MAX.find(m=>a<=m[0])||MAX[MAX.length-1])[1];
const restFor=(a,n)=>n<=0?0:((a<=14?REST_Y:REST_O).find(r=>n<=r[0]))[1];
const seed=()=>({cur:0,staff:[{name:'Mateo R.',age:12,today:58,last:[]},{name:'Ava K.',age:12,today:0,last:[{ago:2,n:44}]},{name:'Jonah P.',age:11,today:0,last:[{ago:1,n:71}]},{name:'Lily S.',age:12,today:0,last:[]}]});
let C,S={tab:'game',shared:false};
GX.init({gateway:'BaseballXX',seed}).then(c=>{C=c;paint();});
const P=()=>C.data.staff[C.data.cur], ini=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function status(p){ if(p.today>0){const r=restFor(p.age,p.today);return {cls:p.today>=maxFor(p.age)?'stop':'wait',txt:`${p.today} today · ${r} rest day${r===1?'':'s'}`,next:r};}
  const l=p.last[0]; if(!l) return {cls:'ok',txt:'Available',next:0};
  const need=restFor(p.age,l.n), left=need+1-l.ago; return left>0?{cls:'wait',txt:`Rest: available ${GX.day(GX.today(left))}`,next:left}:{cls:'ok',txt:'Available',next:0};}
function vGame(){const p=P(),mx=maxFor(p.age),pct=Math.min(100,p.today/mx*100),r=restFor(p.age,p.today),col=p.today>=mx?'var(--red)':pct>75?'var(--clay)':'var(--green)';
  const bands=(p.age<=14?REST_Y:REST_O), nb=bands.find(b=>p.today<=b[0]);
  return `<div class="chips">${C.data.staff.map((s,i)=>`<span class="chip ${i===C.data.cur?'on':''}" data-p="${i}">${GX.esc(s.name)}</span>`).join('')}</div>
  <div class="big"><div class="n">${p.today}</div><div class="of">pitches · limit ${mx} for age ${p.age}</div>
    <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
    <div class="rest" style="color:${col}">${p.today>=mx?'Daily limit reached. Finish this batter, then out of the game.':r?`${r} day${r===1?'':'s'} rest needed so far`:'No rest needed yet'}</div>
    ${p.today<mx&&nb&&nb[0]<999?`<div class="of" style="margin-top:6px">${nb[0]-p.today+1} more pitch${nb[0]-p.today===0?'':'es'} adds another rest day</div>`:''}</div>
  <button class="tap" id="tap" ${p.today>=mx?'disabled':''}>+1 pitch</button>
  <div class="row2"><button id="undo">− Undo</button><button id="done">End outing</button></div>
  <div class="legend">A guide based on widely used youth guidelines. Always follow your league’s rules.</div>`;}
function vStaff(){return `<div class="h3">Your staff</div>${C.data.staff.map((p,i)=>{const s=status(p);return `<div class="p" data-p="${i}" style="cursor:pointer"><div class="av">${ini(p.name)}</div><div><b>${GX.esc(p.name)}</b><small>Age ${p.age} · limit ${maxFor(p.age)}</small></div><div class="st ${s.cls}">${s.txt}</div></div>`;}).join('')}
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share today’s arm-care report`}</button>`:''}`;}
function vGuide(){const a=P().age;return `<div class="h3">Daily limits by age</div><table><tr><th>Age</th><th>Max pitches</th></tr>${[['7–8',50],['9–10',75],['11–12',85],['13–14',95],['15–16',95],['17–18',105]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
  <div class="h3">Rest days · ${a<=14?'age 14 and under':'ages 15 to 18'}</div><table><tr><th>Pitches</th><th>Rest</th></tr>${(a<=14?REST_Y:REST_O).map((r,i,arr)=>`<tr><td>${i?arr[i-1][0]+1:1}${r[0]<999?'–'+r[0]:'+'}</td><td>${r[1]} day${r[1]===1?'':'s'}</td></tr>`).join('')}</table>
  <div class="legend">Shown for ${GX.esc(P().name)} (age ${a}). A guide, not medical advice.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='game'?vGame():S.tab==='staff'?vStaff():vGuide();
  v.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{C.data.cur=+e.dataset.p;S.tab='game';GX.save(C.data);paint();});
  const t=document.getElementById('tap');if(t)t.onclick=()=>{P().today++;GX.save(C.data);paint();};
  const u=document.getElementById('undo');if(u)u.onclick=()=>{P().today=Math.max(0,P().today-1);GX.save(C.data);paint();};
  const d=document.getElementById('done');if(d)d.onclick=()=>{const p=P();if(p.today>0){p.last=[{ago:0,n:p.today}];p.today=0;}S.tab='staff';GX.save(C.data);paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const used=C.data.staff.filter(p=>p.today>0||(p.last[0]&&p.last[0].ago===0)).length;
    GX.post(`Arm-care report: <b>${used} pitcher${used===1?'':'s'}</b> used today, every count inside the limit. Kept in Pitch Count 💪⚾`,'PITCH COUNT').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
