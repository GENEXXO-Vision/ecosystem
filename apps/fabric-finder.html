<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fabric Finder</title>
<style>
/* Fabric Finder, by Cushionry (fictional), 2026-11-19. A GENEXXO app for SofaXX.
   Tell it about your home (dogs, cats, children, sunny window, wants velvet); it scores eight fabric types and
   suggests three. Rub counts are Martindale (15,000+ is fine for everyday use, 25,000+ is heavy duty). Cleaning
   codes are the usual upholstery ones: W water-based, S solvent only, WS either, X vacuum only. Order up to eight
   free swatches. A guide, not a guarantee. */
:root{--bg:#F6F7F2;--card:#fff;--line:rgba(43,36,32,.1);--ink:#2B2420;--mut:rgba(43,36,32,.55);--sage:#5C7A59;--terra:#C2593A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#9DB59A,#5C7A59);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sage)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q button{font:inherit;font-weight:800;font-size:13px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink)}
.q button span{display:block;font-size:22px;margin-bottom:3px}.q button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 7px}
.fb{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.fb .s{width:48px;height:48px;border-radius:12px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fb .x{flex:1;min-width:0}.fb .x b{display:block}.fb .x small{display:block;color:var(--mut);font-size:12px}
.meter{height:5px;border-radius:99px;background:#ECEDE6;margin-top:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--sage)}
.add{font:inherit;font-weight:800;font-size:12px;border:1px solid var(--line);background:#F1F3EC;color:var(--ink);border-radius:99px;padding:6px 10px;cursor:pointer;white-space:nowrap}.add.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.rank{font-size:11px;font-weight:900;color:var(--terra)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sage);color:#fff;cursor:pointer}.go:disabled{background:#E6E8E0;color:var(--mut)}
.ok{background:#E8EFE6;border-radius:14px;padding:14px;margin-top:12px;font-size:13.5px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}.empty{padding:26px 10px;text-align:center;color:var(--mut)}
</style></head><body>
<div class="hd"><div class="logo">🧵</div><div><h1>Fabric Finder</h1><p>Cushionry · in SofaXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="home" class="on">My home</button><button data-tab="all">Fabrics</button><button data-tab="sw">Swatches</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const Q=[['dog','🐕','Dogs'],['cat','🐈','Cats'],['kids','🧒','Children'],['sun','☀️','A sunny window'],['soft','🧸','I want it soft'],['easy','🧽','Easy to clean']];
/* score fields 0–3: pets (claws/hair), kids (spills), sun (fade), soft (feel), easy (cleaning) */
const F=[
 {n:'Performance weave',c:'#8A8F7E',rub:'60,000',code:'W',feel:'Smooth, tight',p:3,cl:3,k:3,su:3,so:1,e:3},
 {n:'Recycled velvet',c:'#B5563C',rub:'50,000',code:'W',feel:'Plush, deep',p:2,cl:2,k:2,su:1,so:3,e:2},
 {n:'Wool blend',c:'#7C6A55',rub:'40,000',code:'S',feel:'Warm, textured',p:2,cl:1,k:2,su:2,so:2,e:1},
 {n:'Brushed cotton',c:'#C9B79A',rub:'25,000',code:'WS',feel:'Soft, matte',p:1,cl:1,k:1,su:1,so:3,e:2},
 {n:'Linen union',c:'#D8CDB8',rub:'20,000',code:'S',feel:'Crisp, natural',p:1,cl:0,k:1,su:2,so:1,e:1},
 {n:'Boucle',c:'#E8E1D3',rub:'30,000',code:'S',feel:'Nubbly, cosy',p:0,cl:0,k:1,su:2,so:3,e:1},
 {n:'Leather',c:'#6B3F28',rub:'n/a',code:'W',feel:'Smooth, ages well',p:1,cl:2,k:3,su:1,so:1,e:3},
 {n:'Chenille',c:'#9B8BA5',rub:'35,000',code:'WS',feel:'Soft, slightly shiny',p:1,cl:1,k:2,su:2,so:3,e:2}];
const CODE={W:'Water-based cleaner',S:'Solvent cleaner only',WS:'Water or solvent',X:'Vacuum only'};
const seed=()=>({h:{dog:true,kids:true,sun:false,cat:false,soft:true,easy:false},sw:[0,1]});
let C,S={tab:'home',ordered:false,shared:false};
GX.init({gateway:'SofaXX',seed}).then(c=>{C=c;paint();});
function score(f){const h=C.data.h;let s=4,m=4;
  if(h.dog){s+=f.p*2;m+=6;} if(h.cat){s+=f.cl*2;m+=6;} if(h.kids){s+=f.k*2;m+=6;} if(h.sun){s+=f.su;m+=3;} if(h.soft){s+=f.so;m+=3;} if(h.easy){s+=f.e*2;m+=6;}
  return Math.round(100*s/m);}
const ranked=()=>F.map((f,i)=>Object.assign({i,sc:score(f)},f)).sort((a,b)=>b.sc-a.sc);
const row=(f,rank)=>`<div class="fb"><div class="s" style="background:${f.c}"></div><div class="x">${rank?`<span class="rank">#${rank} FOR YOUR HOME</span>`:''}<b>${f.n}</b><small>${f.feel} · ${f.rub} rubs · ${f.code}: ${CODE[f.code]}</small><div class="meter"><i style="width:${f.sc}%"></i></div></div>
  <button class="add ${C.data.sw.includes(f.i)?'on':''}" data-sw="${f.i}">${C.data.sw.includes(f.i)?'✓ Swatch':'+ Swatch'}</button></div>`;
function vHome(){const r=ranked();return `<div class="q">${Q.map(([k,e,l])=>`<button class="${C.data.h[k]?'on':''}" data-q="${k}"><span>${e}</span>${l}</button>`).join('')}</div>
  <div class="lbl">Best for your home</div>${r.slice(0,3).map((f,i)=>row(f,i+1)).join('')}
  <div class="legend">${C.data.h.cat?'Cats: avoid loops (boucle) and loose weaves. Claws catch.':C.data.h.dog?'Dogs: tight weaves shrug off hair and claws.':'Tap what is true for your home.'}</div>`;}
function vAll(){return ranked().map(f=>row(f,0)).join('')+`<div class="legend">Rubs: 15,000+ for everyday use, 25,000+ heavy duty.</div>`;}
function vSw(){const s=C.data.sw.map(i=>Object.assign({i,sc:score(F[i])},F[i]));
  if(S.ordered)return `<div class="ok">✓ <b>${s.length} swatches</b> are on their way. They usually arrive in two to three days.</div>${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Ask ${C.gateway} which one to pick`}</button>`:''}`;
  return (s.length?s.map(f=>row(f,0)).join(''):'<div class="empty">Add swatches from your matches.</div>')+`<button class="go" id="order" ${s.length?'':'disabled'}>Order ${s.length} free swatch${s.length===1?'':'es'}</button><div class="legend">Up to eight, posted free.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='home'?vHome():S.tab==='all'?vAll():vSw();
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{C.data.h[b.dataset.q]=!C.data.h[b.dataset.q];GX.save(C.data);paint();});
  v.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sw,s=C.data.sw,k=s.indexOf(i);if(k<0){if(s.length<8)s.push(i);}else s.splice(k,1);S.ordered=false;GX.save(C.data);paint();});
  const o=document.getElementById('order');if(o)o.onclick=()=>{S.ordered=true;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`Swatches ordered: <b>${C.data.sw.map(i=>F[i].n).join(', ')}</b>. Which would you pick for a home with ${C.data.h.dog?'a dog':C.data.h.kids?'children':'us in it'}? 🧵`,'FABRIC FINDER').then(ok=>{if(ok){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
