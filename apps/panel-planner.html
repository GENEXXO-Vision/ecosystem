<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Planner</title>
<style>
/* Panel Planner, by Nib & Brush (fictional), 2026-11-21. A GENEXXO app for ComicXX.
   Thumbnail a comic: each page has a layout (six-grid, three tiers, splash, widescreen, 2/1/2, nine-grid) drawn to the
   proportions of a comic page; tap a panel to give it a beat from a short list (or your own words). Pacing shows panels
   per page and flags pages that are very busy (8+) or might deserve a splash. */
:root{--bg:#FFFCF3;--card:#fff;--line:rgba(29,27,36,.12);--ink:#1D1B24;--mut:rgba(29,27,36,.55);--pop:#E11D2E;--blue:#2453C9;--sun:#F7C844}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F0434F,#A3121D);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--pop)}
.pg{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pg b{flex:1;font-size:16px}
.nv{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:18px;font-weight:900;cursor:pointer;color:var(--ink)}
.page{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:6px;aspect-ratio:2/3;max-height:380px;margin:0 auto;display:block;width:100%;max-width:260px}
.page svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:6px 10px;cursor:pointer}.chip.on{background:var(--pop);border-color:var(--pop);color:#fff}.chip.b.on{background:var(--blue);border-color:var(--blue)}
.note{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}.note b{color:var(--pop)}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.th button{font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;color:var(--ink)}.th button.on{border-color:var(--pop)}.th svg{width:100%;aspect-ratio:2/3;display:block}.th small{font-size:10.5px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:7px 0}.row span{width:56px;font-weight:800;font-size:12.5px}.row .b{flex:1;height:14px;border-radius:99px;background:#F1ECDD;overflow:hidden}.row .b i{display:block;height:100%}.row small{width:110px;text-align:right;font-size:11.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--pop);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#F1ECDD;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🗒️</div><div><h1>Panel Planner</h1><p>Nib & Brush · in ComicXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="p" class="on">Page</button><button data-tab="a">All pages</button><button data-tab="c">Pacing</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
/* layouts as panels [x,y,w,h] in a 100×150 page */
const L={'Six-grid':[[0,0,50,50],[50,0,50,50],[0,50,50,50],[50,50,50,50],[0,100,50,50],[50,100,50,50]],'Three tiers':[[0,0,100,50],[0,50,100,50],[0,100,100,50]],'Splash':[[0,0,100,150]],
 'Widescreen':[[0,0,100,37.5],[0,37.5,100,37.5],[0,75,100,37.5],[0,112.5,100,37.5]],'2 / 1 / 2':[[0,0,50,50],[50,0,50,50],[0,50,100,50],[0,100,50,50],[50,100,50,50]],
 'Nine-grid':Array.from({length:9},(_,i)=>[(i%3)*33.33,Math.floor(i/3)*50,33.33,50])};
const BEATS=['Establishing shot','Close-up','Reaction','Dialogue','Action','Silent beat','Reveal','Page-turn hook'];
const seed=()=>({cur:0,sel:0,title:'The Allotment',pages:[{l:'Three tiers',b:['Establishing shot','Dialogue','Close-up']},{l:'Six-grid',b:['Dialogue','Reaction','Dialogue','Close-up','Silent beat','Page-turn hook']},{l:'Splash',b:['Reveal']},{l:'Nine-grid',b:['Action','Action','Reaction','Dialogue','Dialogue','Close-up','Action','Reaction','Page-turn hook']}]});
let C,S={tab:'p',shared:false};
GX.init({gateway:'ComicXX',seed}).then(c=>{C=c;paint();});
const svg=(lay,sel,beats,small)=>`<svg viewBox="-2 -2 104 154">${L[lay].map(([x,y,w,h],i)=>`<g ${small?'':`data-p="${i}" style="cursor:pointer"`}><rect x="${x+1.5}" y="${y+1.5}" width="${w-3}" height="${h-3}" fill="${i===sel?'#FDE8EA':'#fff'}" stroke="${i===sel?'#E11D2E':'#1D1B24'}" stroke-width="${small?2:1.6}"/>${small?'':`<text x="${x+5}" y="${y+12}" font-size="8" font-weight="900" fill="#E11D2E">${i+1}</text><text x="${x+w/2}" y="${y+h/2+3}" font-size="${w<40?5:6.5}" text-anchor="middle" fill="#555">${beats&&beats[i]?beats[i]:''}</text>`}</g>`).join('')}</svg>`;
function vP(){const d=C.data,p=d.pages[d.cur];p.b=p.b||[];return `<div class="pg"><button class="nv" id="prev">‹</button><b>Page ${d.cur+1} of ${d.pages.length} · ${p.l}</b><button class="nv" id="next">›</button></div>
  <div class="page">${svg(p.l,d.sel,p.b,false)}</div>
  <div class="chips">${Object.keys(L).map(k=>`<button class="chip ${p.l===k?'on':''}" data-l="${k}">${k}</button>`).join('')}</div>
  <div class="note"><b>Panel ${d.sel+1}:</b> ${p.b[d.sel]||'Tap a beat below'}</div>
  <div class="chips">${BEATS.map(x=>`<button class="chip b ${p.b[d.sel]===x?'on':''}" data-beat="${x}">${x}</button>`).join('')}</div>`;}
function vA(){return `<div class="th">${C.data.pages.map((p,i)=>`<button class="${i===C.data.cur?'on':''}" data-go="${i}">${svg(p.l,-1,null,true)}<small>p${i+1}</small></button>`).join('')}</div><button class="go alt" id="add">+ Add a page</button>`;}
function vC(){const ps=C.data.pages;return `<div class="card">${ps.map((p,i)=>{const n=L[p.l].length,col=n>=8?'#E11D2E':n===1?'#F7C844':'#2453C9';return `<div class="row"><span>Page ${i+1}</span><div class="b"><i style="width:${Math.min(100,n*11)}%;background:${col}"></i></div><small>${n} panel${n>1?'s':''}${n>=8?' · busy':n===1?' · splash':''}</small></div>`;}).join('')}</div>
  <div class="legend">Busy pages read fast; splashes make readers stop. Mix them to control the pace.</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my page plan`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='p'?vP():S.tab==='a'?vA():vC();const d=C.data,p=d.pages[d.cur],sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-p]').forEach(g=>g.onclick=()=>{d.sel=+g.dataset.p;sv();});
  v.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{p.l=b.dataset.l;p.b=p.b.slice(0,L[p.l].length);d.sel=0;sv();});
  v.querySelectorAll('[data-beat]').forEach(b=>b.onclick=()=>{p.b[d.sel]=b.dataset.beat;if(d.sel<L[p.l].length-1)d.sel++;sv();});
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{d.cur=+b.dataset.go;d.sel=0;S.tab='p';sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('prev',()=>{d.cur=Math.max(0,d.cur-1);d.sel=0;sv();});on('next',()=>{d.cur=Math.min(d.pages.length-1,d.cur+1);d.sel=0;sv();});
  on('add',()=>{d.pages.push({l:'Six-grid',b:[]});d.cur=d.pages.length-1;d.sel=0;S.tab='p';sv();});
  on('share',()=>GX.post(`Thumbnailing <b>${GX.esc(d.title)}</b>: ${d.pages.length} pages, ${d.pages.reduce((a,p)=>a+L[p.l].length,0)} panels, one big splash. Planned in Panel Planner 🗒️`,'PANEL PLANNER').then(o=>{if(o){S.shared=true;paint();}}));}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
