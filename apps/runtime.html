<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Runtime</title>
<style>
/* Runtime, by Lantern Cinemas (fictional), 2026-11-21. A GENEXXO app for FilmXX.
   Start time + trailers + running time (+ a break and a second film for double bills) = walk-out time,
   checked against the last train (walk to the station included) and an optional babysitter time. Films are fictional. */
:root{--bg:#120C0E;--card:rgba(255,255,255,.05);--line:rgba(247,238,240,.1);--ink:#F7EEF0;--mut:rgba(247,238,240,.55);--red:#E0464E;--grn:#86EFAC;--amb:#F5B342}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#E0464E,#8E1B22);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:7px}
.row .n{flex:1}.row small{display:block;font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.05em}.row b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.st{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:17px;font-weight:900;cursor:pointer;color:var(--ink)}
.out{margin-top:14px;border-radius:18px;padding:16px;text-align:center;background:linear-gradient(150deg,#4A1219,#1A0A0C);border:1px solid rgba(224,70,78,.3)}
.out small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#F9A8AE}.out b{display:block;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.ok{margin-top:10px;font-weight:800;font-size:13.5px;padding:10px;border-radius:12px}.ok.y{background:rgba(134,239,172,.12);color:var(--grn)}.ok.n{background:rgba(245,179,66,.13);color:var(--amb)}
.tl{display:flex;height:14px;border-radius:9px;overflow:hidden;margin-top:12px}.tl i{display:block;height:100%}
.it{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}.it b{flex:1}.it span{color:var(--mut);font-size:12.5px;font-weight:700;text-align:right}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--red);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">⏱️</div><div><h1>Runtime</h1><p>Lantern Cinemas · in FilmXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Tonight</button><button data-tab="d">Double bill</button><button data-tab="n">My nights</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const seed=()=>({start:1185,ads:20,run:112,run2:94,gap:20,train:1392,walk:12,film:'The Quiet Harbour',film2:'Snow on Arden Street',where:'Lantern York',
  nights:[{t:'Undertow',where:'Lantern York',d:-9,out:'22:18'},{t:'Dog Days in Margate',where:'Lantern Leeds',d:-23,out:'21:31'},{t:'35 mm double bill',where:'Lantern York',d:-41,out:'00:06'}]});
let C,S={tab:'t',saved:false,shared:false};
GX.init({gateway:'FilmXX',seed}).then(c=>{C=c;paint();});
const hhmm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const hm=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
function ctl(id,label,val){return `<div class="row"><button class="st" data-id="${id}" data-dx="-1">−</button><div class="n"><small>${label}</small><b>${val}</b></div><button class="st" data-id="${id}" data-dx="1">+</button></div>`;}
function verdict(out){const d=C.data,spare=d.train-d.walk-out;return spare>=0?`<div class="ok y">✓ You’ll make the ${hhmm(d.train)} train with ${spare} minutes to spare</div>`:`<div class="ok n">⚠ You’d miss the ${hhmm(d.train)} by ${-spare} minutes. Try an earlier showing</div>`;}
function bar(parts){const t=parts.reduce((a,p)=>a+p[0],0);return `<div class="tl">${parts.map(p=>`<i style="width:${100*p[0]/t}%;background:${p[1]}"></i>`).join('')}</div>`;}
function vT(){const d=C.data,out=d.start+d.ads+d.run;
  return `<div style="font-weight:800">${GX.esc(d.film)} <span style="color:var(--mut);font-weight:600">· ${GX.esc(d.where)}</span></div>`+
  ctl('start','LISTED START',hhmm(d.start))+ctl('ads','TRAILERS AND ADS',d.ads+' min')+ctl('run','RUNNING TIME',hm(d.run))+ctl('train','LAST TRAIN',hhmm(d.train))+
  `<div class="out"><small>YOU’LL WALK OUT AT</small><b>${hhmm(out)}</b>${bar([[d.ads,'#6B5A5D'],[d.run,'#E0464E'],[Math.max(5,d.train-out),'#2A1F22']])}${verdict(out)}</div>
  <button class="go" id="save" ${S.saved?'disabled':''}>${S.saved?'✓ Added to My nights':'Save this night'}</button>`;}
function vD(){const d=C.data,out=d.start+d.ads+d.run+d.gap+d.run2;
  return `<div style="font-weight:800">${GX.esc(d.film)} + ${GX.esc(d.film2)}</div>`+ctl('start','FIRST FILM STARTS',hhmm(d.start))+ctl('run','FILM ONE',hm(d.run))+ctl('gap','BREAK',d.gap+' min')+ctl('run2','FILM TWO',hm(d.run2))+
  `<div class="out"><small>DOUBLE BILL ENDS AT</small><b>${hhmm(out)}</b>${bar([[d.ads,'#6B5A5D'],[d.run,'#E0464E'],[d.gap,'#F5B342'],[d.run2,'#A78BFA']])}${verdict(out)}</div>`;}
function vN(){return C.data.nights.map(n=>`<div class="it"><b>${GX.esc(n.t)}<br><small style="color:var(--mut);font-weight:600">${GX.esc(n.where)}</small></b><span>${GX.day(GX.today(n.d))}<br>out ${n.out}</span></div>`).join('')+
  (GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share tonight’s plan'}</button>`:'');}
const STEP={start:5,ads:5,run:1,run2:1,gap:5,train:1},LIM={start:[600,1410],ads:[0,40],run:[60,240],run2:[60,240],gap:[0,60],train:[1260,1500]};
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='t'?vT():S.tab==='d'?vD():vN();
  v.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const k=b.dataset.id;d[k]=Math.min(LIM[k][1],Math.max(LIM[k][0],d[k]+STEP[k]*+b.dataset.dx));S.saved=false;GX.save(d);paint();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('save',()=>{d.nights.unshift({t:d.film,where:d.where,d:0,out:hhmm(d.start+d.ads+d.run)});S.saved=true;GX.save(d);paint();});
  on('share',()=>{const out=d.start+d.ads+d.run;GX.post(`Tonight: <b>${GX.esc(d.film)}</b> at ${GX.esc(d.where)}, ${hhmm(d.start)}. Out by ${hhmm(out)}, home on the ${hhmm(d.train)}. Who’s in? 🍿`,'RUNTIME').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
