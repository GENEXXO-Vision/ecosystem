<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rice Timer</title>
<style>
/* Rice Timer, by Umami Pantry (fictional), 2026-11-19. A GENEXXO app for SushiXX.
   Amounts: about 45g of uncooked sushi rice per maki roll (a 180g cup makes about four). Water: 1.1 × the rice's
   weight in ml after rinsing. Seasoning per 300g of rice: 60ml rice vinegar, 20g sugar, 6g salt. Steps: rinse,
   soak 30 min, cook 15 min, rest 10 min, season and fan. The step timer runs for real; "Skip" moves on. */
:root{--bg:#0E1318;--card:rgba(255,255,255,.05);--line:rgba(242,238,232,.1);--ink:#F2EEE8;--mut:rgba(242,238,232,.55);--was:#A3C45A;--sal:#FF8A65;--rice:#EFE4CF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#B9D46A,#5F8A2A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--was)}
.rolls{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0}.rolls b{font-size:48px;font-weight:900;min-width:70px;text-align:center}.rolls small{display:block;text-align:center;color:var(--mut);font-weight:800;font-size:11px;letter-spacing:.08em}
.st{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:22px;font-weight:900;cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}.row+.row{border-top:1px solid var(--line)}.row span{color:var(--mut)}.row b{color:var(--rice)}
.ring{width:180px;height:180px;margin:6px auto 4px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .t b{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}.ring .t small{color:var(--mut);font-weight:800;font-size:11px;letter-spacing:.06em}
.steps{display:flex;gap:4px;margin:4px 0 10px}.steps i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08)}.steps i.on{background:var(--was)}.steps i.cur{background:var(--sal)}
.now{text-align:center}.now h2{font-size:20px;font-weight:900}.now p{color:var(--mut);font-size:13px;margin-top:3px}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1}
.go{width:100%;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--was);color:#14200A;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.lg{display:flex;gap:10px;padding:9px 0;font-size:13px}.lg+.lg{border-top:1px solid var(--line)}.lg span{color:var(--mut);width:70px;flex-shrink:0}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🍚</div><div><h1>Rice Timer</h1><p>Umami Pantry · in SushiXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="amt" class="on">Amounts</button><button data-tab="steps">Steps</button><button data-tab="log">My rolls</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const STEPS=[{n:'Rinse',m:3,p:'Swirl the rice in cold water and pour it off. Repeat until the water runs almost clear.'},{n:'Soak',m:30,p:'Leave the rinsed rice in its measured water so every grain drinks evenly.'},
 {n:'Cook',m:15,p:'Lid on, bring to the boil, then the lowest heat. Don’t lift the lid.'},{n:'Rest',m:10,p:'Off the heat, lid still on. The steam finishes the job.'},{n:'Season',m:5,p:'Tip into a wide bowl, fold in the vinegar mix with a paddle and fan it until glossy and body-warm.'}];
const seed=()=>({rolls:6,log:[{d:-7,n:8,t:'Salmon and avocado maki'},{d:-14,n:6,t:'Cucumber maki and nigiri'},{d:-21,n:4,t:'First go! Mostly worked'}]});
let C,S={tab:'amt',step:0,left:STEPS[0].m*60,run:false,shared:false},tick=null;
GX.init({gateway:'SushiXX',seed}).then(c=>{C=c;paint();});
const amt=r=>{const g=r*45;return {g,w:Math.round(g*1.1),v:Math.round(g/300*60),s:Math.round(g/300*20),sa:Math.round(g/300*6*10)/10};};
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function vAmt(){const a=amt(C.data.rolls);return `<div class="rolls"><button class="st" id="dec">−</button><div><b>${C.data.rolls}</b><small>MAKI ROLLS</small></div><button class="st" id="inc">+</button></div>
  <div class="card"><h3>Rice</h3><div class="row"><span>Sushi rice (uncooked)</span><b>${a.g}g</b></div><div class="row"><span>Water, after rinsing</span><b>${a.w}ml</b></div></div>
  <div class="card"><h3>Seasoning (sushi-zu)</h3><div class="row"><span>Rice vinegar</span><b>${a.v}ml</b></div><div class="row"><span>Sugar</span><b>${a.s}g</b></div><div class="row"><span>Salt</span><b>${a.sa}g</b></div></div>
  <div class="legend">Warm the vinegar, sugar and salt until they dissolve. Don’t boil it.</div>`;}
function vSteps(){const st=STEPS[S.step],tot=st.m*60,frac=S.left/tot,C2=2*Math.PI*80;
  return `<div class="steps">${STEPS.map((_,i)=>`<i class="${i<S.step?'on':i===S.step?'cur':''}"></i>`).join('')}</div>
  <div class="now"><h2>${S.step+1}. ${st.n}</h2><p>${st.p}</p></div>
  <div class="ring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" stroke="rgba(255,255,255,.08)" stroke-width="12" fill="none"/><circle cx="90" cy="90" r="80" stroke="${S.left?'#A3C45A':'#FF8A65'}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-frac)}"/></svg><div class="t"><b>${mmss(S.left)}</b><small>${S.left?(S.run?'RUNNING':'READY'):'DONE'}</small></div></div>
  <div class="btns"><button class="go" id="run">${S.run?'Pause':S.left?'Start':'Next step'}</button><button class="go alt" id="skip" ${S.step>=STEPS.length-1&&!S.left?'disabled':''}>${S.step>=STEPS.length-1?'Finish':'Skip'}</button></div>
  <div class="legend">Step ${S.step+1} of ${STEPS.length} · about an hour from rinse to rolling.</div>`;}
function vLog(){return `<div class="card">${C.data.log.slice().sort((a,b)=>b.d-a.d).map(l=>`<div class="lg"><span>${l.d===0?'Today':GX.day(GX.today(l.d),{day:'numeric',month:'short'})}</span><b style="font-weight:600">${l.n} rolls · ${GX.esc(l.t)}</b></div>`).join('')}</div>
  <button class="go" id="add" style="margin-top:12px">Log today’s ${C.data.rolls} rolls</button>
  ${GX.can('feed')?`<button class="go alt" id="share" style="margin-top:8px" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my sushi nights to ${C.gateway}`}</button>`:''}`;}
function stop(){clearInterval(tick);tick=null;S.run=false;}
function next(){stop();if(S.step<STEPS.length-1){S.step++;S.left=STEPS[S.step].m*60;}else{S.left=0;}paint();}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='amt'?vAmt():S.tab==='steps'?vSteps():vLog();
  const i=document.getElementById('inc'),d=document.getElementById('dec');
  if(i)i.onclick=()=>{C.data.rolls=Math.min(24,C.data.rolls+1);GX.save(C.data);paint();};if(d)d.onclick=()=>{C.data.rolls=Math.max(1,C.data.rolls-1);GX.save(C.data);paint();};
  const r=document.getElementById('run');if(r)r.onclick=()=>{if(!S.left){next();return;}if(S.run){stop();paint();return;}S.run=true;tick=setInterval(()=>{S.left=Math.max(0,S.left-1);if(!S.left)stop();if(S.tab==='steps')paint();},1000);paint();};
  const sk=document.getElementById('skip');if(sk)sk.onclick=next;
  const a=document.getElementById('add');if(a)a.onclick=()=>{C.data.log.push({d:0,n:C.data.rolls,t:'Sushi night'});S.shared=false;GX.save(C.data);paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const n=C.data.log.reduce((s,l)=>s+l.n,0);GX.post(`<b>${n} rolls</b> made at home this year, and the rice gets better every time. Timed with Rice Timer 🍚`,'RICE TIMER').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
