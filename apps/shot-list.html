<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shot List</title>
<style>
/* Shot List, by Clapper Kit (fictional), 2026-11-21. A GENEXXO app for FilmXX.
   Scenes → shots (size, movement, note). The Shoot day tab regroups every shot by location so each setup is filmed
   once, with a running estimate (10 min a shot + 30 min per location move) and tick-off. The seeded film is fictional. */
:root{--bg:#14120C;--card:rgba(255,255,255,.05);--line:rgba(248,242,226,.1);--ink:#F8F2E2;--mut:rgba(248,242,226,.55);--gold:#F2C14E;--grn:#86EFAC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F2C14E,#A8741A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
h3{font-size:12px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.sh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}
.sh .no{font-weight:900;color:var(--gold);width:34px;font-size:13px}.sh .x{flex:1;min-width:0}.sh b{font-size:13.5px}.sh small{display:block;color:var(--mut);font-size:12px}
.sz{font-size:11px;font-weight:900;padding:3px 7px;border-radius:7px;background:rgba(242,193,78,.15);color:var(--gold)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:#14120C;font-weight:900;flex-shrink:0}.tick.on{background:var(--grn);border-color:var(--grn)}.sh.done{opacity:.5}
.loc{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px}.loc b{font-size:15px}.loc span{color:var(--mut);font-size:12px;font-weight:700}
.sum{border-radius:18px;padding:14px;background:linear-gradient(150deg,#3A2E10,#17130A);border:1px solid rgba(242,193,78,.3);display:flex;gap:10px}
.sum div{flex:1;text-align:center}.sum small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gold)}.sum b{font-size:22px;font-weight:900}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button{flex:1;min-width:52px;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 4px;cursor:pointer}.seg button.on{background:var(--gold);border-color:var(--gold);color:#1E1705}
input{width:100%;font:inherit;font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--gold);color:#1E1705;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🎬</div><div><h1>Shot List</h1><p>Clapper Kit · in FilmXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="s" class="on">Shots</button><button data-tab="d">Shoot day</button><button data-tab="a">Add a shot</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const SIZES={WS:'Wide',MS:'Mid',CU:'Close-up',ECU:'Extreme close-up',OTS:'Over the shoulder'},MOVES=['Static','Pan','Handheld','Dolly'];
const seed=()=>({title:'The Long Way Home',scenes:[{n:'Breakfast, the morning she leaves',loc:'Kitchen'},{n:'Waiting for the bus',loc:'Bus stop'},{n:'The walk home instead',loc:'Field'},{n:'Back at the table',loc:'Kitchen'}],
  shots:[{sc:0,sz:'WS',mv:'Static',n:'The whole kitchen, Mum at the stove',ok:true},{sc:0,sz:'MS',mv:'Static',n:'Ana at the table, not eating',ok:true},{sc:0,sz:'CU',mv:'Static',n:'Her packed bag by the door',ok:true},
  {sc:1,sz:'WS',mv:'Static',n:'Bus stop in the rain, Ana alone',ok:false},{sc:1,sz:'CU',mv:'Handheld',n:'Her face as the bus pulls up',ok:false},{sc:1,sz:'ECU',mv:'Static',n:'The ticket in her hand',ok:false},
  {sc:2,sz:'WS',mv:'Pan',n:'Ana crossing the field at golden hour',ok:false},{sc:2,sz:'MS',mv:'Dolly',n:'Walking alongside her',ok:false},
  {sc:3,sz:'WS',mv:'Static',n:'Same frame as shot 1, empty kitchen',ok:false},{sc:3,sz:'OTS',mv:'Static',n:'Mum sees her through the window',ok:false},{sc:3,sz:'CU',mv:'Static',n:'Mum’s face',ok:false}],
  draft:{sc:1,sz:'MS',mv:'Static',n:''}});
let C,S={tab:'s',added:false,shared:false};
GX.init({gateway:'FilmXX',seed}).then(c=>{C=c;paint();});
const num=(i)=>{const d=C.data,s=d.shots[i],k=d.shots.filter((x,j)=>x.sc===s.sc&&j<=i).length;return (s.sc+1)+String.fromCharCode(64+k);};
const row=(i,tick)=>{const s=C.data.shots[i];return `<div class="sh ${tick&&s.ok?'done':''}"><span class="no">${num(i)}</span><div class="x"><b>${GX.esc(s.n)}</b><small>${SIZES[s.sz]} · ${s.mv}</small></div><span class="sz">${s.sz}</span>${tick?`<button class="tick ${s.ok?'on':''}" data-t="${i}">${s.ok?'✓':''}</button>`:''}</div>`;};
function vS(){const d=C.data;return `<div class="sum"><div><small>SCENES</small><b>${d.scenes.length}</b></div><div><small>SHOTS</small><b>${d.shots.length}</b></div><div><small>IN THE CAN</small><b>${d.shots.filter(s=>s.ok).length}</b></div></div>`+
  d.scenes.map((sc,k)=>`<h3>Scene ${k+1} · ${GX.esc(sc.loc)}</h3><div style="color:var(--mut);font-size:12.5px">${GX.esc(sc.n)}</div>${d.shots.map((s,i)=>[s,i]).filter(([s])=>s.sc===k).map(([,i])=>row(i,false)).join('')}`).join('');}
function vD(){const d=C.data,locs=[...new Set(d.scenes.map(s=>s.loc))],left=d.shots.filter(s=>!s.ok).length,mins=left*10+Math.max(0,locs.filter(l=>d.shots.some(s=>!s.ok&&d.scenes[s.sc].loc===l)).length-1)*30;
  return `<div class="sum"><div><small>LOCATIONS</small><b>${locs.length}</b></div><div><small>SHOTS LEFT</small><b>${left}</b></div><div><small>ABOUT</small><b>${Math.floor(mins/60)}h ${mins%60}m</b></div></div>`+
  locs.map(l=>{const ix=d.shots.map((s,i)=>[s,i]).filter(([s])=>d.scenes[s.sc].loc===l);return `<div class="loc"><b>📍 ${GX.esc(l)}</b><span>${ix.filter(([s])=>s.ok).length} of ${ix.length} done</span></div>${ix.map(([,i])=>row(i,true)).join('')}`;}).join('')+
  (GX.can('feed')?`<button class="go alt" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share our shoot progress'}</button>`:'')+`<div class="legend">Shots are grouped by location, so the kitchen is lit once for scenes 1 and 4.</div>`;}
function vA(){const d=C.data,f=d.draft;
  return `<label>Scene</label><div class="seg">${d.scenes.map((s,k)=>`<button data-sc="${k}" class="${f.sc===k?'on':''}">${k+1} · ${GX.esc(s.loc)}</button>`).join('')}</div>
  <label>Shot size</label><div class="seg">${Object.keys(SIZES).map(k=>`<button data-sz="${k}" class="${f.sz===k?'on':''}">${k}</button>`).join('')}</div>
  <label>Movement</label><div class="seg">${MOVES.map(m=>`<button data-mv="${m}" class="${f.mv===m?'on':''}">${m}</button>`).join('')}</div>
  <label>What we see</label><input id="n" maxlength="70" placeholder="e.g. Ana’s hand on the gate" value="${GX.esc(f.n)}">
  <button class="go" id="add" ${S.added?'disabled':''}>${S.added?'✓ Added to scene '+(f.sc+1):'Add shot'}</button>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='s'?vS():S.tab==='d'?vD():vA();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const s=d.shots[+b.dataset.t];s.ok=!s.ok;sv();});
  ['sc','sz','mv'].forEach(k=>v.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{d.draft[k]=k==='sc'?+b.dataset[k]:b.dataset[k];S.added=false;sv();}));
  const n=document.getElementById('n');if(n)n.oninput=()=>{d.draft.n=n.value;if(S.added){S.added=false;const a=document.getElementById('add');a.disabled=false;a.textContent='Add shot';}};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('add',()=>{const f=d.draft;d.shots.push({sc:f.sc,sz:f.sz,mv:f.mv,n:f.n.trim()||SIZES[f.sz]+' shot',ok:false});f.n='';S.added=true;sv();});
  on('share',()=>{const ok=d.shots.filter(s=>s.ok).length;GX.post(`Shooting <b>${GX.esc(d.title)}</b>: ${ok} of ${d.shots.length} shots in the can. Kitchen done, bus stop next 🎬`,'SHOT LIST').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
