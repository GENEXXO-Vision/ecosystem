<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volunteer Hours</title>
<style>
/* Volunteer Hours, by Handsup Volunteering (fictional), 2026-11-24. A GENEXXO app for CharityXX.
   Log your volunteering by role and see your totals. */
:root{--bg:#FFF8F6;--card:#FFFFFF;--line:rgba(0,0,0,.09);--off:rgba(0,0,0,.06);--ink:#2B1418;--mut:rgba(43,20,24,.55);--acc:#E11D48;--accInk:#FFFFFF;--ok:#22C55E;--bad:#EF4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FDA4AF,#E11D48);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.hero{text-align:center;padding:18px 14px}.hero small{display:block;color:var(--mut);font-weight:700;font-size:12px}.hero b{display:block;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1.15}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0;text-align:center}.grid small{display:block;color:var(--mut);font-weight:700;font-size:11.5px}.grid b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.row{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}.row b{flex:1;font-size:14px}.row span{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700;font-size:13px;text-align:right}.row em{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:600;display:block}
.row.warn{border-color:var(--acc)}.row.bad{border-color:var(--bad)}
.step{display:flex;align-items:center;gap:8px;margin-top:6px}.step label{flex:1;font-weight:700;font-size:13.5px}.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:900;font-size:17px;cursor:pointer}.step output{min-width:74px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
input.tx{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:8px}.bars div{flex:1;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px;position:relative}.bars div.dim{opacity:.45}.bars div.hi{background:var(--bad)}
.blab{display:flex;gap:4px}.blab span{flex:1;text-align:center;font-size:10px;color:var(--mut);font-weight:700}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--acc);color:var(--accInk);cursor:pointer}.go:disabled{background:var(--off);color:var(--mut)}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:900;border-radius:99px;padding:3px 9px;letter-spacing:.04em}.pill.ok{background:rgba(34,197,94,.16);color:var(--ok)}.pill.bad{background:rgba(239,68,68,.16);color:var(--bad)}.pill.due{background:var(--off);color:var(--acc)}
.prog{height:12px;border-radius:99px;background:var(--off);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.q b{display:block;font-size:16px;margin-top:4px}.q small{color:var(--mut);font-weight:700}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px;cursor:pointer}.opt.right{border-color:var(--ok);background:rgba(34,197,94,.12)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.1)}

</style></head><body>
<div class="hd"><div class="logo">🙋</div><div><h1>Volunteer Hours</h1><p>Handsup Volunteering · in CharityXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="l" class="on">Log</button><button data-tab="t">Totals</button><button data-tab="r">Roles</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
let C,S={tab:'l',shared:false};
const $=id=>document.getElementById(id),fmt=(n,d=0)=>Number(n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const shareBtn=(label)=>GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:label}</button>`:'';

const seed=()=>({roles:['Charity shop','Food drive','Litter pick'],role:0,h:3,log:[[GX.iso(-2),0,4],[GX.iso(-5),1,3],[GX.iso(-9),0,4],[GX.iso(-16),2,2],[GX.iso(-23),0,4],[GX.iso(-30),1,3],[GX.iso(-37),0,4],[GX.iso(-44),2,2],[GX.iso(-58),0,4],[GX.iso(-72),1,3]]});
const sum=L=>L.reduce((a,x)=>a+x[2],0);
const VIEWS={
 l(){const d=C.data;return `<div class="lbl">Role</div><div class="chips">${d.roles.map((r,i)=>`<button class="chip ${d.role===i?'on':''}" data-r="${i}">${r}</button>`).join('')}</div>
  <div class="step"><label>Hours today</label><button data-v="-1">−</button><output>${d.h}</output><button data-v="1">+</button></div><button class="go" id="add">Log ${d.h} hour${d.h===1?'':'s'}</button>
  <div class="lbl">Recent</div>`+d.log.slice(0,5).map(x=>`<div class="row"><b>${d.roles[x[1]]}<em>${GX.day(x[0])}</em></b><span>${x[2]} h</span></div>`).join('');},
 t(){const d=C.data,mo=[...Array(6)].map((_,i)=>{const t=new Date(GX.iso(0));t.setMonth(t.getMonth()-5+i);return [t.getFullYear(),t.getMonth()];}),hm=mo.map(([y,m])=>sum(d.log.filter(x=>{const t=new Date(x[0]);return t.getFullYear()===y&&t.getMonth()===m;}))),mx=Math.max(4,...hm);
  return `<div class="card hero"><small>Hours given</small><b>${sum(d.log)}</b><small>${d.log.length} sessions</small></div><div class="card"><div class="bars">${hm.map(h=>`<div style="height:${h/mx*100}%"></div>`).join('')}</div><div class="blab">${mo.map(([y,m])=>`<span>${new Date(y,m,1).toLocaleDateString('en-GB',{month:'short'})}</span>`).join('')}</div></div>`+shareBtn('Share my hours');},
 r(){const d=C.data;return d.roles.map((r,i)=>`<div class="row"><b>${r}</b><span>${sum(d.log.filter(x=>x[1]===i))} h</span></div>`).join('')+'<div class="legend">Find new roles on Handsup Volunteering.</div>';}};
function bind(v){const d=C.data;
 v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{d.role=+b.dataset.r;save();});
 v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{d.h=Math.max(1,Math.min(12,d.h+ +b.dataset.v));save();});
 const a=$('add');if(a)a.onclick=()=>{d.log.unshift([GX.iso(0),d.role,d.h]);S.shared=false;S.tab='t';save();};}
const shareText=()=>`${sum(C.data.log)} hours volunteered so far 🙋 Every hour counts.`;

function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=$('v');v.innerHTML=VIEWS[S.tab]();bind(v);
  const sh=$('share');if(sh)sh.onclick=()=>GX.post(shareText(),'VOLUNTEER HOURS').then(o=>{if(o){S.shared=true;paint();}});}
const save=()=>{GX.save(C.data);paint();};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
GX.init({gateway:'CharityXX',seed}).then(c=>{C=c;paint();});
</script></body></html>
