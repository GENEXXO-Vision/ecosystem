<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Table Fit</title>
<style>
/* Table Fit, by Board & Sort (fictional), 2026-11-21. A GENEXXO app for JigsawXX.
   Typical finished sizes by piece count (they vary by maker; the box is the authority). A puzzle "fits" if it sits on
   the table with at least the chosen sorting margin on the long sides. SVG drawn to scale. */
:root{--bg:#FBF7EF;--card:#fff;--line:rgba(35,48,46,.1);--ink:#23302E;--mut:rgba(35,48,46,.55);--teal:#138A80;--coral:#B9472B;--mus:#D99A1E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F58B6C,#B9472B);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--coral)}
.dims{display:flex;gap:8px}.dim{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}.dim small{display:block;font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.06em}.dim b{font-size:20px;font-weight:900}
.dim .r{display:flex;align-items:center;justify-content:space-between;margin-top:2px}.st{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px;font-weight:900;cursor:pointer;color:var(--ink)}
svg{display:block;width:100%;height:auto;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.seg button{flex:1;min-width:58px;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 2px;cursor:pointer}.seg button.on{background:var(--coral);border-color:var(--coral);color:#fff}.seg button.no{text-decoration:line-through;opacity:.55}
.res{margin-top:10px;padding:12px;border-radius:14px;font-weight:800;font-size:14px}.res.y{background:rgba(19,138,128,.1);color:var(--teal)}.res.n{background:rgba(185,71,43,.1);color:var(--coral)}.res small{display:block;font-weight:600;font-size:12.5px;color:var(--mut);margin-top:2px}
.it{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}.it b{flex:1}.it span{color:var(--mut);font-size:12.5px;font-weight:700}
.go{width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--coral);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#ECE6DA;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📐</div><div><h1>Table Fit</h1><p>Board &amp; Sort · in JigsawXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="f" class="on">Will it fit?</button><button data-tab="b">My boards</button><button data-tab="s">Sizes</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const SIZES=[[300,46,33],[500,49,36],[750,61,46],[1000,68,48],[1500,85,60],[2000,98,68],[3000,120,80]];
const seed=()=>({w:120,dp:75,p:1000,margin:10,boards:[{n:'Dining table',w:120,dp:75},{n:'Puzzle Desk',w:78,dp:56},{n:'Coffee table',w:100,dp:50}]});
let C,S={tab:'f',saved:false,shared:false};
GX.init({gateway:'JigsawXX',seed}).then(c=>{C=c;paint();});
const sz=p=>SIZES.find(s=>s[0]===p),fits=(p,w,dp,m)=>{const s=sz(p);return s[1]+2*m<=w&&s[2]<=dp||s[2]+2*m<=w&&s[1]<=dp;};
function draw(){const d=C.data,s=sz(d.p),sc=300/Math.max(d.w,s[1]+10),W=d.w*sc,H=d.dp*sc,pw=s[1]*sc,ph=s[2]*sc,ok=fits(d.p,d.w,d.dp,d.margin);
  return `<svg viewBox="0 0 320 ${Math.max(H,ph)+40}" xmlns="http://www.w3.org/2000/svg"><rect x="${(320-W)/2}" y="20" width="${W}" height="${H}" rx="8" fill="#E9D9BF" stroke="#B89A6A" stroke-width="2"/>
  <rect x="${(320-pw)/2}" y="${20+(H-ph)/2}" width="${pw}" height="${ph}" rx="3" fill="${ok?'rgba(19,138,128,.75)':'rgba(185,71,43,.75)'}" stroke="#fff" stroke-width="1.5" stroke-dasharray="${ok?'0':'5 3'}"/>
  <text x="160" y="${24+H/2}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="-apple-system,sans-serif">${s[1]} × ${s[2]} cm</text>
  <text x="160" y="14" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B5430" font-family="-apple-system,sans-serif">Table ${d.w} × ${d.dp} cm · to scale</text></svg>`;}
function vF(){const d=C.data,s=sz(d.p),ok=fits(d.p,d.w,d.dp,d.margin),best=SIZES.filter(x=>fits(x[0],d.w,d.dp,d.margin)).pop();
  return `<div class="dims"><div class="dim"><small>TABLE WIDTH</small><div class="r"><button class="st" data-k="w" data-dx="-5">−</button><b>${d.w}</b><button class="st" data-k="w" data-dx="5">+</button></div></div><div class="dim"><small>TABLE DEPTH</small><div class="r"><button class="st" data-k="dp" data-dx="-5">−</button><b>${d.dp}</b><button class="st" data-k="dp" data-dx="5">+</button></div></div></div>
  <div class="seg">${SIZES.map(x=>`<button data-p="${x[0]}" class="${d.p===x[0]?'on':''} ${fits(x[0],d.w,d.dp,d.margin)?'':'no'}">${x[0].toLocaleString('en-GB')}</button>`).join('')}</div>
  ${draw()}
  <div class="res ${ok?'y':'n'}">${ok?`✓ A ${d.p.toLocaleString('en-GB')}-piece fits, with room to sort`:`✗ A ${d.p.toLocaleString('en-GB')}-piece is too big here`}<small>${best?`Biggest that fits with ${d.margin} cm to sort: ${best[0].toLocaleString('en-GB')} pieces`:'Try a bigger table or a board'}</small></div>
  <div class="seg">${[0,10,20].map(m=>`<button data-m="${m}" class="${d.margin===m?'on':''}">${m?m+' cm each side to sort':'No sorting room'}</button>`).join('')}</div>
  <button class="go alt" id="save" ${S.saved?'disabled':''}>${S.saved?'✓ Saved to My boards':'Save this table'}</button>`;}
function vB(){const d=C.data;return d.boards.map((b,i)=>{const best=SIZES.filter(x=>fits(x[0],b.w,b.dp,d.margin)).pop();return `<div class="it" data-use="${i}" style="cursor:pointer"><b>${GX.esc(b.n)}<br><small style="color:var(--mut);font-weight:600">${b.w} × ${b.dp} cm</small></b><span>up to ${best?best[0].toLocaleString('en-GB'):'—'} pieces</span></div>`;}).join('')+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my puzzle set-up'}</button>`:'')+`<div class="legend">Tap a board to check it on the first tab.</div>`;}
function vS(){return SIZES.map(s=>`<div class="it"><b>${s[0].toLocaleString('en-GB')} pieces</b><span>about ${s[1]} × ${s[2]} cm</span></div>`).join('')+`<div class="legend">Typical sizes. Every maker is a little different: check the box.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='f'?vF():S.tab==='b'?vB():vS();const sv=()=>{S.saved=false;GX.save(d);paint();};
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;d[k]=Math.min(200,Math.max(30,d[k]+ +b.dataset.dx));sv();});
  v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{d.p=+b.dataset.p;sv();});
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{d.margin=+b.dataset.m;sv();});
  v.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const x=d.boards[+b.dataset.use];d.w=x.w;d.dp=x.dp;S.tab='f';sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('save',()=>{d.boards.unshift({n:'My table, '+GX.day(GX.today(0),{day:'numeric',month:'short'}),w:d.w,dp:d.dp});GX.save(d);S.saved=true;paint();});
  on('share',()=>{const b=d.boards[0],best=SIZES.filter(x=>fits(x[0],b.w,b.dp,d.margin)).pop();GX.post(`My ${GX.esc(b.n.toLowerCase())} takes up to a <b>${best?best[0].toLocaleString('en-GB'):'small'}-piece</b> jigsaw with room to sort. Checked with Table Fit 📐`,'TABLE FIT').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
