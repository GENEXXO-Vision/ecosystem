<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cat Diary</title>
<style>
/* Cat Diary, by Tabby Kitchen (fictional), 2026-11-21. A GENEXXO app for CatXX.
   A daily tick-list per cat (breakfast, dinner, water, litter) and a weight log. It records and flags; it never
   diagnoses. Flags: a meal not ticked yesterday, or a weight drop of more than 5% over the last month, both say
   "worth mentioning to your vet". Cats not eating for 24 hours or more: call the vet. */
:root{--bg:#FFF8F1;--card:#fff;--line:rgba(43,33,27,.1);--ink:#2B211B;--mut:rgba(43,33,27,.55);--gin:#D9772E;--vio:#6D28D9;--ok:#2F7E73;--amb:#B7791F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F2A35E,#C2621F);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--gin)}
.cats{display:flex;gap:8px;margin-bottom:10px}.cats button{flex:1;font:inherit;font-weight:800;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;cursor:pointer;color:var(--ink)}.cats button.on{border-color:var(--gin);background:#FDEBD9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink)}.tk span{font-size:22px;display:block}.tk b{display:block}.tk small{color:var(--mut);font-size:12px}
.tk.on{background:#E6F2EF;border-color:var(--ok)}.tk.on small{color:var(--ok);font-weight:800}
.flag{margin-top:10px;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:700;background:#FBF0DD;color:#7A4E0E}.flag.ok{background:#E6F2EF;color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.wt{display:flex;align-items:center;justify-content:center;gap:16px}.wt b{font-size:34px;font-weight:900;min-width:96px;text-align:center}
.st{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#FDEBD9;font:inherit;font-size:20px;font-weight:900;cursor:pointer;color:var(--ink)}
.vv{padding:9px 0;font-size:13.5px}.vv+.vv{border-top:1px solid var(--line)}.vv span{color:var(--mut);font-size:12px;display:block}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--gin);color:#fff;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:#F4E6D8;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
svg{width:100%;display:block}
</style></head><body>
<div class="hd"><div class="logo">🐈</div><div><h1>Cat Diary</h1><p>Tabby Kitchen · in CatXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Today</button><button data-tab="w">Weight</button><button data-tab="v">Vet notes</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const JOBS=[['breakfast','🥣','Breakfast'],['dinner','🍽️','Dinner'],['water','💧','Fresh water'],['litter','🧹','Litter scooped']];
const seed=()=>({cat:0,cats:[
 {n:'Mo',e:'🐈',today:{breakfast:true,water:true},yest:{breakfast:true,dinner:false,water:true,litter:true},w:[4.6,4.6,4.5,4.5,4.4,4.3,4.3,4.2],vet:[{d:-60,t:'Annual check-up and booster. All well. Weight 4.6kg.'}]},
 {n:'Pip',e:'🐱',today:{breakfast:true,dinner:false,water:true,litter:true},yest:{breakfast:true,dinner:true,water:true,litter:true},w:[1.4,1.6,1.8,1.9,2.1,2.2,2.4,2.5],vet:[{d:-20,t:'Second kitten vaccination. Microchip checked.'},{d:-48,t:'First vaccination and health check.'}]}]});
let C,S={tab:'t',shared:false};
GX.init({gateway:'CatXX',seed}).then(c=>{C=c;paint();});
const cat=()=>C.data.cats[C.data.cat];
const cats=()=>`<div class="cats">${C.data.cats.map((c,i)=>`<button class="${C.data.cat===i?'on':''}" data-c="${i}">${c.e} ${c.n}</button>`).join('')}</div>`;
function flags(c){const out=[];const miss=JOBS.slice(0,2).filter(([k])=>!c.yest[k]).map(j=>j[2].toLowerCase());if(miss.length)out.push(`${c.n} didn’t have ${miss.join(' or ')} yesterday.`);
  const w=c.w,drop=(w[w.length-5]-w[w.length-1])/w[w.length-5];if(drop>0.05)out.push(`${c.n} has lost ${Math.round(drop*100)}% of their weight in a month.`);return out;}
function vT(){const c=cat(),f=flags(c);return cats()+`<div class="grid">${JOBS.map(([k,e,l])=>`<button class="tk ${c.today[k]?'on':''}" data-j="${k}"><span>${e}</span><b>${l}</b><small>${c.today[k]?'✓ Done':'Not yet'}</small></button>`).join('')}</div>
  ${f.length?`<div class="flag">⚠️ ${f.join(' ')} Worth mentioning to your vet.</div>`:`<div class="flag ok">✓ Nothing unusual for ${c.n}.</div>`}
  <div class="legend">If a cat stops eating for 24 hours or more, call your vet.</div>`;}
function vW(){const c=cat(),w=c.w,mx=Math.max(...w)*1.05,mn=Math.min(...w)*0.92,H=120,W=320,pt=(v,i)=>`${i*(W/(w.length-1))},${H-(v-mn)/(mx-mn)*H}`;
  return cats()+`<div class="card"><h3>Last 8 weeks</h3><svg viewBox="-6 -6 ${W+12} ${H+24}"><polyline points="${w.map(pt).join(' ')}" fill="none" stroke="#D9772E" stroke-width="3" stroke-linejoin="round"/>${w.map((v,i)=>`<circle cx="${pt(v,i).split(',')[0]}" cy="${pt(v,i).split(',')[1]}" r="4" fill="#D9772E"/>`).join('')}<text x="0" y="${H+18}" font-size="11" fill="#999">8 weeks ago</text><text x="${W}" y="${H+18}" font-size="11" fill="#999" text-anchor="end">this week</text></svg></div>
  <div class="card"><h3>This week’s weigh-in</h3><div class="wt"><button class="st" id="wdn">−</button><b>${w[w.length-1].toFixed(1)}kg</b><button class="st" id="wup">+</button></div></div>
  <div class="legend">Weigh at the same time of day: you on the scales, then you holding the cat, and take one from the other.</div>`;}
function vV(){const c=cat();return cats()+`<div class="card"><h3>${c.n}’s vet visits</h3>${c.vet.slice().sort((a,b)=>b.d-a.d).map(x=>`<div class="vv">${GX.esc(x.t)}<span>${GX.day(GX.today(x.d),{day:'numeric',month:'short',year:'numeric'})}</span></div>`).join('')}</div>
  <button class="go alt" id="note">+ Add today’s note: “Seen for weight check”</button>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share ${c.n}’s week to ${C.gateway}`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='t'?vT():S.tab==='w'?vW():vV();const d=C.data,c=cat(),sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{d.cat=+b.dataset.c;S.shared=false;sv();});
  v.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{c.today[b.dataset.j]=!c.today[b.dataset.j];sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('wup',()=>{c.w[c.w.length-1]=Math.round((c.w[c.w.length-1]+0.1)*10)/10;sv();});on('wdn',()=>{c.w[c.w.length-1]=Math.max(0.3,Math.round((c.w[c.w.length-1]-0.1)*10)/10);sv();});
  on('note',()=>{c.vet.push({d:0,t:'Seen for weight check.'});sv();});
  on('share',()=>GX.post(`${c.e} ${c.n} this week: <b>${c.w[c.w.length-1].toFixed(1)}kg</b>, eating well and very pleased with the radiator. Kept in Cat Diary`,'CAT DIARY').then(o=>{if(o){S.shared=true;paint();}}));}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
