<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Empty Legs</title>
<style>
/* Empty Legs, by Altair Jets (fictional), 2026-11-23. A GENEXXO app for JetXX.
   This week's one-way private jet repositioning flights (fictional, dated from today), route filters, route alerts
   and a held seat. Prices are illustrative; empty legs move with the main charter. */
:root{--bg:#0A0E1A;--card:rgba(255,255,255,.05);--line:rgba(231,236,245,.1);--ink:#E7ECF5;--mut:rgba(231,236,245,.55);--champ:#E2C275;--sky:#38BDF8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F1DCA7,#A8873C);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--champ)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--champ);border-color:var(--champ);color:#1C1607}
.leg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.rt{display:flex;align-items:center;gap:8px}.rt .ap{flex:1}.rt .ap b{display:block;font-size:20px;font-weight:900;letter-spacing:.02em}.rt .ap small{color:var(--mut);font-size:11.5px}.rt .ap.r{text-align:right}
.rt .ln{flex:1.2;display:flex;align-items:center;gap:4px;color:var(--champ)}.rt .ln:before,.rt .ln:after{content:'';flex:1;border-top:1px dashed rgba(226,194,117,.5)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.meta small{color:var(--mut);font-size:12px}.meta .pr{font-size:18px;font-weight:900;color:var(--champ)}
.hold{font:inherit;font-weight:800;font-size:12.5px;padding:9px 14px;border-radius:99px;border:0;background:var(--champ);color:#1C1607;cursor:pointer}.hold:disabled{background:rgba(255,255,255,.08);color:var(--mut)}
.al{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}.al b{flex:1}
.tg{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;border:0}.tg:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--champ)}.tg.on:after{left:21px}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--champ);color:#1C1607;cursor:pointer}.go:disabled{background:rgba(255,255,255,.08);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">💺</div><div><h1>Empty Legs</h1><p>Altair Jets · in JetXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="f" class="on">This week</button><button data-tab="a">Alerts</button><button data-tab="h">My seats</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const LEGS=[['FAB','Farnborough','GVA','Geneva',0,'18:30',2,690,'Light jet'],['BQH','Biggin Hill','NCE','Nice',1,'10:15',4,890,'Midsize jet'],['LTN','Luton','PMI','Palma',1,'16:00',6,740,'Super-midsize jet'],['MAN','Manchester','ZRH','Zurich',2,'08:45',3,820,'Light jet'],['FAB','Farnborough','CMF','Chambéry',3,'07:30',5,780,'Midsize jet'],['EDI','Edinburgh','LBG','Paris',3,'13:00',4,590,'Light jet'],['GVA','Geneva','FAB','Farnborough',4,'19:45',6,640,'Midsize jet'],['BQH','Biggin Hill','IBZ','Ibiza',5,'11:30',7,690,'Super-midsize jet']];
const seed=()=>({alerts:{'London → Alps':true,'London → Riviera':false,'North → Europe':true,'Anywhere → London':false},held:['BQHNCE1']});
let C,S={tab:'f',f:'All',shared:false};
GX.init({gateway:'JetXX',seed}).then(c=>{C=c;paint();});
const LON=['FAB','BQH','LTN'];
const F={All:()=>true,'From London':l=>LON.includes(l[0]),'From the North':l=>['MAN','EDI'].includes(l[0]),'To the Alps':l=>['GVA','ZRH','CMF'].includes(l[2])};
const id=l=>l[0]+l[2]+l[4];
const leg=l=>{const h=C.data.held.includes(id(l));return `<div class="leg"><div class="rt"><div class="ap"><b>${l[0]}</b><small>${l[1]}</small></div><div class="ln">✈</div><div class="ap r"><b>${l[2]}</b><small>${l[3]}</small></div></div>
  <div class="meta"><div><small>${GX.day(GX.today(l[4]))} · ${l[5]} · ${l[8]}</small><br><small>${l[6]} seats</small></div><div style="text-align:right"><div class="pr">£${l[7]}</div><button class="hold" data-hold="${id(l)}" ${h?'disabled':''}>${h?'✓ Held':'Hold a seat'}</button></div></div></div>`;};
function vF(){return `<div class="chips">${Object.keys(F).map(k=>`<button class="chip ${S.f===k?'on':''}" data-f="${k}">${k}</button>`).join('')}</div>`+LEGS.filter(F[S.f]).map(leg).join('')+`<div class="legend">Empty legs move with the main charter. We’ll tell you if yours changes.</div>`;}
function vA(){const a=C.data.alerts;return `<div class="lbl">Tell me about new empty legs</div>`+Object.keys(a).map(k=>`<div class="al"><span style="font-size:20px">🔔</span><b>${k}</b><button class="tg ${a[k]?'on':''}" data-al="${GX.esc(k)}"></button></div>`).join('')+`<div class="legend">${Object.values(a).filter(Boolean).length} alerts on</div>`;}
function vH(){const L=LEGS.filter(l=>C.data.held.includes(id(l)));return L.length?L.map(leg).join('')+`<div class="legend">Seats are held for 24 hours.</div>`+(GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my flight'}</button>`:''):'<div class="legend" style="margin-top:30px">No seats held. Find one in This week.</div>';}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='f'?vF():S.tab==='a'?vA():vH();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;paint();});
  v.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{d.alerts[b.dataset.al]=!d.alerts[b.dataset.al];sv();});
  v.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>{d.held.push(b.dataset.hold);S.tab='h';S.shared=false;sv();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const l=LEGS.find(x=>id(x)===d.held[d.held.length-1]);GX.post(`Holding a seat on an empty-leg jet: <b>${l[1]} → ${l[3]}</b>, ${GX.day(GX.today(l[4]))}. Private jet for £${l[7]} 💺`,'EMPTY LEGS').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
