<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watchlist</title>
<style>
/* Watchlist, by Reelhouse (fictional), 2026-11-21. A GENEXXO app for FilmXX.
   Films to see and films seen, star ratings, and "pick for tonight" by mood and how long you've got.
   Every film title, year and director here is fictional. */
:root{--bg:#0F0D14;--card:rgba(255,255,255,.05);--line:rgba(243,240,247,.1);--ink:#F3F0F7;--mut:rgba(243,240,247,.55);--vio:#A78BFA;--red:#E0464E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#9F67FA,#4C1D95);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--vio)}
.f{display:flex;gap:11px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.post{width:44px;height:62px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.f .x{flex:1;min-width:0}.f b{display:block;font-size:14.5px}.f small{color:var(--mut);font-size:12px}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(167,139,250,.15);color:var(--vio);margin-right:4px}
.mini{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.stars{display:flex;gap:2px}.stars button{font-size:18px;background:none;border:0;cursor:pointer;color:#4A4458;padding:0 1px}.stars button.on{color:#F2C14E}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button{flex:1;min-width:60px;font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;padding:9px 4px;cursor:pointer}.seg button.on{background:var(--vio);border-color:var(--vio);color:#160B2E}
.pick{margin-top:14px;border-radius:20px;padding:18px;background:linear-gradient(155deg,#3B1F6E,#1A1030 60%,#5A1820);border:1px solid rgba(167,139,250,.3);text-align:center}
.pick small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#F2C14E}.pick h2{font-size:24px;font-weight:900;margin:6px 0 2px}.pick p{color:var(--mut);font-size:13px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--vio);color:#160B2E;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🎬</div><div><h1>Watchlist</h1><p>Reelhouse · in FilmXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="w" class="on">To see</button><button data-tab="t">Tonight</button><button data-tab="s">Seen</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const MOODS=['Cosy','Funny','Gripping','Weepy','Thoughtful'];
const seed=()=>({mood:'Cosy',time:120,pick:null,films:[
  {t:'The Quiet Harbour',y:2026,m:112,mood:'Thoughtful',by:'Anwen Price',em:'⚓',bg:'linear-gradient(160deg,#1E3A5F,#0B1626)',seen:false,from:'Film Club'},
  {t:'Snow on Arden Street',y:1954,m:94,mood:'Cosy',by:'Harold Venn',em:'❄️',bg:'linear-gradient(160deg,#5A6A82,#1E2533)',seen:false,from:'Reelhouse December Collection'},
  {t:'Twelve Tins of Paint',y:2025,m:101,mood:'Funny',by:'Mo Akhtar',em:'🎨',bg:'linear-gradient(160deg,#E0464E,#7A1C22)',seen:false,from:'Sue'},
  {t:'Night Ferry to Bilbao',y:2024,m:128,mood:'Gripping',by:'Lucía Ortega',em:'🚢',bg:'linear-gradient(160deg,#20304A,#06090F)',seen:false,from:'Cal'},
  {t:'The Last Lighthouse Keeper',y:2023,m:96,mood:'Weepy',by:'Iona MacRae',em:'🗼',bg:'linear-gradient(160deg,#F2C14E,#7A4E12)',seen:false,from:'Mum'},
  {t:'Christmas at the Picture Palace',y:1961,m:88,mood:'Cosy',by:'Joan Fairley',em:'🎄',bg:'linear-gradient(160deg,#1F6B45,#0A2618)',seen:false,from:'Lantern Cinemas'},
  {t:'Small Hours',y:2026,m:79,mood:'Thoughtful',by:'Kofi Mensah',em:'🌙',bg:'linear-gradient(160deg,#4C1D95,#160B2E)',seen:false,from:'Film Club'},
  {t:'Dog Days in Margate',y:2022,m:99,mood:'Funny',by:'Tess Hollis',em:'🐕',bg:'linear-gradient(160deg,#F49B5C,#8A3A12)',seen:true,stars:4},
  {t:'Undertow',y:2021,m:117,mood:'Gripping',by:'Rafe Okoro',em:'🌊',bg:'linear-gradient(160deg,#0E5A6B,#04161C)',seen:true,stars:5},
  {t:'Letters from Hay',y:2019,m:104,mood:'Weepy',by:'Bryony Hale',em:'✉️',bg:'linear-gradient(160deg,#C9A27A,#5A4028)',seen:true,stars:4},
  {t:'The Cartographer’s Daughter',y:1972,m:131,mood:'Thoughtful',by:'Pavel Ruzicka',em:'🗺️',bg:'linear-gradient(160deg,#6B5A3A,#221A0E)',seen:true,stars:5},
  {t:'Mince Pies at Midnight',y:2020,m:91,mood:'Cosy',by:'Gwen Tudor',em:'🥧',bg:'linear-gradient(160deg,#A33A3A,#3A1010)',seen:true,stars:3}]});
let C,S={tab:'w',shared:false};
GX.init({gateway:'FilmXX',seed}).then(c=>{C=c;paint();});
const hm=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const poster=f=>`<div class="post" style="background:${f.bg}">${f.em}</div>`;
function vW(){const l=C.data.films.map((f,i)=>[f,i]).filter(x=>!x[0].seen);
  return l.map(([f,i])=>`<div class="f">${poster(f)}<div class="x"><b>${GX.esc(f.t)}</b><small>${f.y} · ${hm(f.m)} · ${GX.esc(f.by)}</small><div style="margin-top:4px"><span class="tag">${f.mood}</span><small>from ${GX.esc(f.from)}</small></div></div><button class="mini" data-seen="${i}">✓ Seen</button></div>`).join('')+`<div class="legend">${l.length} films waiting. Tap Seen when you’ve watched one, then rate it.</div>`;}
function pickOne(){const d=C.data,l=d.films.map((f,i)=>[f,i]).filter(([f])=>!f.seen&&f.m<=d.time),m=l.filter(([f])=>f.mood===d.mood),pool=m.length?m:l;if(!pool.length){d.pick=null;return;}const r=GX.rng(d.mood+d.time+Date.now());d.pick=pool[Math.floor(r()*pool.length)][1];}
function vT(){const d=C.data,p=d.pick!=null?d.films[d.pick]:null;
  return `<label>In the mood for</label><div class="seg">${MOODS.map(m=>`<button data-mood="${m}" class="${d.mood===m?'on':''}">${m}</button>`).join('')}</div>
  <label>Time we’ve got</label><div class="seg">${[[90,'Under 1h 30'],[120,'Under 2h'],[200,'All night']].map(t=>`<button data-time="${t[0]}" class="${d.time===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
  ${p&&!p.seen?`<div class="pick"><small>TONIGHT’S FILM</small><div style="display:flex;justify-content:center;margin-top:10px"><div class="post" style="background:${p.bg};width:84px;height:118px;font-size:38px;border-radius:10px">${p.em}</div></div><h2>${GX.esc(p.t)}</h2><p>${p.y} · ${hm(p.m)} · ${p.mood}<br>Recommended by ${GX.esc(p.from)}</p></div>`:'<div class="legend" style="margin-top:20px">Nothing fits yet. Try another mood or more time.</div>'}
  <button class="go" id="pick">${p?'Pick another':'Pick for tonight'}</button>`;}
function vS(){const l=C.data.films.map((f,i)=>[f,i]).filter(x=>x[0].seen);
  return l.map(([f,i])=>`<div class="f">${poster(f)}<div class="x"><b>${GX.esc(f.t)}</b><small>${f.y} · ${GX.esc(f.by)}</small><div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${i}:${n}" class="${(f.stars||0)>=n?'on':''}">★</button>`).join('')}</div></div></div>`).join('')+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my year in film'}</button>`:'');}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='w'?vW():S.tab==='t'?vT():vS();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-seen]').forEach(b=>b.onclick=()=>{const f=d.films[+b.dataset.seen];f.seen=true;f.stars=0;sv();});
  v.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{d.mood=b.dataset.mood;pickOne();sv();});
  v.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{d.time=+b.dataset.time;pickOne();sv();});
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const [i,n]=b.dataset.r.split(':').map(Number);d.films[i].stars=n;sv();});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on('pick',()=>{pickOne();sv();});
  on('share',()=>{const s=d.films.filter(f=>f.seen),top=s.slice().sort((a,b)=>(b.stars||0)-(a.stars||0))[0];GX.post(`<b>${s.length} films</b> watched and rated this year. Top of the pile: ${GX.esc(top.t)} (${top.y}) ${'★'.repeat(top.stars||0)} 🎬`,'WATCHLIST').then(o=>{if(o){S.shared=true;paint();}});});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;if(S.tab==='t'&&C.data.pick==null)pickOne();paint();};
</script></body></html>
