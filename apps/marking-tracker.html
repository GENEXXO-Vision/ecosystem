<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marking Tracker</title>
<style>
/* Marking Tracker, by "Planwell" (fictional), 2026-11-16. A GENEXXO app for TeacherXX.
   Each pile: class, task, books, books done, deadline (days from today) and the teacher's own minutes per book.
   Time left = books left × minutes per book. Piles sort soonest deadline first; overdue piles are flagged. */
:root{--bg:#FBF7EE;--card:#FFFDF8;--line:rgba(30,42,38,.1);--ink:#1E2A26;--mut:rgba(30,42,38,.55);--green:#2F5D50;--red:#D9433B;--yel:#E0A21B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F7C548,#C98C0E);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--yel)}
.mtn{background:linear-gradient(160deg,#2F5D50,#1F4237);color:#FBF7EE;border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center}
.mtn .n{flex:1}.mtn b{font-size:32px;font-weight:900;display:block;line-height:1.1}.mtn small{font-weight:800;font-size:12px;opacity:.75}
.pile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.pile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pile .top b{font-size:15px}.pile .top small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.due{font-size:11.5px;font-weight:900;border-radius:99px;padding:3px 9px;white-space:nowrap}.d-ok{background:#E3EFE9;color:var(--green)}.d-soon{background:#FFF1CF;color:#9A6B00}.d-late{background:#FDE2DF;color:var(--red)}.d-done{background:#E3EFE9;color:var(--green)}
.books{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 8px}.books i{width:12px;height:16px;border-radius:2px 3px 3px 2px;background:rgba(30,42,38,.1)}.books i.m{background:var(--yel)}
.pile .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}.pile .ft span{font-size:12.5px;color:var(--mut);font-weight:700}
.tick{font:inherit;font-weight:900;font-size:13px;border:0;border-radius:99px;padding:8px 14px;background:var(--yel);color:#3A2A00;cursor:pointer}.tick:disabled{background:#E3EFE9;color:var(--green)}
.tick.s{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 11px}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.row b{font-size:14px}.row small{display:block;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:8px}.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}.step span{min-width:64px;text-align:center;font-weight:900;font-size:15px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--green);color:#fff;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut);border:1px solid var(--line)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📚</div><div><h1>Marking Tracker</h1><p>Planwell · in TeacherXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="piles" class="on">Piles</button><button data-tab="add">New pile</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CLASSES=['9X2','7B','11S','10Y','8C'],TASKS=['Assessment','Homework','Mock paper','Book look','End-of-unit test'];
const seed=()=>({mins:4,piles:[
  {c:'11S',t:'Mock paper',n:24,done:9,due:2,m:8},{c:'9X2',t:'End-of-unit test',n:28,done:28,due:1,m:4},
  {c:'7B',t:'Homework',n:30,done:12,due:4,m:3},{c:'10Y',t:'Assessment',n:27,done:0,due:6,m:6},{c:'8C',t:'Book look',n:29,done:20,due:-1,m:3}]});
let C,S={tab:'piles',shared:{},f:{c:0,t:0,n:28,due:3,m:4}};
GX.init({gateway:'TeacherXX',seed}).then(c=>{C=c;paint();});
const left=p=>(p.n-p.done)*p.m;
const hm=m=>m>=60?Math.floor(m/60)+'h '+(m%60?String(m%60).padStart(2,'0')+'m':''):m+'m';
function due(p){if(p.done>=p.n)return '<span class="due d-done">✓ DONE</span>';if(p.due<0)return `<span class="due d-late">${-p.due}d OVERDUE</span>`;if(p.due===0)return '<span class="due d-soon">DUE TODAY</span>';
  return `<span class="due ${p.due<=2?'d-soon':'d-ok'}">${GX.day(GX.today(p.due),{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}</span>`;}
function vPiles(){const ps=C.data.piles,open=ps.filter(p=>p.done<p.n),tot=open.reduce((a,p)=>a+left(p),0),books=open.reduce((a,p)=>a+p.n-p.done,0);
  const sorted=ps.map((p,i)=>({p,i})).sort((a,b)=>(a.p.done>=a.p.n)-(b.p.done>=b.p.n)||a.p.due-b.p.due);
  return `<div class="mtn"><div style="font-size:40px">⛰️</div><div class="n"><b>${hm(tot)}</b><small>${books} books left across ${open.length} piles</small></div></div>
  ${sorted.map(({p,i})=>{const fin=p.done>=p.n;return `<div class="pile"><div class="top"><div><b>${p.c} · ${p.t}</b><small>${p.done} of ${p.n} marked · ${p.m} min a book</small></div>${due(p)}</div>
    <div class="books">${Array.from({length:p.n},(_,j)=>`<i class="${j<p.done?'m':''}"></i>`).join('')}</div>
    <div class="ft"><span>${fin?'Pile cleared 🎉':hm(left(p))+' to go'}</span>${fin?(GX.can('feed')?`<button class="tick" data-share="${i}" ${S.shared[i]?'disabled':''}>${S.shared[i]?'✓ Shared':'Share'}</button>`:''):`<div><button class="tick s" data-five="${i}">+5</button> <button class="tick" data-one="${i}">✓ One more</button></div>`}</div></div>`;}).join('')}
  <div class="legend">Time left uses your own minutes per book for each pile.</div>`;}
function vAdd(){const f=S.f;const st=(k,lab,sub,val)=>`<div class="row"><div><b>${lab}</b><small>${sub}</small></div><div class="step"><button data-k="${k}" data-d="-1">–</button><span>${val}</span><button data-k="${k}" data-d="1">+</button></div></div>`;
  return st('c','Class','Which class',CLASSES[f.c])+st('t','Task','What you are marking',TASKS[f.t])+st('n','Books','How many',f.n)+st('due','Deadline','When it is due',f.due===0?'Today':GX.day(GX.today(f.due),{weekday:'short',day:'numeric'}))+st('m','Minutes a book','Your pace',f.m+' min')
  +`<div class="legend">About <b>${hm(f.n*f.m)}</b> of marking.</div><button class="go" id="add">Add pile</button>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),ps=C.data.piles;v.innerHTML=S.tab==='piles'?vPiles():vAdd();
  v.querySelectorAll('[data-one]').forEach(e=>e.onclick=()=>{const p=ps[+e.dataset.one];p.done=Math.min(p.n,p.done+1);GX.save(C.data);paint();});
  v.querySelectorAll('[data-five]').forEach(e=>e.onclick=()=>{const p=ps[+e.dataset.five];p.done=Math.min(p.n,p.done+5);GX.save(C.data);paint();});
  v.querySelectorAll('[data-share]').forEach(e=>e.onclick=()=>{const i=+e.dataset.share,p=ps[i];
    GX.post(`Pile cleared: <b>${p.n} ${p.t.toLowerCase()}s for ${p.c}</b>, all marked. The mountain shrinks, tracked in Marking Tracker 📚`,'MARKING TRACKER').then(ok=>{if(ok){S.shared[i]=true;paint();}});});
  v.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{const k=e.dataset.k,d=+e.dataset.d,f=S.f;
    if(k==='c')f.c=(f.c+d+CLASSES.length)%CLASSES.length;else if(k==='t')f.t=(f.t+d+TASKS.length)%TASKS.length;else if(k==='n')f.n=Math.max(1,Math.min(60,f.n+d));else if(k==='due')f.due=Math.max(0,Math.min(28,f.due+d));else f.m=Math.max(1,Math.min(30,f.m+d));paint();});
  const a=document.getElementById('add');if(a)a.onclick=()=>{const f=S.f;ps.push({c:CLASSES[f.c],t:TASKS[f.t],n:f.n,done:0,due:f.due,m:f.m});GX.save(C.data);S.tab='piles';paint();};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
