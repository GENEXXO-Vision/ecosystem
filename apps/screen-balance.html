<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screen Balance</title>
<style>
/* Screen Balance, by Kindred Cases (fictional), 2026-11-24. A GENEXXO app for PhoneXX.
   Log the day's phone time by kind, a gentle daily goal, the last seven days and phone-free times. Self-reported,
   no lock-outs, no shaming. */
:root{--bg:#F8F7FC;--card:#fff;--line:rgba(27,24,48,.09);--ink:#1B1830;--mut:rgba(27,24,48,.55);--acc:#10B981;--ind:#4F46E5;--cor:#F43F5E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#34D399,#047857);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.ring{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.ring svg{width:116px;height:116px;flex-shrink:0}.ring small{color:var(--mut);font-weight:700;font-size:12px}.ring b{display:block;font-size:28px;font-weight:900}
.pill{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(16,185,129,.12);color:#047857}.pill.w{background:rgba(244,63,94,.1);color:var(--cor)}
.cat{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}.cat .e{font-size:20px}.cat .x{flex:1}.cat b{display:block;font-size:13.5px}.cat .bar{height:6px;border-radius:99px;background:rgba(27,24,48,.07);margin-top:5px;overflow:hidden}.cat .bar i{display:block;height:100%;border-radius:99px}
.cat button{font:inherit;font-weight:800;font-size:12px;padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.wk{display:flex;align-items:flex-end;gap:6px;height:160px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;position:relative}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:700;position:relative;z-index:1}.wk i{display:block;border-radius:6px 6px 2px 2px;background:#A7F3D0;margin-bottom:4px}.wk i.o{background:#FECDD3}.wk .t i{background:var(--acc)}
.goal{position:absolute;left:10px;right:10px;border-top:2px dashed rgba(79,70,229,.45)}
.ff{display:flex;gap:10px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}.ff .e{font-size:22px}.ff .x{flex:1}.ff b{display:block;font-size:14px}.ff small{color:var(--mut)}
.tg{width:44px;height:26px;border-radius:99px;background:rgba(27,24,48,.15);position:relative;cursor:pointer;border:0}.tg:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--acc)}.tg.on:after{left:21px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--acc);color:#fff;cursor:pointer}.go:disabled{background:rgba(27,24,48,.07);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🌿</div><div><h1>Screen Balance</h1><p>Kindred Cases · in PhoneXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Today</button><button data-tab="w">This week</button><button data-tab="f">Phone-free</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CATS=[['📱','Social','#F43F5E'],['🎬','Video','#4F46E5'],['💬','Messages','#10B981'],['🗺️','Maps and travel','#F59E0B'],['📰','News and reading','#64748B']];
const seed=()=>({goal:180,today:[45,30,25,15,20],week:[232,198,176,214,161,149],free:{'🍽️ Meals':true,'🛏️ The hour before bed':true,'☀️ Sunday mornings':false,'🚶 Walks':false}});
let C,S={tab:'t',shared:false};
GX.init({gateway:'PhoneXX',seed}).then(c=>{C=c;paint();});
const tot=()=>C.data.today.reduce((a,b)=>a+b,0),hm=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
function vT(){const d=C.data,t=tot(),f=Math.min(1,t/d.goal),c=2*Math.PI*48,over=t>d.goal,mx=Math.max(...d.today,1);
  return `<div class="ring"><svg viewBox="0 0 116 116"><circle cx="58" cy="58" r="48" fill="none" stroke="rgba(27,24,48,.07)" stroke-width="12"/><circle cx="58" cy="58" r="48" fill="none" stroke="${over?'#F43F5E':'#10B981'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 58 58)"/><text x="58" y="64" text-anchor="middle" fill="#1B1830" font-size="17" font-weight="800">${Math.round(t/d.goal*100)}%</text></svg>
  <div><small>On your phone today</small><b>${hm(t)}</b><span class="pill ${over?'w':''}">${over?'Over your goal: that’s okay':`${hm(d.goal-t)} under your ${d.goal/60}h goal`}</span></div></div><div class="lbl">By kind · tap + to log 15 minutes</div>`+
  CATS.map((c,i)=>`<div class="cat"><span class="e">${c[0]}</span><div class="x"><b>${c[1]} · ${hm(d.today[i])}</b><div class="bar"><i style="width:${d.today[i]/mx*100}%;background:${c[2]}"></i></div></div><button data-c="${i}">+15</button></div>`).join('')+
  `<div class="legend">Logged by you. No lock-outs, no judgement.</div>`;}
function vW(){const d=C.data,days=[...d.week,tot()],max=Math.max(...days,d.goal)*1.1,avg=Math.round(days.reduce((a,b)=>a+b,0)/7);
  return `<div class="ring" style="padding:12px 16px"><div><small>Daily average this week</small><b>${hm(avg)}</b><span class="pill ${avg>d.goal?'w':''}">${days.filter(x=>x<=d.goal).length} of 7 days within your goal</span></div></div>
  <div class="lbl">Last 7 days</div><div class="wk"><span class="goal" style="bottom:${10+18+d.goal/max*110}px"></span>${days.map((m,i)=>`<div class="${i===6?'t':''}"><i class="${m>d.goal&&i<6?'o':''}" style="height:${Math.max(2,m/max*110)}px"></i>${i===6?'Today':GX.day(GX.today(i-6),{weekday:'narrow'})}</div>`).join('')}</div>
  <div class="legend">Dashed line: your goal of ${d.goal/60} hours.</div>`+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my week'}</button>`:'');}
function vF(){const a=C.data.free,on=Object.values(a).filter(Boolean).length;return `<div class="lbl">Times you keep phone-free</div>`+Object.keys(a).map(k=>`<div class="ff"><span class="e">${k.split(' ')[0]}</span><div class="x"><b>${k.slice(k.indexOf(' ')+1)}</b><small>${a[k]?'Phone-free ✓':'Not yet'}</small></div><button class="tg ${a[k]?'on':''}" data-f="${GX.esc(k)}"></button></div>`).join('')+
  `<div class="legend">${on} phone-free time${on===1?'':'s'}. Start with one and keep it.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='t'?vT():S.tab==='w'?vW():vF();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{d.today[+b.dataset.c]+=15;sv();});
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{d.free[b.dataset.f]=!d.free[b.dataset.f];sv();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const days=[...d.week,tot()],avg=Math.round(days.reduce((a,b)=>a+b,0)/7);GX.post(`Averaging ${hm(avg)} a day on my phone this week, and ${Object.values(d.free).filter(Boolean).length} phone-free times I’m keeping. Small steps 🌿`,'SCREEN BALANCE').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
