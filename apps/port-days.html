<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Port Days</title>
<style>
/* Port Days, by "Wake Digital" (fictional), 2026-11-17. A GENEXXO app for CruiseXX.
   A twelve-night Norwegian fjords sailing from Southampton on the (fictional) Azure Meridian, with real ports:
   Stavanger, Geiranger, Flåm, Bergen (overnight), Ålesund. Day 1 sails 63 days from today. "Today" shows
   the day you pick as if you were on it: arrive, all aboard (30 minutes before sailing) and a countdown
   to all aboard: from the current time of day when it falls inside the port window, otherwise a preview from
   a few hours after arrival (labelled PREVIEW), so the screen never reads "ship sailed" at night. Tap a plan idea to add it to that day's notes. */
:root{--bg:#06192B;--card:rgba(255,255,255,.05);--line:rgba(232,244,250,.1);--ink:#E8F4FA;--mut:rgba(232,244,250,.55);--tq:#2EC4D6;--cor:#FF8A5B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2EC4D6,#0E6F8C);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--tq)}
.hero{border-radius:18px;padding:16px;background:linear-gradient(150deg,#0F3E63,#0A2540);border:1px solid rgba(46,196,214,.25)}
.hero small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--tq)}.hero h2{font-size:21px;font-weight:900;margin:3px 0 1px}.hero p{color:var(--mut);font-size:13px}
.big{display:flex;gap:8px;margin-top:12px}.big div{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;text-align:center}.big b{display:block;font-size:20px;font-weight:900}.big span{font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.big .ab{background:rgba(255,138,91,.16)}.big .ab b{color:var(--cor)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.dy{display:flex;gap:11px;align-items:center;padding:9px 0;cursor:pointer}.dy+.dy{border-top:1px solid var(--line)}
.dy .n{width:38px;height:38px;border-radius:11px;background:rgba(46,196,214,.13);color:var(--tq);font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.dy.sea .n{background:rgba(232,244,250,.06);color:var(--mut)}.dy.on .n{background:var(--tq);color:#06192B}
.dy .x{flex:1}.dy .x b{font-size:14px}.dy .x small{display:block;color:var(--mut);font-size:12px}.dy .t{font-size:12px;font-weight:800;color:var(--mut);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font:inherit;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 11px;cursor:pointer}.chips button.on{background:rgba(46,196,214,.18);border-color:var(--tq)}
.nt{padding:7px 0;font-size:13.5px}.nt+.nt{border-top:1px solid var(--line)}.nt span{color:var(--tq);font-weight:800;margin-right:6px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--tq);color:#06192B;cursor:pointer}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">⚓</div><div><h1>Port Days</h1><p>Wake Digital · in CruiseXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="trip" class="on">Trip</button><button data-tab="day">Day</button><button data-tab="plans">Plans</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
/* [port, country, arrive, sail, ideas] — sea days have no times */
const DAYS=[
  ['Southampton','UK',null,'17:00',['Sail-away on the top deck','Find the cabin and unpack']],
  ['At sea','',null,null,['Talk: The Vikings at sea','Spa afternoon']],
  ['Stavanger','Norway','08:00','17:00',['Pulpit Rock boat trip','Old Stavanger’s white houses','Norwegian Petroleum Museum']],
  ['Geiranger','Norway','09:00','18:00',['Kayak under the Seven Sisters','Skageflå farm hike','Eagle Road viewpoint']],
  ['Ålesund','Norway','07:00','16:00',['Climb the 418 steps of Aksla','Art nouveau walk']],
  ['Flåm','Norway','08:00','18:00',['Flåm Railway','Fjord safari by RIB','Ægir brewery']],
  ['Bergen','Norway','08:00',null,['Fløibanen funicular','Bryggen wharf','Fish market lunch']],
  ['Bergen','Norway',null,'17:00',['Grieg’s house, Troldhaugen','KODE art museums']],
  ['At sea','',null,null,['Galley tour','Formal night']],
  ['At sea','',null,null,['Lecture: Northern lights','Pack slowly']],
  ['Southampton','UK','06:30',null,['Disembark from 08:00']]];
const START=63;
const seed=()=>({cur:3,notes:{3:['Kayak under the Seven Sisters'],5:['Flåm Railway'],6:['Fløibanen funicular','Fish market lunch']}});
let C,S={tab:'trip',shared:false};
GX.init({gateway:'CruiseXX',seed}).then(c=>{C=c;paint();setInterval(()=>{if(S.tab==='day')paint();},30000);});
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const aboard=d=>d[3]?hm(mins(d[3])-30):null;
const date=i=>GX.today(START+i);
function vTrip(){const ports=new Set(DAYS.filter(d=>d[1]==='Norway').map(d=>d[0])).size;
  return `<div class="hero"><small>AZURE MERIDIAN · FJORDS</small><h2>${DAYS.length} days, ${ports} Norwegian ports</h2><p>Sails ${GX.day(date(0),{weekday:'long',day:'numeric',month:'long'})} from Southampton</p>
    <div class="big"><div><b>${START}</b><span>DAYS TO GO</span></div><div><b>${DAYS.filter(d=>d[0]==='At sea').length}</b><span>SEA DAYS</span></div><div><b>${Object.values(C.data.notes).flat().length}</b><span>PLANS</span></div></div></div>
  <div class="card">${DAYS.map((d,i)=>`<div class="dy ${d[0]==='At sea'?'sea':''} ${i===C.data.cur?'on':''}" data-d="${i}"><span class="n">${i+1}</span><div class="x"><b>${d[0]}</b><small>${GX.day(date(i))}${d[1]?' · '+d[1]:''}</small></div><span class="t">${d[2]||d[3]?`${d[2]||'—'} – ${d[3]||(i===6?'overnight':'—')}`:'🌊'}</span></div>`).join('')}</div>`;}
function vDay(){const i=C.data.cur,d=DAYS[i],ab=aboard(d),now=new Date(),nm=now.getHours()*60+now.getMinutes();
  let cd='—',lab='ALL ABOARD';if(ab){const arr=d[2]?mins(d[2]):0,live=nm>=arr&&nm<mins(ab),at=live?nm:arr+165,left=mins(ab)-at;cd=`${Math.floor(left/60)}h ${left%60}m`;lab=live?'TO ALL ABOARD':`TO ALL ABOARD AT ${hm(at)} (PREVIEW)`;}
  const notes=C.data.notes[i]||[];
  return `<div class="hero"><small>DAY ${i+1} · ${GX.day(date(i)).toUpperCase()}</small><h2>${d[0]}${d[1]?', '+d[1]:''}</h2><p>${d[0]==='At sea'?'A day at sea: no port, all ship.':i===6?'Overnight in Bergen: the ship stays alongside until tomorrow.':'Times are ship’s time.'}</p>
    <div class="big"><div><b>${d[2]||'—'}</b><span>ARRIVE</span></div><div class="ab"><b>${ab||'—'}</b><span>ALL ABOARD</span></div><div><b>${d[3]||'—'}</b><span>SAIL</span></div></div>
    ${ab?`<div class="big"><div class="ab" style="flex:1"><b>${cd}</b><span>${lab}</span></div></div>`:''}</div>
  <div class="card"><h3>Ideas for the day · tap to plan</h3><div class="chips">${d[4].map(x=>`<button data-note="${GX.esc(x)}" class="${notes.includes(x)?'on':''}">${notes.includes(x)?'✓ ':''}${GX.esc(x)}</button>`).join('')}</div></div>
  <div class="legend">Be back on board by the all-aboard time. The ship will not wait.</div>`;}
function vPlans(){const ks=Object.keys(C.data.notes).map(Number).filter(k=>C.data.notes[k].length).sort((a,b)=>a-b);
  return `${ks.length?ks.map(k=>`<div class="card"><h3>Day ${k+1} · ${DAYS[k][0]}${aboard(DAYS[k])?' · all aboard '+aboard(DAYS[k]):''}</h3>${C.data.notes[k].map(n=>`<div class="nt"><span>●</span>${GX.esc(n)}</div>`).join('')}</div>`).join(''):'<div class="legend">No plans yet. Pick ideas on any day.</div>'}
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my fjords plan to ${C.gateway}`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='trip'?vTrip():S.tab==='day'?vDay():vPlans();
  v.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{C.data.cur=+e.dataset.d;GX.save(C.data);S.tab='day';paint();});
  v.querySelectorAll('[data-note]').forEach(e=>e.onclick=()=>{const i=C.data.cur,n=e.dataset.note,a=C.data.notes[i]||(C.data.notes[i]=[]);
    C.data.notes[i]=a.includes(n)?a.filter(x=>x!==n):a.concat(n);GX.save(C.data);S.shared=false;paint();});
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const n=Object.values(C.data.notes).flat().length;
    GX.post(`<b>${START} days</b> to the Norwegian fjords on the Azure Meridian, and ${n} plans made already: Geiranger, Flåm and a night in Bergen. Port Days ⚓`,'PORT DAYS').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
