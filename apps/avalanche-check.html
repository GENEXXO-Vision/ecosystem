<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avalanche Check</title>
<style>
/* Avalanche Check, by "Slope Safe" (fictional), 2026-10-09. A GENEXXO app — and the one that asks for less:
   identity only, no feed posting, so the permission sheet visibly differs per app. Demo data, not a real
   bulletin; the app says so. */
:root{--bg:#120B0D;--card:#1E1316;--line:rgba(255,255,255,.08);--ink:#FFF1F2;--mut:rgba(255,241,242,.55);--acc:#EF4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;font:inherit;font-weight:800;font-size:13px;color:var(--mut);background:none;border:0;border-radius:9px;padding:8px 0;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
select{width:100%;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.lvl{display:flex;align-items:center;gap:14px}.num{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#111;flex-shrink:0}
.lvl b{display:block;font-size:19px}.lvl span{font-size:12.5px;color:var(--mut);font-weight:600}
.bands{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin-top:12px;font-size:12.5px;align-items:center}.bands i{font-style:normal;font-weight:900;padding:3px 10px;border-radius:8px;color:#111;text-align:center}
.rose{display:flex;gap:14px;align-items:center;margin-top:12px}.rose p{font-size:12px;color:var(--mut);line-height:1.5}
.pb{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.pb:last-child{border:0}.pb .ic{font-size:24px}.pb b{display:block;font-size:14px}.pb span{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(239,68,68,.15);color:#FCA5A5;margin:4px 4px 0 0}
.ck{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.ck:last-child{border:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ck.on .box{background:#22C55E;border-color:#22C55E;color:#04210F}.ck b{font-size:14px}.ck span{display:block;font-size:11.5px;color:var(--mut)}
.ready{text-align:center;font-weight:900;font-size:15px;padding:12px;border-radius:12px;margin-top:4px}
.note{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
</style></head><body>
<div class="hd"><div class="logo">⚠️</div><div><h1>Avalanche Check</h1><p>by Slope Safe · real-time risk</p></div></div>
<div class="tabs" id="tabs"><button data-tab="bulletin" class="on">Bulletin</button><button data-tab="problems">Problems</button><button data-tab="check">Checklist</button></div>
<main id="v"></main>
<script src="gx-sdk.js"></script>
<script>
const ZONES = ['Mont Blanc massif','Valais · Verbier','Arlberg · St Anton','Tarentaise · Val d’Isère','Hokkaido · Niseko'];
const LV = [null,['Low','#4ADE80'],['Moderate','#FACC15'],['Considerable','#FB923C'],['High','#EF4444'],['Very high','#991B1B']];
const ASPECTS = ['N','NE','E','SE','S','SW','W','NW'];
const PROBLEMS = [['💨','Wind slab','Fresh drifts on lee slopes below ridges.'],['❄️','New snow','Storm snow not yet bonded to the old surface.'],['🧊','Persistent weak layer','Buried facets that can fail under a single skier.'],['💧','Wet snow','Loose wet slides as the day warms, sunny aspects.'],['🪨','Gliding snow','Full-depth glide cracks on smooth grassy slopes.']];
const CHECK = [['Transceiver on and tested','Group check at the car park, send and receive'],['Shovel and probe packed','Assembled once at home this week'],['Read today’s bulletin','Level, aspects and problems understood'],['Plan shared with someone','Route and turn-around time'],['Group agrees the bail-out','Who calls it, and where we turn back']];
let C, S = { tab:'bulletin', zone:0 };
function bulletin(z){ const r=GX.rng(ZONES[z]+GX.iso(0)); const low=1+Math.floor(r()*2), high=Math.min(5,low+1+Math.floor(r()*2)); const risky=ASPECTS.filter(()=>r()>.5);
  const probs=PROBLEMS.filter(()=>r()>.55).slice(0,3); if(!probs.length) probs.push(PROBLEMS[0]); return {low, high, risky:risky.length?risky:['N','NE'], probs, above:Math.round(2000+r()*600)}; }
GX.init({gateway:'SkiXX', seed:()=>({zone:0, check:{}, day:''})}).then(c=>{ C=c; if(C.data.day!==GX.iso(0)){ C.data.check={}; C.data.day=GX.iso(0); } S.zone=C.data.zone||0; paint(); });

function rose(risky){ const cx=60, cy=60, R=50; return `<svg width="120" height="120" viewBox="0 0 120 120">${ASPECTS.map((a,i)=>{ const a0=(i*45-22.5-90)*Math.PI/180, a1=(i*45+22.5-90)*Math.PI/180;
  return `<path d="M${cx},${cy} L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)} A${R},${R} 0 0 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} Z" fill="${risky.includes(a)?'#EF4444':'rgba(255,255,255,.07)'}" stroke="#120B0D" stroke-width="2"/>
  <text x="${cx+(R+0)*.72*Math.cos((i*45-90)*Math.PI/180)}" y="${cy+(R)*.72*Math.sin((i*45-90)*Math.PI/180)+4}" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">${a}</text>`; }).join('')}</svg>`; }
function vBulletin(){ const b=bulletin(S.zone), [nm,col]=LV[b.high];
  return `<select id="zone">${ZONES.map((z,i)=>`<option value="${i}" ${i===S.zone?'selected':''}>${z}</option>`).join('')}</select>
    <div class="card"><div class="lvl"><div class="num" style="background:${col}">${b.high}</div><div><b>${nm}</b><span>Danger level today above ${b.above} m · ${GX.day(GX.today(0),{weekday:'long',day:'numeric',month:'long'})}</span></div></div>
    <div class="bands"><span>Above ${b.above} m</span><i style="background:${col}">${b.high} · ${nm}</i><span>Below ${b.above} m</span><i style="background:${LV[b.low][1]}">${b.low} · ${LV[b.low][0]}</i></div>
    <div class="rose">${rose(b.risky)}<p><b style="color:#FCA5A5">Most dangerous aspects</b><br>${b.risky.join(', ')}. Treat these slopes with extra caution, especially near ridges and in gullies.</p></div></div>
    <div class="note">Demo bulletin for illustration. Always read your official local avalanche service before going.</div>`; }
function vProblems(){ const b=bulletin(S.zone); return `<div class="card">${b.probs.map(p=>`<div class="pb"><div class="ic">${p[0]}</div><div><b>${p[1]}</b><span>${p[2]}</span><br>
    <span class="tag">${b.risky.slice(0,3).join(' · ')}</span><span class="tag">Above ${b.above} m</span><span class="tag">${['Possible','Likely'][p[1].length%2]}</span></div></div>`).join('')}</div>`; }
function vCheck(){ const n=CHECK.filter((_,i)=>C.data.check[i]).length, all=n===CHECK.length;
  return `<div class="card">${CHECK.map((c,i)=>`<div class="ck ${C.data.check[i]?'on':''}" data-k="${i}"><div class="box">${C.data.check[i]?'✓':''}</div><div><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('')}</div>
    <div class="ready" style="background:${all?'rgba(34,197,94,.15)':'rgba(255,255,255,.04)'};color:${all?'#4ADE80':'var(--mut)'}">${all?'✓ Ready to go. Enjoy it, and turn back early.':`${n} of ${CHECK.length} done`}</div>
    <div class="note">Resets every morning.</div>`; }
function paint(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'); v.innerHTML=S.tab==='bulletin'?vBulletin():S.tab==='problems'?vProblems():vCheck();
  const z=document.getElementById('zone'); if(z) z.onchange=()=>{ S.zone=+z.value; C.data.zone=S.zone; GX.save(C.data); paint(); };
  v.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{ const k=e.dataset.k; C.data.check[k]=!C.data.check[k]; GX.save(C.data); paint(); }); }
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; paint();};
</script></body></html>
