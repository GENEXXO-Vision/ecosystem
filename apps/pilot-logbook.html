<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pilot Logbook</title>
<style>
/* Pilot Logbook, by Contrail Aviation Academy (fictional), 2026-11-23. A GENEXXO app for JetXX.
   Log training flights; totals against simplified private-licence minimums (45 hours, 10 solo, 5 solo cross-country:
   illustrative round figures). Keep your official logbook too. */
:root{--bg:#0A0E1A;--card:rgba(255,255,255,.05);--line:rgba(231,236,245,.1);--ink:#E7ECF5;--mut:rgba(231,236,245,.55);--sky:#38BDF8;--dusk:#FB923C;--champ:#E2C275}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FB923C,#7C2D12);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sky)}
.big{background:linear-gradient(135deg,#1E3A8A,#0EA5E9);border-radius:20px;padding:18px}.big small{opacity:.85;font-weight:700;font-size:12px}.big b{display:block;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.p{margin-top:12px}.p small{display:flex;justify-content:space-between;color:var(--mut);font-weight:700;font-size:12px}.p small b{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:99px;background:var(--sky)}
.fl{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px}.fl .x{flex:1}.fl b{display:block}.fl p{color:var(--mut);font-size:12.5px}.fl .t{font-weight:900;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(56,189,248,.15);color:var(--sky);margin-left:4px}.tag.s{background:rgba(251,146,60,.15);color:var(--dusk)}
.lbl{font-weight:800;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink)}select option{color:#000}
.seg{display:flex;gap:6px}.seg button{flex:1;font:inherit;font-weight:800;font-size:13px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}.seg button.on{background:var(--sky);border-color:var(--sky);color:#06202E}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sky);color:#06202E;cursor:pointer}.go:disabled{background:rgba(255,255,255,.08);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📒</div><div><h1>Pilot Logbook</h1><p>Contrail Aviation Academy · in JetXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="t" class="on">Totals</button><button data-tab="l">Flights</button><button data-tab="a">Log a flight</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const seed=()=>{const R=[['Circuits','Gloucestershire','dual',1.1],['Stalls and steep turns','Gloucestershire','dual',1.2],['Circuits','Gloucestershire','dual',1.0],['First solo!','Gloucestershire','solo',0.4],['Navigation to Bristol','Gloucestershire → Bristol','dual',1.6],['Solo circuits','Gloucestershire','solo',1.0],['Forced landings practice','Gloucestershire','dual',1.3],['Solo cross-country','Gloucestershire → Oxford','xc',1.5],['Instrument appreciation','Gloucestershire','dual',1.0],['Solo consolidation','Gloucestershire','solo',1.2]];
  const f=R.map((r,i)=>({d:GX.iso(-(R.length-i)*9),n:r[0],r:r[1],k:r[2],h:r[3],ac:'Two-seat trainer'}));
  return {flights:f,prior:24.8};};
let C,S={tab:'t',kind:'dual',shared:false};
GX.init({gateway:'JetXX',seed}).then(c=>{C=c;paint();});
const sum=k=>C.data.flights.filter(f=>!k||k.includes(f.k)).reduce((a,f)=>a+f.h,0);
const tot=()=>C.data.prior+sum();
const prog=(lab,v,max)=>`<div class="p"><small><span>${lab}</span><b>${v.toFixed(1)} / ${max} h</b></small><div class="bar"><i style="width:${Math.min(100,v/max*100)}%;${v>=max?'background:#22C55E':''}"></i></div></div>`;
function vT(){const t=tot(),solo=sum(['solo','xc'])+6.2,xc=sum(['xc']);
  return `<div class="big"><small>Total flying hours</small><b>${t.toFixed(1)}</b><small>${t>=45?'Hours met: time for your skills test!':`${(45-t).toFixed(1)} hours to the licence minimum`}</small></div>`+
  prog('Total time',t,45)+prog('Solo time',solo,10)+prog('Solo cross-country',xc,5)+`<div class="legend">Simplified, illustrative minimums. Your instructor and official logbook are the record.</div>`+
  (GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:'Share my progress'}</button>`:'');}
function vL(){const F=C.data.flights.slice().reverse();return `<div class="lbl">${F.length} flights logged here · ${C.data.prior} h from before</div>`+F.map(f=>`<div class="fl"><span style="font-size:20px">${f.k==='dual'?'👨‍✈️':'🛩️'}</span><div class="x"><b>${GX.esc(f.n)}<span class="tag ${f.k!=='dual'?'s':''}">${f.k==='dual'?'Dual':f.k==='xc'?'Solo XC':'Solo'}</span></b><p>${GX.day(f.d)} · ${GX.esc(f.r)}</p></div><span class="t">${f.h.toFixed(1)} h</span></div>`).join('');}
function vA(){return `<div class="lbl">What did you fly?</div><input id="fn" placeholder="e.g. Solo circuits">
  <div class="lbl">Route</div><input id="fr" placeholder="e.g. Gloucestershire → Oxford">
  <div class="lbl">Type</div><div class="seg">${[['dual','Dual'],['solo','Solo'],['xc','Solo XC']].map(k=>`<button data-k="${k[0]}" class="${S.kind===k[0]?'on':''}">${k[1]}</button>`).join('')}</div>
  <div class="lbl">Flight time (hours)</div><select id="fh">${[0.5,0.8,1.0,1.2,1.5,1.8,2.0,2.5].map(h=>`<option ${h===1?'selected':''}>${h.toFixed(1)}</option>`).join('')}</select>
  <button class="go" id="add">Log flight</button>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v'),d=C.data;v.innerHTML=S.tab==='t'?vT():S.tab==='l'?vL():vA();const sv=()=>{GX.save(d);paint();};
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;v.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b));});
  const a=document.getElementById('add');if(a)a.onclick=()=>{d.flights.push({d:GX.iso(0),n:document.getElementById('fn').value.trim()||'Training flight',r:document.getElementById('fr').value.trim()||'Local',k:S.kind,h:+document.getElementById('fh').value,ac:'Two-seat trainer'});S.tab='t';S.shared=false;sv();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{GX.post(`${tot().toFixed(1)} hours in the logbook and counting towards my private pilot licence ✈️`,'PILOT LOGBOOK').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
