<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fit Check</title>
<style>
/* Fit Check, by "Doorway Labs" (fictional), 2026-11-19. A GENEXXO app for SofaXX.
   Will the sofa get through every doorway? Three ways through a door, the way delivery teams think:
   upright and carried in lengthways (depth < door width), on its back (height < door width) and tilted
   (diagonal depth < door width; measured from the top back corner to the front of the seat). The length travels
   along the hall, so it only matters on turns. Feet that unscrew take 10cm off the height. A simple guide, not a guarantee: tight turns
   in halls and stairs need more room. */
:root{--bg:#FAF6F0;--card:#fff;--line:rgba(43,36,32,.1);--ink:#2B2420;--mut:rgba(43,36,32,.55);--terra:#C2593A;--sage:#5C7A59;--bad:#B3261E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#D9805F,#A3432A);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--terra)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card h3{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.dim{display:flex;align-items:center;gap:8px;padding:7px 0}.dim+.dim{border-top:1px solid var(--line)}.dim span{flex:1;font-weight:700}.dim b{width:64px;text-align:center;font-size:17px}
.st{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#F4EDE4;font:inherit;font-size:18px;font-weight:800;cursor:pointer;color:var(--ink)}
.tg{font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:#F4EDE4;color:var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer}.tg.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.res{display:flex;gap:10px;align-items:center;padding:10px 0}.res+.res{border-top:1px solid var(--line)}
.res .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0}
.res .x{flex:1}.res .x b{display:block}.res .x small{color:var(--mut);font-size:12px}
.big{border-radius:18px;padding:16px;text-align:center;color:#fff}.big h2{font-size:22px;font-weight:900}.big p{font-size:13px;opacity:.9;margin-top:3px}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--terra);color:#fff;cursor:pointer}.go:disabled{background:#EDE4D9;color:var(--mut)}
.cmp{display:flex;gap:10px;align-items:center;padding:10px 0}.cmp+.cmp{border-top:1px solid var(--line)}.cmp .x{flex:1}.cmp .x b{display:block}.cmp .x small{color:var(--mut);font-size:12px}
.pill{font-size:11.5px;font-weight:900;padding:4px 9px;border-radius:99px}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">📐</div><div><h1>Fit Check</h1><p>Doorway Labs · in SofaXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="chk" class="on">Check</button><button data-tab="doors">Doorways</button><button data-tab="cmp">Compare</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const seed=()=>({s:{n:'Hollow Three-Seater',w:214,d:96,h:84,dg:79,feet:true},doors:[{n:'Front door',w:81,h:198},{n:'Hall into lounge',w:76,h:196},{n:'Lounge door frame',w:78,h:198}],
  cmp:[{n:'Hollow Three-Seater',w:214,d:96,h:84,dg:79,feet:true},{n:'Studio Two-Seater',w:150,d:86,h:80,dg:70,feet:true},{n:'Corner Sofa (one piece)',w:262,d:160,h:86,dg:120,feet:false},{n:'Spare Room Sofa Bed',w:182,d:92,h:88,dg:68,feet:false}]});
let C,S={tab:'chk',shared:false};
GX.init({gateway:'SofaXX',seed}).then(c=>{C=c;paint();});
const STEP={w:2,d:2,h:2,dg:2};
function ways(s,door){const h=s.h-(s.feet?10:0);
  if(s.d<door.w)return {ok:true,how:'Upright, carried in lengthways',gap:door.w-s.d};
  if(h<door.w)return {ok:true,how:'On its back'+(s.feet?', feet off':''),gap:door.w-h};
  if(s.dg<door.w)return {ok:true,how:'Tilted, the delivery-team way',gap:door.w-s.dg};
  return {ok:false,how:'Too tight',gap:Math.min(s.d,h,s.dg)-door.w};}
const all=s=>C.data.doors.map(d=>Object.assign({door:d},ways(s,d)));
const badge=r=>`<div class="ic" style="background:${r.ok?(r.gap<4?'#C98A1B':'var(--sage)'):'var(--bad)'}">${r.ok?'✓':'✗'}</div>`;
function vChk(){const s=C.data.s,r=all(s),ok=r.every(x=>x.ok),tight=r.filter(x=>x.ok&&x.gap<4).length;
  return `<div class="big" style="background:${ok?(tight?'linear-gradient(135deg,#D9A23B,#A86E10)':'linear-gradient(135deg,#7FA07B,#4E6B4B)'):'linear-gradient(135deg,#D25B4C,#9E2A1E)'}"><h2>${ok?(tight?'It fits, just':'It fits'):'It won’t fit'}</h2><p>${GX.esc(s.n)} · ${C.data.doors.length} doorways checked</p></div>
  <div class="card"><h3>The sofa (cm)</h3>${[['w','Length'],['d','Depth'],['h','Height'],['dg','Diagonal depth']].map(([k,l])=>`<div class="dim"><span>${l}</span><button class="st" data-dec="${k}">−</button><b>${s[k]}</b><button class="st" data-inc="${k}">+</button></div>`).join('')}
  <div style="margin-top:8px"><button class="tg ${s.feet?'on':''}" id="feet">${s.feet?'✓ ':''}Feet unscrew (−10cm)</button></div></div>
  <div class="card"><h3>Doorway by doorway</h3>${r.map(x=>`<div class="res">${badge(x)}<div class="x"><b>${GX.esc(x.door.n)} · ${x.door.w}cm</b><small>${x.how}${x.ok?` · ${x.gap}cm to spare`:` · ${x.gap}cm short`}</small></div></div>`).join('')}</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share this fit to ${C.gateway}`}</button>`:''}
  <div class="legend">Diagonal depth: from the top back corner to the front edge of the seat.</div>`;}
function vDoors(){return `<div class="card"><h3>Your doorways (narrowest point, cm)</h3>${C.data.doors.map((d,i)=>`<div class="dim"><span>${GX.esc(d.n)}</span><button class="st" data-ddec="${i}">−</button><b>${d.w}</b><button class="st" data-dinc="${i}">+</button></div>`).join('')}</div>
  <button class="go" id="add" ${C.data.doors.length>=5?'disabled':''}>Add a doorway</button><div class="legend">Measure inside the frame, with the door fully open. Hinges and handles count.</div>`;}
function vCmp(){const nar=C.data.doors.reduce((a,d)=>d.w<a.w?d:a);
  return `<div class="card"><h3>Through your narrowest door (${GX.esc(nar.n)}, ${nar.w}cm)</h3>${C.data.cmp.map((s,i)=>{const r=all(s),ok=r.every(x=>x.ok);
    return `<div class="cmp"><div class="x"><b>${GX.esc(s.n)}</b><small>${s.w} × ${s.d} × ${s.h} cm</small></div><span class="pill" style="background:${ok?'#E3EDE1':'#F7DEDA'};color:${ok?'var(--sage)':'var(--bad)'}">${ok?'FITS':'NO'}</span><button class="st" data-use="${i}" title="Check this one">›</button></div>`;}).join('')}</div>
  <div class="legend">Tap › to load a sofa into the checker.</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='chk'?vChk():S.tab==='doors'?vDoors():vCmp();const s=C.data.s;
  v.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{s[b.dataset.inc]+=STEP[b.dataset.inc];S.shared=false;GX.save(C.data);paint();});
  v.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{s[b.dataset.dec]=Math.max(30,s[b.dataset.dec]-STEP[b.dataset.dec]);S.shared=false;GX.save(C.data);paint();});
  v.querySelectorAll('[data-dinc]').forEach(b=>b.onclick=()=>{C.data.doors[+b.dataset.dinc].w++;GX.save(C.data);paint();});
  v.querySelectorAll('[data-ddec]').forEach(b=>b.onclick=()=>{const d=C.data.doors[+b.dataset.ddec];d.w=Math.max(50,d.w-1);GX.save(C.data);paint();});
  v.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{C.data.s=Object.assign({},C.data.cmp[+b.dataset.use]);GX.save(C.data);S.tab='chk';paint();});
  const f=document.getElementById('feet');if(f)f.onclick=()=>{s.feet=!s.feet;GX.save(C.data);paint();};
  const a=document.getElementById('add');if(a)a.onclick=()=>{C.data.doors.push({n:['Stair landing','Back door'][C.data.doors.length%2],w:80,h:198});GX.save(C.data);paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const r=all(s),ok=r.every(x=>x.ok);
    GX.post(`Fit Check says the <b>${GX.esc(s.n)}</b> ${ok?'will get through all':'won’t get through all'} ${r.length} of our doorways. Measured before we ordered 📐`,'FIT CHECK').then(o=>{if(o){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
