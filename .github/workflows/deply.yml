# Updated May 2026
# The name of the entire automated process as it will appear in GitHub Actions
name: FTP Smart Deploy
# Defines the trigger for this workflow
on:
  # Trigger the script when a "push" command is executed
  push:
    # Restrict the trigger only to specific branches
    branches:
      # The script runs ONLY when you push changes to the 'main' branch
      - main
# Defines the actual work that needs to be done
jobs:
  # A unique identifier (ID) for this specific job
  web-deploy:
    # The human-readable name of the job displayed in the GitHub UI
    name: 🎉 Smart Deploy
    # Tells GitHub to spin up a fresh virtual machine running the latest Ubuntu Linux
    runs-on: ubuntu-latest
    
    # The sequence of tasks (steps) that the virtual machine will execute
    steps:
    # STEP 1: Download your code from the GitHub repository onto the virtual machine
    - name: 🚚 Get latest code
      # Uses the official GitHub action to clone/checkout your repository
      uses: actions/checkout@v4
    
    # STEP 2: Connect via FTP and upload only the modified files
    - name: 📂 Sync files to server
      # Uses a community-built action specialized in smart FTP deployments
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      # Pass the required configuration settings (inputs) to this action
      with:
        # The FTP host address, securely pulled from your GitHub Repository Secrets
        server: ${{ secrets.FTP_SERVER }}
        # The FTP username, securely pulled from your GitHub Repository Secrets
        username: ${{ secrets.FTP_USERNAME }}
        # The FTP password, securely pulled from your GitHub Repository Secrets
        password: ${{ secrets.FTP_PASSWORD }}
        # Defines the connection protocol (FTPS = FTP over SSL/TLS for encryption)
        protocol: ftps
        # The standard network port used for FTP/FTPS connections
        port: 21
        # The destination folder on the server
        server-dir: /

    # STEP 3: Purge Cloudflare cache so the updated site appears immediately
    - name: 🧹 Purge Cloudflare cache
      run: |
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}" \
          -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_AUTH_KEY }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
        echo "✅ Cloudflare cache purged!"
