<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sow Calendar</title>
<style>
/* Sow Calendar, by Rootwell (fictional), 2026-11-19. A GENEXXO app for PlantXX.
   What to sow, plant and harvest each month in a typical UK garden or allotment (general guidance; local frosts
   vary). Opens on the real current month and can step through the year. Tick jobs off; keep a plot list; log
   harvests and share them. */
:root{--bg:#F5F6EE;--card:#fff;--line:rgba(30,43,31,.1);--ink:#1E2B1F;--mut:rgba(30,43,31,.55);--moss:#5E7431;--leaf:#2F7D4A;--pot:#C8692E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#A3B86C,#5E7431);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--moss)}
.mo{display:flex;align-items:center;gap:8px}.mo h2{flex:1;text-align:center;font-size:20px;font-weight:900}
.nv{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:18px;font-weight:900;cursor:pointer;color:var(--ink)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.sec h3{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.job{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;width:100%;background:none;border:0;font:inherit;text-align:left;color:var(--ink)}.job+.job{border-top:1px solid var(--line)}
.job .bx{width:22px;height:22px;border-radius:7px;border:2px solid #C9D1C2;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0}
.job.done .bx{background:var(--moss);border-color:var(--moss)}.job.done span{color:var(--mut);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:#E6EADD;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--moss)}
.bed{display:flex;gap:10px;align-items:center;padding:9px 0}.bed+.bed{border-top:1px solid var(--line)}.bed b{width:64px;flex-shrink:0;font-size:12.5px;color:var(--mut)}.bed span{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 11px;cursor:pointer}
.tot{display:flex;gap:10px}.tot div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px}.tot b{display:block;font-size:26px;font-weight:900;color:var(--moss)}.tot small{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.06em}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--moss);color:#fff;cursor:pointer}.go:disabled{background:#E6EADD;color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}
</style></head><body>
<div class="hd"><div class="logo">🗓️</div><div><h1>Sow Calendar</h1><p>Rootwell · in PlantXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="mo" class="on">This month</button><button data-tab="plot">My plot</button><button data-tab="hv">Harvest</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAL=[
 {sow:['Onions (indoors, heated)','Sweet peas (under cover)'],plant:['Bare-root fruit trees','Rhubarb crowns'],pick:['Leeks','Parsnips','Kale','Brussels sprouts']},
 {sow:['Broad beans (under cover)','Chillies (indoors, heated)','Tomatoes (indoors, heated)'],plant:['Shallots','Garlic, if not planted yet'],pick:['Leeks','Parsnips','Purple sprouting broccoli']},
 {sow:['Carrots','Beetroot','Lettuce','Peas','Tomatoes (indoors)'],plant:['Onion sets','First early potatoes (late month)'],pick:['Purple sprouting broccoli','Forced rhubarb']},
 {sow:['Chard','Carrots','Courgettes (indoors)','Runner beans (indoors)'],plant:['Second early and maincrop potatoes','Asparagus crowns'],pick:['Rhubarb','Spring onions']},
 {sow:['French beans','Courgettes and squash (outdoors, late month)'],plant:['Tomatoes, after the last frost','Courgettes'],pick:['Asparagus','Radishes','Lettuce']},
 {sow:['Lettuce','Beetroot','Carrots','Kale'],plant:['Leeks','Cabbages and other brassicas'],pick:['Broad beans','Peas','Early potatoes','Strawberries']},
 {sow:['Spring cabbage','Chard','Oriental salad leaves'],plant:['Leeks'],pick:['Courgettes','French beans','Tomatoes','Beetroot']},
 {sow:['Spring cabbage','Spinach','Winter salad leaves'],plant:['Strawberry runners'],pick:['Tomatoes','Runner beans','Sweetcorn','Onions']},
 {sow:['Green manure','Overwintering onions'],plant:['Autumn onion sets','Garlic (late month)'],pick:['Squash','Maincrop potatoes','Apples']},
 {sow:['Broad beans (Aquadulce)','Sweet peas (under cover)'],plant:['Garlic','Onion sets','Bare-root fruit'],pick:['Pumpkins and squash','Apples','Leeks']},
 {sow:['Broad beans','Sweet peas (under cover)'],plant:['Garlic','Bare-root fruit trees and bushes','Tulip bulbs'],pick:['Leeks','Parsnips','Kale','Brussels sprouts','Celeriac']},
 {sow:['Not much: plan next year and order seeds'],plant:['Bare-root fruit trees, if the ground isn’t frozen','Garlic, if you missed November'],pick:['Brussels sprouts','Parsnips','Leeks','Kale','Red cabbage']}];
const SEC=[['sow','🌱 Sow','var(--leaf)'],['plant','🪴 Plant','var(--pot)'],['pick','🧺 Harvest','var(--moss)']];
const seed=()=>({done:{},beds:[{b:'Bed 1',c:'Garlic, just planted'},{b:'Bed 2',c:'Leeks and parsnips'},{b:'Bed 3',c:'Empty: green manure'},{b:'Fruit',c:'Two apple trees, rhubarb'}],hv:[{t:'Leeks',kg:3.2,d:-4},{t:'Parsnips',kg:2.1,d:-9},{t:'Squash',kg:11.5,d:-40},{t:'Potatoes',kg:24,d:-70},{t:'Runner beans',kg:6.4,d:-90}]});
let C,S={tab:'mo',m:new Date().getMonth(),shared:false};
GX.init({gateway:'PlantXX',seed}).then(c=>{C=c;paint();});
const key=(m,s,i)=>m+'-'+s+'-'+i;
function vMo(){const c=CAL[S.m],all=SEC.flatMap(([s])=>c[s].map((_,i)=>key(S.m,s,i))),n=all.filter(k=>C.data.done[k]).length;
  return `<div class="mo"><button class="nv" id="prev">‹</button><h2>${M[S.m]}</h2><button class="nv" id="next">›</button></div>
  <div class="bar"><i style="width:${Math.round(100*n/all.length)}%"></i></div><div class="legend" style="margin-top:5px">${n} of ${all.length} jobs done</div>
  ${SEC.map(([s,t,col])=>`<div class="sec"><h3 style="color:${col}">${t}</h3>${c[s].map((j,i)=>{const k=key(S.m,s,i),d=C.data.done[k];return `<button class="job ${d?'done':''}" data-k="${k}"><span class="bx">${d?'✓':''}</span><span>${j}</span></button>`;}).join('')}</div>`).join('')}
  <div class="legend">For a typical UK garden. Colder spots run a couple of weeks behind.</div>`;}
function vPlot(){const c=CAL[S.m];return `<div class="sec"><h3 style="color:var(--moss)">My plot</h3>${C.data.beds.map((b,i)=>`<div class="bed"><b>${GX.esc(b.b)}</b><span>${GX.esc(b.c)}</span></div>`).join('')}</div>
  <div class="sec"><h3 style="color:var(--leaf)">Plant something from ${M[S.m]} into Bed 3</h3><div class="chips">${c.plant.concat(c.sow).slice(0,4).map(t=>`<button class="chip" data-put="${GX.esc(t)}">+ ${GX.esc(t)}</button>`).join('')}</div></div>`;}
function vHv(){const yr=C.data.hv.reduce((a,h)=>a+h.kg,0);return `<div class="tot"><div><b>${yr.toFixed(1)}</b><small>KG THIS YEAR</small></div><div><b>${C.data.hv.length}</b><small>HARVESTS</small></div><div><b>${new Set(C.data.hv.map(h=>h.t)).size}</b><small>CROPS</small></div></div>
  <div class="sec">${C.data.hv.slice().sort((a,b)=>b.d-a.d).slice(0,8).map(h=>`<div class="bed"><b>${h.d===0?'Today':GX.day(GX.today(h.d),{day:'numeric',month:'short'})}</b><span>${GX.esc(h.t)}</span><b style="width:auto;color:var(--ink)">${h.kg} kg</b></div>`).join('')}</div>
  <div class="chips">${CAL[S.m].pick.slice(0,3).map(t=>`<button class="chip" data-hv="${GX.esc(t)}">🧺 Picked ${GX.esc(t.toLowerCase())}</button>`).join('')}</div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share my harvest to ${C.gateway}`}</button>`:''}`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='mo'?vMo():S.tab==='plot'?vPlot():vHv();
  v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;C.data.done[k]=!C.data.done[k];GX.save(C.data);paint();});
  v.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{C.data.beds[2].c=b.dataset.put.replace(/&amp;/g,'&');GX.save(C.data);paint();});
  v.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{C.data.hv.push({t:b.dataset.hv,kg:Math.round((0.5+Math.random()*2)*10)/10,d:0});S.shared=false;GX.save(C.data);paint();});
  const p=document.getElementById('prev');if(p)p.onclick=()=>{S.m=(S.m+11)%12;paint();};
  const n=document.getElementById('next');if(n)n.onclick=()=>{S.m=(S.m+1)%12;paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>{const yr=C.data.hv.reduce((a,h)=>a+h.kg,0);GX.post(`<b>${yr.toFixed(1)}kg</b> off the plot this year, and the garlic is in for next. Logged in Sow Calendar 🧺`,'SOW CALENDAR').then(ok=>{if(ok){S.shared=true;paint();}});};}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
