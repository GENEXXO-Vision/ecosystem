<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route Logger</title>
<style>
/* Route Logger — a fictional third-party app by "Crux Labs", 2026-10-08.
   Runs inside GENEXXO's app canvas in a sandboxed iframe (no same-origin access), so it cannot see
   or touch the host app. Everything it needs it asks the host for over postMessage — the GENEXXO
   bridge: identity, the gateway it is in, its own saved data, and (with permission) posting to the
   gateway feed. Opened directly, outside the canvas, it still runs on sample data. */
:root{--bg:#0E1311;--card:#161D1A;--line:rgba(255,255,255,.08);--ink:#E9F2EC;--muted:rgba(233,242,236,.55);--acc:#4ADE80;--acc2:#22C55E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#15803D);display:flex;align-items:center;justify-content:center;font-weight:900;color:#06200F;font-size:15px}
.hd h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.hd p{font-size:11.5px;color:var(--muted);font-weight:600}
.id{margin-top:10px;font-size:11px;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:6px}
.id::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;font:inherit;font-weight:800;font-size:13px;color:var(--muted);background:none;border:0;border-radius:9px;padding:8px 0;cursor:pointer}
.tabs button.on{background:var(--acc);color:#06200F}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:#0B0F0D;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:99px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
.chip.on{background:rgba(74,222,128,.14);border-color:var(--acc);color:var(--acc)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0B0F0D;color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.step b{min-width:28px;text-align:center;font-size:17px}
.go{width:100%;margin-top:16px;font:inherit;font-weight:900;font-size:15px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#06200F;cursor:pointer}
.go:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.done{margin-top:12px;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.06)}
.done h3{font-size:15px;font-weight:800}
.done p{font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.send{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.send:last-child{border-bottom:0}
.gr{min-width:44px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#06200F}
.send .t{flex:1;min-width:0}
.send .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send .t span{font-size:11px;color:var(--muted);font-weight:600}
.style{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bar{display:flex;align-items:center;gap:9px;margin:6px 0}
.bar span{width:34px;font-size:12px;font-weight:800;text-align:right}
.bar i{display:block;height:20px;border-radius:6px;min-width:4px}
.bar em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:13px}
</style>
</head>
<body>
<div class="hd"><div class="logo">RL</div><div><h1>Route Logger</h1><p>by Crux Labs · v2.4</p></div></div>
<div class="id" id="who">Connecting to GENEXXO…</div>
<div class="stats"><div class="stat"><b id="sTotal">–</b><span>Sends</span></div><div class="stat"><b id="sTop">–</b><span>Top grade</span></div><div class="stat"><b id="sMonth">–</b><span>This month</span></div></div>
<div class="tabs" id="tabs"><button data-t="log" class="on">Log</button><button data-t="sends">Sends</button><button data-t="pyr">Pyramid</button></div>
<main id="view"></main>

<script>
const GRADES = ['5c','6a','6a+','6b','6b+','6c','6c+','7a','7a+','7b','7b+','7c','7c+','8a','8a+'];
const CRAGS  = ['Stanage','Fontainebleau','Kalymnos','Céüse','Siurana','Red River Gorge','Arco'];
const STYLES = ['Onsight','Flash','Redpoint','Project'];
const gColor = g => { const i = GRADES.indexOf(g); return i<4?'#86EFAC':i<7?'#4ADE80':i<10?'#FACC15':i<12?'#FB923C':'#F87171'; };
const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const SEED = () => [
  {route:'Pinch Me',crag:'Stanage',grade:'7a',style:'Redpoint',tries:4,date:daysAgo(2)},
  {route:'Grande Grotta',crag:'Kalymnos',grade:'6c+',style:'Flash',tries:1,date:daysAgo(9)},
  {route:'La Marie-Rose',crag:'Fontainebleau',grade:'6a',style:'Onsight',tries:1,date:daysAgo(16)},
  {route:'Mesca',crag:'Siurana',grade:'7a+',style:'Redpoint',tries:7,date:daysAgo(23)},
  {route:'Black Slab',crag:'Stanage',grade:'6b',style:'Onsight',tries:1,date:daysAgo(31)},
  {route:'Dolphin Wall',crag:'Arco',grade:'6c',style:'Flash',tries:1,date:daysAgo(40)},
  {route:'Berlin',crag:'Céüse',grade:'7b',style:'Project',tries:9,date:daysAgo(5)},
];
let S = { sends:null, grants:[], user:null, gateway:'', tab:'log', draft:{style:'Redpoint',tries:1}, last:null, shared:false };

// ── the GENEXXO bridge ──────────────────────────────────────────────────────────────────────
const host = window.parent !== window ? window.parent : null;
const send = msg => host && host.postMessage(Object.assign({gx:1}, msg), '*');
window.addEventListener('message', e => {
  const m = e.data || {}; if(!m.gx) return;
  if(m.type==='init'){
    S.user = m.user; S.gateway = m.gateway; S.grants = m.grants||[];
    S.sends = Array.isArray(m.data && m.data.sends) ? m.data.sends : SEED();
    document.getElementById('who').textContent = `Signed in with GENEXXO · ${m.gateway}` ;
    paint();
  }
  if(m.type==='posted'){ S.shared = true; paint(); }
});
send({type:'ready', app:'route-logger'});
// Opened on its own (no host answered): run on sample data, nothing saved.
setTimeout(()=>{ if(!S.sends){ S.sends = SEED(); document.getElementById('who').textContent='Demo mode · open inside GENEXXO to save'; paint(); } }, 700);
const save = () => send({type:'save', data:{sends:S.sends}});

// ── views ───────────────────────────────────────────────────────────────────────────────────
function stats(){
  const sent = S.sends.filter(s=>s.style!=='Project');
  const top = sent.reduce((a,s)=>GRADES.indexOf(s.grade)>GRADES.indexOf(a)?s.grade:a, '');
  const m = new Date().toISOString().slice(0,7);
  document.getElementById('sTotal').textContent = sent.length;
  document.getElementById('sTop').textContent = top || '–';
  document.getElementById('sMonth').textContent = sent.filter(s=>s.date.slice(0,7)===m).length;
}
function vLog(){
  const d = S.draft;
  const done = S.last ? `<div class="card done"><h3>✓ Logged ${S.last.route} · ${S.last.grade}</h3>
      <p>${S.last.style} at ${S.last.crag}${S.last.tries>1?` · ${S.last.tries} attempts`:''}</p>
      ${S.grants.includes('feed')
        ? `<button class="go ghost" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${S.gateway}`:`Share to ${S.gateway||'the'} feed`}</button>`
        : `<div class="note">Posting to the ${S.gateway||'gateway'} feed wasn't allowed.</div>`}
    </div>` : '';
  return `<div class="card">
    <label>Route</label><input id="route" placeholder="e.g. Pinch Me" value="${d.route||''}" autocomplete="off">
    <div class="row2">
      <div><label>Crag</label><select id="crag">${CRAGS.map(c=>`<option ${c===(d.crag||'Stanage')?'selected':''}>${c}</option>`).join('')}</select></div>
      <div><label>Grade</label><select id="grade">${GRADES.map(g=>`<option ${g===(d.grade||'6c')?'selected':''}>${g}</option>`).join('')}</select></div>
    </div>
    <label>Style</label><div class="chips">${STYLES.map(s=>`<div class="chip ${s===d.style?'on':''}" data-s="${s}">${s}</div>`).join('')}</div>
    <label>Attempts</label><div class="step"><button id="minus">−</button><b>${d.tries}</b><button id="plus">+</button></div>
    <button class="go" id="logit">Log this send</button>
  </div>${done}`;
}
function vSends(){
  if(!S.sends.length) return `<div class="card empty">No sends yet — log your first one.</div>`;
  const rows = [...S.sends].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="send">
    <div class="gr" style="background:${gColor(s.grade)}">${s.grade}</div>
    <div class="t"><b>${s.route}</b><span>${s.crag} · ${new Date(s.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>
    <div class="style">${s.style}${s.tries>1?` · ${s.tries}`:''}</div></div>`).join('');
  return `<div class="card">${rows}</div>`;
}
function vPyr(){
  const sent = S.sends.filter(s=>s.style!=='Project');
  const counts = {}; sent.forEach(s=>counts[s.grade]=(counts[s.grade]||0)+1);
  const used = GRADES.filter(g=>counts[g]).reverse();
  if(!used.length) return `<div class="card empty">Your grade pyramid builds as you log sends.</div>`;
  const max = Math.max(...used.map(g=>counts[g]));
  return `<div class="card">${used.map(g=>`<div class="bar"><span>${g}</span><i style="width:${Math.max(6,counts[g]/max*72)}%;background:${gColor(g)}"></i><em>${counts[g]}</em></div>`).join('')}
    <div class="note">Projects aren't counted until they go.</div></div>`;
}
function paint(){
  if(!S.sends) return;
  stats();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  const v = document.getElementById('view');
  v.innerHTML = S.tab==='log' ? vLog() : S.tab==='sends' ? vSends() : vPyr();
  if(S.tab!=='log') return;
  const keep = () => { S.draft.route=document.getElementById('route').value; S.draft.crag=document.getElementById('crag').value; S.draft.grade=document.getElementById('grade').value; };
  v.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ keep(); S.draft.style=c.dataset.s; paint(); });
  document.getElementById('minus').onclick=()=>{ keep(); S.draft.tries=Math.max(1,S.draft.tries-1); paint(); };
  document.getElementById('plus').onclick=()=>{ keep(); S.draft.tries=Math.min(50,S.draft.tries+1); paint(); };
  document.getElementById('logit').onclick=()=>{
    keep(); const r=(S.draft.route||'').trim(); if(!r){ document.getElementById('route').focus(); return; }
    S.last = {route:r, crag:S.draft.crag, grade:S.draft.grade, style:S.draft.style, tries:S.draft.tries, date:daysAgo(0)};
    S.sends.push(S.last); S.shared=false; S.draft={style:'Redpoint',tries:1}; save(); paint();
  };
  const sh = document.getElementById('share');
  if(sh) sh.onclick=()=>{ const l=S.last;
    send({type:'post', text:`Sent <b>${l.route}</b> (${l.grade}) at ${l.crag} — ${l.style.toLowerCase()}${l.tries>1?`, ${l.tries} attempts`:''}.`, badge:'SEND' }); };
}
document.getElementById('tabs').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.t; paint(); };
</script>
</body>
</html>
