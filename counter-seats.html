<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Counter Seats</title>
<style>
/* Counter Seats, by Kaito Sushi Bar (fictional), 2026-11-19. A GENEXXO app for SushiXX.
   Book seats at a twelve-seat counter: city, night (next 7 days), sitting (18:00 or 20:30), then pick 1–4 seats on
   the counter (taken seats are seeded per night so they stay put), add allergies for the chef, confirm. The booking
   shows a code to show at the door. Dates are relative to today. */
:root{--bg:#0E1318;--card:rgba(255,255,255,.05);--line:rgba(242,238,232,.1);--ink:#F2EEE8;--mut:rgba(242,238,232,.55);--sal:#FF8A65;--was:#A3C45A;--sl:#7C8CA6;--wood:#B98A55}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4A5A72,#1C2636);display:flex;align-items:center;justify-content:center;font-size:21px}
.hd h1{font-size:18px;font-weight:800}.hd p{font-size:11.5px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:800;font-size:13.5px;color:var(--mut);background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 10px;margin-right:8px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sal)}
.lbl{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--sal);border-color:var(--sal);color:#2A0E04}.chip.al.on{background:#E5484D;border-color:#E5484D;color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days div{text-align:center;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}.days div b{display:block;font-size:17px}.days div span{font-size:10px;font-weight:800;color:var(--mut)}
.days div.on{background:var(--sal);border-color:var(--sal);color:#2A0E04}.days div.on span{color:#2A0E04}
.ctr{position:relative;padding:20px 8px 8px;margin-top:4px}
.bar{height:34px;border-radius:0 0 40px 40px;background:linear-gradient(180deg,#C99A62,#946B3D);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:.12em;color:#2A1A08}
.chefs{text-align:center;font-size:22px;margin-bottom:4px}
.seats{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.seats div{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;cursor:pointer;border:2px solid var(--was);color:var(--was)}
.seats div.tk{border-color:transparent;background:rgba(255,255,255,.08);color:transparent;cursor:not-allowed}.seats div.me{background:var(--sal);border-color:var(--sal);color:#2A0E04}
.key{display:flex;gap:12px;justify-content:center;font-size:11.5px;color:var(--mut);margin-top:10px}.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tkt{border-radius:18px;padding:16px;background:linear-gradient(150deg,#26324A,#141C28);border:1px solid rgba(255,138,101,.3)}
.tkt small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--sal)}.tkt h2{font-size:21px;font-weight:900;margin:4px 0}.tkt p{color:var(--mut);font-size:13px}
.code{font:900 28px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;padding:16px 0 6px;color:var(--sal)}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px}.row+.row{border-top:1px solid var(--line)}.row span{color:var(--mut)}
.go{width:100%;margin-top:12px;font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:12px;background:var(--sal);color:#2A0E04;cursor:pointer}.go.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.go:disabled{background:var(--card);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:10px;text-align:center}.empty{padding:26px 10px;text-align:center;color:var(--mut)}
</style></head><body>
<div class="hd"><div class="logo">🪑</div><div><h1>Counter Seats</h1><p>Kaito Sushi Bar · in SushiXX</p></div></div>
<div class="tabs" id="tabs"><button data-tab="when" class="on">When</button><button data-tab="seats">Seats</button><button data-tab="mine">My booking</button></div>
<div id="v"></div>
<script src="gx-sdk.js"></script>
<script>
const CITY={London:'Berwick Street, Soho',Manchester:'King Street',Edinburgh:'Thistle Street, New Town'},SIT=['18:00','20:30'],ALS=['Shellfish','Fish','Sesame','Gluten','Egg'],PRICE=95;
const seed=()=>({city:'London',day:2,sit:1,pick:[0,1],al:[],booking:null});
let C,S={tab:'when',shared:false};
GX.init({gateway:'SushiXX',seed}).then(c=>{C=c;paint();});
function taken(){const d=C.data,r=GX.rng(d.city+GX.iso(d.day)+d.sit),t=new Set();const n=5+Math.floor(r()*5);while(t.size<n){t.add(Math.floor(r()*12));}[0,1].forEach(i=>t.delete(i));return t;}
const free=()=>12-taken().size;
function vWhen(){const d=C.data;return `<div class="lbl">Counter</div><div class="chips">${Object.keys(CITY).map(c=>`<button class="chip ${d.city===c?'on':''}" data-city="${c}">${c}</button>`).join('')}</div>
  <div class="lbl">Night</div><div class="days">${[1,2,3,4,5,6,7].map(o=>{const t=GX.today(o);return `<div class="${d.day===o?'on':''}" data-day="${o}"><span>${GX.day(t,{weekday:'short'}).toUpperCase()}</span><b>${t.getDate()}</b></div>`;}).join('')}</div>
  <div class="lbl">Sitting</div><div class="chips">${SIT.map((s,i)=>`<button class="chip ${d.sit===i?'on':''}" data-sit="${i}">${s}</button>`).join('')}</div>
  <div class="legend">${free()} of 12 seats free · Omakase, fourteen courses, £${PRICE} each</div><button class="go" id="toSeats">Choose seats</button>`;}
function vSeats(){const d=C.data,t=taken();d.pick=d.pick.filter(i=>!t.has(i));
  return `<div class="legend" style="margin:0 0 4px">${d.city} · ${GX.day(GX.today(d.day),{weekday:'long',day:'numeric',month:'short'})} · ${SIT[d.sit]}</div>
  <div class="ctr"><div class="chefs">👨‍🍳 🔪 👩‍🍳</div><div class="bar">THE COUNTER</div><div class="seats">${Array.from({length:12},(_,i)=>`<div class="${t.has(i)?'tk':d.pick.includes(i)?'me':''}" data-seat="${i}">${i+1}</div>`).join('')}</div></div>
  <div class="key"><span><i style="border:2px solid var(--was)"></i>Free</span><span><i style="background:var(--sal)"></i>Yours</span><span><i style="background:rgba(255,255,255,.15)"></i>Taken</span></div>
  <div class="lbl">Allergies for the chef</div><div class="chips">${ALS.map(a=>`<button class="chip al ${d.al.includes(a)?'on':''}" data-al="${a}">${a}</button>`).join('')}</div>
  <button class="go" id="book" ${d.pick.length?'':'disabled'}>Book ${d.pick.length} seat${d.pick.length===1?'':'s'} · £${PRICE*d.pick.length}</button><div class="legend">Seats 1 and 12 are the corners: the best view of the knife work.</div>`;}
function vMine(){const b=C.data.booking;if(!b)return '<div class="empty">No booking yet. Pick a night and seats.</div>';
  return `<div class="tkt"><small>BOOKED · OMAKASE</small><h2>Kaito ${b.city}</h2><p>${CITY[b.city]}</p><div class="code">${b.code}</div>
  <div class="row"><span>Night</span><b>${GX.day(GX.today(b.day),{weekday:'long',day:'numeric',month:'long'})}</b></div><div class="row"><span>Sitting</span><b>${SIT[b.sit]}</b></div>
  <div class="row"><span>Seats</span><b>${b.seats.map(s=>s+1).join(', ')}</b></div><div class="row"><span>Allergies</span><b>${b.al.length?b.al.join(', '):'None'}</b></div><div class="row"><span>Total</span><b>£${PRICE*b.seats.length}</b></div></div>
  ${GX.can('feed')?`<button class="go" id="share" ${S.shared?'disabled':''}>${S.shared?`✓ Shared to ${C.gateway}`:`Share to ${C.gateway}`}</button>`:''}<button class="go alt" id="cancel">Cancel booking</button>
  <div class="legend">${b.al.length?'The chef has your allergies. Please mention them again when you sit down.':'Arrive ten minutes early. The first course is served together.'}</div>`;}
function paint(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v=document.getElementById('v');v.innerHTML=S.tab==='when'?vWhen():S.tab==='seats'?vSeats():vMine();const d=C.data;
  v.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{d.city=b.dataset.city;GX.save(d);paint();});
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{d.day=+b.dataset.day;GX.save(d);paint();});
  v.querySelectorAll('[data-sit]').forEach(b=>b.onclick=()=>{d.sit=+b.dataset.sit;GX.save(d);paint();});
  v.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{if(b.classList.contains('tk'))return;const i=+b.dataset.seat,k=d.pick.indexOf(i);if(k<0){if(d.pick.length<4)d.pick.push(i);}else d.pick.splice(k,1);GX.save(d);paint();});
  v.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{const a=b.dataset.al,k=d.al.indexOf(a);k<0?d.al.push(a):d.al.splice(k,1);GX.save(d);paint();});
  const ts=document.getElementById('toSeats');if(ts)ts.onclick=()=>{S.tab='seats';paint();};
  const bk=document.getElementById('book');if(bk)bk.onclick=()=>{const r=GX.rng(d.city+d.day+d.sit+d.pick.join());d.booking={city:d.city,day:d.day,sit:d.sit,seats:d.pick.slice().sort((a,b)=>a-b),al:d.al.slice(),code:'KT-'+Math.floor(r()*9e4+1e4)};S.shared=false;GX.save(d);S.tab='mine';paint();};
  const cn=document.getElementById('cancel');if(cn)cn.onclick=()=>{d.booking=null;GX.save(d);paint();};
  const sh=document.getElementById('share');if(sh)sh.onclick=()=>GX.post(`Booked <b>omakase</b> at Kaito ${GX.esc(d.booking.city)}: ${d.booking.seats.length} seats at the counter, ${GX.day(GX.today(d.booking.day),{weekday:'long'})} at ${SIT[d.booking.sit]} 🍣`,'COUNTER SEATS').then(o=>{if(o){S.shared=true;paint();}});}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;paint();};
</script></body></html>
